# Edge proxy for the studio.
#   admin.localhost               -> studio admin (/admin), API (/api, /files), deploy page (/deploy)
#   <slug>.preview.localhost      -> preview of that site (published content), same API
#   localhost / 127.0.0.1         -> redirect to the studio admin

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  return 404;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  return 302 http://admin.localhost/admin;
}

server {
  listen 80;
  server_name admin.localhost ~^[a-z0-9][a-z0-9-]*\.preview\.localhost$;
  client_max_body_size 20m;

  location = / {
    if ($host = admin.localhost) { return 302 /admin; }
    set $web studio-web:5173;
    proxy_pass http://$web;
    proxy_set_header Host $host;
  }
  location ~ ^/(api|files)/ {
    set $api studio-api:4000;
    proxy_pass http://$api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /deploy/ {
    if ($host != admin.localhost) { return 404; }
    set $control control:8080;
    proxy_pass http://$control;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }
  location / {
    set $web studio-web:5173;
    proxy_pass http://$web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
