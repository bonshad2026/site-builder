# Local development services. The web app does not need Docker; only the API does.
name: site-builder

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sb_admin
      POSTGRES_PASSWORD: sb_admin_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb_admin"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional S3-compatible storage: docker compose --profile s3 up -d
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sb_minio
      MINIO_ROOT_PASSWORD: sb_minio_dev_password
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
