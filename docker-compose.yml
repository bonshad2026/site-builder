# Whole stack for local use: `docker compose up -d --build`
#   site http://localhost:5173 · admin http://localhost:5173/admin · API http://localhost:4000
# Secrets come from the root .env (copy .env.example). After code changes, run with --build again.
name: site-builder

services:
  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      # Inside the compose network the database is `postgres`, not localhost:5433.
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: "5432"
    ports:
      - "4000:4000"
    volumes:
      # Uploaded files (local storage driver) stay on the host.
      - ./var/uploads:/app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: http://localhost:4000
        VITE_SITE_ID: atelier-navar
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sb_admin
      POSTGRES_PASSWORD: sb_admin_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb_admin"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional S3-compatible storage: docker compose --profile s3 up -d
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sb_minio
      MINIO_ROOT_PASSWORD: sb_minio_dev_password
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
