},{"level":2,"id":"جریان-کار-اپراتور","text":"جریان کار اپراتور"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"02-architecture/request-path.md","title":"مسیر یک درخواست","html":"\u003ch1 id=\"مسیر-یک-درخواست\">مسیر یک درخواست\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۲ — معماری · فایل‌ها: \u003ccode>deploy/edge/nginx.conf\u003c/code>، \u003ccode>apps/api/src/app.ts\u003c/code>، \u003ccode>apps/api/src/middleware/tenant.ts\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>هر درخواستی که به استودیو می‌رسد اول از nginx (\u003ccode>sb-edge\u003c/code>) می‌گذرد. nginx بر اساس \u003cstrong>مسیر\u003c/strong> آن را به یکی از سه سرویس می‌فرستد. اگر درخواست به API برسد، API از روی \u003cstrong>slug\u003c/strong> سایت در آدرس، دیتابیس همان سایت را پیدا می‌کند.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart LR\n  B[مرورگر] --&gt; E[sb-edge&lt;br/&gt;nginx :80]\n  E -- &quot;/api/ , /files/&quot; --&gt; A[sb-studio-api :4000]\n  E -- &quot;/deploy/&quot; --&gt; C[sb-control :8080]\n  E -- &quot;بقیه&quot; --&gt; W[sb-studio-web :5173]\n  A --&gt; CD[(sb_control)]\n  A --&gt; TD[(دیتابیس سایت)]\u003c/pre>\n\u003ch2 id=\"۱-nginx\">۱. nginx\u003c/h2>\n\u003cp>nginx فقط به این hostها جواب می‌دهد: \u003ccode>admin.localhost\u003c/code> و \u003ccode>&lt;slug&gt;.preview.localhost\u003c/code>. \u003ccode>localhost\u003c/code> به \u003ccode>/admin\u003c/code> redirect می‌شود و برای هر host دیگر 404 برمی‌گرداند.\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>مسیر\u003c/th>\u003cth>سرویس\u003c/th>\u003cth>توضیح\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>/api/…\u003c/code> و \u003ccode>/files/…\u003c/code>\u003c/td>\u003ctd>\u003ccode>studio-api:4000\u003c/code>\u003c/td>\u003ctd>API و فایل‌های آپلودشده\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/deploy/…\u003c/code>\u003c/td>\u003ctd>\u003ccode>control:8080\u003c/code>\u003c/td>\u003ctd>فقط روی \u003ccode>admin.localhost\u003c/code>؛ روی پیش‌نمایش سایت‌ها 404\u003c/td>\u003c/tr>\u003ctr>\u003ctd>بقیه\u003c/td>\u003ctd>\u003ccode>studio-web:5173\u003c/code>\u003c/td>\u003ctd>پنل ادمین و سایت عمومی (یک bundle)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>API و وب روی \u003cstrong>یک origin\u003c/strong> هستند (\u003ccode>VITE_API_URL=same-origin\u003c/code>). برای همین cookieها بدون تنظیم CORS کار می‌کنند و وب درخواست‌ها را به \u003ccode>window.location.origin + /api/v1\u003c/code> می‌فرستد.\u003c/p>\n\u003ch2 id=\"۲-وب-کدام-سایت\">۲. وب: کدام سایت؟\u003c/h2>\n\u003cp>\u003ccode>apps/web/src/features/public-site/data.ts\u003c/code>:\u003c/p>\n\u003cul>\u003cli>اگر host به شکل \u003ccode>&lt;slug&gt;.preview.…\u003c/code> باشد، \u003ccode>slug\u003c/code> سایتِ نمایش‌داده‌شده است.\u003c/li>\u003cli>اگر نه، \u003ccode>VITE_SITE_ID\u003c/code> (بستهٔ مشتری با همین مقدار build می‌شود).\u003c/li>\u003cli>داده‌های عمومی از \u003ccode>/api/v1/public/sites/&lt;slug&gt;/…\u003c/code> خوانده می‌شوند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۳-api-ترتیب-middlewareها\">۳. API: ترتیب middlewareها\u003c/h2>\n\u003cp>\u003ccode>apps/api/src/app.ts\u003c/code>، به همان ترتیب اجرا:\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TB\n  R[درخواست] --&gt; H[helmet، cors، json 1mb، cookies]\n  H --&gt; S[loadSession&lt;br/&gt;cookie sb_session ← users]\n  S --&gt; G{مسیر}\n  G -- &quot;/api/v1/auth&quot; --&gt; AU[authRoutes]\n  G -- &quot;/api/v1/platform/…&quot; --&gt; PA[requirePlatformAdmin]\n  G -- &quot;/api/v1/sites/:siteId/…&quot; --&gt; RA[requireAuth + CSRF] --&gt; MT[loadMemberTenant] --&gt; MR[routeهای سایت]\n  G -- &quot;/api/v1/public/sites/:siteSlug/…&quot; --&gt; PT[loadPublicTenant] --&gt; LC[loadCustomer] --&gt; PR[routeهای عمومی]\u003c/pre>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>پیشوند\u003c/th>\u003cth>چه کسی\u003c/th>\u003cth>سایت از کجا می‌آید\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>/api/v1/auth\u003c/code>\u003c/td>\u003ctd>همه (ورود، خروج، فراموشی رمز)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/api/v1/platform/…\u003c/code>\u003c/td>\u003ctd>فقط اپراتور\u003c/td>\u003ctd>— (کار روی همهٔ سایت‌ها)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/api/v1/sites/:siteId/…\u003c/code>\u003c/td>\u003ctd>عضو سایت یا اپراتور\u003c/td>\u003ctd>\u003ccode>:siteId\u003c/code> = slug\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/api/v1/public/sites/:siteSlug/…\u003c/code>\u003c/td>\u003ctd>بازدیدکننده (بدون ورود) و مشتری سایت\u003c/td>\u003ctd>\u003ccode>:siteSlug\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/api/v1/payments/callback/:siteSlug/:paymentId\u003c/code>\u003c/td>\u003ctd>بازگشت از درگاه پرداخت\u003c/td>\u003ctd>\u003ccode>:siteSlug\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/api/v1/openapi.json\u003c/code>\u003c/td>\u003ctd>همه\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"۴-پیدا-کردن-دیتابیس-سایت\">۴. پیدا کردن دیتابیس سایت\u003c/h2>\n\u003cp>\u003ccode>loadMemberTenant\u003c/code> در \u003ccode>middleware/tenant.ts\u003c/code>:\u003c/p>\n\u003col>\u003cli>در آدرس \u003ccode>/api/v1/sites/:siteId/…\u003c/code>، مقدار \u003ccode>siteId\u003c/code> همان \u003cstrong>slug\u003c/strong> سایت است، نه id.\u003c/li>\u003cli>در جدول \u003ccode>tenants\u003c/code> دیتابیس کنترل دنبال slug می‌گردد. سایت باید \u003ccode>active\u003c/code> باشد.\u003c/li>\u003cli>دسترسی فقط از جدول \u003ccode>memberships\u003c/code> خوانده می‌شود، نه از چیزی که مرورگر می‌فرستد. کسی که عضو نیست \u003cstrong>404\u003c/strong> می‌گیرد (نه 403) تا نتواند وجود سایت‌ها را حدس بزند.\u003c/li>\u003cli>یک connection pool برای آن سایت از \u003ccode>ctx.tenantPools\u003c/code> گرفته می‌شود و در \u003ccode>req.tenant.db\u003c/code> قرار می‌گیرد.\u003c/li>\u003c/ol>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/api/src/middleware/tenant.ts\nreq.tenant = { id: tenant.id, slug: tenant.slug, name: tenant.name, db: poolFor(ctx, tenant), role, permissions };\u003c/code>\u003c/pre>\n\u003cp>از اینجا به بعد هر handler فقط با \u003ccode>req.tenant!.db\u003c/code> کار می‌کند و نمی‌تواند به دیتابیس سایت دیگری برسد.\u003c/p>\n\u003ch2 id=\"۵-پاسخ\">۵. پاسخ\u003c/h2>\n\u003cul>\u003cli>موفق: \u003ccode>{ data, meta? }\u003c/code> (برای لیست‌ها \u003ccode>meta\u003c/code> شامل \u003ccode>page\u003c/code>، \u003ccode>pageSize\u003c/code>، \u003ccode>total\u003c/code>، \u003ccode>totalPages\u003c/code> است).\u003c/li>\u003cli>بدون محتوا: \u003ccode>204\u003c/code>.\u003c/li>\u003cli>خطا: \u003ccode>{ error: { code, message, details? } }\u003c/code>. → \u003ca href=\"#03-layers/api.md::خطاها\">API\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>مسیر جدیدی در API اضافه کنید → \u003ca href=\"#05-recipes/new-api-route.md\">دستورالعمل: مسیر API جدید\u003c/a>\u003c/li>\u003cli>بدانید چرا هر سایت دیتابیس جدا دارد → \u003ca href=\"#02-architecture/multi-tenancy.md\">چند-مستأجری\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2 id=\"اشتباههای-رایج\">اشتباه‌های رایج\u003c/h2>\n\u003cul>\u003cli>⚠️ بعد از تغییر کد، کانتینرها باید rebuild شوند؛ کد از دیسک خوانده نمی‌شود.\u003c/li>\u003cli>⚠️ اگر \u003ccode>/deploy/\u003c/code> روی آدرس پیش‌نمایش باز نمی‌شود، درست است: عمداً بسته شده.\u003c/li>\u003cli>⚠️ در تست یا اسکریپت، \u003ccode>admin.localhost\u003c/code> در Node.js resolve نمی‌شود؛ از \u003ccode>http://127.0.0.1:4000\u003c/code> استفاده کنید.\u003c/li>\u003c/ul>","text":" مسیر یک درخواست فصل ۲ — معماری · فایل‌ها: deploy/edge/nginx.conf ، apps/api/src/app.ts ، apps/api/src/middleware/tenant.ts خلاصه هر درخواستی که به استودیو می‌رسد اول از nginx sb edge می‌گذرد. nginx بر اساس مسیر آن را به یکی از سه سرویس می‌فرستد. اگر درخواست به API برسد، API از روی slug سایت در آدرس، دیتابیس همان سایت را پیدا می‌کند. ۱. nginx nginx فقط به این hostها جواب می‌دهد: admin.localhost و \u003cslug .preview.localhost . localhost به /admin redirect می‌شود و برای هر host دیگر 404 برمی‌گرداند. مسیر سرویس توضیح /api/… و /files/… studio api:4000 API و فایل‌های آپلودشده /deploy/… control:8080 فقط روی admin.localhost ؛ روی پیش‌نمایش سایت‌ها 404 بقیه studio web:5173 پنل ادمین و سایت عمومی یک bundle API و وب روی یک origin هستند VITE_API_URL=same origin . برای همین cookieها بدون تنظیم CORS کار می‌کنند و وب درخواست‌ها را به window.location.origin + /api/v1 می‌فرستد. ۲. وب: کدام سایت؟ apps/web/src/features/public site/data.ts : اگر host به شکل \u003cslug .preview.… باشد، slug سایتِ نمایش‌داده‌شده است. اگر نه، VITE_SITE_ID بستهٔ مشتری با همین مقدار build می‌شود . داده‌های عمومی از /api/v1/public/sites/\u003cslug /… خوانده می‌شوند. ۳. API: ترتیب middlewareها apps/api/src/app.ts ، به همان ترتیب اجرا: پیشوند چه کسی سایت از کجا می‌آید /api/v1/auth همه ورود، خروج، فراموشی رمز — /api/v1/platform/… فقط اپراتور — کار روی همهٔ سایت‌ها /api/v1/sites/:siteId/… عضو سایت یا اپراتور :siteId = slug /api/v1/public/sites/:siteSlug/… بازدیدکننده بدون ورود و مشتری سایت :siteSlug /api/v1/payments/callback/:siteSlug/:paymentId بازگشت از درگاه پرداخت :siteSlug /api/v1/openapi.json همه — ۴. پیدا کردن دیتابیس سایت loadMemberTenant در middleware/tenant.ts : 1. در آدرس /api/v1/sites/:siteId/… ، مقدار siteId همان slug سایت است، نه id. 2. در جدول tenants دیتابیس کنترل دنبال slug می‌گردد. سایت باید active باشد. 3. دسترسی فقط از جدول memberships خوانده می‌شود، نه از چیزی که مرورگر می‌فرستد. کسی که عضو نیست 404 می‌گیرد نه 403 تا نتواند وجود سایت‌ها را حدس بزند. 4. یک connection pool برای آن سایت از ctx.tenantPools گرفته می‌شود و در req.tenant.db قرار می‌گیرد. از اینجا به بعد هر handler فقط با req.tenant!.db کار می‌کند و نمی‌تواند به دیتابیس سایت دیگری برسد. ۵. پاسخ موفق: { data, meta? } برای لیست‌ها meta شامل page ، pageSize ، total ، totalPages است . بدون محتوا: 204 . خطا: { error: { code, message, details? } } . → API ../03 layers/api.md خطاها اگر بخواهید… مسیر جدیدی در API اضافه کنید → دستورالعمل: مسیر API جدید ../05 recipes/new api route.md بدانید چرا هر سایت دیتابیس جدا دارد → چند مستأجری multi tenancy.md اشتباه‌های رایج ⚠️ بعد از تغییر کد، کانتینرها باید rebuild شوند؛ کد از دیسک خوانده نمی‌شود. ⚠️ اگر /deploy/ روی آدرس پیش‌نمایش باز نمی‌شود، درست است: عمداً بسته شده. ⚠️ در تست یا اسکریپت، admin.localhost در Node.js resolve نمی‌شود؛ از http://127.0.0.1:4000 استفاده کنید. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"۱-nginx","text":"۱. nginx"},{"level":2,"id":"۲-وب-کدام-سایت","text":"۲. وب: کدام سایت؟"},{"level":2,"id":"۳-api-ترتیب-middlewareها","text":"۳. API: ترتیب middlewareها"},{"level":2,"id":"۴-پیدا-کردن-دیتابیس-سایت","text":"۴. پیدا کردن دیتابیس سایت"},{"level":2,"id":"۵-پاسخ","text":"۵. پاسخ"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"},{"level":2,"id":"اشتباههای-رایج","text":"اشتباه‌های رایج"}]},{"path":"03-layers/api.md","title":"API","html":"\u003ch1 id=\"api\">API\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۳ — لایه‌ها · پوشه: \u003ccode>apps/api/src\u003c/code> · Express 5، \u003ccode>pg\u003c/code>، zod، pino\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cul>\u003cli>\u003ccode>app.ts\u003c/code> همهٔ routeها را وصل می‌کند.\u003c/li>\u003cli>هر قابلیت یک پوشه در \u003ccode>modules/\u003c/code> دارد: \u003ccode>*.routes.ts\u003c/code> آدرس‌ها را تعریف می‌کند و \u003ccode>*.service.ts\u003c/code> منطق را.\u003c/li>\u003cli>همهٔ routeها با \u003ccode>ApiRouter\u003c/code> تعریف می‌شوند. این کلاس ورودی را با zod اعتبارسنجی می‌کند و route را در OpenAPI ثبت می‌کند.\u003c/li>\u003cli>SQL مستقیم با \u003ccode>pg\u003c/code> نوشته می‌شود و ORM وجود ندارد.\u003c/li>\u003c/ul>\n\u003ch2 id=\"شروع-برنامه\">شروع برنامه\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  E[config/env.ts&lt;br/&gt;loadEnv با zod] --&gt; C[context.ts&lt;br/&gt;createContext]\n  C --&gt; A[app.ts&lt;br/&gt;createApp]\n  A --&gt; S[server.ts&lt;br/&gt;listen :4000]\u003c/pre>\n\u003cp>\u003ccode>AppContext\u003c/code> (\u003ccode>context.ts\u003c/code>) تنها شیء مشترک است و به هر route داده می‌شود:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>فیلد\u003c/th>\u003cth>چیست\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>env\u003c/code>\u003c/td>\u003ctd>متغیرهای محیطی اعتبارسنجی‌شده (\u003ccode>config/env.ts\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>control\u003c/code>\u003c/td>\u003ctd>pool دیتابیس کنترل\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tenantPools\u003c/code>\u003c/td>\u003ctd>poolهای دیتابیس سایت‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>storage\u003c/code>\u003c/td>\u003ctd>ذخیرهٔ فایل (\u003ccode>local\u003c/code> یا \u003ccode>s3\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>email\u003c/code>، \u003ccode>sms\u003c/code>\u003c/td>\u003ctd>فرستنده‌ها (\u003ccode>console\u003c/code> در محیط محلی)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>log\u003c/code>\u003c/td>\u003ctd>logger از نوع pino\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>اگر متغیر محیطی جدیدی لازم دارید، آن را به schema در \u003ccode>config/env.ts\u003c/code> اضافه کنید (با پیش‌فرض اگر اختیاری است) و در \u003ccode>deploy/docker-compose.yml\u003c/code> و \u003ccode>deploy/export/docker-compose.yml\u003c/code> هم مقدار بدهید.\u003c/p>\n\u003ch2 id=\"تعریف-route-با-apirouter\">تعریف route با \u003ccode>ApiRouter\u003c/code>\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/api/src/modules/leads/leads.routes.ts (کوتاه‌شده)\nexport function leadsRoutes(ctx: AppContext) {\n  const r = new ApiRouter('/api/v1/sites/:siteId/leads', 'Requests', true); // base، تگ OpenAPI، نیاز به ورود\n  r.router.use(requireModule('leads'));\n\n  r.route(\n    {\n      method: 'get',\n      path: '/',\n      summary: 'List customer requests, newest activity first, with filters',\n      query: paginationQuery.extend({ state: z.enum(['open', 'done', 'cancelled']).optional() }),\n      middleware: [requirePermission('leads:read')],\n    },\n    async ({ req, query }) =&gt; {\n      const { rows } = await req.tenant!.db.query('SELECT … LIMIT $1 OFFSET $2', [query.pageSize, (query.page - 1) * query.pageSize]);\n      return { data: rows, meta: pageMeta(query.page, query.pageSize, total) };\n    },\n  );\n  return r.router;\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>گزینه\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>params\u003c/code>، \u003ccode>query\u003c/code>، \u003ccode>body\u003c/code>\u003c/td>\u003ctd>schemaهای zod. ورودی parse می‌شود و اگر نامعتبر باشد \u003ccode>400 validation_failed\u003c/code> برمی‌گردد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>middleware\u003c/code>\u003c/td>\u003ctd>قبل از handler اجرا می‌شود (\u003ccode>requirePermission\u003c/code>، \u003ccode>requireModule\u003c/code>، rate limit…)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>status\u003c/code>\u003c/td>\u003ctd>کد پاسخ موفق (پیش‌فرض 200؛ برای ساختن 201)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>rawBody\u003c/code>\u003c/td>\u003ctd>برای آپلود multipart که body را خودش می‌خواند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>auth\u003c/code>\u003c/td>\u003ctd>فقط برای مستندات OpenAPI: امنیت route را جدا از router تعیین می‌کند\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>handler یک \u003ccode>{ data, meta? }\u003c/code> برمی‌گرداند (json با \u003ccode>status\u003c/code>)، یا \u003ccode>undefined\u003c/code> (یعنی \u003ccode>204\u003c/code>). اگر خودش \u003ccode>res\u003c/code> را فرستاده باشد (redirect، فایل)، چیز دیگری ارسال نمی‌شود.\u003c/p>\n\u003cp>\u003cstrong>OpenAPI همیشه به‌روز است:\u003c/strong> هر \u003ccode>r.route(...)\u003c/code> در \u003ccode>registry\u003c/code> ثبت می‌شود و \u003ccode>GET /api/v1/openapi.json\u003c/code> از روی همان ساخته می‌شود. فهرست کامل و دقیق آدرس‌ها را آنجا ببینید.\u003c/p>\n\u003cp>کمکی‌های \u003ccode>common/http.ts\u003c/code>: \u003ccode>paginationQuery\u003c/code> (\u003ccode>page\u003c/code>، \u003ccode>pageSize\u003c/code> تا ۱۰۰)، \u003ccode>pageMeta\u003c/code>، \u003ccode>idParam\u003c/code>.\u003c/p>\n\u003ch2 id=\"خطاها\">خطاها\u003c/h2>\n\u003cp>\u003ccode>common/errors.ts\u003c/code>:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>throw notFound('Page');                 // 404 not_found\nthrow forbidden('Only the operator…');  // 403 forbidden\nthrow badRequest('…', details);         // 400 bad_request\nthrow conflict('…');                    // 409 conflict\nthrow new AppError(403, 'module_disabled', '…');\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>middleware/errors.ts\u003c/code> هر \u003ccode>AppError\u003c/code> را به \u003ccode>{ error: { code, message, details? } }\u003c/code> تبدیل می‌کند.\u003c/li>\u003cli>\u003ccode>fromPgError\u003c/code> خطاهای constraint دیتابیس را تبدیل می‌کند: unique به 409، foreign key و check به 400.\u003c/li>\u003cli>خطای ناشناخته 500 می‌شود و در لاگ ثبت می‌شود.\u003c/li>\u003cli>API \u003cstrong>کد\u003c/strong> و \u003cstrong>حدود\u003c/strong> (\u003ccode>minimum\u003c/code>، \u003ccode>maximum\u003c/code>…) را می‌فرستد و وب آن‌ها را با \u003ccode>apps/web/src/lib/errorText.ts\u003c/code> به جملهٔ فارسی یا انگلیسی تبدیل می‌کند. پیام انگلیسی API به کاربر نشان داده نمی‌شود، پس برای خطای جدید یک \u003ccode>code\u003c/code> معنادار انتخاب کنید و متنش را در \u003ccode>errorText.ts\u003c/code> اضافه کنید.\u003c/li>\u003c/ul>\n\u003ch2 id=\"دسترسی-به-دیتابیس\">دسترسی به دیتابیس\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کجا\u003c/th>\u003cth>از چه استفاده کنید\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>دادهٔ یک سایت\u003c/td>\u003ctd>\u003ccode>req.tenant!.db.query(sql, params)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کاربران، سایت‌ها، starterها، kitها\u003c/td>\u003ctd>\u003ccode>ctx.control.query(…)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>چند query که باید با هم انجام شوند\u003c/td>\u003ctd>\u003ccode>withTransaction(db, async (client) =&gt; …)\u003c/code> (\u003ccode>database/tenant/pools.ts\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ثبت رویداد\u003c/td>\u003ctd>\u003ccode>auditTenant(db, {...})\u003c/code> / \u003ccode>auditPlatform(...)\u003c/code> (\u003ccode>modules/audit/audit.ts\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>همیشه از پارامتر (\u003ccode>$1\u003c/code>، \u003ccode>$2\u003c/code>) استفاده کنید و هیچ‌وقت مقدار را مستقیم داخل رشتهٔ SQL نگذارید. شناسه‌های Postgres (نام دیتابیس و role) فقط در \u003ccode>provisioning.ts\u003c/code> و با \u003ccode>ident()\u003c/code> ساخته می‌شوند.\u003c/p>\n\u003cp>نام ستون‌ها در دیتابیس snake_case و در JSON پاسخ camelCase است. تبدیل در خود SQL انجام می‌شود: \u003ccode>created_at AS &quot;createdAt&quot;\u003c/code>.\u003c/p>\n\u003ch2 id=\"ماژولها\">ماژول‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ماژول\u003c/th>\u003cth>آدرس پایه\u003c/th>\u003cth>چه می‌کند\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>auth\u003c/code>\u003c/td>\u003ctd>\u003ccode>/auth\u003c/code>\u003c/td>\u003ctd>ورود، خروج، OTP، تأیید ایمیل و تلفن، SSO\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>platform\u003c/code>\u003c/td>\u003ctd>\u003ccode>/platform\u003c/code>\u003c/td>\u003ctd>سایت‌ها (ساخت با setup، حذف، دادهٔ نمونه)، کاربران، audit، پیام‌رسانی (\u003ccode>messaging.ts\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bank\u003c/code>\u003c/td>\u003ctd>\u003ccode>/platform/bank\u003c/code>\u003c/td>\u003ctd>site kits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>starters\u003c/code>\u003c/td>\u003ctd>\u003ccode>/platform/starters\u003c/code>، \u003ccode>/sites/:s/starters\u003c/code>\u003c/td>\u003ctd>ذخیره، بررسی و اعمال starterها؛ starterهای آماده\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>payments\u003c/code>\u003c/td>\u003ctd>\u003ccode>/platform/payment-gateways\u003c/code>، \u003ccode>/sites/:s/payment-settings\u003c/code>، \u003ccode>/sites/:s/payments\u003c/code>، \u003ccode>/payments/callback\u003c/code>\u003c/td>\u003ctd>درگاه‌ها، تراکنش‌ها، بازگشت از درگاه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>site\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s\u003c/code>، \u003ccode>/sites/:s/settings\u003c/code>، \u003ccode>/sites/:s/overview\u003c/code>\u003c/td>\u003ctd>تنظیمات سایت، داشبورد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pages\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/pages\u003c/code>\u003c/td>\u003ctd>صفحه‌ها، انتشار، نسخه‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>catalog\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/products\u003c/code>، \u003ccode>/sites/:s/services\u003c/code>\u003c/td>\u003ctd>محصولات و خدمات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>collections\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/collections\u003c/code>\u003c/td>\u003ctd>جدول‌های محتوا و آیتم‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>leads\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/leads\u003c/code>\u003c/td>\u003ctd>صندوق درخواست‌ها برای کارکنان\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>orders\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/orders\u003c/code>\u003c/td>\u003ctd>سفارش‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>customers\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/customers\u003c/code>\u003c/td>\u003ctd>حساب مشتریان (مسدود و آزاد کردن)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>shop\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/shop\u003c/code>، عمومی\u003c/td>\u003ctd>کوپن، نظرها، خبرنامه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>assets\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/assets\u003c/code>\u003c/td>\u003ctd>آپلود و فهرست فایل‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>members\u003c/code>\u003c/td>\u003ctd>\u003ccode>/sites/:s/members\u003c/code>\u003c/td>\u003ctd>مالک و کارکنان، مجوزها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>public\u003c/code>\u003c/td>\u003ctd>\u003ccode>/public/sites/:slug/…\u003c/code>\u003c/td>\u003ctd>هرچه بازدیدکننده می‌خواند یا می‌فرستد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>interactions\u003c/code>\u003c/td>\u003ctd>(داخل public)\u003c/td>\u003ctd>فرم‌ها، حساب مشتری، پیگیری؛ سرویس مشترک درخواست‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>audit\u003c/code>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>تابع‌های ثبت رویداد\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"فایلها-storage\">فایل‌ها (storage)\u003c/h2>\n\u003cp>\u003ccode>storage/storage.ts\u003c/code>: کلید هر فایل \u003ccode>public/tenants/&lt;tenantId&gt;/&lt;yyyy&gt;/&lt;mm&gt;/&lt;uuid&gt;.&lt;ext&gt;\u003c/code> یا \u003ccode>private/…\u003c/code> است. در driver \u003ccode>local\u003c/code>، \u003ccode>storage/files.routes.ts\u003c/code> فایل‌های public را مستقیم سرو می‌کند و private را فقط با امضای معتبر و منقضی‌نشده (\u003ccode>STORAGE_SIGNING_KEY\u003c/code>). نوع فایل از محتوا تشخیص داده می‌شود (\u003ccode>file-type\u003c/code>) و سقف حجم \u003ccode>UPLOAD_MAX_BYTES\u003c/code> است.\u003c/p>\n\u003ch2 id=\"cli\">CLI\u003c/h2>\n\u003cp>\u003ccode>src/cli.ts\u003c/code> (در کانتینر: \u003ccode>node dist/cli.js …\u003c/code>): \u003ccode>migrate\u003c/code>، \u003ccode>create-admin\u003c/code>، \u003ccode>set-password\u003c/code>، \u003ccode>provision\u003c/code>، \u003ccode>add-sample-starters\u003c/code>. → \u003ca href=\"#06-operations/docker.md::cli-api\">Docker و اجرای روزانه\u003c/a>\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>route جدید بسازید → \u003ca href=\"#05-recipes/new-api-route.md\">دستورالعمل\u003c/a>\u003c/li>\u003cli>تست بنویسید → \u003ca href=\"#05-recipes/tests.md\">نوشتن تست\u003c/a>\u003c/li>\u003c/ul>","text":" API فصل ۳ — لایه‌ها · پوشه: apps/api/src · Express 5، pg ، zod، pino خلاصه app.ts همهٔ routeها را وصل می‌کند. هر قابلیت یک پوشه در modules/ دارد: .routes.ts آدرس‌ها را تعریف می‌کند و .service.ts منطق را. همهٔ routeها با ApiRouter تعریف می‌شوند. این کلاس ورودی را با zod اعتبارسنجی می‌کند و route را در OpenAPI ثبت می‌کند. SQL مستقیم با pg نوشته می‌شود و ORM وجود ندارد. شروع برنامه AppContext context.ts تنها شیء مشترک است و به هر route داده می‌شود: فیلد چیست env متغیرهای محیطی اعتبارسنجی‌شده config/env.ts control pool دیتابیس کنترل tenantPools poolهای دیتابیس سایت‌ها storage ذخیرهٔ فایل local یا s3 email ، sms فرستنده‌ها console در محیط محلی log logger از نوع pino اگر متغیر محیطی جدیدی لازم دارید، آن را به schema در config/env.ts اضافه کنید با پیش‌فرض اگر اختیاری است و در deploy/docker compose.yml و deploy/export/docker compose.yml هم مقدار بدهید. تعریف route با ApiRouter گزینه کار params ، query ، body schemaهای zod. ورودی parse می‌شود و اگر نامعتبر باشد 400 validation_failed برمی‌گردد middleware قبل از handler اجرا می‌شود requirePermission ، requireModule ، rate limit… status کد پاسخ موفق پیش‌فرض 200؛ برای ساختن 201 rawBody برای آپلود multipart که body را خودش می‌خواند auth فقط برای مستندات OpenAPI: امنیت route را جدا از router تعیین می‌کند handler یک { data, meta? } برمی‌گرداند json با status ، یا undefined یعنی 204 . اگر خودش res را فرستاده باشد redirect، فایل ، چیز دیگری ارسال نمی‌شود. OpenAPI همیشه به‌روز است: هر r.route ... در registry ثبت می‌شود و GET /api/v1/openapi.json از روی همان ساخته می‌شود. فهرست کامل و دقیق آدرس‌ها را آنجا ببینید. کمکی‌های common/http.ts : paginationQuery page ، pageSize تا ۱۰۰ ، pageMeta ، idParam . خطاها common/errors.ts : middleware/errors.ts هر AppError را به { error: { code, message, details? } } تبدیل می‌کند. fromPgError خطاهای constraint دیتابیس را تبدیل می‌کند: unique به 409، foreign key و check به 400. خطای ناشناخته 500 می‌شود و در لاگ ثبت می‌شود. API کد و حدود minimum ، maximum … را می‌فرستد و وب آن‌ها را با apps/web/src/lib/errorText.ts به جملهٔ فارسی یا انگلیسی تبدیل می‌کند. پیام انگلیسی API به کاربر نشان داده نمی‌شود، پس برای خطای جدید یک code معنادار انتخاب کنید و متنش را در errorText.ts اضافه کنید. دسترسی به دیتابیس کجا از چه استفاده کنید دادهٔ یک سایت req.tenant!.db.query sql, params کاربران، سایت‌ها، starterها، kitها ctx.control.query … چند query که باید با هم انجام شوند withTransaction db, async client = … database/tenant/pools.ts ثبت رویداد auditTenant db, {...} / auditPlatform ... modules/audit/audit.ts همیشه از پارامتر $1 ، $2 استفاده کنید و هیچ‌وقت مقدار را مستقیم داخل رشتهٔ SQL نگذارید. شناسه‌های Postgres نام دیتابیس و role فقط در provisioning.ts و با ident ساخته می‌شوند. نام ستون‌ها در دیتابیس snake_case و در JSON پاسخ camelCase است. تبدیل در خود SQL انجام می‌شود: created_at AS \"createdAt\" . ماژول‌ها ماژول آدرس پایه چه می‌کند auth /auth ورود، خروج، OTP، تأیید ایمیل و تلفن، SSO platform /platform سایت‌ها ساخت با setup، حذف، دادهٔ نمونه ، کاربران، audit، پیام‌رسانی messaging.ts bank /platform/bank site kits starters /platform/starters ، /sites/:s/starters ذخیره، بررسی و اعمال starterها؛ starterهای آماده payments /platform/payment gateways ، /sites/:s/payment settings ، /sites/:s/payments ، /payments/callback درگاه‌ها، تراکنش‌ها، بازگشت از درگاه site /sites/:s ، /sites/:s/settings ، /sites/:s/overview تنظیمات سایت، داشبورد pages /sites/:s/pages صفحه‌ها، انتشار، نسخه‌ها catalog /sites/:s/products ، /sites/:s/services محصولات و خدمات collections /sites/:s/collections جدول‌های محتوا و آیتم‌ها leads /sites/:s/leads صندوق درخواست‌ها برای کارکنان orders /sites/:s/orders سفارش‌ها customers /sites/:s/customers حساب مشتریان مسدود و آزاد کردن shop /sites/:s/shop ، عمومی کوپن، نظرها، خبرنامه assets /sites/:s/assets آپلود و فهرست فایل‌ها members /sites/:s/members مالک و کارکنان، مجوزها public /public/sites/:slug/… هرچه بازدیدکننده می‌خواند یا می‌فرستد interactions داخل public فرم‌ها، حساب مشتری، پیگیری؛ سرویس مشترک درخواست‌ها audit — تابع‌های ثبت رویداد فایل‌ها storage storage/storage.ts : کلید هر فایل public/tenants/\u003ctenantId /\u003cyyyy /\u003cmm /\u003cuuid .\u003cext یا private/… است. در driver local ، storage/files.routes.ts فایل‌های public را مستقیم سرو می‌کند و private را فقط با امضای معتبر و منقضی‌نشده STORAGE_SIGNING_KEY . نوع فایل از محتوا تشخیص داده می‌شود file type و سقف حجم UPLOAD_MAX_BYTES است. CLI src/cli.ts در کانتینر: node dist/cli.js … : migrate ، create admin ، set password ، provision ، add sample starters . → Docker و اجرای روزانه ../06 operations/docker.md cli api اگر بخواهید… route جدید بسازید → دستورالعمل ../05 recipes/new api route.md تست بنویسید → نوشتن تست ../05 recipes/tests.md ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"شروع-برنامه","text":"شروع برنامه"},{"level":2,"id":"تعریف-route-با-apirouter","text":"تعریف route با ApiRouter"},{"level":2,"id":"خطاها","text":"خطاها"},{"level":2,"id":"دسترسی-به-دیتابیس","text":"دسترسی به دیتابیس"},{"level":2,"id":"ماژولها","text":"ماژول‌ها"},{"level":2,"id":"فایلها-storage","text":"فایل‌ها (storage)"},{"level":2,"id":"cli","text":"CLI"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"03-layers/data-model.md","title":"مدل داده","html":"\u003ch1 id=\"مدل-داده\">مدل داده\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۳ — لایه‌ها · فایل‌ها: \u003ccode>apps/api/src/database/control-plane/migrations/*.sql\u003c/code>، \u003ccode>apps/api/src/database/tenant/migrations/*.sql\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>دو دیتابیس با دو مجموعه migration جدا (→ \u003ca href=\"#02-architecture/multi-tenancy.md\">چند-مستأجری\u003c/a>). این صفحه نقشهٔ جدول‌هاست. \u003cstrong>منبع اصلی، خود فایل‌های SQL هستند.\u003c/strong> اگر ستونی را دنبال می‌کنید، در migrationها جست‌وجو کنید (\u003ccode>grep -n &quot;column_name&quot; apps/api/src/database/**/migrations/*.sql\u003c/code>)، چون ستون‌ها در migrationهای بعدی اضافه شده‌اند.\u003c/p>\n\u003ch2 id=\"دیتابیس-کنترل-sb_control\">دیتابیس کنترل (\u003ccode>sb_control\u003c/code>)\u003c/h2>\n\u003cpre class=\"mermaid\">erDiagram\n  users ||--o{ sessions : has\n  users ||--o{ memberships : has\n  tenants ||--o{ memberships : has\n  tenants ||--o{ tenant_domains : has\n  users ||--o{ auth_tokens : has\n  bank_types ||--o{ kit_tables : has\n  bank_types ||--o{ bank_entries : has\n  starters\n  app_settings\n  audit_events\u003c/pre>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>جدول\u003c/th>\u003cth>migration\u003c/th>\u003cth>چه نگه می‌دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>users\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>همهٔ کاربران پنل؛ \u003ccode>is_platform_admin\u003c/code> یعنی اپراتور\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sessions\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>sessionها؛ فقط \u003ccode>token_hash\u003c/code> و \u003ccode>csrf_hash\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>auth_tokens\u003c/code>، \u003ccode>otp_codes\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>لینک‌های تأیید ایمیل و بازیابی رمز؛ کدهای SMS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tenants\u003c/code>\u003c/td>\u003ctd>001، 002\u003c/td>\u003ctd>سایت‌ها: \u003ccode>slug\u003c/code>، \u003ccode>status\u003c/code>، \u003ccode>db_name\u003c/code>، \u003ccode>db_user\u003c/code>، \u003ccode>db_password_enc\u003c/code>، \u003ccode>provisioning_step\u003c/code>، \u003ccode>business_type\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tenant_domains\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>دامنه‌های هر سایت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>memberships\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>عضویت کاربر در سایت: \u003ccode>role\u003c/code> (owner / staff) و \u003ccode>permissions\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>audit_events\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>رویدادهای سطح platform\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bank_types\u003c/code>، \u003ccode>bank_kinds\u003c/code>، \u003ccode>bank_photos\u003c/code>، \u003ccode>bank_entries\u003c/code>\u003c/td>\u003ctd>002\u003c/td>\u003ctd>site kits: نوع سایت، لیست‌ها (محصول، خدمت، نظر، FAQ)، عکس‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>app_settings\u003c/code>\u003c/td>\u003ctd>003\u003c/td>\u003ctd>تنظیمات کلی استودیو به شکل key/value: \u003ccode>payment_catalog\u003c/code>، \u003ccode>starter_samples\u003c/code>، \u003ccode>general_kit_seeded\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>starters\u003c/code>، \u003ccode>bank_hidden\u003c/code>\u003c/td>\u003ctd>004، 005\u003c/td>\u003ctd>starterها (\u003ccode>kind\u003c/code>، \u003ccode>group_name\u003c/code>، \u003ccode>sample_key\u003c/code>، \u003ccode>data\u003c/code>)؛ موارد پنهان‌شدهٔ kit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>kit_tables\u003c/code>\u003c/td>\u003ctd>006\u003c/td>\u003ctd>جدول‌های هر kit (کپی starter جدول با آیتم‌های نمونه)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"دیتابیس-هر-سایت-sb_t_slug\">دیتابیس هر سایت (\u003ccode>sb_t_&lt;slug&gt;\u003c/code>)\u003c/h2>\n\u003cpre class=\"mermaid\">erDiagram\n  pages ||--o{ page_versions : &quot;هر انتشار&quot;\n  products ||--o{ order_items : &quot;&quot;\n  orders ||--o{ order_items : &quot;&quot;\n  orders ||--o{ payments : &quot;&quot;\n  leads ||--o{ payments : &quot;&quot;\n  orders ||--o{ case_events : &quot;&quot;\n  leads ||--o{ case_events : &quot;&quot;\n  leads ||--o{ request_files : &quot;&quot;\n  customers ||--o{ orders : &quot;&quot;\n  customers ||--o{ leads : &quot;&quot;\n  customers ||--o{ customer_sessions : &quot;&quot;\n  collections ||--o{ collection_items : &quot;&quot;\n  products ||--o{ product_reviews : &quot;&quot;\u003c/pre>\n\u003ch3 id=\"تنظیمات-و-محتوا\">تنظیمات و محتوا\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>جدول\u003c/th>\u003cth>migration\u003c/th>\u003cth>چه نگه می‌دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>site_settings\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>\u003cstrong>یک ردیف\u003c/strong> (\u003ccode>id = 1\u003c/code>) با ستون \u003ccode>settings\u003c/code> (jsonb): همهٔ تنظیمات سایت، طبق \u003ccode>siteSettingsSchema\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pages\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>صفحه‌ها: \u003ccode>slug\u003c/code>، \u003ccode>title\u003c/code>، \u003ccode>is_home\u003c/code>، \u003ccode>draft\u003c/code> (jsonb)، \u003ccode>published\u003c/code> (jsonb)، \u003ccode>published_version\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>page_versions\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>کپی هر انتشار؛ برای تاریخچه و بازگردانی\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>assets\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>فایل‌های آپلودشده: \u003ccode>storage_key\u003c/code>، \u003ccode>visibility\u003c/code> (public / private)، \u003ccode>kind\u003c/code>، \u003ccode>alt\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>collections\u003c/code>\u003c/td>\u003ctd>006\u003c/td>\u003ctd>تعریف جدول‌های محتوا: \u003ccode>slug\u003c/code>، \u003ccode>fields\u003c/code> (jsonb)، \u003ccode>detail_page\u003c/code>، \u003ccode>commerce\u003c/code>، \u003ccode>request_type\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>collection_items\u003c/code>\u003c/td>\u003ctd>006\u003c/td>\u003ctd>آیتم‌ها: \u003ccode>slug\u003c/code>، \u003ccode>title\u003c/code>، \u003ccode>data\u003c/code> (jsonb)، \u003ccode>status\u003c/code>، \u003ccode>position\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"فروشگاه\">فروشگاه\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>جدول\u003c/th>\u003cth>migration\u003c/th>\u003cth>چه نگه می‌دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>products\u003c/code>\u003c/td>\u003ctd>001، 004، 010\u003c/td>\u003ctd>محصول: \u003ccode>price_minor\u003c/code>، \u003ccode>stock\u003c/code>، \u003ccode>category\u003c/code>، \u003ccode>variants\u003c/code>، …\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>services\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>خدمات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>orders\u003c/code>، \u003ccode>order_items\u003c/code>\u003c/td>\u003ctd>001، 005، 007، 010\u003c/td>\u003ctd>سفارش و اقلامش؛ \u003ccode>customer_id\u003c/code>، \u003ccode>payment_method\u003c/code>، \u003ccode>unread\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>coupons\u003c/code>، \u003ccode>product_reviews\u003c/code>، \u003ccode>subscribers\u003c/code>\u003c/td>\u003ctd>010\u003c/td>\u003ctd>کد تخفیف، نظرها (منتظر تأیید)، خبرنامه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>payment_settings\u003c/code>\u003c/td>\u003ctd>002، 011\u003c/td>\u003ctd>فقط \u003ccode>allow_cod\u003c/code> (پرداخت در محل) باقی مانده\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>payment_gateways\u003c/code>\u003c/td>\u003ctd>011\u003c/td>\u003ctd>هر درگاه یک ردیف: \u003ccode>provider\u003c/code>، \u003ccode>allowed\u003c/code>، \u003ccode>enabled\u003c/code>، \u003ccode>sort\u003c/code>، \u003ccode>label\u003c/code>، \u003ccode>credentials\u003c/code>، \u003ccode>test_mode\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>payments\u003c/code>\u003c/td>\u003ctd>002، 007\u003c/td>\u003ctd>هر تلاش پرداخت: \u003ccode>order_id\u003c/code> یا \u003ccode>lead_id\u003c/code>، \u003ccode>provider\u003c/code>، \u003ccode>status\u003c/code>، \u003ccode>authority\u003c/code>، \u003ccode>ref_id\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"درخواستها-و-مشتریان\">درخواست‌ها و مشتریان\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>جدول\u003c/th>\u003cth>migration\u003c/th>\u003cth>چه نگه می‌دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>leads\u003c/code>\u003c/td>\u003ctd>001، 004، 007\u003c/td>\u003ctd>درخواست‌ها: \u003ccode>type\u003c/code>، \u003ccode>number\u003c/code> (کد \u003ccode>R&lt;number&gt;\u003c/code>)، \u003ccode>status\u003c/code> (مرحله)، \u003ccode>stage_kind\u003c/code>، \u003ccode>details\u003c/code>، \u003ccode>amount_due_minor\u003c/code>، \u003ccode>paid_minor\u003c/code>، \u003ccode>unread\u003c/code>، \u003ccode>customer_id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>case_events\u003c/code>\u003c/td>\u003ctd>007\u003c/td>\u003ctd>خط زمانی درخواست یا سفارش: \u003ccode>kind\u003c/code>، \u003ccode>public\u003c/code>، \u003ccode>body\u003c/code>، \u003ccode>by_customer\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>request_files\u003c/code>\u003c/td>\u003ctd>008\u003c/td>\u003ctd>فایل‌هایی که با فرم آپلود شده‌اند (خصوصی)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>customers\u003c/code>، \u003ccode>customer_sessions\u003c/code>، \u003ccode>customer_codes\u003c/code>\u003c/td>\u003ctd>007\u003c/td>\u003ctd>حساب مشتریان سایت و کدهای یک‌بارمصرف\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>audit_events\u003c/code>\u003c/td>\u003ctd>001\u003c/td>\u003ctd>رویدادهای همین سایت (\u003ccode>auditTenant\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"قراردادهای-مشترک\">قراردادهای مشترک\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>کلید اصلی\u003c/strong> \u003ccode>uuid\u003c/code> با \u003ccode>gen_random_uuid()\u003c/code>. شمارهٔ قابل‌خواندن جدا است (\u003ccode>orders.number\u003c/code>، \u003ccode>leads.number\u003c/code>).\u003c/li>\u003cli>\u003cstrong>مبلغ‌ها\u003c/strong> با پسوند \u003ccode>_minor\u003c/code> و به کوچک‌ترین واحد پول ذخیره می‌شوند (برای IRR، ریال).\u003c/li>\u003cli>\u003cstrong>متن دوزبانه\u003c/strong> به شکل jsonb \u003ccode>{ &quot;en&quot;: &quot;…&quot;, &quot;fa&quot;: &quot;…&quot; }\u003c/code> است (\u003ccode>localizedSchema\u003c/code>).\u003c/li>\u003cli>\u003cstrong>دادهٔ نمونه\u003c/strong> ستون \u003ccode>demo boolean\u003c/code> دارد (migration 009). همه با هم حذف می‌شوند و در بستهٔ install نمی‌روند، مگر اپراتور بخواهد (\u003ccode>deploy/export/drop-demo.sql\u003c/code>).\u003c/li>\u003cli>\u003cstrong>jsonb ترتیب کلیدها را نگه نمی‌دارد.\u003c/strong> JSONها را همیشه ساختاری مقایسه کنید، نه به‌صورت متن.\u003c/li>\u003c/ul>\n\u003ch2 id=\"کجا-تعریف-میشود-چه-چیزی-در-jsonb-است\">کجا تعریف می‌شود چه چیزی در jsonb است؟\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ستون\u003c/th>\u003cth>schema در shared\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>site_settings.settings\u003c/code>\u003c/td>\u003ctd>\u003ccode>siteSettingsSchema\u003c/code> (\u003ccode>schemas.ts\u003c/code>) + بخش‌های \u003ccode>siteOptions.ts\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pages.draft\u003c/code> / \u003ccode>published\u003c/code>\u003c/td>\u003ctd>\u003ccode>pageDocumentSchema\u003c/code> (\u003ccode>schemas.ts\u003c/code>)؛ props هر سکشن در \u003ccode>sectionDefinitions\u003c/code> (\u003ccode>sections.ts\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>collections.fields\u003c/code>\u003c/td>\u003ctd>\u003ccode>collectionInputSchema\u003c/code> (\u003ccode>collections.ts\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>starters.data\u003c/code>\u003c/td>\u003ctd>\u003ccode>starterPackSchema\u003c/code> (\u003ccode>starters.ts\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>ستون یا جدول اضافه کنید → \u003ca href=\"#05-recipes/new-migration.md\">migration جدید\u003c/a>\u003c/li>\u003cli>تنظیم جدیدی به سایت اضافه کنید (بدون migration) → \u003ca href=\"#05-recipes/new-site-setting.md\">تنظیم جدید برای سایت\u003c/a>\u003c/li>\u003c/ul>","text":" مدل داده فصل ۳ — لایه‌ها · فایل‌ها: apps/api/src/database/control plane/migrations/ .sql ، apps/api/src/database/tenant/migrations/ .sql خلاصه دو دیتابیس با دو مجموعه migration جدا → چند مستأجری ../02 architecture/multi tenancy.md . این صفحه نقشهٔ جدول‌هاست. منبع اصلی، خود فایل‌های SQL هستند. اگر ستونی را دنبال می‌کنید، در migrationها جست‌وجو کنید grep n \"column_name\" apps/api/src/database/ /migrations/ .sql ، چون ستون‌ها در migrationهای بعدی اضافه شده‌اند. دیتابیس کنترل sb_control جدول migration چه نگه می‌دارد users 001 همهٔ کاربران پنل؛ is_platform_admin یعنی اپراتور sessions 001 sessionها؛ فقط token_hash و csrf_hash auth_tokens ، otp_codes 001 لینک‌های تأیید ایمیل و بازیابی رمز؛ کدهای SMS tenants 001، 002 سایت‌ها: slug ، status ، db_name ، db_user ، db_password_enc ، provisioning_step ، business_type tenant_domains 001 دامنه‌های هر سایت memberships 001 عضویت کاربر در سایت: role owner / staff و permissions audit_events 001 رویدادهای سطح platform bank_types ، bank_kinds ، bank_photos ، bank_entries 002 site kits: نوع سایت، لیست‌ها محصول، خدمت، نظر، FAQ ، عکس‌ها app_settings 003 تنظیمات کلی استودیو به شکل key/value: payment_catalog ، starter_samples ، general_kit_seeded starters ، bank_hidden 004، 005 starterها kind ، group_name ، sample_key ، data ؛ موارد پنهان‌شدهٔ kit kit_tables 006 جدول‌های هر kit کپی starter جدول با آیتم‌های نمونه دیتابیس هر سایت sb_t_\u003cslug تنظیمات و محتوا جدول migration چه نگه می‌دارد site_settings 001 یک ردیف id = 1 با ستون settings jsonb : همهٔ تنظیمات سایت، طبق siteSettingsSchema pages 001 صفحه‌ها: slug ، title ، is_home ، draft jsonb ، published jsonb ، published_version page_versions 001 کپی هر انتشار؛ برای تاریخچه و بازگردانی assets 001 فایل‌های آپلودشده: storage_key ، visibility public / private ، kind ، alt collections 006 تعریف جدول‌های محتوا: slug ، fields jsonb ، detail_page ، commerce ، request_type collection_items 006 آیتم‌ها: slug ، title ، data jsonb ، status ، position فروشگاه جدول migration چه نگه می‌دارد products 001، 004، 010 محصول: price_minor ، stock ، category ، variants ، … services 001 خدمات orders ، order_items 001، 005، 007، 010 سفارش و اقلامش؛ customer_id ، payment_method ، unread coupons ، product_reviews ، subscribers 010 کد تخفیف، نظرها منتظر تأیید ، خبرنامه payment_settings 002، 011 فقط allow_cod پرداخت در محل باقی مانده payment_gateways 011 هر درگاه یک ردیف: provider ، allowed ، enabled ، sort ، label ، credentials ، test_mode payments 002، 007 هر تلاش پرداخت: order_id یا lead_id ، provider ، status ، authority ، ref_id درخواست‌ها و مشتریان جدول migration چه نگه می‌دارد leads 001، 004، 007 درخواست‌ها: type ، number کد R\u003cnumber ، status مرحله ، stage_kind ، details ، amount_due_minor ، paid_minor ، unread ، customer_id case_events 007 خط زمانی درخواست یا سفارش: kind ، public ، body ، by_customer request_files 008 فایل‌هایی که با فرم آپلود شده‌اند خصوصی customers ، customer_sessions ، customer_codes 007 حساب مشتریان سایت و کدهای یک‌بارمصرف audit_events 001 رویدادهای همین سایت auditTenant قراردادهای مشترک کلید اصلی uuid با gen_random_uuid . شمارهٔ قابل‌خواندن جدا است orders.number ، leads.number . مبلغ‌ها با پسوند _minor و به کوچک‌ترین واحد پول ذخیره می‌شوند برای IRR، ریال . متن دوزبانه به شکل jsonb { \"en\": \"…\", \"fa\": \"…\" } است localizedSchema . دادهٔ نمونه ستون demo boolean دارد migration 009 . همه با هم حذف می‌شوند و در بستهٔ install نمی‌روند، مگر اپراتور بخواهد deploy/export/drop demo.sql . jsonb ترتیب کلیدها را نگه نمی‌دارد. JSONها را همیشه ساختاری مقایسه کنید، نه به‌صورت متن. کجا تعریف می‌شود چه چیزی در jsonb است؟ ستون schema در shared site_settings.settings siteSettingsSchema schemas.ts + بخش‌های siteOptions.ts pages.draft / published pageDocumentSchema schemas.ts ؛ props هر سکشن در sectionDefinitions sections.ts collections.fields collectionInputSchema collections.ts starters.data starterPackSchema starters.ts اگر بخواهید… ستون یا جدول اضافه کنید → migration جدید ../05 recipes/new migration.md تنظیم جدیدی به سایت اضافه کنید بدون migration → تنظیم جدید برای سایت ../05 recipes/new site setting.md ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"دیتابیس-کنترل-sb_control","text":"دیتابیس کنترل (sb_control)"},{"level":2,"id":"دیتابیس-هر-سایت-sb_t_slug","text":"دیتابیس هر سایت (sb_t_\u003cslug>)"},{"level":3,"id":"تنظیمات-و-محتوا","text":"تنظیمات و محتوا"},{"level":3,"id":"فروشگاه","text":"فروشگاه"},{"level":3,"id":"درخواستها-و-مشتریان","text":"درخواست‌ها و مشتریان"},{"level":2,"id":"قراردادهای-مشترک","text":"قراردادهای مشترک"},{"level":2,"id":"کجا-تعریف-میشود-چه-چیزی-در-jsonb-است","text":"کجا تعریف می‌شود چه چیزی در jsonb است؟"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"03-layers/migrations.md","title":"migrationها","html":"\u003ch1 id=\"migrationها\">migrationها\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۳ — لایه‌ها · فایل‌ها: \u003ccode>apps/api/src/database/migrator.ts\u003c/code>، \u003ccode>apps/api/src/cli.ts\u003c/code>، \u003ccode>deploy/studio/api-start.sh\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cul>\u003cli>migrationها فایل‌های SQL شماره‌دار هستند و در دو پوشه قرار دارند:\n\u003cul>\u003cli>\u003ccode>control-plane/migrations/\u003c/code> برای \u003ccode>sb_control\u003c/code>. آخرین: \u003ccode>006_kit_tables.sql\u003c/code>.\u003c/li>\u003cli>\u003ccode>tenant/migrations/\u003c/code> برای هر سایت. آخرین: \u003ccode>011_payment_gateways.sql\u003c/code>.\u003c/li>\u003c/ul>\u003c/li>\u003cli>در هر شروع API (\u003ccode>node dist/cli.js migrate\u003c/code>) اول دیتابیس کنترل و بعد \u003cstrong>همهٔ سایت‌ها\u003c/strong> migrate می‌شوند.\u003c/li>\u003cli>\u003cstrong>migrationی که اجرا شده را هرگز ویرایش نکنید.\u003c/strong> همیشه یک فایل جدید با شمارهٔ بعدی بسازید.\u003c/li>\u003c/ul>\n\u003ch2 id=\"migrator-چطور-کار-میکند\">migrator چطور کار می‌کند\u003c/h2>\n\u003cp>\u003ccode>migrate()\u003c/code> در \u003ccode>migrator.ts\u003c/code>:\u003c/p>\n\u003col>\u003cli>یک \u003cstrong>advisory lock\u003c/strong> می‌گیرد تا دو پروسه هم‌زمان یک دیتابیس را migrate نکنند.\u003c/li>\u003cli>جدول \u003ccode>schema_migrations (name, checksum, applied_at)\u003c/code> را در صورت نبودن می‌سازد.\u003c/li>\u003cli>برای هر migration اجراشده checksum فایل را دوباره حساب می‌کند. اگر فایل تغییر کرده باشد، با خطای \u003ccode>Migration … was modified after it was applied\u003c/code> متوقف می‌شود.\u003c/li>\u003cli>هر migration اجرانشده را به ترتیب نام و \u003cstrong>هر کدام در یک تراکنش\u003c/strong> اجرا می‌کند. اگر شکست بخورد، rollback می‌شود، ثبت نمی‌شود و خطا بالا می‌رود.\u003c/li>\u003c/ol>\n\u003cpre class=\"mermaid\">flowchart LR\n  S[api-start.sh] --&gt; M[cli migrate]\n  M --&gt; C[migrate sb_control]\n  C --&gt; T[migrateAllTenants]\n  T --&gt; T1[sb_t_a]\n  T --&gt; T2[sb_t_b]\n  T --&gt; T3[…]\u003c/pre>\n\u003cp>سایت جدید هم موقع ساخت (\u003ccode>provisionTenant\u003c/code>) همهٔ migrationهای tenant را می‌گیرد. روی سرور مشتری هم \u003ccode>deploy/cell/api-start.sh\u003c/code> همین \u003ccode>migrate\u003c/code> را اجرا می‌کند. پس بستهٔ design update که API جدیدتری دارد، دیتابیس مشتری را خودش به‌روز می‌کند.\u003c/p>\n\u003ch2 id=\"قواعد-نوشتن\">قواعد نوشتن\u003c/h2>\n\u003cul>\u003cli>نام فایل: \u003ccode>NNN_short_name.sql\u003c/code> با شمارهٔ سه‌رقمی بعدی.\u003c/li>\u003cli>طوری بنویسید که روی دیتابیسی که \u003cstrong>داده دارد\u003c/strong> هم درست اجرا شود (سایت‌های موجود و سرورهای مشتری): مقدار پیش‌فرض بدهید یا دادهٔ قدیمی را در همان migration منتقل کنید. نمونه: \u003ccode>011_payment_gateways.sql\u003c/code> درگاه قبلی هر سایت را به جدول جدید منتقل می‌کند و بعد ستون‌های قدیمی را حذف می‌کند.\u003c/li>\u003cli>در صورت امکان \u003ccode>IF NOT EXISTS\u003c/code> بنویسید.\u003c/li>\u003cli>\u003ccode>BEGIN\u003c/code> و \u003ccode>COMMIT\u003c/code> ننویسید؛ migrator خودش تراکنش را باز می‌کند.\u003c/li>\u003cli>اگر ستون jsonb اضافه می‌کنید، schema آن را در \u003ccode>packages/shared\u003c/code> تعریف کنید.\u003c/li>\u003c/ul>\n\u003ch2 id=\"تست\">تست\u003c/h2>\n\u003cp>تست‌های API دیتابیس‌های تازه می‌سازند و همهٔ migrationها را روی آن‌ها اجرا می‌کنند. پس اگر migration خطا داشته باشد، \u003ccode>npm test\u003c/code> شکست می‌خورد. برای منطق انتقال داده یک تست جدا بنویسید.\u003c/p>\n\u003cp>→ \u003ca href=\"#05-recipes/new-migration.md\">دستورالعمل: migration جدید\u003c/a>\u003c/p>\n\u003ch2 id=\"اشتباههای-رایج\">اشتباه‌های رایج\u003c/h2>\n\u003cul>\u003cli>⚠️ ویرایش یک migration اجراشده باعث می‌شود API استودیو بالا نیاید (خطای checksum). تغییر را برگردانید و یک migration جدید بنویسید.\u003c/li>\u003cli>⚠️ migration tenant که فقط روی دیتابیس خالی کار می‌کند، روی سرور مشتری شکست می‌خورد.\u003c/li>\u003c/ul>","text":" migrationها فصل ۳ — لایه‌ها · فایل‌ها: apps/api/src/database/migrator.ts ، apps/api/src/cli.ts ، deploy/studio/api start.sh خلاصه migrationها فایل‌های SQL شماره‌دار هستند و در دو پوشه قرار دارند: control plane/migrations/ برای sb_control . آخرین: 006_kit_tables.sql . tenant/migrations/ برای هر سایت. آخرین: 011_payment_gateways.sql . در هر شروع API node dist/cli.js migrate اول دیتابیس کنترل و بعد همهٔ سایت‌ها migrate می‌شوند. migrationی که اجرا شده را هرگز ویرایش نکنید. همیشه یک فایل جدید با شمارهٔ بعدی بسازید. migrator چطور کار می‌کند migrate در migrator.ts : 1. یک advisory lock می‌گیرد تا دو پروسه هم‌زمان یک دیتابیس را migrate نکنند. 2. جدول schema_migrations name, checksum, applied_at را در صورت نبودن می‌سازد. 3. برای هر migration اجراشده checksum فایل را دوباره حساب می‌کند. اگر فایل تغییر کرده باشد، با خطای Migration … was modified after it was applied متوقف می‌شود. 4. هر migration اجرانشده را به ترتیب نام و هر کدام در یک تراکنش اجرا می‌کند. اگر شکست بخورد، rollback می‌شود، ثبت نمی‌شود و خطا بالا می‌رود. سایت جدید هم موقع ساخت provisionTenant همهٔ migrationهای tenant را می‌گیرد. روی سرور مشتری هم deploy/cell/api start.sh همین migrate را اجرا می‌کند. پس بستهٔ design update که API جدیدتری دارد، دیتابیس مشتری را خودش به‌روز می‌کند. قواعد نوشتن نام فایل: NNN_short_name.sql با شمارهٔ سه‌رقمی بعدی. طوری بنویسید که روی دیتابیسی که داده دارد هم درست اجرا شود سایت‌های موجود و سرورهای مشتری : مقدار پیش‌فرض بدهید یا دادهٔ قدیمی را در همان migration منتقل کنید. نمونه: 011_payment_gateways.sql درگاه قبلی هر سایت را به جدول جدید منتقل می‌کند و بعد ستون‌های قدیمی را حذف می‌کند. در صورت امکان IF NOT EXISTS بنویسید. BEGIN و COMMIT ننویسید؛ migrator خودش تراکنش را باز می‌کند. اگر ستون jsonb اضافه می‌کنید، schema آن را در packages/shared تعریف کنید. تست تست‌های API دیتابیس‌های تازه می‌سازند و همهٔ migrationها را روی آن‌ها اجرا می‌کنند. پس اگر migration خطا داشته باشد، npm test شکست می‌خورد. برای منطق انتقال داده یک تست جدا بنویسید. → دستورالعمل: migration جدید ../05 recipes/new migration.md اشتباه‌های رایج ⚠️ ویرایش یک migration اجراشده باعث می‌شود API استودیو بالا نیاید خطای checksum . تغییر را برگردانید و یک migration جدید بنویسید. ⚠️ migration tenant که فقط روی دیتابیس خالی کار می‌کند، روی سرور مشتری شکست می‌خورد. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"migrator-چطور-کار-میکند","text":"migrator چطور کار می‌کند"},{"level":2,"id":"قواعد-نوشتن","text":"قواعد نوشتن"},{"level":2,"id":"تست","text":"تست"},{"level":2,"id":"اشتباههای-رایج","text":"اشتباه‌های رایج"}]},{"path":"03-layers/shared.md","title":"پکیج shared","html":"\u003ch1 id=\"پکیج-shared\">پکیج shared\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۳ — لایه‌ها · پوشه: \u003ccode>packages/shared/src\u003c/code> (import با \u003ccode>@site-builder/shared\u003c/code>)\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>هر داده‌ای که بین وب و API رد و بدل می‌شود، \u003cstrong>یک‌بار و فقط اینجا\u003c/strong> با zod تعریف می‌شود:\u003c/p>\n\u003cul>\u003cli>API هر ورودی را با همین schemaها parse می‌کند،\u003c/li>\u003cli>وب فرم‌ها و پیش‌فرض‌ها را از همین‌ها می‌گیرد،\u003c/li>\u003cli>منطق خالصی که هر دو طرف لازم دارند (مثلاً محاسبهٔ مبلغ فرم، تبدیل نسخه‌های قدیمی) هم اینجاست.\u003c/li>\u003c/ul>\n\u003cpre class=\"mermaid\">flowchart LR\n  Z[schema در shared] --&gt; A[API: ApiRouter body/query/params]\n  Z --&gt; O[OpenAPI: /api/v1/openapi.json]\n  Z --&gt; W[وب: فرم‌ها، پیش‌فرض‌ها، نوع‌ها]\n  Z --&gt; D[jsonb در دیتابیس]\u003c/pre>\n\u003cp>shared هیچ وابستگی به Express، React یا دیتابیس ندارد و فقط کد خالص TypeScript است.\u003c/p>\n\u003ch2 id=\"فایلها\">فایل‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>فایل\u003c/th>\u003cth>مهم‌ترین چیزها\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>constants.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>MEMBERSHIP_ROLES\u003c/code>، \u003ccode>PERMISSIONS\u003c/code>، \u003ccode>TENANT_STATUSES\u003c/code>، \u003ccode>FORM_TYPES\u003c/code>، ماژول‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>schemas.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>slugSchema\u003c/code>، \u003ccode>localizedSchema\u003c/code>، \u003ccode>siteSettingsSchema\u003c/code>، \u003ccode>withSettingDefaults\u003c/code>، \u003ccode>pageDocumentSchema\u003c/code>، \u003ccode>pageInputSchema\u003c/code>، \u003ccode>productInputSchema\u003c/code>، \u003ccode>orderInputSchema\u003c/code>، \u003ccode>leadInputSchema\u003c/code>، \u003ccode>paymentGatewayInputSchema\u003c/code>، \u003ccode>couponInputSchema\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sections.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>sectionDefinitions\u003c/code> (props هر نوع سکشن)، \u003ccode>defaultProps\u003c/code>، \u003ccode>parseSectionProps\u003c/code>، \u003ccode>normalizedProps\u003c/code>، \u003ccode>contentOnlyChange\u003c/code>، \u003ccode>SYSTEM_PAGES\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>siteOptions.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>designSchema\u003c/code> (فونت و رنگ)، \u003ccode>headerSchema\u003c/code>، \u003ccode>footerSchema\u003c/code>، \u003ccode>formFieldSchema\u003c/code>، \u003ccode>FORM_FIELD_TYPES\u003c/code>، \u003ccode>shopPageSchema\u003c/code>، \u003ccode>systemPagesSchema\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>collections.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>collectionInputSchema\u003c/code> (۱۵ نوع فیلد)، فیلترها، فیلترهای بازدیدکننده، بلوک‌های باکس، \u003ccode>COLLECTION_PRESETS\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>interactions.ts\u003c/code>\u003c/td>\u003ctd>request typeها، workflowها، \u003ccode>WORKFLOW_PRESETS\u003c/code>، حساب مشتری، \u003ccode>computeTotal\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>forms.ts\u003c/code>\u003c/td>\u003ctd>تبدیل فرم‌های نسخهٔ ۱ به نسخهٔ ۲ هنگام خواندن\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>setup.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>siteSetupSchema\u003c/code>، \u003ccode>SETUP_FORMS\u003c/code>، \u003ccode>setupRequestType\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bank.ts\u003c/code>\u003c/td>\u003ctd>site kits: \u003ccode>BUILT_IN_KINDS\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>starters.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>starterPackSchema\u003c/code> (نسخهٔ ۲)، \u003ccode>readStarterPack\u003c/code> (تبدیل داده‌های قدیمی)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"تنظیمات-سایت-یک-سند-بزرگ\">تنظیمات سایت: یک سند بزرگ\u003c/h2>\n\u003cp>\u003ccode>siteSettingsSchema\u003c/code> همهٔ تنظیمات سایت را تعریف می‌کند و در \u003ccode>site_settings.settings\u003c/code> ذخیره می‌شود. گروه‌های اصلی:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>گروه\u003c/th>\u003cth>چه دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>name\u003c/code>، \u003ccode>tagline\u003c/code>، \u003ccode>logoAssetId\u003c/code>، \u003ccode>contact\u003c/code>، \u003ccode>social\u003c/code>\u003c/td>\u003ctd>برند و تماس\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>defaultLocale\u003c/code>، \u003ccode>locales\u003c/code>، \u003ccode>direction\u003c/code>، \u003ccode>calendar\u003c/code>، \u003ccode>errorLanguage\u003c/code>، \u003ccode>adminLanguage\u003c/code>\u003c/td>\u003ctd>زبان و جهت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>themeId\u003c/code>، \u003ccode>design\u003c/code>، \u003ccode>accentColor\u003c/code>\u003c/td>\u003ctd>ظاهر\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nav\u003c/code>، \u003ccode>header\u003c/code>، \u003ccode>footer\u003c/code>، \u003ccode>announcement\u003c/code>، \u003ccode>popup\u003c/code>\u003c/td>\u003ctd>منو و قاب صفحه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>modules\u003c/code>\u003c/td>\u003ctd>روشن و خاموش بودن بخش‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>requestTypes\u003c/code>، \u003ccode>formOptions\u003c/code>، \u003ccode>notifications\u003c/code>، \u003ccode>accounts\u003c/code>\u003c/td>\u003ctd>فرم‌ها، workflow، اعلان‌ها، حساب مشتری\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>productCategories\u003c/code>، \u003ccode>shop\u003c/code>، \u003ccode>shopPage\u003c/code>، \u003ccode>cardDesigns\u003c/code>\u003c/td>\u003ctd>فروشگاه و باکس‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemPages\u003c/code>، \u003ccode>texts\u003c/code>، \u003ccode>seo\u003c/code>، \u003ccode>meta\u003c/code>، \u003ccode>exportOptions\u003c/code>\u003c/td>\u003ctd>صفحه‌های داخلی، متن‌های ثابت، SEO، کد صفحه، تحویل\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"withsettingdefaults-سازگاری-با-سایتهای-قدیمی\">\u003ccode>withSettingDefaults\u003c/code>: سازگاری با سایت‌های قدیمی\u003c/h3>\n\u003cp>گروه‌های اختیاری در شیء \u003ccode>optionSchemas\u003c/code> (\u003ccode>schemas.ts\u003c/code>) فهرست شده‌اند. هنگام خواندن تنظیمات، \u003ccode>withSettingDefaults\u003c/code> برای هر گروهی که وجود ندارد یا parse نمی‌شود \u003cstrong>پیش‌فرض\u003c/strong> را می‌گذارد. به همین دلیل سایتی که قبل از یک قابلیت ساخته شده، بدون migration همان ظاهر قبلی را دارد. API در \u003ccode>GET /settings\u003c/code> و وب در \u003ccode>useSiteSettings\u003c/code> همین تابع را صدا می‌زنند.\u003c/p>\n\u003cblockquote>\u003cp>تنظیم جدید = یک کلید اختیاری با \u003ccode>.default(…)\u003c/code> در schema + افزودن آن به \u003ccode>optionSchemas\u003c/code>. → \u003ca href=\"#05-recipes/new-site-setting.md\">دستورالعمل\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"سند-صفحه\">سند صفحه\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// pageDocumentSchema (ساده‌شده)\n{ schemaVersion: 1, sections: [{ id: 's1', type: 'hero', hidden?: false, props: { … } }] }\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>sectionSchema\u003c/code> فقط شکل کلی و اندازه را بررسی می‌کند.\u003c/li>\u003cli>props هر نوع با \u003ccode>parseSectionProps(type, props)\u003c/code> و بر اساس \u003ccode>sectionDefinitions[type]\u003c/code> + \u003ccode>appearanceSchema\u003c/code> (فاصله، پس‌زمینه…) اعتبارسنجی می‌شود و پیش‌فرض‌ها پر می‌شوند.\u003c/li>\u003cli>\u003ccode>normalizedProps\u003c/code> شکل‌های قدیمی را به شکل جدید تبدیل می‌کند (مثلاً یک دکمهٔ \u003ccode>cta\u003c/code> به آرایهٔ \u003ccode>buttons\u003c/code>).\u003c/li>\u003c/ul>\n\u003cp>۲۰ نوع سکشن: \u003ccode>page-header\u003c/code>، \u003ccode>hero\u003c/code>، \u003ccode>rich-text\u003c/code>، \u003ccode>image-text\u003c/code>، \u003ccode>features\u003c/code>، \u003ccode>stats\u003c/code>، \u003ccode>services\u003c/code>، \u003ccode>products\u003c/code>، \u003ccode>gallery\u003c/code>، \u003ccode>testimonials\u003c/code>، \u003ccode>faq\u003c/code>، \u003ccode>pricing\u003c/code>، \u003ccode>cta\u003c/code>، \u003ccode>collection-list\u003c/code>، \u003ccode>collection-item\u003c/code>، \u003ccode>system-page\u003c/code>، \u003ccode>map\u003c/code>، \u003ccode>video\u003c/code>، \u003ccode>newsletter\u003c/code>، \u003ccode>contact-form\u003c/code>.\u003c/p>\n\u003ch2 id=\"الگوی-نسخه-قدیمی-هنگام-خواندن-تبدیل-میشود\">الگوی «نسخهٔ قدیمی هنگام خواندن تبدیل می‌شود»\u003c/h2>\n\u003cp>در این پروژه به‌جای migration روی jsonb، شکل قدیمی \u003cstrong>هنگام خواندن\u003c/strong> به شکل جدید تبدیل می‌شود:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>داده\u003c/th>\u003cth>تابع تبدیل\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>props سکشن\u003c/td>\u003ctd>\u003ccode>normalizedProps\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>فرم نسخهٔ ۱\u003c/td>\u003ctd>\u003ccode>upgradeRequestType\u003c/code> (\u003ccode>forms.ts\u003c/code>) داخل \u003ccode>withSettingDefaults\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>starter قدیمی \u003ccode>{document}\u003c/code>\u003c/td>\u003ctd>\u003ccode>readStarterPack\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"build\">build\u003c/h2>\n\u003cp>\u003ccode>package.json\u003c/code> پکیج سه ورودی دارد: \u003ccode>types\u003c/code> و \u003ccode>source\u003c/code> به \u003ccode>src/index.ts\u003c/code>، و \u003ccode>default\u003c/code> به \u003ccode>dist/index.js\u003c/code>.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>وب\u003c/strong> (Vite، \u003ccode>apps/web/vite.config.ts\u003c/code>) و typecheck مستقیم سورس را می‌خوانند و build لازم ندارند.\u003c/li>\u003cli>\u003cstrong>API در اجرا\u003c/strong> از \u003ccode>dist\u003c/code> می‌خواند. پس در Docker اول \u003ccode>npm run build -w packages/shared\u003c/code> اجرا می‌شود. در \u003ccode>npm run dev:api\u003c/code> و تست‌ها، \u003ccode>--conditions=source\u003c/code> باعث می‌شود سورس خوانده شود.\u003c/li>\u003c/ul>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>بدانید API چطور از این schemaها استفاده می‌کند → \u003ca href=\"#03-layers/api.md\">API\u003c/a>\u003c/li>\u003cli>سکشن جدید بسازید → \u003ca href=\"#05-recipes/new-section.md\">نوع سکشن جدید\u003c/a>\u003c/li>\u003c/ul>","text":" پکیج shared فصل ۳ — لایه‌ها · پوشه: packages/shared/src import با @site builder/shared خلاصه هر داده‌ای که بین وب و API رد و بدل می‌شود، یک‌بار و فقط اینجا با zod تعریف می‌شود: API هر ورودی را با همین schemaها parse می‌کند، وب فرم‌ها و پیش‌فرض‌ها را از همین‌ها می‌گیرد، منطق خالصی که هر دو طرف لازم دارند مثلاً محاسبهٔ مبلغ فرم، تبدیل نسخه‌های قدیمی هم اینجاست. shared هیچ وابستگی به Express، React یا دیتابیس ندارد و فقط کد خالص TypeScript است. فایل‌ها فایل مهم‌ترین چیزها constants.ts MEMBERSHIP_ROLES ، PERMISSIONS ، TENANT_STATUSES ، FORM_TYPES ، ماژول‌ها schemas.ts slugSchema ، localizedSchema ، siteSettingsSchema ، withSettingDefaults ، pageDocumentSchema ، pageInputSchema ، productInputSchema ، orderInputSchema ، leadInputSchema ، paymentGatewayInputSchema ، couponInputSchema sections.ts sectionDefinitions props هر نوع سکشن ، defaultProps ، parseSectionProps ، normalizedProps ، contentOnlyChange ، SYSTEM_PAGES siteOptions.ts designSchema فونت و رنگ ، headerSchema ، footerSchema ، formFieldSchema ، FORM_FIELD_TYPES ، shopPageSchema ، systemPagesSchema collections.ts collectionInputSchema ۱۵ نوع فیلد ، فیلترها، فیلترهای بازدیدکننده، بلوک‌های باکس، COLLECTION_PRESETS interactions.ts request typeها، workflowها، WORKFLOW_PRESETS ، حساب مشتری، computeTotal forms.ts تبدیل فرم‌های نسخهٔ ۱ به نسخهٔ ۲ هنگام خواندن setup.ts siteSetupSchema ، SETUP_FORMS ، setupRequestType bank.ts site kits: BUILT_IN_KINDS starters.ts starterPackSchema نسخهٔ ۲ ، readStarterPack تبدیل داده‌های قدیمی تنظیمات سایت: یک سند بزرگ siteSettingsSchema همهٔ تنظیمات سایت را تعریف می‌کند و در site_settings.settings ذخیره می‌شود. گروه‌های اصلی: گروه چه دارد name ، tagline ، logoAssetId ، contact ، social برند و تماس defaultLocale ، locales ، direction ، calendar ، errorLanguage ، adminLanguage زبان و جهت themeId ، design ، accentColor ظاهر nav ، header ، footer ، announcement ، popup منو و قاب صفحه modules روشن و خاموش بودن بخش‌ها requestTypes ، formOptions ، notifications ، accounts فرم‌ها، workflow، اعلان‌ها، حساب مشتری productCategories ، shop ، shopPage ، cardDesigns فروشگاه و باکس‌ها systemPages ، texts ، seo ، meta ، exportOptions صفحه‌های داخلی، متن‌های ثابت، SEO، کد صفحه، تحویل withSettingDefaults : سازگاری با سایت‌های قدیمی گروه‌های اختیاری در شیء optionSchemas schemas.ts فهرست شده‌اند. هنگام خواندن تنظیمات، withSettingDefaults برای هر گروهی که وجود ندارد یا parse نمی‌شود پیش‌فرض را می‌گذارد. به همین دلیل سایتی که قبل از یک قابلیت ساخته شده، بدون migration همان ظاهر قبلی را دارد. API در GET /settings و وب در useSiteSettings همین تابع را صدا می‌زنند. تنظیم جدید = یک کلید اختیاری با .default … در schema + افزودن آن به optionSchemas . → دستورالعمل ../05 recipes/new site setting.md سند صفحه sectionSchema فقط شکل کلی و اندازه را بررسی می‌کند. props هر نوع با parseSectionProps type, props و بر اساس sectionDefinitions type + appearanceSchema فاصله، پس‌زمینه… اعتبارسنجی می‌شود و پیش‌فرض‌ها پر می‌شوند. normalizedProps شکل‌های قدیمی را به شکل جدید تبدیل می‌کند مثلاً یک دکمهٔ cta به آرایهٔ buttons . ۲۰ نوع سکشن: page header ، hero ، rich text ، image text ، features ، stats ، services ، products ، gallery ، testimonials ، faq ، pricing ، cta ، collection list ، collection item ، system page ، map ، video ، newsletter ، contact form . الگوی «نسخهٔ قدیمی هنگام خواندن تبدیل می‌شود» در این پروژه به‌جای migration روی jsonb، شکل قدیمی هنگام خواندن به شکل جدید تبدیل می‌شود: داده تابع تبدیل props سکشن normalizedProps فرم نسخهٔ ۱ upgradeRequestType forms.ts داخل withSettingDefaults starter قدیمی {document} readStarterPack build package.json پکیج سه ورودی دارد: types و source به src/index.ts ، و default به dist/index.js . وب Vite، apps/web/vite.config.ts و typecheck مستقیم سورس را می‌خوانند و build لازم ندارند. API در اجرا از dist می‌خواند. پس در Docker اول npm run build w packages/shared اجرا می‌شود. در npm run dev:api و تست‌ها، conditions=source باعث می‌شود سورس خوانده شود. اگر بخواهید… بدانید API چطور از این schemaها استفاده می‌کند → API api.md سکشن جدید بسازید → نوع سکشن جدید ../05 recipes/new section.md ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"فایلها","text":"فایل‌ها"},{"level":2,"id":"تنظیمات-سایت-یک-سند-بزرگ","text":"تنظیمات سایت: یک سند بزرگ"},{"level":3,"id":"withsettingdefaults-سازگاری-با-سایتهای-قدیمی","text":"withSettingDefaults: سازگاری با سایت‌های قدیمی"},{"level":2,"id":"سند-صفحه","text":"سند صفحه"},{"level":2,"id":"الگوی-نسخه-قدیمی-هنگام-خواندن-تبدیل-میشود","text":"الگوی «نسخهٔ قدیمی هنگام خواندن تبدیل می‌شود»"},{"level":2,"id":"build","text":"build"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"03-layers/web.md","title":"وب","html":"\u003ch1 id=\"وب\">وب\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۳ — لایه‌ها · پوشه: \u003ccode>apps/web/src\u003c/code> · React 19، Vite، Tailwind 4، TanStack Query، React Router 7\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>یک برنامهٔ React که سه کار انجام می‌دهد:\u003c/p>\n\u003col>\u003cli>\u003cstrong>سایت عمومی\u003c/strong> هر مشتری: صفحه‌ها، فروشگاه، حساب مشتری.\u003c/li>\u003cli>\u003cstrong>پنل ادمین\u003c/strong> در \u003ccode>/admin\u003c/code>: تنظیمات، صندوق درخواست‌ها، سفارش‌ها و…\u003c/li>\u003cli>\u003cstrong>builder\u003c/strong> (فقط در استودیو): ویرایش صفحه با پیش‌نمایش زنده.\u003c/li>\u003c/ol>\n\u003cp>پنل و builder به‌صورت lazy load می‌شوند تا سایت عمومی سبک بماند. در build مشتری (\u003ccode>VITE_ADMIN_SCOPE=client\u003c/code>) builder و صفحه‌های platform اصلاً داخل bundle نیستند.\u003c/p>\n\u003ch2 id=\"مسیرها\">مسیرها\u003c/h2>\n\u003cp>\u003ccode>app/routes.tsx\u003c/code>:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>مسیر\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>/admin/*\u003c/code>\u003c/td>\u003ctd>\u003ccode>AdminRoot\u003c/code> (lazy)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/reset-password\u003c/code>، \u003ccode>/verify-email\u003c/code>\u003c/td>\u003ctd>لینک‌های ایمیل\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/__preview\u003c/code>\u003c/td>\u003ctd>iframe پیش‌نمایش builder (فقط استودیو)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/__starter-preview\u003c/code>\u003c/td>\u003ctd>پیش‌نمایش starterها (فقط استودیو)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/\u003c/code>\u003c/td>\u003ctd>صفحهٔ اصلی سایت (\u003ccode>SitePage home\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/products\u003c/code>، \u003ccode>/products/:slug\u003c/code>، \u003ccode>/services\u003c/code>، \u003ccode>/services/:slug\u003c/code>\u003c/td>\u003ctd>صفحه‌های داخلی فروشگاه و خدمات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/cart\u003c/code>، \u003ccode>/checkout\u003c/code>، \u003ccode>/checkout/result\u003c/code>\u003c/td>\u003ctd>سبد و پرداخت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/account\u003c/code>، \u003ccode>/track\u003c/code>، \u003ccode>/track/:code\u003c/code>\u003c/td>\u003ctd>حساب مشتری و پیگیری\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/wishlist\u003c/code>\u003c/td>\u003ctd>علاقه‌مندی‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/:slug\u003c/code>\u003c/td>\u003ctd>صفحهٔ ساخته‌شده در builder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/:collection/:item\u003c/code>\u003c/td>\u003ctd>صفحهٔ یک آیتم از جدول محتوا (مثلاً \u003ccode>/classes/yoga\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>*\u003c/code>\u003c/td>\u003ctd>404\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>صفحه‌های داخلی داخل \u003ccode>&lt;BuiltInPage page=&quot;…&quot;&gt;\u003c/code> قرار دارند. اگر سایت یک صفحهٔ منتشرشده با slug ثابت آن صفحه داشته باشد (مثلاً \u003ccode>products\u003c/code>)، همان صفحهٔ builder نشان داده می‌شود و محتوای داخلی درون سکشن \u003ccode>system-page\u003c/code> قرار می‌گیرد. → \u003ca href=\"#04-features/system-pages.md\">صفحات داخلی\u003c/a>\u003c/p>\n\u003ch3 id=\"پنل-ادمین\">پنل ادمین\u003c/h3>\n\u003cp>\u003ccode>admin/AdminRoot.tsx\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003ccode>/admin/login\u003c/code>، \u003ccode>/admin/forgot\u003c/code>\u003c/li>\u003cli>\u003ccode>/admin/platform/*\u003c/code> (\u003ccode>PlatformPages\u003c/code>، فقط اپراتور): سایت‌ها، کاربران، audit، starterها، site kits، درگاه‌ها\u003c/li>\u003cli>\u003ccode>/admin/sites/:siteId/*\u003c/code> (\u003ccode>SitePages\u003c/code>): صفحه‌ها، محتوا، محصولات، خدمات، جدول‌ها و آیتم‌ها، درخواست‌ها (\u003ccode>leads\u003c/code>)، سفارش‌ها، مشتریان، کوپن‌ها، نظرها، مشترکان، فایل‌ها، اعضا، تنظیمات، درگاه‌ها، تراکنش‌ها\u003c/li>\u003cli>\u003ccode>/admin/sites/:siteId/pages/:pageId/builder\u003c/code> (فقط اپراتور)\u003c/li>\u003c/ul>\n\u003cp>منوی کناری هر سایت در \u003ccode>SiteNav\u003c/code> داخل \u003ccode>AdminRoot.tsx\u003c/code> است.\u003c/p>\n\u003ch2 id=\"دریافت-داده\">دریافت داده\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  C[کامپوننت] --&gt; H[hook با useQuery&lt;br/&gt;مثلاً useSiteSettings]\n  H --&gt; A[lib/api.ts&lt;br/&gt;api.get / post / patch]\n  A -- &quot;fetch + cookie + X-CSRF-Token&quot; --&gt; API[&quot;/api/v1/…&quot;]\n  A -. &quot;setApiMock (پیش‌نمایش starter)&quot; .-&gt; M[پاسخ ساختگی]\u003c/pre>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>lib/api.ts\u003c/code>\u003c/strong>: \u003ccode>api.get/post/put/patch/delete\u003c/code> پاسخ \u003ccode>data\u003c/code> را برمی‌گردانند و \u003ccode>api.page\u003c/code> کل پاسخ را (همراه \u003ccode>meta\u003c/code>). خطاها \u003ccode>ApiError\u003c/code> با \u003ccode>status\u003c/code>، \u003ccode>code\u003c/code> و \u003ccode>details\u003c/code> هستند.\u003c/li>\u003cli>\u003cstrong>hookهای سایت عمومی\u003c/strong>: \u003ccode>features/public-site/data.ts\u003c/code> (\u003ccode>useSiteSettings\u003c/code>، \u003ccode>usePublishedPageList\u003c/code>…)؛ کلید query به شکل \u003ccode>['public', site, …]\u003c/code>.\u003c/li>\u003cli>\u003cstrong>hookهای پنل\u003c/strong> کنار صفحه‌ها تعریف شده‌اند (مثلاً \u003ccode>admin/collections/api.ts\u003c/code>).\u003c/li>\u003cli>بعد از هر تغییر، \u003ccode>queryClient.invalidateQueries\u003c/code> با همان کلید صدا زده می‌شود تا داده دوباره خوانده شود.\u003c/li>\u003cli>\u003cstrong>سایت جاری:\u003c/strong> \u003ccode>useSiteId()\u003c/code> از \u003ccode>SiteIdContext\u003c/code>؛ مقدار پیش‌فرض از host یا \u003ccode>VITE_SITE_ID\u003c/code> می‌آید.\u003c/li>\u003cli>\u003cstrong>بدون API\u003c/strong> (\u003ccode>VITE_API_URL\u003c/code> خالی): سایت با \u003ccode>content/fallback\u003c/code> نمایش داده می‌شود و پنل در دسترس نیست.\u003c/li>\u003c/ul>\n\u003ch2 id=\"رندر-سکشنها\">رندر سکشن‌ها\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  P[سند صفحه&lt;br/&gt;sections] --&gt; SR[SectionRenderer]\n  SR --&gt; V{parseSectionProps}\n  V -- &quot;نامعتبر&quot; --&gt; N[&quot;هیچ (برای بازدیدکننده)&lt;br/&gt;اخطار (در builder)&quot;]\n  V -- &quot;معتبر&quot; --&gt; L[SectionLook&lt;br/&gt;appearance] --&gt; R[sectionRenderers type]\u003c/pre>\n\u003cul>\u003cli>\u003ccode>sections/renderers.tsx\u003c/code>: جدول \u003ccode>sectionRenderers\u003c/code> (هر \u003ccode>type\u003c/code> یک کامپوننت). سکشن‌های جدول محتوا در \u003ccode>collectionSections.tsx\u003c/code> و رسانه در \u003ccode>mediaSections.tsx\u003c/code> هستند.\u003c/li>\u003cli>\u003ccode>SectionRenderer\u003c/code> هر سکشن را در یک error boundary می‌گذارد، پس سکشن خراب بقیهٔ صفحه را از کار نمی‌اندازد.\u003c/li>\u003cli>در صفحهٔ قالبِ آیتم جدول، \u003ccode>{{field}}\u003c/code> در هر متنی با مقدار آیتم جایگزین می‌شود (\u003ccode>useItemTokens\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch2 id=\"builder\">builder\u003c/h2>\n\u003cp>\u003ccode>admin/builder/\u003c/code>:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>فایل\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>BuilderPage.tsx\u003c/code>\u003c/td>\u003ctd>صفحهٔ اصلی: لیست سکشن‌ها (کشیدن و رها کردن با dnd-kit)، افزودن، ذخیره، انتشار\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>state.ts\u003c/code>\u003c/td>\u003ctd>reducer: \u003ccode>add\u003c/code>، \u003ccode>remove\u003c/code>، \u003ccode>duplicate\u003c/code>، \u003ccode>move\u003c/code>، \u003ccode>update\u003c/code>، \u003ccode>toggleHidden\u003c/code>، \u003ccode>undo\u003c/code>/\u003ccode>redo\u003c/code> (تا ۱۰۰ قدم؛ ویرایش‌های پشت‌سرهم یک سکشن در کمتر از ۱ ثانیه یک قدم حساب می‌شوند)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fields.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>sectionMeta\u003c/code>: نام، توضیح و \u003cstrong>فیلدهای ویرایشگر\u003c/strong> هر نوع سکشن (\u003ccode>FieldDef\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Inspector.tsx\u003c/code>\u003c/td>\u003ctd>فرم تنظیمات سکشن انتخاب‌شده، ساخته‌شده از \u003ccode>FieldDef\u003c/code>ها؛ و ظاهر (\u003ccode>AppearanceEditor\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PreviewFrame.tsx\u003c/code>\u003c/td>\u003ctd>داخل iframe \u003ccode>/__preview\u003c/code>؛ سند را با \u003ccode>postMessage\u003c/code> می‌گیرد و با استایل خود سایت رندر می‌کند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>CardDesigner.tsx\u003c/code>، \u003ccode>CollectionFields.tsx\u003c/code>\u003c/td>\u003ctd>طراح باکس و فیلدهای مخصوص منبع داده\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cpre class=\"mermaid\">sequenceDiagram\n  participant B as BuilderPage\n  participant F as iframe /__preview\n  participant A as API\n  F-&gt;&gt;B: sb:ready\n  B-&gt;&gt;F: sb:doc (sections، siteId، selectedId…)\n  F-&gt;&gt;B: sb:select (کلیک روی سکشن)\n  B-&gt;&gt;A: PATCH /sites/:s/pages/:id { document } (ذخیرهٔ خودکار کمی پس از آخرین تغییر)\n  B-&gt;&gt;A: POST /sites/:s/pages/:id/publish\u003c/pre>\n\u003cp>پیش‌نمایش در iframe است تا عرض واقعی موبایل، تبلت و دسکتاپ و CSS خود سایت را داشته باشد. پیام‌ها فقط از همان origin پذیرفته می‌شوند.\u003c/p>\n\u003ch2 id=\"ظاهر-و-تم\">ظاهر و تم\u003c/h2>\n\u003cul>\u003cli>\u003ccode>styles/index.css\u003c/code>: tokenهای رنگ (\u003ccode>--bg\u003c/code>، \u003ccode>--surface\u003c/code>، \u003ccode>--ink\u003c/code>، \u003ccode>--accent\u003c/code>…) برای هر \u003ccode>[data-theme=&quot;…&quot;]\u003c/code> که Tailwind آن‌ها را به کلاس‌هایی مثل \u003ccode>bg-bg\u003c/code> و \u003ccode>text-ink-soft\u003c/code> تبدیل می‌کند.\u003c/li>\u003cli>طراحی سفارشی سایت (\u003ccode>settings.design\u003c/code>: فونت‌ها، رنگ‌ها) با \u003ccode>lib/siteLook.tsx\u003c/code> اعمال می‌شود.\u003c/li>\u003cli>در کامپوننت‌ها رنگ ثابت ننویسید؛ از کلاس‌های token استفاده کنید تا همهٔ تم‌ها درست کار کنند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"زبان-و-جهت\">زبان و جهت\u003c/h2>\n\u003cul>\u003cli>متن‌های دوزبانه درون کد: \u003ccode>L('English', 'فارسی')\u003c/code> (\u003ccode>admin/interactions/common.tsx\u003c/code>) یک \u003ccode>{ en, fa }\u003c/code> می‌سازد و \u003ccode>useL()\u003c/code> نسخهٔ زبان جاری را برمی‌گرداند. بعضی فایل‌ها \u003ccode>l({ en, fa })\u003c/code> محلی دارند.\u003c/li>\u003cli>متن‌های مشترک پنل در \u003ccode>admin/i18n.ts\u003c/code> هستند (\u003ccode>useT()\u003c/code>).\u003c/li>\u003cli>متن‌های سایت عمومی در \u003ccode>locales/en.ts\u003c/code> و \u003ccode>locales/fa.ts\u003c/code> هستند و \u003ccode>settings.texts\u003c/code> می‌تواند آن‌ها را عوض کند.\u003c/li>\u003cli>زبان و جهت جاری از \u003ccode>lib/preferences.tsx\u003c/code> (\u003ccode>usePreferences()\u003c/code>) می‌آیند.\u003c/li>\u003cli>تاریخ‌ها با \u003ccode>lib/calendar.ts\u003c/code> (شمسی یا میلادی) نمایش داده می‌شوند.\u003c/li>\u003cli>خطاهای API با \u003ccode>lib/errorText.ts\u003c/code> به جمله تبدیل می‌شوند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>سکشن جدید بسازید → \u003ca href=\"#05-recipes/new-section.md\">نوع سکشن جدید\u003c/a>\u003c/li>\u003cli>صفحهٔ جدیدی به پنل اضافه کنید: کامپوننت را در \u003ccode>admin/pages/\u003c/code> بسازید، در \u003ccode>SitePages.tsx\u003c/code> (یا \u003ccode>PlatformPages.tsx\u003c/code>) یک \u003ccode>&lt;Route&gt;\u003c/code> بدهید و در \u003ccode>SiteNav\u003c/code> لینکش را بگذارید. اگر فقط برای اپراتور است، با \u003ccode>operator\u003c/code> یا \u003ccode>OPERATOR_UI\u003c/code> محدودش کنید \u003cstrong>و\u003c/strong> در API هم.\u003c/li>\u003c/ul>","text":" وب فصل ۳ — لایه‌ها · پوشه: apps/web/src · React 19، Vite، Tailwind 4، TanStack Query، React Router 7 خلاصه یک برنامهٔ React که سه کار انجام می‌دهد: 1. سایت عمومی هر مشتری: صفحه‌ها، فروشگاه، حساب مشتری. 2. پنل ادمین در /admin : تنظیمات، صندوق درخواست‌ها، سفارش‌ها و… 3. builder فقط در استودیو : ویرایش صفحه با پیش‌نمایش زنده. پنل و builder به‌صورت lazy load می‌شوند تا سایت عمومی سبک بماند. در build مشتری VITE_ADMIN_SCOPE=client builder و صفحه‌های platform اصلاً داخل bundle نیستند. مسیرها app/routes.tsx : مسیر چه چیزی /admin/ AdminRoot lazy /reset password ، /ver
