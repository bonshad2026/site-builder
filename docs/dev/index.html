const DATA = {"pages":[{"path":"01-start/folders.md","title":"ساختار پوشه‌ها","html":"\u003ch1 id=\"ساختار-پوشهها\">ساختار پوشه‌ها\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۱ — شروع\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"نمای-کلی\">نمای کلی\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>site-builder/\n├── packages/shared/      ← schemaهای zod و منطق مشترک بین API و وب\n├── apps/api/             ← سرور Express 5 + Postgres\n├── apps/web/             ← React + Vite: پنل ادمین، builder و سایت عمومی\n├── deploy/               ← Docker، nginx، سرویس deploy، بستهٔ مشتری، backup\n├── tools/guide-videos/   ← ضبط ویدیوهای راهنمای کاربر (Playwright)\n├── docs/                 ← مستندات (این پوشه)\n├── Dockerfile            ← همهٔ imageها از این یک فایل ساخته می‌شوند\n├── AGENTS.md             ← راهنمای کوتاه انگلیسی برای agentها\n└── docker-compose.yml    ← قدیمی (نسخهٔ اول)؛ استفاده نکنید\u003c/code>\u003c/pre>\n\u003ch2 id=\"وابستگی-پکیجها\">وابستگی پکیج‌ها\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  S[packages/shared] --&gt; A[apps/api]\n  S --&gt; W[apps/web]\n  W -. HTTP /api/v1 .-&gt; A\u003c/pre>\n\u003cp>\u003ccode>shared\u003c/code> هیچ چیزی از دو پکیج دیگر import نمی‌کند. API و وب هم هیچ‌وقت از هم import نمی‌کنند و فقط از طریق HTTP با هم حرف می‌زنند.\u003c/p>\n\u003ch2 id=\"packagessharedsrc\">\u003ccode>packages/shared/src\u003c/code>\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>فایل\u003c/th>\u003cth>چه دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>constants.ts\u003c/code>\u003c/td>\u003ctd>نقش‌ها، \u003ccode>PERMISSIONS\u003c/code>، ماژول‌ها، وضعیت سایت‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>schemas.ts\u003c/code>\u003c/td>\u003ctd>تنظیمات سایت (\u003ccode>siteSettingsSchema\u003c/code>)، صفحه، محصول، سفارش، درخواست، درگاه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sections.ts\u003c/code>\u003c/td>\u003ctd>کتابخانهٔ سکشن‌ها (\u003ccode>sectionDefinitions\u00 \u003cthead>\u003ctr>\u003cth>مسیر\u003c/th>\u003cth>چه دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>main.tsx\u003c/code>، \u003ccode>app/\u003c/code>\u003c/td>\u003ctd>شروع برنامه و جدول مسیرها (\u003ccode>app/routes.tsx\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>admin/\u003c/code>\u003c/td>\u003ctd>پنل ادمین (lazy load)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>admin/builder/\u003c/code>\u003c/td>\u003ctd>ویرایشگر صفحه: \u003ccode>BuilderPage\u003c/code>، \u003ccode>Inspector\u003c/code>، \u003ccode>fields.ts\u003c/code>، \u003ccode>state.ts\u003c/code>، \u003ccode>PreviewFrame\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>admin/pages/\u003c/code>\u003c/td>\u003ctd>صفحه‌های پنل: سایت‌ها، تنظیمات، صندوق درخواست‌ها، فروشگاه، starterها…\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>admin/collections/\u003c/code>، \u003ccode>admin/interactions/\u003c/code>\u003c/td>\u003ctd>جدول‌های محتوا؛ طراح فرم و workflow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>features/\u003c/code>\u003c/td>\u003ctd>بخش‌های سایت عمومی: \u003ccode>public-site\u003c/code>، \u003ccode>cart\u003c/code>، \u003ccode>account\u003c/code>، \u003ccode>collections\u003c/code>، \u003ccode>leads\u003c/code>، \u003ccode>wishlist\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sections/\u003c/code>\u003c/td>\u003ctd>رندر سکشن‌ها: \u003ccode>renderers.tsx\u003c/code> (جدول renderer هر نوع)، \u003ccode>SectionRenderer.tsx\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/\u003c/code>\u003c/td>\u003ctd>layout سایت و اجزای UI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lib/\u003c/code>\u003c/td>\u003ctd>\u003ccode>api.ts\u003c/code> (کلاینت API)، \u003ccode>errorText.ts\u003c/code>، \u003ccode>calendar.ts\u003c/code>، \u003ccode>preferences.tsx\u003c/code>…\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>content/\u003c/code>\u003c/td>\u003ctd>محتوای نمایشی وقتی API در دسترس نیست\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>scripts/prerender.mjs\u003c/code>\u003c/td>\u003ctd>ساخت HTML ایستا برای SEO هنگام build\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>test/\u003c/code>\u003c/td>\u003ctd>تست‌های وب\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"deploy\">\u003ccode>deploy/\u003c/code>\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>مسیر\u003c/th>\u003cth>چه دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>docker-compose.yml\u003c/code>\u003c/td>\u003ctd>استودیو (پروژهٔ compose به نام \u003ccode>site-builder\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>edge/nginx.conf\u003c/code>\u003c/td>\u003ctd>مسیریابی همهٔ آدرس‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>studio/api-start.sh\u003c/code>\u003c/td>\u003ctd>کارهایی که API استودیو در هر بار شروع انجام می‌دهد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>control/server.mjs\u003c/code>\u003c/td>\u003ctd>سرویس deploy (بدون وابستگی npm)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>export/\u003c/code>\u003c/td>\u003ctd>فایل‌هایی که داخل هر بستهٔ مشتری قرار می‌گیرند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cell/api-start.sh\u003c/code>\u003c/td>\u003ctd>شروع API روی سرور مشتری\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>backup/\u003c/code>\u003c/td>\u003ctd>backup و restore کل استودیو\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>photos/\u003c/code>\u003c/td>\u003ctd>دانلود عکس‌های قالب‌ها به \u003ccode>var/demo-images\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"پوشههایی-که-در-git-نیستند\">پوشه‌هایی که در Git نیستند\u003c/h2>\n\u003cp>\u003ccode>var/\u003c/code> (عکس‌ها و فایل‌های محلی)، \u003ccode>exports/\u003c/code> (بسته‌های مشتری)، \u003ccode>backups/\u003c/code>، \u003ccode>.env\u003c/code> و \u003ccode>deploy/.env\u003c/code>. این‌ها دادهٔ مشتری و رمز دارند و \u003cstrong>هرگز\u003c/strong> نباید commit شوند.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>معنی اصطلاح‌ها را بدانید → \u003ca href=\"#01-start/glossary.md\">واژه‌نامه\u003c/a>\u003c/li>\u003cli>ببینید این قطعه‌ها در اجرا چطور به هم وصل می‌شوند → \u003ca href=\"#02-architecture/overview.md\">نمای کلی معماری\u003c/a>\u003c/li>\u003c/ul>","text":" ساختار پوشه‌ها فصل ۱ — شروع نمای کلی وابستگی پکیج‌ها shared هیچ چیزی از دو پکیج دیگر import نمی‌کند. API و وب هم هیچ‌وقت از هم import نمی‌کنند و فقط از طریق HTTP با هم حرف می‌زنند. packages/shared/src فایل چه دارد constants.ts نقش‌ها، PERMISSIONS ، ماژول‌ها، وضعیت سایت‌ها schemas.ts تنظیمات سایت siteSettingsSchema ، صفحه، محصول، سفارش، درخواست، درگاه sections.ts کتابخانهٔ سکشن‌ها sectionDefinitions ، SYSTEM_PAGES ، contentOnlyChange siteOptions.ts header، footer، طراحی فونت و رنگ ، فیلدهای فرم collections.ts جدول‌های محتوا، فیلترها، باکس‌ها، presetها interactions.ts / forms.ts فرم درخواست، workflow، حساب مشتری؛ تبدیل فرم‌های نسخهٔ ۱ setup.ts ورودی ساخت سایت جدید siteSetupSchema bank.ts site kits بانک محتوا starters.ts ساختار starter pack apps/api/src مسیر چه دارد server.ts / app.ts شروع سرور؛ وصل کردن همهٔ routeها و middlewareها cli.ts دستورات migrate ، set password ، provision ، add sample starters cell bootstrap.ts راه‌اندازی اولیه روی سرور مشتری context.ts AppContext : اتصال دیتابیس کنترل، poolهای سایت‌ها، storage، ایمیل و SMS config/env.ts همهٔ متغیرهای محیطی با zod common/ http.ts ApiRouter ، errors.ts ، crypto.ts ، sql.ts ، logger.ts middleware/ auth.ts session، CSRF ، tenant.ts پیدا کردن سایت، دسترسی، ماژول ، errors.ts database/ migrator.ts ، migrationهای control plane/ و tenant/ ، tenant/pools.ts storage/ ذخیرهٔ فایل local یا S3 و route فایل‌ها modules/\u003cname / هر قابلیت: .routes.ts آدرس‌ها و .service.ts منطق ../test/ تست‌های vitest روی Postgres واقعی ماژول‌ها: assets ، audit ، auth ، bank ، catalog ، collections ، customers ، interactions ، leads ، members ، orders ، pages ، payments ، platform ، public ، shop ، site ، starters . apps/web/src مسیر چه دارد main.tsx ، app/ شروع برنامه و جدول مسیرها app/routes.tsx admin/ پنل ادمین lazy load admin/builder/ ویرایشگر صفحه: BuilderPage ، Inspector ، fields.ts ، state.ts ، PreviewFrame admin/pages/ صفحه‌های پنل: سایت‌ها، تنظیمات، صندوق درخواست‌ها، فروشگاه، starterها… admin/collections/ ، admin/interactions/ جدول‌های محتوا؛ طراح فرم و workflow features/ بخش‌های سایت عمومی: public site ، cart ، account ، collections ، leads ، wishlist sections/ رندر سکشن‌ها: renderers.tsx جدول renderer هر نوع ، SectionRenderer.tsx components/ layout سایت و اجزای UI lib/ api.ts کلاینت API ، errorText.ts ، calendar.ts ، preferences.tsx … content/ محتوای نمایشی وقتی API در دسترس نیست scripts/prerender.mjs ساخت HTML ایستا برای SEO هنگام build test/ تست‌های وب deploy/ مسیر چه دارد docker compose.yml استودیو پروژهٔ compose به نام site builder edge/nginx.conf مسیریابی همهٔ آدرس‌ها studio/api start.sh کارهایی که API استودیو در هر بار شروع انجام می‌دهد control/server.mjs سرویس deploy بدون وابستگی npm export/ فایل‌هایی که داخل هر بستهٔ مشتری قرار می‌گیرند cell/api start.sh شروع API روی سرور مشتری backup/ backup و restore کل استودیو photos/ دانلود عکس‌های قالب‌ها به var/demo images پوشه‌هایی که در Git نیستند var/ عکس‌ها و فایل‌های محلی ، exports/ بسته‌های مشتری ، backups/ ، .env و deploy/.env . این‌ها دادهٔ مشتری و رمز دارند و هرگز نباید commit شوند. اگر بخواهید… معنی اصطلاح‌ها را بدانید → واژه‌نامه glossary.md ببینید این قطعه‌ها در اجرا چطور به هم وصل می‌شوند → نمای کلی معماری ../02 architecture/overview.md ","headings":[{"level":2,"id":"نمای-کلی","text":"نمای کلی"},{"level":2,"id":"وابستگی-پکیجها","text":"وابستگی پکیج‌ها"},{"level":2,"id":"packagessharedsrc","text":"packages/shared/src"},{"level":2,"id":"appsapisrc","text":"apps/api/src"},{"level":2,"id":"appswebsrc","text":"apps/web/src"},{"level":2,"id":"deploy","text":"deploy/"},{"level":2,"id":"پوشههایی-که-در-git-نیستند","text":"پوشه‌هایی که در Git نیستند"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"01-start/glossary.md","title":"واژه‌نامه","html":"\u003ch1 id=\"واژهنامه\">واژه‌نامه\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۱ — شروع\u003c/p>\u003c/blockquote>\n\u003cp>این واژه‌ها در کد، مستندات و پیام‌ها همان‌طور که اینجا آمده‌اند به کار می‌روند.\u003c/p>\n\u003ch2 id=\"افراد-و-نقشها\">افراد و نقش‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>واژه\u003c/th>\u003cth>معنی\u003c/th>\u003cth>در کد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>operator\u003c/strong> (اپراتور)\u003c/td>\u003ctd>سازندهٔ سایت‌ها، یعنی شما. به همهٔ سایت‌ها و ساختارشان دسترسی دارد\u003c/td>\u003ctd>\u003ccode>users.is_platform_admin\u003c/code>، \u003ccode>requirePlatformAdmin\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>owner\u003c/strong> (مالک)\u003c/td>\u003ctd>صاحب کسب‌وکار؛ مشتریِ شما\u003c/td>\u003ctd>\u003ccode>memberships.role = 'owner'\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>staff\u003c/strong> (کارمند)\u003c/td>\u003ctd>کسی که مالک اضافه کرده، با دسترسی‌های محدود\u003c/td>\u003ctd>\u003ccode>memberships.role = 'staff'\u003c/code>، \u003ccode>permissions\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>customer\u003c/strong> (مشتریِ سایت)\u003c/td>\u003ctd>بازدیدکننده‌ای که در خود سایت حساب دارد\u003c/td>\u003ctd>جدول \u003ccode>customers\u003c/code> در دیتابیس سایت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>client\u003c/strong>\u003c/td>\u003ctd>در متن‌ها همان owner و staff، یعنی هر کسی جز اپراتور که وارد پنل می‌شود\u003c/td>\u003ctd>\u003ccode>isClient(req)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"محیطها\">محیط‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>واژه\u003c/th>\u003cth>معنی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>studio\u003c/strong> (استودیو)\u003c/td>\u003ctd>جایی که همهٔ سایت‌ها ساخته می‌شوند: \u003ccode>deploy/docker-compose.yml\u003c/code>، http://admin.localhost\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>preview\u003c/strong>\u003c/td>\u003ctd>نمایش زندهٔ یک سایت در استودیو: \u003ccode>http://&lt;slug&gt;.preview.localhost\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>deploy service\u003c/strong>\u003c/td>\u003ctd>صفحهٔ http://admin.localhost/deploy/ که برای هر سایت بستهٔ تحویل می‌سازد (\u003ccode>deploy/control/\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>package\u003c/strong> (بسته)\u003c/td>\u003ctd>خروجی قابل نصب برای سرور مشتری: \u003cstrong>install\u003c/strong> (بار اول) یا \u003cstrong>design update\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>cell\u003c/strong>\u003c/td>\u003ctd>API روی سرور مشتری که فقط یک سایت دارد. با \u003ccode>CELL_SLUG\u003c/code> شناخته می‌شود\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>clientLocked\u003c/strong>\u003c/td>\u003ctd>در cell، مشتری فقط محتوا را تغییر می‌دهد و ساختار سایت قفل است\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>legacy\u003c/strong>\u003c/td>\u003ctd>نسخهٔ اول پروژه (\u003ccode>docker-compose.yml\u003c/code> ریشه و مستندات قدیمی)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"داده\">داده\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>واژه\u003c/th>\u003cth>معنی\u003c/th>\u003cth>در کد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>site\u003c/strong> = \u003cstrong>tenant\u003c/strong>\u003c/td>\u003ctd>یک سایت مشتری. در کد بیشتر tenant گفته می‌شود\u003c/td>\u003ctd>جدول \u003ccode>tenants\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>slug\u003c/strong>\u003c/td>\u003ctd>شناسهٔ متنی (\u003ccode>cafe-roya\u003c/code>). در آدرس‌های API، \u003ccode>:siteId\u003c/code> همان slug است\u003c/td>\u003ctd>\u003ccode>slugSchema\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>control DB\u003c/strong>\u003c/td>\u003ctd>دیتابیس مرکزی \u003ccode>sb_control\u003c/code>: کاربران، sessionها، سایت‌ها، عضویت‌ها، starterها، kitها\u003c/td>\u003ctd>\u003ccode>ctx.control\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>tenant DB\u003c/strong>\u003c/td>\u003ctd>دیتابیس جدای هر سایت (\u003ccode>sb_t_&lt;slug&gt;\u003c/code>): صفحه‌ها، محصولات، سفارش‌ها…\u003c/td>\u003ctd>\u003ccode>req.tenant.db\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>site settings\u003c/strong>\u003c/td>\u003ctd>یک سند JSON بزرگ برای هر سایت: نام، منو، طراحی، ماژول‌ها، فرم‌ها، فروشگاه…\u003c/td>\u003ctd>\u003ccode>site_settings.settings\u003c/code>، \u003ccode>siteSettingsSchema\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>module\u003c/strong>\u003c/td>\u003ctd>بخشی از سایت که خاموش و روشن می‌شود: products، orders، services، leads\u003c/td>\u003ctd>\u003ccode>settings.modules\u003c/code>، \u003ccode>requireModule\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>demo\u003c/strong> (دادهٔ نمونه)\u003c/td>\u003ctd>ردیف‌های ساختگی با \u003ccode>demo = true\u003c/code> که با هم پاک می‌شوند و در بسته‌ها نمی‌روند\u003c/td>\u003ctd>ستون \u003ccode>demo\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"صفحهها-و-طراحی\">صفحه‌ها و طراحی\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>واژه\u003c/th>\u003cth>معنی\u003c/th>\u003cth>در کد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>page\u003c/strong>\u003c/td>\u003ctd>صفحه‌ای که در builder ساخته می‌شود. یک \u003cstrong>draft\u003c/strong> (پیش‌نویس) و یک \u003cstrong>published\u003c/strong> (منتشرشده) دارد\u003c/td>\u003ctd>جدول \u003ccode>pages\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>page version\u003c/strong>\u003c/td>\u003ctd>نسخهٔ ثبت‌شده در هر بار انتشار؛ قابل بازگردانی\u003c/td>\u003ctd>\u003ccode>page_versions\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>section\u003c/strong>\u003c/td>\u003ctd>بلوکی از صفحه (hero، faq، فرم تماس…) با \u003ccode>type\u003c/code> و \u003ccode>props\u003c/code>\u003c/td>\u003ctd>\u003ccode>sectionDefinitions\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>builder\u003c/strong>\u003c/td>\u003ctd>ویرایشگر صفحه در پنل\u003c/td>\u003ctd>\u003ccode>apps/web/src/admin/builder/\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>system page\u003c/strong>\u003c/td>\u003ctd>صفحهٔ داخلی (فروشگاه، سبد، حساب، 404…) که با slug ثابت قابل ویرایش می‌شود\u003c/td>\u003ctd>\u003ccode>SYSTEM_PAGES\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>collection\u003c/strong> (جدول محتوا)\u003c/td>\u003ctd>جدولی که اپراتور تعریف می‌کند (دوره‌ها، اخبار…) و مالک آیتم‌هایش را اضافه می‌کند\u003c/td>\u003ctd>\u003ccode>collections\u003c/code>، \u003ccode>collection_items\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>card / box design\u003c/strong>\u003c/td>\u003ctd>طرح باکس هر آیتم در لیست‌ها\u003c/td>\u003ctd>\u003ccode>settings.cardDesigns\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>header / footer\u003c/strong>\u003c/td>\u003ctd>سربرگ و پانویس سایت\u003c/td>\u003ctd>\u003ccode>settings.header\u003c/code>، \u003ccode>settings.footer\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"درخواستها-و-فروش\">درخواست‌ها و فروش\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>واژه\u003c/th>\u003cth>معنی\u003c/th>\u003cth>در کد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>request\u003c/strong> = \u003cstrong>lead\u003c/strong>\u003c/td>\u003ctd>درخواستی که بازدیدکننده با فرم می‌فرستد (مشاوره، رزرو…). در کد قدیمی‌تر lead نام دارد\u003c/td>\u003ctd>جدول \u003ccode>leads\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>request type\u003c/strong>\u003c/td>\u003ctd>یک نوع فرم با سؤال‌ها و workflow خودش\u003c/td>\u003ctd>\u003ccode>settings.requestTypes\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>workflow\u003c/strong>\u003c/td>\u003ctd>مراحلی که یک درخواست طی می‌کند\u003c/td>\u003ctd>\u003ccode>stages\u003c/code> در request type\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>case events\u003c/strong>\u003c/td>\u003ctd>خط زمانی یک درخواست یا سفارش: تغییر مرحله، پیام، یادداشت، پرداخت\u003c/td>\u003ctd>\u003ccode>case_events\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>order\u003c/strong>\u003c/td>\u003ctd>سفارش فروشگاه\u003c/td>\u003ctd>\u003ccode>orders\u003c/code>، \u003ccode>order_items\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>gateway / driver\u003c/strong>\u003c/td>\u003ctd>درگاه پرداخت؛ driver کدی است که یک نوع درگاه را می‌شناسد\u003c/td>\u003ctd>\u003ccode>payments/drivers.ts\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>minor unit\u003c/strong>\u003c/td>\u003ctd>مبلغ به کوچک‌ترین واحد پول (برای IRR، ریال)\u003c/td>\u003ctd>ستون‌های \u003ccode>*_minor\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"ابزارهای-استودیو\">ابزارهای استودیو\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>واژه\u003c/th>\u003cth>معنی\u003c/th>\u003cth>در کد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>setup\u003c/strong>\u003c/td>\u003ctd>فرم ساخت سایت جدید که تنظیمات، صفحه‌ها، فرم‌ها و جدول‌ها را می‌سازد\u003c/td>\u003ctd>\u003ccode>siteSetupSchema\u003c/code>، \u003ccode>applySetup\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>business type / template\u003c/strong>\u003c/td>\u003ctd>یکی از ۸ نوع کسب‌وکار آماده در setup\u003c/td>\u003ctd>\u003ccode>templates/catalog.ts\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>starter\u003c/strong>\u003c/td>\u003ctd>نقطهٔ شروع آماده: صفحه، جدول، header یا footer، قابل اعمال روی هر سایت\u003c/td>\u003ctd>جدول \u003ccode>starters\u003c/code>، \u003ccode>starterPackSchema\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>pack\u003c/strong>\u003c/td>\u003ctd>محتوای کامل یک starter: صفحه‌ها، جدول‌ها، فرم‌ها، عکس‌ها، نمونه‌ها\u003c/td>\u003ctd>\u003ccode>starters.data\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ready-made starter\u003c/strong>\u003c/td>\u003ctd>starterهای آمادهٔ خود کد که در هر شروع API اضافه می‌شوند\u003c/td>\u003ctd>\u003ccode>starters/samples.ts\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>site kit\u003c/strong> (= content bank)\u003c/td>\u003ctd>دادهٔ نمونه برای هر نوع سایت؛ دادهٔ نمونهٔ سایت‌ها از آن ساخته می‌شود\u003c/td>\u003ctd>\u003ccode>bank_types\u003c/code>، \u003ccode>kit_tables\u003c/code>، \u003ccode>bank_entries\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>ببینید این اجزا چطور کنار هم کار می‌کنند → \u003ca href=\"#02-architecture/overview.md\">نمای کلی معماری\u003c/a>\u003c/li>\u003c/ul>","text":" واژه‌نامه فصل ۱ — شروع این واژه‌ها در کد، مستندات و پیام‌ها همان‌طور که اینجا آمده‌اند به کار می‌روند. افراد و نقش‌ها واژه معنی در کد operator اپراتور سازندهٔ سایت‌ها، یعنی شما. به همهٔ سایت‌ها و ساختارشان دسترسی دارد users.is_platform_admin ، requirePlatformAdmin owner مالک صاحب کسب‌وکار؛ مشتریِ شما memberships.role = 'owner' staff کارمند کسی که مالک اضافه کرده، با دسترسی‌های محدود memberships.role = 'staff' ، permissions customer مشتریِ سایت بازدیدکننده‌ای که در خود سایت حساب دارد جدول customers در دیتابیس سایت client در متن‌ها همان owner و staff، یعنی هر کسی جز اپراتور که وارد پنل می‌شود isClient req محیط‌ها واژه معنی studio استودیو جایی که همهٔ سایت‌ها ساخته می‌شوند: deploy/docker compose.yml ، http://admin.localhost preview نمایش زندهٔ یک سایت در استودیو: http://\u003cslug .preview.localhost deploy service صفحهٔ http://admin.localhost/deploy/ که برای هر سایت بستهٔ تحویل می‌سازد deploy/control/ package بسته خروجی قابل نصب برای سرور مشتری: install بار اول یا design update cell API روی سرور مشتری که فقط یک سایت دارد. با CELL_SLUG شناخته می‌شود clientLocked در cell، مشتری فقط محتوا را تغییر می‌دهد و ساختار سایت قفل است legacy نسخهٔ اول پروژه docker compose.yml ریشه و مستندات قدیمی داده واژه معنی در کد site = tenant یک سایت مشتری. در کد بیشتر tenant گفته می‌شود جدول tenants slug شناسهٔ متنی cafe roya . در آدرس‌های API، :siteId همان slug است slugSchema control DB دیتابیس مرکزی sb_control : کاربران، sessionها، سایت‌ها، عضویت‌ها، starterها، kitها ctx.control tenant DB دیتابیس جدای هر سایت sb_t_\u003cslug : صفحه‌ها، محصولات، سفارش‌ها… req.tenant.db site settings یک سند JSON بزرگ برای هر سایت: نام، منو، طراحی، ماژول‌ها، فرم‌ها، فروشگاه… site_settings.settings ، siteSettingsSchema module بخشی از سایت که خاموش و روشن می‌شود: products، orders، services، leads settings.modules ، requireModule demo دادهٔ نمونه ردیف‌های ساختگی با demo = true که با هم پاک می‌شوند و در بسته‌ها نمی‌روند ستون demo صفحه‌ها و طراحی واژه معنی در کد page صفحه‌ای که در builder ساخته می‌شود. یک draft پیش‌نویس و یک published منتشرشده دارد جدول pages page version نسخهٔ ثبت‌شده در هر بار انتشار؛ قابل بازگردانی page_versions section بلوکی از صفحه hero، faq، فرم تماس… با type و props sectionDefinitions builder ویرایشگر صفحه در پنل apps/web/src/admin/builder/ system page صفحهٔ داخلی فروشگاه، سبد، حساب، 404… که با slug ثابت قابل ویرایش می‌شود SYSTEM_PAGES collection جدول محتوا جدولی که اپراتور تعریف می‌کند دوره‌ها، اخبار… و مالک آیتم‌هایش را اضافه می‌کند collections ، collection_items card / box design طرح باکس هر آیتم در لیست‌ها settings.cardDesigns header / footer سربرگ و پانویس سایت settings.header ، settings.footer درخواست‌ها و فروش واژه معنی در کد request = lead درخواستی که بازدیدکننده با فرم می‌فرستد مشاوره، رزرو… . در کد قدیمی‌تر lead نام دارد جدول leads request type یک نوع فرم با سؤال‌ها و workflow خودش settings.requestTypes workflow مراحلی که یک درخواست طی می‌کند stages در request type case events خط زمانی یک درخواست یا سفارش: تغییر مرحله، پیام، یادداشت، پرداخت case_events order سفارش فروشگاه orders ، order_items gateway / driver درگاه پرداخت؛ driver کدی است که یک نوع درگاه را می‌شناسد payments/drivers.ts minor unit مبلغ به کوچک‌ترین واحد پول برای IRR، ریال ستون‌های _minor ابزارهای استودیو واژه معنی در کد setup فرم ساخت سایت جدید که تنظیمات، صفحه‌ها، فرم‌ها و جدول‌ها را می‌سازد siteSetupSchema ، applySetup business type / template یکی از ۸ نوع کسب‌وکار آماده در setup templates/catalog.ts starter نقطهٔ شروع آماده: صفحه، جدول، header یا footer، قابل اعمال روی هر سایت جدول starters ، starterPackSchema pack محتوای کامل یک starter: صفحه‌ها، جدول‌ها، فرم‌ها، عکس‌ها، نمونه‌ها starters.data ready made starter starterهای آمادهٔ خود کد که در هر شروع API اضافه می‌شوند starters/samples.ts site kit = content bank دادهٔ نمونه برای هر نوع سایت؛ دادهٔ نمونهٔ سایت‌ها از آن ساخته می‌شود bank_types ، kit_tables ، bank_entries اگر بخواهید… ببینید این اجزا چطور کنار هم کار می‌کنند → نمای کلی معماری ../02 architecture/overview.md ","headings":[{"level":2,"id":"افراد-و-نقشها","text":"افراد و نقش‌ها"},{"level":2,"id":"محیطها","text":"محیط‌ها"},{"level":2,"id":"داده","text":"داده"},{"level":2,"id":"صفحهها-و-طراحی","text":"صفحه‌ها و طراحی"},{"level":2,"id":"درخواستها-و-فروش","text":"درخواست‌ها و فروش"},{"level":2,"id":"ابزارهای-استودیو","text":"ابزارهای استودیو"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"01-start/setup.md","title":"راه‌اندازی محیط توسعه","html":"\u003ch1 id=\"راهاندازی-محیط-توسعه\">راه‌اندازی محیط توسعه\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۱ — شروع · فایل‌ها: \u003ccode>deploy/docker-compose.yml\u003c/code>، \u003ccode>deploy/.env.example\u003c/code>، \u003ccode>package.json\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>برای توسعه سه چیز لازم دارید:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>استودیو\u003c/strong> که در Docker اجرا می‌شود و تغییراتتان را در مرورگر نشانش می‌دهد،\u003c/li>\u003cli>\u003cstrong>Node.js\u003c/strong> برای typecheck و اجرای تست‌ها روی سیستم خودتان،\u003c/li>\u003cli>یک \u003cstrong>Postgres جدا برای تست‌ها\u003c/strong> روی پورت 5433.\u003c/li>\u003c/ul>\n\u003ch2 id=\"پیشنیازها\">پیش‌نیازها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ابزار\u003c/th>\u003cth>نسخه\u003c/th>\u003cth>برای\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Docker Desktop\u003c/td>\u003ctd>روشن و در حال اجرا\u003c/td>\u003ctd>استودیو و دیتابیس تست\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Node.js\u003c/td>\u003ctd>۲۲ (Dockerfile از \u003ccode>node:22-alpine\u003c/code> استفاده می‌کند)\u003c/td>\u003ctd>\u003ccode>npm install\u003c/code>، typecheck، تست\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Git\u003c/td>\u003ctd>—\u003c/td>\u003ctd>کد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VS Code (اختیاری)\u003c/td>\u003ctd>با افزونهٔ Mermaid\u003c/td>\u003ctd>خواندن همین مستندات\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"۱-دریافت-کد-و-نصب-پکیجها\">۱. دریافت کد و نصب پکیج‌ها\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git clone https://github.com/bonshad2026/site-builder.git\ncd site-builder\ngit switch develop\nnpm install\u003c/code>\u003c/pre>\n\u003cp>پروژه یک \u003cstrong>npm workspace\u003c/strong> است. با یک بار \u003ccode>npm install\u003c/code> در ریشه، هر سه پکیج نصب می‌شوند: \u003ccode>packages/shared\u003c/code>، \u003ccode>apps/api\u003c/code> و \u003ccode>apps/web\u003c/code>.\u003c/p>\n\u003cblockquote>\u003cp>اگر \u003ccode>npm install\u003c/code> به mirror داخل lockfile وصل نشد، در \u003ccode>deploy/.env\u003c/code> مقدار \u003ccode>NPM_REGISTRY=https://registry.npmjs.org/\u003c/code> را بگذارید (برای ساخت Docker). روی سیستم خودتان هم می‌توانید \u003ccode>npm install --registry=https://registry.npmjs.org/\u003c/code> بزنید.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"۲-ساخت-فایل-تنظیمات\">۲. ساخت فایل تنظیمات\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>cp deploy/.env.example deploy/.env\u003c/code>\u003c/pre>\n\u003cp>مقدارها را پر کنید. هر کلید ۳۲ بایت تصادفی است:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>node -e &quot;console.log(require('crypto').randomBytes(32).toString('base64'))&quot;\u003c/code>\u003c/pre>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کلید\u003c/th>\u003cth>چیست\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>CONTROL_ADMIN_EMAIL\u003c/code> / \u003ccode>CONTROL_ADMIN_PASSWORD\u003c/code>\u003c/td>\u003ctd>ورود اپراتور به استودیو (محلی: \u003ccode>admin\u003c/code> / \u003ccode>123456\u003c/code>). در هر بار شروع API دوباره روی همین مقدار تنظیم می‌شود\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>STUDIO_DB_PASSWORD\u003c/code>\u003c/td>\u003ctd>رمز کاربر \u003ccode>sb_admin\u003c/code> دیتابیس استودیو\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>STUDIO_API_DB_PASSWORD\u003c/code>\u003c/td>\u003ctd>رمز کاربر \u003ccode>sb_api\u003c/code> که API با آن به \u003ccode>sb_control\u003c/code> وصل می‌شود\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>STUDIO_TENANT_SECRETS_KEY\u003c/code>\u003c/td>\u003ctd>کلید رمزکردن رمزهای دیتابیس سایت‌ها (باید base64 و ۳۲ بایت باشد)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>STUDIO_STORAGE_SIGNING_KEY\u003c/code>\u003c/td>\u003ctd>امضای لینک فایل‌های خصوصی\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SITE_OPERATOR_*\u003c/code> / \u003ccode>SITE_OWNER_*\u003c/code>\u003c/td>\u003ctd>حساب‌های پیش‌فرض بسته‌هایی که برای مشتری ساخته می‌شود\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>EXPORT_DIR\u003c/code>\u003c/td>\u003ctd>پوشه‌ای که بسته‌های مشتری در آن ساخته می‌شوند\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>اگر از یک backup شروع می‌کنید، \u003ccode>deploy/.env\u003c/code> داخل همان backup است؛ راهنمای \u003ca href=\"../HANDOFF.fa.md\">\u003ccode>HANDOFF.fa.md\u003c/code>\u003c/a> را ببینید.\u003c/p>\n\u003ch2 id=\"۳-اجرای-استودیو\">۳. اجرای استودیو\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml up -d --build\u003c/code>\u003c/pre>\n\u003cp>ساخت اول چند دقیقه طول می‌کشد. بعد:\u003c/p>\n\u003cul>\u003cli>پنل: http://admin.localhost (ورود با حساب اپراتور)\u003c/li>\u003cli>پیش‌نمایش هر سایت: \u003ccode>http://&lt;slug&gt;.preview.localhost\u003c/code>\u003c/li>\u003cli>سرویس deploy: http://admin.localhost/deploy/\u003c/li>\u003c/ul>\n\u003cp>مرورگرها آدرس‌های \u003ccode>*.localhost\u003c/code> را خودشان به 127.0.0.1 می‌برند و تنظیم \u003ccode>hosts\u003c/code> لازم نیست. (Node.js این کار را نمی‌کند؛ برای همین اسکریپت‌ها مستقیم به \u003ccode>127.0.0.1:4000\u003c/code> وصل می‌شوند.)\u003c/p>\n\u003ch2 id=\"۴-دیتابیس-تست\">۴. دیتابیس تست\u003c/h2>\n\u003cp>تست‌های API روی Postgres واقعی اجرا می‌شوند، روی پورت \u003cstrong>5433\u003c/strong> (جدا از استودیو):\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker run -d --name sb-test-pg -p 127.0.0.1:5433:5432 -e POSTGRES_USER=sb_admin -e POSTGRES_PASSWORD=sb_admin_dev_password postgres:16-alpine\u003c/code>\u003c/pre>\n\u003cp>دفعه‌های بعد فقط:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker start sb-test-pg\u003c/code>\u003c/pre>\n\u003ch2 id=\"۵-بررسی-اینکه-همهچیز-سالم-است\">۵. بررسی اینکه همه‌چیز سالم است\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>npm run typecheck\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>npm test\u003c/code>\u003c/pre>\n\u003cp>در تاریخ 2026-11-02 هر دو بدون خطا هستند: وب ۴۳ تست و API ۱۰۴ تست.\u003c/p>\n\u003ch2 id=\"۶-چرخه-هر-تغییر\">۶. چرخهٔ هر تغییر\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  A[ویرایش کد] --&gt; B[npm run typecheck]\n  B --&gt; C[npm test]\n  C --&gt; D[rebuild کانتینرها]\n  D --&gt; E[بررسی در admin.localhost]\n  E --&gt; F[به‌روزرسانی مستندات و STATUS]\u003c/pre>\n\u003cp>rebuild فقط برای دو کانتینر برنامه:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml up -d --build studio-api studio-web\u003c/code>\u003c/pre>\n\u003ch2 id=\"اجرای-بدون-docker-اختیاری\">اجرای بدون Docker (اختیاری)\u003c/h2>\n\u003cp>برای کار سریع روی رابط کاربری می‌توانید وب را با Vite و hot reload اجرا کنید (\u003ccode>npm run dev\u003c/code> در ریشه). اما API و دیتابیس همچنان باید در دسترس باشند و آدرس‌های preview (\u003ccode>*.preview.localhost\u003c/code>) فقط از طریق nginx استودیو کار می‌کنند. برای همین روش اصلی این پروژه rebuild کانتینرهاست.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>بدانید هر پوشه چه دارد → \u003ca href=\"#01-start/folders.md\">ساختار پوشه‌ها\u003c/a>\u003c/li>\u003cli>دستورات روزانهٔ Docker را ببینید → \u003ca href=\"#06-operations/docker.md\">Docker و اجرای روزانه\u003c/a>\u003c/li>\u003cli>با مشکل نصب روبه‌رو شدید → \u003ca href=\"#06-operations/troubleshooting.md\">عیب‌یابی\u003c/a>\u003c/li>\u003c/ul>","text":" راه‌اندازی محیط توسعه فصل ۱ — شروع · فایل‌ها: deploy/docker compose.yml ، deploy/.env.example ، package.json خلاصه برای توسعه سه چیز لازم دارید: استودیو که در Docker اجرا می‌شود و تغییراتتان را در مرورگر نشانش می‌دهد، Node.js برای typecheck و اجرای تست‌ها روی سیستم خودتان، یک Postgres جدا برای تست‌ها روی پورت 5433. پیش‌نیازها ابزار نسخه برای Docker Desktop روشن و در حال اجرا استودیو و دیتابیس تست Node.js ۲۲ Dockerfile از node:22 alpine استفاده می‌کند npm install ، typecheck، تست Git — کد VS Code اختیاری با افزونهٔ Mermaid خواندن همین مستندات ۱. دریافت کد و نصب پکیج‌ها پروژه یک npm workspace است. با یک بار npm install در ریشه، هر سه پکیج نصب می‌شوند: packages/shared ، apps/api و apps/web . اگر npm install به mirror داخل lockfile وصل نشد، در deploy/.env مقدار NPM_REGISTRY=https://registry.npmjs.org/ را بگذارید برای ساخت Docker . روی سیستم خودتان هم می‌توانید npm install registry=https://registry.npmjs.org/ بزنید. ۲. ساخت فایل تنظیمات مقدارها را پر کنید. هر کلید ۳۲ بایت تصادفی است: کلید چیست CONTROL_ADMIN_EMAIL / CONTROL_ADMIN_PASSWORD ورود اپراتور به استودیو محلی: admin / 123456 . در هر بار شروع API دوباره روی همین مقدار تنظیم می‌شود STUDIO_DB_PASSWORD رمز کاربر sb_admin دیتابیس استودیو STUDIO_API_DB_PASSWORD رمز کاربر sb_api که API با آن به sb_control وصل می‌شود STUDIO_TENANT_SECRETS_KEY کلید رمزکردن رمزهای دیتابیس سایت‌ها باید base64 و ۳۲ بایت باشد STUDIO_STORAGE_SIGNING_KEY امضای لینک فایل‌های خصوصی SITE_OPERATOR_ / SITE_OWNER_ حساب‌های پیش‌فرض بسته‌هایی که برای مشتری ساخته می‌شود EXPORT_DIR پوشه‌ای که بسته‌های مشتری در آن ساخته می‌شوند اگر از یک backup شروع می‌کنید، deploy/.env داخل همان backup است؛ راهنمای HANDOFF.fa.md ../../HANDOFF.fa.md را ببینید. ۳. اجرای استودیو ساخت اول چند دقیقه طول می‌کشد. بعد: پنل: http://admin.localhost ورود با حساب اپراتور پیش‌نمایش هر سایت: http://\u003cslug .preview.localhost سرویس deploy: http://admin.localhost/deploy/ مرورگرها آدرس‌های .localhost را خودشان به 127.0.0.1 می‌برند و تنظیم hosts لازم نیست. Node.js این کار را نمی‌کند؛ برای همین اسکریپت‌ها مستقیم به 127.0.0.1:4000 وصل می‌شوند. ۴. دیتابیس تست تست‌های API روی Postgres واقعی اجرا می‌شوند، روی پورت 5433 جدا از استودیو : دفعه‌های بعد فقط: ۵. بررسی اینکه همه‌چیز سالم است در تاریخ 2026 11 02 هر دو بدون خطا هستند: وب ۴۳ تست و API ۱۰۴ تست. ۶. چرخهٔ هر تغییر rebuild فقط برای دو کانتینر برنامه: اجرای بدون Docker اختیاری برای کار سریع روی رابط کاربری می‌توانید وب را با Vite و hot reload اجرا کنید npm run dev در ریشه . اما API و دیتابیس همچنان باید در دسترس باشند و آدرس‌های preview .preview.localhost فقط از طریق nginx استودیو کار می‌کنند. برای همین روش اصلی این پروژه rebuild کانتینرهاست. اگر بخواهید… بدانید هر پوشه چه دارد → ساختار پوشه‌ها folders.md دستورات روزانهٔ Docker را ببینید → Docker و اجرای روزانه ../06 operations/docker.md با مشکل نصب روبه‌رو شدید → عیب‌یابی ../06 operations/troubleshooting.md ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"پیشنیازها","text":"پیش‌نیازها"},{"level":2,"id":"۱-دریافت-کد-و-نصب-پکیجها","text":"۱. دریافت کد و نصب پکیج‌ها"},{"level":2,"id":"۲-ساخت-فایل-تنظیمات","text":"۲. ساخت فایل تنظیمات"},{"level":2,"id":"۳-اجرای-استودیو","text":"۳. اجرای استودیو"},{"level":2,"id":"۴-دیتابیس-تست","text":"۴. دیتابیس تست"},{"level":2,"id":"۵-بررسی-اینکه-همهچیز-سالم-است","text":"۵. بررسی اینکه همه‌چیز سالم است"},{"level":2,"id":"۶-چرخه-هر-تغییر","text":"۶. چرخهٔ هر تغییر"},{"level":2,"id":"اجرای-بدون-docker-اختیاری","text":"اجرای بدون Docker (اختیاری)"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"02-architecture/auth.md","title":"احراز هویت و نقش‌ها","html":"\u003ch1 id=\"احراز-هویت-و-نقشها\">احراز هویت و نقش‌ها\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۲ — معماری · فایل‌ها: \u003ccode>apps/api/src/middleware/auth.ts\u003c/code>، \u003ccode>apps/api/src/middleware/tenant.ts\u003c/code>، \u003ccode>apps/api/src/modules/auth/\u003c/code>، \u003ccode>apps/api/src/modules/customers/\u003c/code>، \u003ccode>packages/shared/src/constants.ts\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>دو نوع ورود کاملاً جدا وجود دارد:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>کاربران پنل\u003c/th>\u003cth>مشتریان سایت\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>چه کسانی\u003c/td>\u003ctd>اپراتور، مالک، کارمند\u003c/td>\u003ctd>بازدیدکننده‌ای که در سایت حساب ساخته\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کجا ذخیره می‌شوند\u003c/td>\u003ctd>دیتابیس کنترل (\u003ccode>users\u003c/code>، \u003ccode>sessions\u003c/code>)\u003c/td>\u003ctd>دیتابیس همان سایت (\u003ccode>customers\u003c/code>، \u003ccode>customer_sessions\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cookie\u003c/td>\u003ctd>\u003ccode>sb_session\u003c/code> و \u003ccode>sb_csrf\u003c/code>\u003c/td>\u003ctd>\u003ccode>sb_c_&lt;slug&gt;\u003c/code> و \u003ccode>sb_cc_&lt;slug&gt;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>هدر CSRF\u003c/td>\u003ctd>\u003ccode>X-CSRF-Token\u003c/code>\u003c/td>\u003ctd>\u003ccode>X-Customer-CSRF\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>آدرس‌ها\u003c/td>\u003ctd>\u003ccode>/api/v1/auth/…\u003c/code>\u003c/td>\u003ctd>\u003ccode>/api/v1/public/sites/:slug/customer/…\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"کاربران-پنل\">کاربران پنل\u003c/h2>\n\u003ch3 id=\"ورود\">ورود\u003c/h3>\n\u003cp>\u003ccode>POST /api/v1/auth/login\u003c/code> با نام کاربری یا ایمیل و رمز. ورود با کد SMS هم هست: \u003ccode>/otp/request\u003c/code> و بعد \u003ccode>/otp/login\u003c/code>. رمزها با \u003cstrong>argon2id\u003c/strong> هش می‌شوند (\u003ccode>auth.service.ts\u003c/code>). مسیرهای ورود rate limit دارند.\u003c/p>\n\u003cp>پس از ورود:\u003c/p>\n\u003cul>\u003cli>cookie \u003ccode>sb_session\u003c/code> (HttpOnly) ساخته می‌شود. فقط \u003cstrong>هش\u003c/strong> token در جدول \u003ccode>sessions\u003c/code> ذخیره می‌شود.\u003c/li>\u003cli>cookie \u003ccode>sb_csrf\u003c/code> (قابل خواندن با JavaScript) هم ساخته می‌شود.\u003c/li>\u003cli>عمر session برابر \u003ccode>SESSION_TTL_HOURS\u003c/code> است (پیش‌فرض ۷ روز).\u003c/li>\u003c/ul>\n\u003ch3 id=\"هر-درخواست\">هر درخواست\u003c/h3>\n\u003cpre class=\"mermaid\">sequenceDiagram\n  participant B as مرورگر\n  participant A as API\n  participant C as sb_control\n  B-&gt;&gt;A: درخواست + cookie sb_session (+ X-CSRF-Token برای POST/PUT/PATCH/DELETE)\n  A-&gt;&gt;C: loadSession: sessions JOIN users (token_hash، revoked، expires، status)\n  A-&gt;&gt;A: requireAuth: CSRF را با csrf_hash مقایسه می‌کند\n  A-&gt;&gt;C: loadMemberTenant: tenants + memberships\n  A--&gt;&gt;B: پاسخ یا 401 / 403 / 404\u003c/pre>\n\u003cp>\u003cstrong>CSRF به روش double-submit:\u003c/strong> وب مقدار cookie \u003ccode>sb_csrf\u003c/code> را در هدر \u003ccode>X-CSRF-Token\u003c/code> می‌فرستد (\u003ccode>apps/web/src/lib/api.ts\u003c/code>). API هش هدر را با \u003ccode>csrf_hash\u003c/code> همان session مقایسه می‌کند. این بررسی فقط روی routeهایی است که ورود لازم دارند، پس فرم‌های عمومی بی‌نام تحت تأثیر نیستند.\u003c/p>\n\u003ch3 id=\"نقشها\">نقش‌ها\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نقش\u003c/th>\u003cth>از کجا\u003c/th>\u003cth>دسترسی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>اپراتور (\u003ccode>platform_admin\u003c/code>)\u003c/td>\u003ctd>\u003ccode>users.is_platform_admin\u003c/code>\u003c/td>\u003ctd>همهٔ سایت‌ها، همهٔ مجوزها، routeهای \u003ccode>/platform\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مالک (\u003ccode>owner\u003c/code>)\u003c/td>\u003ctd>\u003ccode>memberships.role\u003c/code>\u003c/td>\u003ctd>همهٔ مجوزهای سایت خودش\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کارمند (\u003ccode>staff\u003c/code>)\u003c/td>\u003ctd>\u003ccode>memberships.role\u003c/code> + \u003ccode>memberships.permissions\u003c/code>\u003c/td>\u003ctd>فقط مجوزهایی که مالک داده\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>مجوزها (\u003ccode>PERMISSIONS\u003c/code> در shared): \u003ccode>site:write\u003c/code>، \u003ccode>pages:write\u003c/code>، \u003ccode>catalog:write\u003c/code>، \u003ccode>assets:write\u003c/code>، \u003ccode>leads:read\u003c/code>، \u003ccode>leads:write\u003c/code>، \u003ccode>orders:read\u003c/code>، \u003ccode>orders:write\u003c/code>، \u003ccode>payments:manage\u003c/code>.\u003c/p>\n\u003ch3 id=\"نگهبانهای-route\">نگهبان‌های route\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>middleware\u003c/th>\u003cth>کجا\u003c/th>\u003cth>چه می‌کند\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>requireAuth\u003c/code>\u003c/td>\u003ctd>\u003ccode>middleware/auth.ts\u003c/code>\u003c/td>\u003ctd>ورود + CSRF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>requirePlatformAdmin\u003c/code>\u003c/td>\u003ctd>\u003ccode>middleware/auth.ts\u003c/code>\u003c/td>\u003ctd>ورود + CSRF + اپراتور\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>requirePermission('x')\u003c/code>\u003c/td>\u003ctd>\u003ccode>middleware/tenant.ts\u003c/code>\u003c/td>\u003ctd>مجوز در همین سایت؛ وگرنه 403\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>requireOwner\u003c/code>\u003c/td>\u003ctd>\u003ccode>middleware/tenant.ts\u003c/code>\u003c/td>\u003ctd>فقط مالک یا اپراتور\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>requireModule('x')\u003c/code>\u003c/td>\u003ctd>\u003ccode>middleware/tenant.ts\u003c/code>\u003c/td>\u003ctd>ماژول سایت روشن باشد؛ وگرنه \u003ccode>403 module_disabled\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>operatorOnly\u003c/code>\u003c/td>\u003ctd>\u003ccode>app.ts\u003c/code>، \u003ccode>pages.routes.ts\u003c/code>\u003c/td>\u003ctd>در cell فقط اپراتور (ساختار سایت)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\u003cp>پنهان کردن یک دکمه در رابط کاربری \u003cstrong>کافی نیست\u003c/strong>. هر محدودیت باید در API هم با یکی از این middlewareها اعمال شود.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"قفل-مشتری-در-cell-clientlocked\">قفل مشتری در cell (\u003ccode>clientLocked\u003c/code>)\u003c/h2>\n\u003cp>وقتی \u003ccode>CELL_SLUG\u003c/code> تنظیم شده است (سرور مشتری)، کاربرِ غیراپراتور:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>صفحه‌ها:\u003c/strong> فقط متن و تصویر سکشن‌های موجود را عوض می‌کند. \u003ccode>contentOnlyChange\u003c/code> (shared \u003ccode>sections.ts\u003c/code>) سند قبلی و جدید را مقایسه می‌کند و افزودن، حذف، جابه‌جایی یا پنهان کردن سکشن و تغییر کلیدهای ساختاری را رد می‌کند.\u003c/li>\u003cli>\u003cstrong>تنظیمات:\u003c/strong> در \u003ccode>PUT /settings\u003c/code> فقط فیلدهای محتوایی از مشتری گرفته می‌شود: نام، شعار، لوگو، تماس، شبکه‌های اجتماعی، دسته‌بندی‌ها، نام نوع درخواست‌ها و مراحل، متن پیام‌ها، footer، قوانین فروشگاه و… (\u003ccode>site.routes.ts\u003c/code>). فرم‌ها، workflowها، حساب‌ها و \u003ccode>settings.texts\u003c/code> مال اپراتور است.\u003c/li>\u003cli>\u003cstrong>وب:\u003c/strong> با \u003ccode>VITE_ADMIN_SCOPE=client\u003c/code> ساخته می‌شود؛ \u003ccode>OPERATOR_UI\u003c/code> در \u003ccode>admin/auth.tsx\u003c/code> غلط است و کد builder اصلاً داخل bundle نیست.\u003c/li>\u003c/ul>\n\u003cp>اپراتور با \u003cstrong>SSO\u003c/strong> وارد پنل مشتری می‌شود: سرویس deploy یک لینک امضاشده با \u003ccode>CELL_SSO_SECRET\u003c/code> می‌سازد، و \u003ccode>GET /api/v1/auth/sso\u003c/code> (\u003ccode>modules/auth/sso.ts\u003c/code>) اگر لینک معتبر، تاریخ‌نگذشته و استفاده‌نشده باشد session باز می‌کند.\u003c/p>\n\u003ch2 id=\"مشتریان-سایت\">مشتریان سایت\u003c/h2>\n\u003cp>اختیاری است (\u003ccode>settings.accounts\u003c/code>). ورود با تلفن یا ایمیل + کد یک‌بارمصرف، و در صورت تمایل رمز:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس (\u003ccode>/api/v1/public/sites/:slug/…\u003c/code>)\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>POST customer/code\u003c/code>\u003c/td>\u003ctd>ارسال کد (ثبت‌نام، ورود، بازیابی رمز)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST customer/signup\u003c/code>\u003c/td>\u003ctd>ساخت حساب با کد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST customer/login\u003c/code>\u003c/td>\u003ctd>ورود با رمز یا کد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST customer/reset\u003c/code>\u003c/td>\u003ctd>رمز جدید با کد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET\u003c/code> / \u003ccode>PATCH customer/me\u003c/code>\u003c/td>\u003ctd>مشتری فعلی؛ تغییر نام، تماس یا رمز\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET customer/cases\u003c/code>\u003c/td>\u003ctd>درخواست‌ها و سفارش‌های مشتری\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>loadCustomer()\u003c/code> در هر درخواست عمومی cookie مشتری را می‌خواند و \u003ccode>req.customer\u003c/code> را پر می‌کند. cookieها به نام slug هستند، پس ورود به یک سایت روی سایت دیگر اثری ندارد. کد routeها در \u003ccode>modules/interactions/public.routes.ts\u003c/code> و منطق در \u003ccode>modules/customers/customers.service.ts\u003c/code> است.\u003c/p>\n\u003cp>در محیط محلی ایمیل و SMS فقط در لاگ \u003ccode>sb-studio-api\u003c/code> چاپ می‌شوند (\u003ccode>EMAIL_PROVIDER=console\u003c/code>، \u003ccode>SMS_PROVIDER=console\u003c/code>) و فرم ثبت‌نام کد را نشان می‌دهد.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>مجوز جدیدی اضافه کنید: آن را به \u003ccode>PERMISSIONS\u003c/code> در shared اضافه کنید، روی route با \u003ccode>requirePermission\u003c/code> بگذارید و در صفحهٔ اعضا (\u003ccode>members\u003c/code>) نمایشش دهید.\u003c/li>\u003cli>رمز یک کاربر را عوض کنید → \u003ca href=\"#06-operations/docker.md::cli-api\">Docker و اجرای روزانه\u003c/a>\u003c/li>\u003c/ul>","text":" احراز هویت و نقش‌ها فصل ۲ — معماری · فایل‌ها: apps/api/src/middleware/auth.ts ، apps/api/src/middleware/tenant.ts ، apps/api/src/modules/auth/ ، apps/api/src/modules/customers/ ، packages/shared/src/constants.ts خلاصه دو نوع ورود کاملاً جدا وجود دارد: کاربران پنل مشتریان سایت چه کسانی اپراتور، مالک، کارمند بازدیدکننده‌ای که در سایت حساب ساخته کجا ذخیره می‌شوند دیتابیس کنترل users ، sessions دیتابیس همان سایت customers ، customer_sessions cookie sb_session و sb_csrf sb_c_\u003cslug و sb_cc_\u003cslug هدر CSRF X CSRF Token X Customer CSRF آدرس‌ها /api/v1/auth/… /api/v1/public/sites/:slug/customer/… کاربران پنل ورود POST /api/v1/auth/login با نام کاربری یا ایمیل و رمز. ورود با کد SMS هم هست: /otp/request و بعد /otp/login . رمزها با argon2id هش می‌شوند auth.service.ts . مسیرهای ورود rate limit دارند. پس از ورود: cookie sb_session HttpOnly ساخته می‌شود. فقط هش token در جدول sessions ذخیره می‌شود. cookie sb_csrf قابل خواندن با JavaScript هم ساخته می‌شود. عمر session برابر SESSION_TTL_HOURS است پیش‌فرض ۷ روز . هر درخواست CSRF به روش double submit: وب مقدار cookie sb_csrf را در هدر X CSRF Token می‌فرستد apps/web/src/lib/api.ts . API هش هدر را با csrf_hash همان session مقایسه می‌کند. این بررسی فقط روی routeهایی است که ورود لازم دارند، پس فرم‌های عمومی بی‌نام تحت تأثیر نیستند. نقش‌ها نقش از کجا دسترسی اپراتور platform_admin users.is_platform_admin همهٔ سایت‌ها، همهٔ مجوزها، routeهای /platform مالک owner memberships.role همهٔ مجوزهای سایت خودش کارمند staff memberships.role + memberships.permissions فقط مجوزهایی که مالک داده مجوزها PERMISSIONS در shared : site:write ، pages:write ، catalog:write ، assets:write ، leads:read ، leads:write ، orders:read ، orders:write ، payments:manage . نگهبان‌های route middleware کجا چه می‌کند requireAuth middleware/auth.ts ورود + CSRF requirePlatformAdmin middleware/auth.ts ورود + CSRF + اپراتور requirePermission 'x' middleware/tenant.ts مجوز در همین سایت؛ وگرنه 403 requireOwner middleware/tenant.ts فقط مالک یا اپراتور requireModule 'x' middleware/tenant.ts ماژول سایت روشن باشد؛ وگرنه 403 module_disabled operatorOnly app.ts ، pages.routes.ts در cell فقط اپراتور ساختار سایت پنهان کردن یک دکمه در رابط کاربری کافی نیست . هر محدودیت باید در API هم با یکی از این middlewareها اعمال شود. قفل مشتری در cell clientLocked وقتی CELL_SLUG تنظیم شده است سرور مشتری ، کاربرِ غیراپراتور: صفحه‌ها: فقط متن و تصویر سکشن‌های موجود را عوض می‌کند. contentOnlyChange shared sections.ts سند قبلی و جدید را مقایسه می‌کند و افزودن، حذف، جابه‌جایی یا پنهان کردن سکشن و تغییر کلیدهای ساختاری را رد می‌کند. تنظیمات: در PUT /settings فقط فیلدهای محتوایی از مشتری گرفته می‌شود: نام، شعار، لوگو، تماس، شبکه‌های اجتماعی، دسته‌بندی‌ها، نام نوع درخواست‌ها و مراحل، متن پیام‌ها، footer، قوانین فروشگاه و… site.routes.ts . فرم‌ها، workflowها، حساب‌ها و settings.texts مال اپراتور است. وب: با VITE_ADMIN_SCOPE=client ساخته می‌شود؛ OPERATOR_UI در admin/auth.tsx غلط است و کد builder اصلاً داخل bundle نیست. اپراتور با SSO وارد پنل مشتری می‌شود: سرویس deploy یک لینک امضاشده با CELL_SSO_SECRET می‌سازد، و GET /api/v1/auth/sso modules/auth/sso.ts اگر لینک معتبر، تاریخ‌نگذشته و استفاده‌نشده باشد session باز می‌کند. مشتریان سایت اختیاری است settings.accounts . ورود با تلفن یا ایمیل + کد یک‌بارمصرف، و در صورت تمایل رمز: آدرس /api/v1/public/sites/:slug/… کار POST customer/code ارسال کد ثبت‌نام، ورود، بازیابی رمز POST customer/signup ساخت حساب با کد POST customer/login ورود با رمز یا کد POST customer/reset رمز جدید با کد GET / PATCH customer/me مشتری فعلی؛ تغییر نام، تماس یا رمز GET customer/cases درخواست‌ها و سفارش‌های مشتری loadCustomer در هر درخواست عمومی cookie مشتری را می‌خواند و req.customer را پر می‌کند. cookieها به نام slug هستند، پس ورود به یک سایت روی سایت دیگر اثری ندارد. کد routeها در modules/interactions/public.routes.ts و منطق در modules/customers/customers.service.ts است. در محیط محلی ایمیل و SMS فقط در لاگ sb studio api چاپ می‌شوند EMAIL_PROVIDER=console ، SMS_PROVIDER=console و فرم ثبت‌نام کد را نشان می‌دهد. اگر بخواهید… مجوز جدیدی اضافه کنید: آن را به PERMISSIONS در shared اضافه کنید، روی route با requirePermission بگذارید و در صفحهٔ اعضا members نمایشش دهید. رمز یک کاربر را عوض کنید → Docker و اجرای روزانه ../06 operations/docker.md cli api ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"کاربران-پنل","text":"کاربران پنل"},{"level":3,"id":"ورود","text":"ورود"},{"level":3,"id":"هر-درخواست","text":"هر درخواست"},{"level":3,"id":"نقشها","text":"نقش‌ها"},{"level":3,"id":"نگهبانهای-route","text":"نگهبان‌های route"},{"level":2,"id":"قفل-مشتری-در-cell-clientlocked","text":"قفل مشتری در cell (clientLocked)"},{"level":2,"id":"مشتریان-سایت","text":"مشتریان سایت"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"02-architecture/builds.md","title":"ساخت و حالت‌های اجرا","html":"\u003ch1 id=\"ساخت-و-حالتهای-اجرا\">ساخت و حالت‌های اجرا\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۲ — معماری · فایل‌ها: \u003ccode>Dockerfile\u003c/code>، \u003ccode>deploy/docker-compose.yml\u003c/code>، \u003ccode>deploy/export/docker-compose.yml\u003c/code>، \u003ccode>deploy/export/Caddyfile\u003c/code>، \u003ccode>apps/web/scripts/prerender.mjs\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>همهٔ imageها از \u003cstrong>یک \u003ccode>Dockerfile\u003c/code>\u003c/strong> ساخته می‌شوند و هر compose یکی از stageهای آن را انتخاب می‌کند. یک کد واحد، بسته به چند متغیر محیطی، در سه حالت اجرا می‌شود.\u003c/p>\n\u003ch2 id=\"stageهای-dockerfile\">stageهای Dockerfile\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart TB\n  D[deps&lt;br/&gt;npm ci] --&gt; S[source&lt;br/&gt;کپی کد]\n  S --&gt; API[api&lt;br/&gt;استودیو]\n  S --&gt; WEB[web&lt;br/&gt;استودیو: vite preview]\n  S --&gt; AB[api-build&lt;br/&gt;minify، بدون source map]\n  AB --&gt; AR[api-runtime&lt;br/&gt;بستهٔ مشتری]\n  S --&gt; WS[web-static&lt;br/&gt;بستهٔ مشتری: VITE_ADMIN_SCOPE=client]\u003c/pre>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>stage\u003c/th>\u003cth>برای\u003c/th>\u003cth>نکته\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>api\u003c/code>\u003c/td>\u003ctd>\u003ccode>sb-studio-api\u003c/code>\u003c/td>\u003ctd>TypeScript کامپایل‌شده؛ شروع با \u003ccode>deploy/studio/api-start.sh\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>web\u003c/code>\u003c/td>\u003ctd>\u003ccode>sb-studio-web\u003c/code>\u003c/td>\u003ctd>\u003ccode>VITE_API_URL=same-origin\u003c/code>، \u003ccode>VITE_SITE_ID=&quot;&quot;\u003c/code> (سایت از host خوانده می‌شود)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>api-runtime\u003c/code>\u003c/td>\u003ctd>بستهٔ مشتری\u003c/td>\u003ctd>فقط \u003ccode>dist\u003c/code> minifyشده، بدون \u003ccode>.d.ts\u003c/code> و source map؛ شروع با \u003ccode>deploy/cell/api-start.sh\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>web-static\u003c/code>\u003c/td>\u003ctd>بستهٔ مشتری\u003c/td>\u003ctd>فایل ایستا؛ آدرس API یک placeholder است که هنگام سرو شدن با آدرس واقعی جایگزین می‌شود\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>NPM_REGISTRY\u003c/code> (اختیاری) آدرس registry داخل \u003ccode>package-lock.json\u003c/code> را عوض می‌کند. نسخه‌ها و hashها همان می‌مانند.\u003c/p>\n\u003ch2 id=\"سه-حالت-اجرا\">سه حالت اجرا\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>استودیو\u003c/th>\u003cth>پیش‌نمایش سایت\u003c/th>\u003cth>سرور مشتری (cell)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>آدرس\u003c/td>\u003ctd>\u003ccode>admin.localhost\u003c/code>\u003c/td>\u003ctd>\u003ccode>&lt;slug&gt;.preview.localhost\u003c/code>\u003c/td>\u003ctd>دامنهٔ مشتری\u003c/td>\u003c/tr>\u003ctr>\u003ctd>سایت‌ها\u003c/td>\u003ctd>همه\u003c/td>\u003ctd>یکی (از host)\u003c/td>\u003ctd>یکی (\u003ccode>CELL_SLUG\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>builder\u003c/td>\u003ctd>دارد\u003c/td>\u003ctd>—\u003c/td>\u003ctd>ندارد (\u003ccode>VITE_ADMIN_SCOPE=client\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ساختار سایت\u003c/td>\u003ctd>اپراتور آزاد است\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003ccode>clientLocked\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>سرو وب\u003c/td>\u003ctd>\u003ccode>vite preview\u003c/code> پشت nginx\u003c/td>\u003ctd>همان\u003c/td>\u003ctd>Caddy با فایل‌های ایستا\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ایمیل و SMS\u003c/td>\u003ctd>فقط در لاگ (\u003ccode>console\u003c/code>)\u003c/td>\u003ctd>همان\u003c/td>\u003ctd>تنظیمات مشتری (\u003ccode>panel\u003c/code>، SMTP، کاوه‌نگار)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"متغیرهای-مهم-build-در-وب\">متغیرهای مهم build در وب\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>متغیر\u003c/th>\u003cth>اثر\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>VITE_API_URL\u003c/code>\u003c/td>\u003ctd>آدرس API. \u003ccode>same-origin\u003c/code> یعنی همان origin صفحه. خالی یعنی سایت با محتوای نمایشی و بدون پنل (\u003ccode>apiAvailable()\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>VITE_SITE_ID\u003c/code>\u003c/td>\u003ctd>سایت پیش‌فرض وقتی host از نوع preview نیست (بستهٔ مشتری)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>VITE_ADMIN_SCOPE=client\u003c/code>\u003c/td>\u003ctd>builder، صفحه‌های platform، \u003ccode>__preview\u003c/code> و \u003ccode>__starter-preview\u003c/code> از bundle حذف می‌شوند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SITE_URL\u003c/code>\u003c/td>\u003ctd>برای prerender: آدرس canonical و sitemap\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"prerender-برای-seo\">prerender برای SEO\u003c/h2>\n\u003cp>\u003ccode>npm run build -w apps/web\u003c/code> بعد از \u003ccode>vite build\u003c/code>، \u003ccode>scripts/prerender.mjs\u003c/code> را اجرا می‌کند. این اسکریپت برای هر صفحه، خدمت و محصول منتشرشده (فارسی و انگلیسی) یک \u003ccode>dist/&lt;path&gt;/index.html\u003c/code> می‌نویسد با \u003ccode>&lt;title&gt;\u003c/code>، description، canonical، hreflang، Open Graph و \u003ccode>lang\u003c/code> و \u003ccode>dir\u003c/code> درست، به‌علاوهٔ \u003ccode>sitemap.xml\u003c/code> و \u003ccode>robots.txt\u003c/code>. بدنهٔ صفحه را همچنان React در مرورگر می‌سازد. اگر API در زمان build در دسترس نباشد، این قدم رد می‌شود.\u003c/p>\n\u003cp>روی سرور مشتری، Caddy \u003ccode>sitemap.xml\u003c/code> را از API زنده می‌گیرد (\u003ccode>/api/v1/public/sites/&lt;slug&gt;/sitemap.xml\u003c/code>)، پس محصولات و صفحه‌های جدید مشتری هم در آن هستند.\u003c/p>\n\u003ch2 id=\"بسته-مشتری-در-اجرا\">بستهٔ مشتری در اجرا\u003c/h2>\n\u003cp>\u003ccode>deploy/export/docker-compose.yml\u003c/code> سه سرویس دارد:\u003c/p>\n\u003cul>\u003cli>\u003ccode>db\u003c/code>: Postgres 16 در شبکهٔ داخلی،\u003c/li>\u003cli>\u003ccode>api\u003c/code>: image ساخته‌شده (\u003ccode>API_IMAGE\u003c/code>) با \u003ccode>CELL_*\u003c/code>،\u003c/li>\u003cli>\u003ccode>proxy\u003c/code>: Caddy. اگر \u003ccode>DOMAIN\u003c/code> دامنهٔ واقعی باشد گواهی HTTPS خودکار می‌گیرد؛ \u003ccode>:80\u003c/code> یعنی HTTP ساده.\u003c/li>\u003c/ul>\n\u003cp>Caddy مسیرهای \u003ccode>/api/*\u003c/code> و \u003ccode>/files/*\u003c/code> را به API می‌فرستد و بقیه را از \u003ccode>/srv/site\u003c/code> سرو می‌کند (با fallback به \u003ccode>index.html\u003c/code> برای مسیرهای React).\u003c/p>\n\u003cp>در شروع، \u003ccode>deploy/cell/api-start.sh\u003c/code> اول migrate می‌کند و بعد \u003ccode>cell-bootstrap.js\u003c/code> را اجرا می‌کند. این اسکریپت حساب اپراتور، حساب مالک و تنها سایتِ cell را می‌سازد. اگر از قبل وجود داشته باشند، دست نمی‌خورند.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>بدانید بسته چطور ساخته می‌شود → \u003ca href=\"#04-features/delivery.md\">تحویل به مشتری\u003c/a>\u003c/li>\u003cli>کد را فقط برای استودیو یا فقط برای مشتری فعال کنید: در وب \u003ccode>import.meta.env.VITE_ADMIN_SCOPE !== 'client'\u003c/code> (یا \u003ccode>OPERATOR_UI\u003c/code>) و در API \u003ccode>ctx.env.CELL_SLUG\u003c/code> را بررسی کنید. نمونه‌ها در \u003ccode>app/routes.tsx\u003c/code> و \u003ccode>app.ts\u003c/code> هستند.\u003c/li>\u003c/ul>","text":" ساخت و حالت‌های اجرا فصل ۲ — معماری · فایل‌ها: Dockerfile ، deploy/docker compose.yml ، deploy/export/docker compose.yml ، deploy/export/Caddyfile ، apps/web/scripts/prerender.mjs خلاصه همهٔ imageها از یک Dockerfile ساخته می‌شوند و هر compose یکی از stageهای آن را انتخاب می‌کند. یک کد واحد، بسته به چند متغیر محیطی، در سه حالت اجرا می‌شود. stageهای Dockerfile stage برای نکته api sb studio api TypeScript کامپایل‌شده؛ شروع با deploy/studio/api start.sh web sb studio web VITE_API_URL=same origin ، VITE_SITE_ID=\"\" سایت از host خوانده می‌شود api runtime بستهٔ مشتری فقط dist minifyشده، بدون .d.ts و source map؛ شروع با deploy/cell/api start.sh web static بستهٔ مشتری فایل ایستا؛ آدرس API یک placeholder است که هنگام سرو شدن با آدرس واقعی جایگزین می‌شود NPM_REGISTRY اختیاری آدرس registry داخل package lock.json را عوض می‌کند. نسخه‌ها و hashها همان می‌مانند. سه حالت اجرا استودیو پیش‌نمایش سایت سرور مشتری cell آدرس admin.localhost \u003cslug .preview.localhost دامنهٔ مشتری سایت‌ها همه یکی از host یکی CELL_SLUG builder دارد — ندارد VITE_ADMIN_SCOPE=client ساختار سایت اپراتور آزاد است — clientLocked سرو وب vite preview پشت nginx همان Caddy با فایل‌های ایستا ایمیل و SMS فقط در لاگ console همان تنظیمات مشتری panel ، SMTP، کاوه‌نگار متغیرهای مهم build در وب متغیر اثر VITE_API_URL آدرس API. same origin یعنی همان origin صفحه. خالی یعنی سایت با محتوای نمایشی و بدون پنل apiAvailable VITE_SITE_ID سایت پیش‌فرض وقتی host از نوع preview نیست بستهٔ مشتری VITE_ADMIN_SCOPE=client builder، صفحه‌های platform، __preview و __starter preview از bundle حذف می‌شوند SITE_URL برای prerender: آدرس canonical و sitemap prerender برای SEO npm run build w apps/web بعد از vite build ، scripts/prerender.mjs را اجرا می‌کند. این اسکریپت برای هر صفحه، خدمت و محصول منتشرشده فارسی و انگلیسی یک dist/\u003cpath /index.html می‌نویسد با \u003ctitle ، description، canonical، hreflang، Open Graph و lang و dir درست، به‌علاوهٔ sitemap.xml و robots.txt . بدنهٔ صفحه را همچنان React در مرورگر می‌سازد. اگر API در زمان build در دسترس نباشد، این قدم رد می‌شود. روی سرور مشتری، Caddy sitemap.xml را از API زنده می‌گیرد /api/v1/public/sites/\u003cslug /sitemap.xml ، پس محصولات و صفحه‌های جدید مشتری هم در آن هستند. بستهٔ مشتری در اجرا deploy/export/docker compose.yml سه سرویس دارد: db : Postgres 16 در شبکهٔ داخلی، api : image ساخته‌شده API_IMAGE با CELL_ ، proxy : Caddy. اگر DOMAIN دامنهٔ واقعی باشد گواهی HTTPS خودکار می‌گیرد؛ :80 یعنی HTTP ساده. Caddy مسیرهای /api/ و /files/ را به API می‌فرستد و بقیه را از /srv/site سرو می‌کند با fallback به index.html برای مسیرهای React . در شروع، deploy/cell/api start.sh اول migrate می‌کند و بعد cell bootstrap.js را اجرا می‌کند. این اسکریپت حساب اپراتور، حساب مالک و تنها سایتِ cell را می‌سازد. اگر از قبل وجود داشته باشند، دست نمی‌خورند. اگر بخواهید… بدانید بسته چطور ساخته می‌شود → تحویل به مشتری ../04 features/delivery.md کد را فقط برای استودیو یا فقط برای مشتری فعال کنید: در وب import.meta.env.VITE_ADMIN_SCOPE !== 'client' یا OPERATOR_UI و در API ctx.env.CELL_SLUG را بررسی کنید. نمونه‌ها در app/routes.tsx و app.ts هستند. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"stageهای-dockerfile","text":"stageهای Dockerfile"},{"level":2,"id":"سه-حالت-اجرا","text":"سه حالت اجرا"},{"level":2,"id":"متغیرهای-مهم-build-در-وب","text":"متغیرهای مهم build در وب"},{"level":2,"id":"prerender-برای-seo","text":"prerender برای SEO"},{"level":2,"id":"بسته-مشتری-در-اجرا","text":"بستهٔ مشتری در اجرا"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"02-architecture/multi-tenancy.md","title":"چند-مستأجری: یک دیتابیس برای هر سایت","html":"\u003ch1 id=\"چند-مستأجری-یک-دیتابیس-برای-هر-سایت\">چند-مستأجری: یک دیتابیس برای هر سایت\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۲ — معماری · فایل‌ها: \u003ccode>apps/api/src/modules/platform/provisioning.ts\u003c/code>، \u003ccode>apps/api/src/database/tenant/pools.ts\u003c/code>، \u003ccode>apps/api/src/context.ts\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>یک سرور Postgres دو نوع دیتابیس دارد:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>sb_control\u003c/code>\u003c/strong>: یکی برای کل استودیو. کاربران، sessionها، فهرست سایت‌ها، عضویت‌ها، starterها و kitها.\u003c/li>\u003cli>\u003cstrong>\u003ccode>sb_t_&lt;slug&gt;\u003c/code>\u003c/strong>: برای هر سایت یکی. صفحه‌ها، تنظیمات، محصولات، سفارش‌ها، درخواست‌ها، مشتری‌ها…\u003c/li>\u003c/ul>\n\u003cp>هر دیتابیس سایت \u003cstrong>کاربر Postgres خودش\u003c/strong> را دارد و بقیه حتی نمی‌توانند به آن وصل شوند.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TB\n  API[API] -- &quot;sb_api&quot; --&gt; C[(sb_control)]\n  API -- &quot;sb_t_cafe_roya (کاربر خودش)&quot; --&gt; T1[(sb_t_cafe_roya)]\n  API -- &quot;sb_t_atelier (کاربر خودش)&quot; --&gt; T2[(sb_t_atelier)]\n  C -. &quot;tenants: db_name، db_user، db_password_enc&quot; .-&gt; API\u003c/pre>\n\u003ch2 id=\"چرا-این-طراحی\">چرا این طراحی؟\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>جداسازی واقعی:\u003c/strong> یک باگ در WHERE نمی‌تواند دادهٔ سایت دیگری را نشان دهد، چون اتصال به دیتابیس دیگری اصلاً وجود ندارد.\u003c/li>\u003cli>\u003cstrong>تحویل ساده:\u003c/strong> برای بستهٔ مشتری، دیتابیس همان سایت dump می‌شود و چیزی جز همان سایت در آن نیست.\u003c/li>\u003cli>\u003cstrong>migration جدا:\u003c/strong> هر سایت جدول \u003ccode>schema_migrations\u003c/code> خودش را دارد.\u003c/li>\u003c/ul>\n\u003ch2 id=\"ساختن-یک-سایت-provisioning\">ساختن یک سایت (provisioning)\u003c/h2>\n\u003cp>\u003ccode>provisionTenant\u003c/code> قدم‌به‌قدم کار می‌کند. هر قدم را می‌شود بی‌خطر تکرار کرد و قدم فعلی در \u003ccode>tenants.provisioning_step\u003c/code> ذخیره می‌شود:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>قدم\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>۱\u003c/td>\u003ctd>ثبت در \u003ccode>tenants\u003c/code> با وضعیت \u003ccode>provisioning\u003c/code> و یک رمز تصادفی رمزشده\u003c/td>\u003c/tr>\u003ctr>\u003ctd>۲\u003c/td>\u003ctd>ساختن role مخصوص سایت (\u003ccode>LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>۳\u003c/td>\u003ctd>\u003ccode>CREATE DATABASE … OWNER &lt;role&gt;\u003c/code>، بعد \u003ccode>REVOKE ALL … FROM PUBLIC\u003c/code> و \u003ccode>GRANT CONNECT\u003c/code> فقط به همان role\u003c/td>\u003c/tr>\u003ctr>\u003ctd>۴–۵\u003c/td>\u003ctd>اجرای migrationهای tenant و ساختن تنظیمات اولیه، با اتصال خود role سایت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>۶–۸\u003c/td>\u003ctd>مالک، دامنه و فعال‌سازی (\u003ccode>status = 'active'\u003c/code>) در یک تراکنش\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>اگر قدمی شکست بخورد، سایت \u003ccode>active\u003c/code> نمی‌شود و خطای \u003ccode>provisioning_failed\u003c/code> برمی‌گردد. اجرای دوباره از همان‌جا ادامه می‌دهد.\u003c/p>\n\u003cp>\u003cstrong>دسترسی admin فقط اینجا:\u003c/strong> اتصال \u003ccode>PG_ADMIN_URL\u003c/code> (کاربر \u003ccode>sb_admin\u003c/code>) فقط برای ساختن و حذف دیتابیس‌ها استفاده می‌شود و هیچ handler معمولی به آن دسترسی ندارد.\u003c/p>\n\u003ch2 id=\"رمزهای-دیتابیس-سایتها\">رمزهای دیتابیس سایت‌ها\u003c/h2>\n\u003cp>رمز هر role در \u003ccode>tenants.db_password_enc\u003c/code> با \u003cstrong>AES-256-GCM\u003c/strong> و کلید \u003ccode>TENANT_SECRETS_KEY\u003c/code> رمز شده است (\u003ccode>common/crypto.ts\u003c/code>). اگر این کلید عوض شود یا گم شود، API دیگر نمی‌تواند به هیچ سایتی وصل شود. پس همیشه همراه backup نگهش دارید (داخل \u003ccode>deploy/.env\u003c/code> است).\u003c/p>\n\u003ch2 id=\"poolهای-اتصال\">poolهای اتصال\u003c/h2>\n\u003cp>\u003ccode>TenantPools\u003c/code> (\u003ccode>database/tenant/pools.ts\u003c/code>):\u003c/p>\n\u003cul>\u003cli>برای هر سایت یک pool کوچک با \u003ccode>TENANT_POOL_SIZE\u003c/code> اتصال (پیش‌فرض ۵).\u003c/li>\u003cli>حداکثر \u003ccode>TENANT_POOL_MAX_OPEN\u003c/code> pool باز (پیش‌فرض ۵۰). اگر به سقف برسد، poolی که از همه دیرتر استفاده شده بسته می‌شود.\u003c/li>\u003cli>خطای اتصال idle، برنامه را از کار نمی‌اندازد.\u003c/li>\u003c/ul>\n\u003ch2 id=\"نامها\">نام‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>چیز\u003c/th>\u003cth>قاعده\u003c/th>\u003cth>مثال\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>slug\u003c/td>\u003ctd>\u003ccode>slugSchema\u003c/code> در shared\u003c/td>\u003ctd>\u003ccode>cafe-roya\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>نام دیتابیس و role\u003c/td>\u003ctd>\u003ccode>TENANT_DB_PREFIX\u003c/code> + slug با \u003ccode>_\u003c/code> به جای \u003ccode>-\u003c/code>\u003c/td>\u003ctd>\u003ccode>sb_t_cafe_roya\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>در تست‌ها\u003c/td>\u003ctd>پیشوند \u003ccode>sb_test_\u003c/code>\u003c/td>\u003ctd>\u003ccode>sb_test_site_ab12cd\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"حذف-سایت\">حذف سایت\u003c/h2>\n\u003cp>\u003ccode>DELETE /api/v1/platform/tenants/:id?confirm=&lt;slug&gt;\u003c/code> (\u003ccode>deleteTenant\u003c/code>) فایل‌ها، دیتابیس، role و ردیف سایت را پاک می‌کند. رابط کاربری قبلش slug را از شما می‌پرسد. برگشت‌پذیر نیست، مگر از backup.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>جدول‌های هر دیتابیس را ببینید → \u003ca href=\"#03-layers/data-model.md\">مدل داده\u003c/a>\u003c/li>\u003cli>جدول جدیدی به همهٔ سایت‌ها اضافه کنید → \u003ca href=\"#05-recipes/new-migration.md\">migration جدید\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2 id=\"اشتباههای-رایج\">اشتباه‌های رایج\u003c/h2>\n\u003cul>\u003cli>⚠️ بعد از کپی داده بین دیتابیس‌ها (restore، انتقال) \u003ccode>deploy/export/fix-sequences.sql\u003c/code> را اجرا کنید؛ وگرنه انتشار صفحه با خطای 409 شکست می‌خورد.\u003c/li>\u003cli>⚠️ در کد handler هرگز به \u003ccode>ctx.control\u003c/code> برای دادهٔ سایت مراجعه نکنید؛ دادهٔ سایت فقط در \u003ccode>req.tenant.db\u003c/code> است.\u003c/li>\u003c/ul>","text":" چند مستأجری: یک دیتابیس برای هر سایت فصل ۲ — معماری · فایل‌ها: apps/api/src/modules/platform/provisioning.ts ، apps/api/src/database/tenant/pools.ts ، apps/api/src/context.ts خلاصه یک سرور Postgres دو نوع دیتابیس دارد: sb_control : یکی برای کل استودیو. کاربران، sessionها، فهرست سایت‌ها، عضویت‌ها، starterها و kitها. sb_t_\u003cslug : برای هر سایت یکی. صفحه‌ها، تنظیمات، محصولات، سفارش‌ها، درخواست‌ها، مشتری‌ها… هر دیتابیس سایت کاربر Postgres خودش را دارد و بقیه حتی نمی‌توانند به آن وصل شوند. چرا این طراحی؟ جداسازی واقعی: یک باگ در WHERE نمی‌تواند دادهٔ سایت دیگری را نشان دهد، چون اتصال به دیتابیس دیگری اصلاً وجود ندارد. تحویل ساده: برای بستهٔ مشتری، دیتابیس همان سایت dump می‌شود و چیزی جز همان سایت در آن نیست. migration جدا: هر سایت جدول schema_migrations خودش را دارد. ساختن یک سایت provisioning provisionTenant قدم‌به‌قدم کار می‌کند. هر قدم را می‌شود بی‌خطر تکرار کرد و قدم فعلی در tenants.provisioning_step ذخیره می‌شود: قدم کار ۱ ثبت در tenants با وضعیت provisioning و یک رمز تصادفی رمزشده ۲ ساختن role مخصوص سایت LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE ۳ CREATE DATABASE … OWNER \u003crole ، بعد REVOKE ALL … FROM PUBLIC و GRANT CONNECT فقط به همان role ۴–۵ اجرای migrationهای tenant و ساختن تنظیمات اولیه، با اتصال خود role سایت ۶–۸ مالک، دامنه و فعال‌سازی status = 'active' در یک تراکنش اگر قدمی شکست بخورد، سایت active نمی‌شود و خطای provisioning_failed برمی‌گردد. اجرای دوباره از همان‌جا ادامه می‌دهد. دسترسی admin فقط اینجا: اتصال PG_ADMIN_URL کاربر sb_admin فقط برای ساختن و حذف دیتابیس‌ها استفاده می‌شود و هیچ handler معمولی به آن دسترسی ندارد. رمزهای دیتابیس سایت‌ها رمز هر role در tenants.db_password_enc با AES 256 GCM و کلید TENANT_SECRETS_KEY رمز شده است common/crypto.ts . اگر این کلید عوض شود یا گم شود، API دیگر نمی‌تواند به هیچ سایتی وصل شود. پس همیشه همراه backup نگهش دارید داخل deploy/.env است . poolهای اتصال TenantPools database/tenant/pools.ts : برای هر سایت یک pool کوچک با TENANT_POOL_SIZE اتصال پیش‌فرض ۵ . حداکثر TENANT_POOL_MAX_OPEN pool باز پیش‌فرض ۵۰ . اگر به سقف برسد، poolی که از همه دیرتر استفاده شده بسته می‌شود. خطای اتصال idle، برنامه را از کار نمی‌اندازد. نام‌ها چیز قاعده مثال slug slugSchema در shared cafe roya نام دیتابیس و role TENANT_DB_PREFIX + slug با _ به جای sb_t_cafe_roya در تست‌ها پیشوند sb_test_ sb_test_site_ab12cd حذف سایت DELETE /api/v1/platform/tenants/:id?confirm=\u003cslug deleteTenant فایل‌ها، دیتابیس، role و ردیف سایت را پاک می‌کند. رابط کاربری قبلش slug را از شما می‌پرسد. برگشت‌پذیر نیست، مگر از backup. اگر بخواهید… جدول‌های هر دیتابیس را ببینید → مدل داده ../03 layers/data model.md جدول جدیدی به همهٔ سایت‌ها اضافه کنید → migration جدید ../05 recipes/new migration.md اشتباه‌های رایج ⚠️ بعد از کپی داده بین دیتابیس‌ها restore، انتقال deploy/export/fix sequences.sql را اجرا کنید؛ وگرنه انتشار صفحه با خطای 409 شکست می‌خورد. ⚠️ در کد handler هرگز به ctx.control برای دادهٔ سایت مراجعه نکنید؛ دادهٔ سایت فقط در req.tenant.db است. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"چرا-این-طراحی","text":"چرا این طراحی؟"},{"level":2,"id":"ساختن-یک-سایت-provisioning","text":"ساختن یک سایت (provisioning)"},{"level":2,"id":"رمزهای-دیتابیس-سایتها","text":"رمزهای دیتابیس سایت‌ها"},{"level":2,"id":"poolهای-اتصال","text":"poolهای اتصال"},{"level":2,"id":"نامها","text":"نام‌ها"},{"level":2,"id":"حذف-سایت","text":"حذف سایت"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"},{"level":2,"id":"اشتباههای-رایج","text":"اشتباه‌های رایج"}]},{"path":"02-architecture/overview.md","title":"نمای کلی معماری","html":"\u003ch1 id=\"نمای-کلی-معماری\">نمای کلی معماری\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۲ — معماری · فایل‌ها: \u003ccode>deploy/docker-compose.yml\u003c/code>، \u003ccode>deploy/control/server.mjs\u003c/code>، \u003ccode>deploy/export/\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>سیستم سه بخش دارد:\u003c/p>\n\u003col>\u003cli>\u003cstrong>استودیو\u003c/strong>: همهٔ سایت‌ها روی سیستم شما و با یک API، یک وب و یک سرور Postgres ساخته می‌شوند.\u003c/li>\u003cli>\u003cstrong>سرویس deploy\u003c/strong>: از هر سایت یک \u003cstrong>بسته\u003c/strong> می‌سازد.\u003c/li>\u003cli>\u003cstrong>سرور مشتری\u003c/strong>: بسته را نصب می‌کند و یک نسخهٔ مستقل و تک‌سایتی (cell) اجرا می‌کند.\u003c/li>\u003c/ol>\n\u003cpre class=\"mermaid\">flowchart LR\n  subgraph Studio[&quot;استودیو (سیستم شما)&quot;]\n    E[sb-edge nginx] --&gt; API[sb-studio-api]\n    E --&gt; WEB[sb-studio-web]\n    E --&gt; CTL[sb-control&lt;br/&gt;سرویس deploy]\n    API --&gt; DB[(sb-studio-db&lt;br/&gt;sb_control + یک DB برای هر سایت)]\n  end\n  CTL -- &quot;بستهٔ نصب / به‌روزرسانی&quot; --&gt; EXP[[exports/]]\n  EXP -- &quot;کپی دستی&quot; --&gt; Client\n  subgraph Client[&quot;سرور مشتری (cell)&quot;]\n    CAD[Caddy + سایت ایستا] --&gt; CAPI[API با CELL_SLUG]\n    CAPI --&gt; CDB[(Postgres)]\n  end\u003c/pre>\n\u003ch2 id=\"استودیو\">استودیو\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کانتینر\u003c/th>\u003cth>نقش\u003c/th>\u003cth>پورت\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sb-edge\u003c/code>\u003c/td>\u003ctd>nginx؛ همهٔ آدرس‌ها از اینجا می‌گذرند\u003c/td>\u003ctd>80\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-studio-api\u003c/code>\u003c/td>\u003ctd>API (Express)\u003c/td>\u003ctd>4000 (فقط localhost، برای debug)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-studio-web\u003c/code>\u003c/td>\u003ctd>build وب، با \u003ccode>vite preview\u003c/code> سرو می‌شود\u003c/td>\u003ctd>5173 (فقط localhost)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-studio-db\u003c/code>\u003c/td>\u003ctd>Postgres 16؛ در شبکهٔ \u003ccode>studio\u003c/code> که \u003ccode>internal\u003c/code> است\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-control\u003c/code>\u003c/td>\u003ctd>سرویس deploy؛ به Docker دسترسی دارد تا بسته بسازد\u003c/td>\u003ctd>8080 (فقط localhost)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>یک build وب برای همه.\u003c/strong> وب استودیو یک bundle است. اینکه کدام سایت نمایش داده شود از اسم host خوانده می‌شود (\u003ccode>&lt;slug&gt;.preview.localhost\u003c/code>). روی \u003ccode>admin.localhost\u003c/code> هم پنل ادمین نمایش داده می‌شود.\u003c/p>\n\u003cp>\u003cstrong>هر سایت، دیتابیس خودش.\u003c/strong> API برای هر سایت یک دیتابیس جدا با کاربر Postgres جدا می‌سازد. → \u003ca href=\"#02-architecture/multi-tenancy.md\">چند-مستأجری\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>هر شروع API\u003c/strong> (\u003ccode>deploy/studio/api-start.sh\u003c/code>) این سه کار را انجام می‌دهد:\u003c/p>\n\u003col>\u003cli>اجرای migrationهای دیتابیس کنترل و همهٔ سایت‌ها،\u003c/li>\u003cli>تنظیم رمز اپراتور طبق \u003ccode>deploy/.env\u003c/code>،\u003c/li>\u003cli>اضافه کردن starterهای آماده‌ای که قبلاً اضافه نشده‌اند.\u003c/li>\u003c/ol>\n\u003ch2 id=\"سرویس-deploy\">سرویس deploy\u003c/h2>\n\u003cp>http://admin.localhost/deploy/ یک برنامهٔ Node بدون وابستگی است (\u003ccode>deploy/control/server.mjs\u003c/code>) و فقط اپراتور به آن دسترسی دارد. برای هر سایت دو نوع بسته می‌سازد:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>install\u003c/strong>: بار اول. شامل image ساخته‌شدهٔ API، سایت ایستا، دادهٔ سایت و فایل‌هایش.\u003c/li>\u003cli>\u003cstrong>design update\u003c/strong>: صفحه‌ها، نسخه‌ها، تنظیمات طراحی، تعریف جدول‌ها و فایل‌های جدید را جایگزین می‌کند؛ دادهٔ خود مشتری (محصولات، سفارش‌ها، درخواست‌ها، تماس، آیتم‌های جدول‌ها) دست نمی‌خورد.\u003c/li>\u003c/ul>\n\u003cp>در هر لحظه فقط یک کار اجرا می‌شود. → \u003ca href=\"#04-features/delivery.md\">تحویل به مشتری\u003c/a>\u003c/p>\n\u003ch2 id=\"سرور-مشتری-cell\">سرور مشتری (cell)\u003c/h2>\n\u003cp>بسته روی سرور مشتری سه سرویس اجرا می‌کند: Postgres، API (همان کد، فقط build شده) و Caddy که سایت ایستا را سرو می‌کند. فرق API در اینجا:\u003c/p>\n\u003cul>\u003cli>\u003ccode>CELL_SLUG\u003c/code> تنظیم شده است، پس \u003cstrong>\u003ccode>clientLocked\u003c/code>\u003c/strong> فعال است: مشتری فقط محتوا را عوض می‌کند و ساختار (افزودن یا جابه‌جایی سکشن، صفحهٔ جدید، طراحی) فقط کار اپراتور است.\u003c/li>\u003cli>وب با \u003ccode>VITE_ADMIN_SCOPE=client\u003c/code> ساخته می‌شود و builder و صفحه‌های platform در آن نیستند.\u003c/li>\u003cli>اپراتور از طریق SSO (\u003ccode>modules/auth/sso.ts\u003c/code>) وارد پنل مشتری می‌شود.\u003c/li>\u003c/ul>\n\u003cp>→ \u003ca href=\"#02-architecture/builds.md\">ساخت و حالت‌های اجرا\u003c/a>\u003c/p>\n\u003ch2 id=\"جریان-کار-اپراتور\">جریان کار اپراتور\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  A[ساخت سایت&lt;br/&gt;setup یا خالی] --&gt; B[طراحی&lt;br/&gt;builder، starterها، تنظیمات]\n  B --&gt; C[دادهٔ نمونه و پیش‌نمایش]\n  C --&gt; D[بستهٔ install]\n  D --&gt; E[نصب روی سرور مشتری]\n  E --&gt; F[تغییر طراحی در استودیو]\n  F --&gt; G[بستهٔ design update]\n  G --&gt; E\u003c/pre>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>ببینید یک درخواست HTTP کجاها می‌رود → \u003ca href=\"#02-architecture/request-path.md\">مسیر یک درخواست\u003c/a>\u003c/li>\u003cli>بدانید چه کسی چه کاری می‌تواند بکند → \u003ca href=\"#02-architecture/auth.md\">احراز هویت و نقش‌ها\u003c/a>\u003c/li>\u003c/ul>","text":" نمای کلی معماری فصل ۲ — معماری · فایل‌ها: deploy/docker compose.yml ، deploy/control/server.mjs ، deploy/export/ خلاصه سیستم سه بخش دارد: 1. استودیو : همهٔ سایت‌ها روی سیستم شما و با یک API، یک وب و یک سرور Postgres ساخته می‌شوند. 2. سرویس deploy : از هر سایت یک بسته می‌سازد. 3. سرور مشتری : بسته را نصب می‌کند و یک نسخهٔ مستقل و تک‌سایتی cell اجرا می‌کند. استودیو کانتینر نقش پورت sb edge nginx؛ همهٔ آدرس‌ها از اینجا می‌گذرند 80 sb studio api API Express 4000 فقط localhost، برای debug sb studio web build وب، با vite preview سرو می‌شود 5173 فقط localhost sb studio db Postgres 16؛ در شبکهٔ studio که internal است — sb control سرویس deploy؛ به Docker دسترسی دارد تا بسته بسازد 8080 فقط localhost یک build وب برای همه. وب استودیو یک bundle است. اینکه کدام سایت نمایش داده شود از اسم host خوانده می‌شود \u003cslug .preview.localhost . روی admin.localhost هم پنل ادمین نمایش داده می‌شود. هر سایت، دیتابیس خودش. API برای هر سایت یک دیتابیس جدا با کاربر Postgres جدا می‌سازد. → چند مستأجری multi tenancy.md هر شروع API deploy/studio/api start.sh این سه کار را انجام می‌دهد: 1. اجرای migrationهای دیتابیس کنترل و همهٔ سایت‌ها، 2. تنظیم رمز اپراتور طبق deploy/.env ، 3. اضافه کردن starterهای آماده‌ای که قبلاً اضافه نشده‌اند. سرویس deploy http://admin.localhost/deploy/ یک برنامهٔ Node بدون وابستگی است deploy/control/server.mjs و فقط اپراتور به آن دسترسی دارد. برای هر سایت دو نوع بسته می‌سازد: install : بار اول. شامل image ساخته‌شدهٔ API، سایت ایستا، دادهٔ سایت و فایل‌هایش. design update : صفحه‌ها، نسخه‌ها، تنظیمات طراحی، تعریف جدول‌ها و فایل‌های جدید را جایگزین می‌کند؛ دادهٔ خود مشتری محصولات، سفارش‌ها، درخواست‌ها، تماس، آیتم‌های جدول‌ها دست نمی‌خورد. در هر لحظه فقط یک کار اجرا می‌شود. → تحویل به مشتری ../04 features/delivery.md سرور مشتری cell بسته روی سرور مشتری سه سرویس اجرا می‌کند: Postgres، API همان کد، فقط build شده و Caddy که سایت ایستا را سرو می‌کند. فرق API در اینجا: CELL_SLUG تنظیم شده است، پس clientLocked فعال است: مشتری فقط محتوا را عوض می‌کند و ساختار افزودن یا جابه‌جایی سکشن، صفحهٔ جدید، طراحی فقط کار اپراتور است. وب با VITE_ADMIN_SCOPE=client ساخته می‌شود و builder و صفحه‌های platform در آن نیستند. اپراتور از طریق SSO modules/auth/sso.ts وارد پنل مشتری می‌شود. → ساخت و حالت‌های اجرا builds.md جریان کار اپراتور اگر بخواهید… ببینید یک درخواست HTTP کجاها می‌رود → مسیر یک درخواست request path.md بدانید چه کسی چه کاری می‌تواند بکند → احراز هویت و نقش‌ها auth.md ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"استودیو","text":"استودیو"},{"level":2,"id":"سرویس-deploy","text":"سرویس deploy"},{"level":2,"id":"سرور-مشتری-cell","text":"سرور مشتری (cell)"
