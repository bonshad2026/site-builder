یل دادهٔ مشتری و رمز دارد. فقط خصوصی منتقلش کنید و هرگز commit نکنید backups/ و / .tar.gz در .gitignore هستند . restore Linux / macOS / Git Bash: Windows PowerShell: اگر روی این سیستم دادهٔ استودیو وجود داشته باشد، restore رد می‌شود . برای پاک کردن دادهٔ فعلی و جایگزینی، replace یا Replace را اضافه کنید. بعد از restore استودیو خودش بالا می‌آید و migrationهای جدید را اجرا می‌کند. backup سایت مشتری روی سرور مشتری، اسکریپت‌های داخل بسته: backup.sh / backup.ps1 و restore.sh / restore db.sh → deploy/export/README.md . بعد از کپی داده بین دیتابیس‌ها اگر داده را دستی از یک دیتابیس به دیگری بردید: وگرنه insert بعدی با id تکراری 409 می‌دهد. ","headings":[{"level":2,"id":"backup-کل-استودیو","text":"backup کل استودیو"},{"level":2,"id":"restore","text":"restore"},{"level":2,"id":"backup-سایت-مشتری","text":"backup سایت مشتری"},{"level":2,"id":"بعد-از-کپی-داده-بین-دیتابیسها","text":"بعد از کپی داده بین دیتابیس‌ها"}]},{"path":"06-operations/docker.md","title":"Docker و اجرای روزانه","html":"\u003ch1 id=\"docker-و-اجرای-روزانه\">Docker و اجرای روزانه\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۶ — عملیات · فایل‌ها: \u003ccode>deploy/docker-compose.yml\u003c/code>، \u003ccode>deploy/studio/api-start.sh\u003c/code>، \u003ccode>apps/api/src/cli.ts\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"کانتینرها-و-volumeها\">کانتینرها و volumeها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کانتینر\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sb-edge\u003c/code>\u003c/td>\u003ctd>nginx روی پورت 80\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-studio-db\u003c/code>\u003c/td>\u003ctd>Postgres استودیو\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-studio-api\u003c/code>\u003c/td>\u003ctd>API (پورت debug: \u003ccode>127.0.0.1:4000\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-studio-web\u003c/code>\u003c/td>\u003ctd>وب (پورت debug: \u003ccode>127.0.0.1:5173\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sb-control\u003c/code>\u003c/td>\u003ctd>سرویس deploy (پورت debug: \u003ccode>127.0.0.1:8080\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>volume\u003c/th>\u003cth>چه دارد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>site-builder_studio-pgdata\u003c/code>\u003c/td>\u003ctd>همهٔ دیتابیس‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>site-builder_studio-uploads\u003c/code>\u003c/td>\u003ctd>فایل‌های آپلودشدهٔ همهٔ سایت‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>site-builder_control-data\u003c/code>\u003c/td>\u003ctd>اطلاعات deploy هر سایت (کلیدها، حساب‌ها، تاریخچهٔ بسته‌ها)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\u003cp>volumeهای قدیمی \u003ccode>sb-platform_*\u003c/code> و \u003ccode>sb-cell-*\u003c/code> پشتیبان‌های باقی‌مانده هستند. \u003cstrong>بدون پرسیدن از مالک پروژه پاکشان نکنید.\u003c/strong>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"دستورات-روزانه\">دستورات روزانه\u003c/h2>\n\u003cp>روشن کردن یا rebuild همه:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml up -d --build\u003c/code>\u003c/pre>\n\u003cp>فقط برنامه‌ها، بعد از تغییر کد:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml up -d --build studio-api studio-web\u003c/code>\u003c/pre>\n\u003cp>لاگ API (ایمیل‌ها، SMSها و کدهای محلی هم اینجا چاپ می‌شوند):\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml logs -f studio-api\u003c/code>\u003c/pre>\n\u003cp>خاموش کردن (داده‌ها می‌مانند):\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml down\u003c/code>\u003c/pre>\n\u003cp>وضعیت:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml ps\u003c/code>\u003c/pre>\n\u003cblockquote>\u003cp>\u003ccode>down -v\u003c/code> همهٔ volumeها، یعنی \u003cstrong>همهٔ سایت‌ها و فایل‌ها\u003c/strong>، را پاک می‌کند. اگر backup ندارید، هرگز اجرایش نکنید.\u003c/p>\u003c/blockquote>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>تغییر در…\u003c/th>\u003cth>چه چیزی را rebuild کنید\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>apps/api\u003c/code> یا \u003ccode>packages/shared\u003c/code>\u003c/td>\u003ctd>\u003ccode>studio-api\u003c/code> (و \u003ccode>studio-web\u003c/code> اگر shared است)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apps/web\u003c/code>\u003c/td>\u003ctd>\u003ccode>studio-web\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>deploy/control/server.mjs\u003c/code>\u003c/td>\u003ctd>\u003ccode>control\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>deploy/edge/nginx.conf\u003c/code>\u003c/td>\u003ctd>\u003ccode>docker compose -f deploy/docker-compose.yml restart edge\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>deploy/.env\u003c/code>\u003c/td>\u003ctd>\u003ccode>up -d\u003c/code> دوباره (کانتینرها با متغیرهای جدید ساخته می‌شوند)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"cli-api\">CLI API\u003c/h2>\n\u003cp>داخل کانتینر:\u003c/p>\n\u003cp>تغییر رمز یک کاربر (\u003ccode>--admin\u003c/code> او را اپراتور می‌کند):\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker exec sb-studio-api node dist/cli.js set-password --email owner --password 123456\u003c/code>\u003c/pre>\n\u003cp>اجرای دوباره migrationها:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker exec sb-studio-api node dist/cli.js migrate\u003c/code>\u003c/pre>\n\u003cp>ساخت سایت از خط فرمان:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker exec sb-studio-api node dist/cli.js provision --slug demo-site --name &quot;Demo&quot; --owner owner@demo.local\u003c/code>\u003c/pre>\n\u003cp>افزودن starterهای آماده (در هر شروع خودکار اجرا می‌شود):\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker exec sb-studio-api node dist/cli.js add-sample-starters\u003c/code>\u003c/pre>\n\u003ch2 id=\"دسترسی-مستقیم-به-دیتابیس\">دسترسی مستقیم به دیتابیس\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker exec -it sb-studio-db psql -U sb_admin -d sb_control\u003c/code>\u003c/pre>\n\u003cp>در psql:\u003c/p>\n\u003cul>\u003cli>\u003ccode>\\l\u003c/code>: فهرست دیتابیس‌ها (\u003ccode>sb_t_&lt;slug&gt;\u003c/code> برای هر سایت)\u003c/li>\u003cli>\u003ccode>\\c sb_t_cafe_roya\u003c/code>: رفتن به دیتابیس یک سایت\u003c/li>\u003cli>\u003ccode>\\dt\u003c/code>: جدول‌ها\u003c/li>\u003c/ul>\n\u003cp>در Git Bash روی ویندوز، برای مسیرهای داخل کانتینر \u003ccode>MSYS_NO_PATHCONV=1\u003c/code> را جلوی دستور بگذارید.\u003c/p>\n\u003ch2 id=\"ابزارهای-دیگر\">ابزارهای دیگر\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کار\u003c/th>\u003cth>دستور\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>عکس‌های قالب‌ها ← \u003ccode>var/demo-images\u003c/code>\u003c/td>\u003ctd>\u003ccode>deploy/photos/download-photos.ps1\u003c/code> (یا \u003ccode>.sh\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ویدیوهای راهنمای کاربر ← \u003ccode>docs/guide/media\u003c/code>\u003c/td>\u003ctd>\u003ccode>node tools/guide-videos/record.mjs\u003c/code> (README همان پوشه)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>backup کل استودیو\u003c/td>\u003ctd>\u003ca href=\"#06-operations/backup.md\">backup و restore\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>مشکلی را حل کنید → \u003ca href=\"#06-operations/troubleshooting.md\">عیب‌یابی\u003c/a>\u003c/li>\u003c/ul>","text":" Docker و اجرای روزانه فصل ۶ — عملیات · فایل‌ها: deploy/docker compose.yml ، deploy/studio/api start.sh ، apps/api/src/cli.ts کانتینرها و volumeها کانتینر کار sb edge nginx روی پورت 80 sb studio db Postgres استودیو sb studio api API پورت debug: 127.0.0.1:4000 sb studio web وب پورت debug: 127.0.0.1:5173 sb control سرویس deploy پورت debug: 127.0.0.1:8080 volume چه دارد site builder_studio pgdata همهٔ دیتابیس‌ها site builder_studio uploads فایل‌های آپلودشدهٔ همهٔ سایت‌ها site builder_control data اطلاعات deploy هر سایت کلیدها، حساب‌ها، تاریخچهٔ بسته‌ها volumeهای قدیمی sb platform_ و sb cell پشتیبان‌های باقی‌مانده هستند. بدون پرسیدن از مالک پروژه پاکشان نکنید. دستورات روزانه روشن کردن یا rebuild همه: فقط برنامه‌ها، بعد از تغییر کد: لاگ API ایمیل‌ها، SMSها و کدهای محلی هم اینجا چاپ می‌شوند : خاموش کردن داده‌ها می‌مانند : وضعیت: down v همهٔ volumeها، یعنی همهٔ سایت‌ها و فایل‌ها ، را پاک می‌کند. اگر backup ندارید، هرگز اجرایش نکنید. تغییر در… چه چیزی را rebuild کنید apps/api یا packages/shared studio api و studio web اگر shared است apps/web studio web deploy/control/server.mjs control deploy/edge/nginx.conf docker compose f deploy/docker compose.yml restart edge deploy/.env up d دوباره کانتینرها با متغیرهای جدید ساخته می‌شوند CLI API داخل کانتینر: تغییر رمز یک کاربر admin او را اپراتور می‌کند : اجرای دوباره migrationها: ساخت سایت از خط فرمان: افزودن starterهای آماده در هر شروع خودکار اجرا می‌شود : دسترسی مستقیم به دیتابیس در psql: \\l : فهرست دیتابیس‌ها sb_t_\u003cslug برای هر سایت \\c sb_t_cafe_roya : رفتن به دیتابیس یک سایت \\dt : جدول‌ها در Git Bash روی ویندوز، برای مسیرهای داخل کانتینر MSYS_NO_PATHCONV=1 را جلوی دستور بگذارید. ابزارهای دیگر کار دستور عکس‌های قالب‌ها ← var/demo images deploy/photos/download photos.ps1 یا .sh ویدیوهای راهنمای کاربر ← docs/guide/media node tools/guide videos/record.mjs README همان پوشه backup کل استودیو backup و restore backup.md اگر بخواهید… مشکلی را حل کنید → عیب‌یابی troubleshooting.md ","headings":[{"level":2,"id":"کانتینرها-و-volumeها","text":"کانتینرها و volumeها"},{"level":2,"id":"دستورات-روزانه","text":"دستورات روزانه"},{"level":2,"id":"cli-api","text":"CLI API"},{"level":2,"id":"دسترسی-مستقیم-به-دیتابیس","text":"دسترسی مستقیم به دیتابیس"},{"level":2,"id":"ابزارهای-دیگر","text":"ابزارهای دیگر"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"06-operations/troubleshooting.md","title":"عیب‌یابی","html":"\u003ch1 id=\"عیبیابی\">عیب‌یابی\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۶ — عملیات\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"نصب-و-build\">نصب و build\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نشانه\u003c/th>\u003cth>علت\u003c/th>\u003cth>راه‌حل\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>npm install\u003c/code> یا \u003ccode>docker build\u003c/code> روی \u003ccode>npm ci\u003c/code> می‌ماند یا خطای شبکه می‌دهد\u003c/td>\u003ctd>lockfile به یک mirror اشاره می‌کند که در دسترس نیست\u003c/td>\u003ctd>در \u003ccode>deploy/.env\u003c/code>: \u003ccode>NPM_REGISTRY=https://registry.npmjs.org/\u003c/code>؛ روی سیستم خودتان \u003ccode>npm install --registry=https://registry.npmjs.org/\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>variable is not set\u003c/code> هنگام \u003ccode>compose up\u003c/code>\u003c/td>\u003ctd>کلیدی در \u003ccode>deploy/.env\u003c/code> خالی است\u003c/td>\u003ctd>\u003ccode>deploy/.env.example\u003c/code> را با \u003ccode>deploy/.env\u003c/code> مقایسه کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API با \u003ccode>Must be 32 bytes, base64-encoded\u003c/code> بالا نمی‌آید\u003c/td>\u003ctd>\u003ccode>STUDIO_TENANT_SECRETS_KEY\u003c/code> قالب درستی ندارد\u003c/td>\u003ctd>یک کلید base64 ۳۲ بایتی بسازید (\u003ca href=\"#01-start/setup.md::۲-ساخت-فایل-تنظیمات\">راه‌اندازی\u003c/a>). روی استودیوی پر، کلید را \u003cstrong>عوض نکنید\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"اجرا\">اجرا\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نشانه\u003c/th>\u003cth>علت\u003c/th>\u003cth>راه‌حل\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>تغییر کد در مرورگر دیده نمی‌شود\u003c/td>\u003ctd>کانتینرها از image ساخته‌شده اجرا می‌شوند\u003c/td>\u003ctd>\u003ccode>up -d --build studio-api studio-web\u003c/code>؛ بعد مرورگر را با Ctrl+F5 refresh کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API بالا نمی‌آید: \u003ccode>Migration … was modified after it was applied\u003c/code>\u003c/td>\u003ctd>یک migration اجراشده ویرایش شده\u003c/td>\u003ctd>فایل را برگردانید و تغییر را در migration جدید بنویسید (\u003ca href=\"#03-layers/migrations.md\">migrationها\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>انتشار صفحه یا افزودن ردیف 409 می‌دهد\u003c/td>\u003ctd>sequenceها بعد از کپی داده عقب مانده‌اند\u003c/td>\u003ctd>\u003ccode>deploy/export/fix-sequences.sql\u003c/code> (\u003ca href=\"#06-operations/backup.md\">backup\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ورود با \u003ccode>admin\u003c/code> کار نمی‌کند\u003c/td>\u003ctd>رمز در هر شروع API از \u003ccode>deploy/.env\u003c/code> تنظیم می‌شود\u003c/td>\u003ctd>\u003ccode>CONTROL_ADMIN_*\u003c/code> را ببینید یا \u003ccode>set-password\u003c/code> بزنید (\u003ca href=\"#06-operations/docker.md::cli-api\">CLI\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>403 Missing or invalid CSRF token\u003c/code>\u003c/td>\u003ctd>درخواست بدون هدر \u003ccode>X-CSRF-Token\u003c/code> یا با cookie قدیمی\u003c/td>\u003ctd>از \u003ccode>api\u003c/code> در \u003ccode>lib/api.ts\u003c/code> استفاده کنید؛ در تست از \u003ccode>signIn()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>403 module_disabled\u003c/code>\u003c/td>\u003ctd>ماژول آن بخش برای سایت خاموش است\u003c/td>\u003ctd>Settings ← Modules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>آدرس \u003ccode>/products\u003c/code> در یک سایت 404 است\u003c/td>\u003ctd>ماژول products خاموش است (سایت خالی)\u003c/td>\u003ctd>ماژول را روشن کنید یا starter فروشگاه را اعمال کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>سایتی که عضوش نیستید 404 می‌دهد\u003c/td>\u003ctd>عمدی است؛ API وجود سایت را لو نمی‌دهد\u003c/td>\u003ctd>با اپراتور وارد شوید یا عضو اضافه کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کد SMS یا ایمیل نمی‌رسد (محلی)\u003c/td>\u003ctd>در محیط محلی فقط در لاگ چاپ می‌شود\u003c/td>\u003ctd>\u003ccode>logs -f studio-api\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>عکس‌های قالب گرادیانی هستند\u003c/td>\u003ctd>Unsplash از Docker در دسترس نیست\u003c/td>\u003ctd>\u003ccode>deploy/photos/download-photos.ps1\u003c/code>، بعد «Refresh photos»\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"ویندوز\">ویندوز\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نشانه\u003c/th>\u003cth>راه‌حل\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PowerShell 5.1 خروجی stderr داکر را خطا نشان می‌دهد\u003c/td>\u003ctd>عادی است؛ اسکریپت‌ها \u003ccode>ErrorActionPreference=Continue\u003c/code> دارند. به exit code نگاه کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tar\u003c/code> در Git Bash با مسیر \u003ccode>C:\u003c/code> خطا می‌دهد\u003c/td>\u003ctd>\u003ccode>tar --force-local …\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مسیر داخل کانتینر در \u003ccode>docker exec\u003c/code> خراب می‌شود (\u003ccode>/data\u003c/code> ← \u003ccode>C:/Program Files/Git/data\u003c/code>)\u003c/td>\u003ctd>\u003ccode>MSYS_NO_PATHCONV=1 docker exec …\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>یک اسکریپت طولانی در heredoc Git Bash parse نمی‌شود\u003c/td>\u003ctd>اسکریپت را در یک فایل بنویسید و آن را اجرا کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Node.js آدرس \u003ccode>admin.localhost\u003c/code> را resolve نمی‌کند\u003c/td>\u003ctd>در اسکریپت‌ها از \u003ccode>http://127.0.0.1:4000\u003c/code> استفاده کنید\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"تستها\">تست‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نشانه\u003c/th>\u003cth>راه‌حل\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ECONNREFUSED 127.0.0.1:5433\u003c/code>\u003c/td>\u003ctd>\u003ccode>docker start sb-test-pg\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مقایسهٔ JSON از دیتابیس گاهی شکست می‌خورد\u003c/td>\u003ctd>jsonb ترتیب کلیدها را نگه نمی‌دارد؛ ساختاری مقایسه کنید (\u003ccode>toEqual\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تست‌ها خیلی کند هستند\u003c/td>\u003ctd>هر فایل تست سایت‌های واقعی می‌سازد؛ با \u003ccode>npx vitest run test/&lt;file&gt;\u003c/code> یک فایل را اجرا کنید\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"جای-دیگری-برای-نگاه-کردن\">جای دیگری برای نگاه کردن\u003c/h2>\n\u003cul>\u003cli>لاگ API: \u003ccode>docker compose -f deploy/docker-compose.yml logs -f studio-api\u003c/code>\u003c/li>\u003cli>لاگ کار deploy: خود صفحهٔ http://admin.localhost/deploy/\u003c/li>\u003cli>ساختار دقیق API: http://admin.localhost/api/v1/openapi.json\u003c/li>\u003cli>console مرورگر: خطای سکشن‌ها در builder به‌صورت کادر قرمز نشان داده می‌شود\u003c/li>\u003c/ul>","text":" عیب‌یابی فصل ۶ — عملیات نصب و build نشانه علت راه‌حل npm install یا docker build روی npm ci می‌ماند یا خطای شبکه می‌دهد lockfile به یک mirror اشاره می‌کند که در دسترس نیست در deploy/.env : NPM_REGISTRY=https://registry.npmjs.org/ ؛ روی سیستم خودتان npm install registry=https://registry.npmjs.org/ variable is not set هنگام compose up کلیدی در deploy/.env خالی است deploy/.env.example را با deploy/.env مقایسه کنید API با Must be 32 bytes, base64 encoded بالا نمی‌آید STUDIO_TENANT_SECRETS_KEY قالب درستی ندارد یک کلید base64 ۳۲ بایتی بسازید راه‌اندازی ../01 start/setup.md ۲ ساخت فایل تنظیمات . روی استودیوی پر، کلید را عوض نکنید اجرا نشانه علت راه‌حل تغییر کد در مرورگر دیده نمی‌شود کانتینرها از image ساخته‌شده اجرا می‌شوند up d build studio api studio web ؛ بعد مرورگر را با Ctrl+F5 refresh کنید API بالا نمی‌آید: Migration … was modified after it was applied یک migration اجراشده ویرایش شده فایل را برگردانید و تغییر را در migration جدید بنویسید migrationها ../03 layers/migrations.md انتشار صفحه یا افزودن ردیف 409 می‌دهد sequenceها بعد از کپی داده عقب مانده‌اند deploy/export/fix sequences.sql backup backup.md ورود با admin کار نمی‌کند رمز در هر شروع API از deploy/.env تنظیم می‌شود CONTROL_ADMIN_ را ببینید یا set password بزنید CLI docker.md cli api 403 Missing or invalid CSRF token درخواست بدون هدر X CSRF Token یا با cookie قدیمی از api در lib/api.ts استفاده کنید؛ در تست از signIn 403 module_disabled ماژول آن بخش برای سایت خاموش است Settings ← Modules آدرس /products در یک سایت 404 است ماژول products خاموش است سایت خالی ماژول را روشن کنید یا starter فروشگاه را اعمال کنید سایتی که عضوش نیستید 404 می‌دهد عمدی است؛ API وجود سایت را لو نمی‌دهد با اپراتور وارد شوید یا عضو اضافه کنید کد SMS یا ایمیل نمی‌رسد محلی در محیط محلی فقط در لاگ چاپ می‌شود logs f studio api عکس‌های قالب گرادیانی هستند Unsplash از Docker در دسترس نیست deploy/photos/download photos.ps1 ، بعد «Refresh photos» ویندوز نشانه راه‌حل PowerShell 5.1 خروجی stderr داکر را خطا نشان می‌دهد عادی است؛ اسکریپت‌ها ErrorActionPreference=Continue دارند. به exit code نگاه کنید tar در Git Bash با مسیر C: خطا می‌دهد tar force local … مسیر داخل کانتینر در docker exec خراب می‌شود /data ← C:/Program Files/Git/data MSYS_NO_PATHCONV=1 docker exec … یک اسکریپت طولانی در heredoc Git Bash parse نمی‌شود اسکریپت را در یک فایل بنویسید و آن را اجرا کنید Node.js آدرس admin.localhost را resolve نمی‌کند در اسکریپت‌ها از http://127.0.0.1:4000 استفاده کنید تست‌ها نشانه راه‌حل ECONNREFUSED 127.0.0.1:5433 docker start sb test pg مقایسهٔ JSON از دیتابیس گاهی شکست می‌خورد jsonb ترتیب کلیدها را نگه نمی‌دارد؛ ساختاری مقایسه کنید toEqual تست‌ها خیلی کند هستند هر فایل تست سایت‌های واقعی می‌سازد؛ با npx vitest run test/\u003cfile یک فایل را اجرا کنید جای دیگری برای نگاه کردن لاگ API: docker compose f deploy/docker compose.yml logs f studio api لاگ کار deploy: خود صفحهٔ http://admin.localhost/deploy/ ساختار دقیق API: http://admin.localhost/api/v1/openapi.json console مرورگر: خطای سکشن‌ها در builder به‌صورت کادر قرمز نشان داده می‌شود ","headings":[{"level":2,"id":"نصب-و-build","text":"نصب و build"},{"level":2,"id":"اجرا","text":"اجرا"},{"level":2,"id":"ویندوز","text":"ویندوز"},{"level":2,"id":"تستها","text":"تست‌ها"},{"level":2,"id":"جای-دیگری-برای-نگاه-کردن","text":"جای دیگری برای نگاه کردن"}]},{"path":"07-rules/code-style.md","title":"سبک کد","html":"\u003ch1 id=\"سبک-کد\">سبک کد\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۷ — قواعد · خلاصهٔ انگلیسی در \u003ccode>AGENTS.md\u003c/code> (بخش Conventions)\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"اصول\">اصول\u003c/h2>\n\u003col>\u003cli>\u003cstrong>اعتبارسنجی فقط در \u003ccode>packages/shared\u003c/code>.\u003c/strong> API هر ورودی را parse می‌کند و وب از همان schemaها استفاده می‌کند. هیچ‌وقت قاعدهٔ اعتبارسنجی را در وب یا API تکرار نکنید.\u003c/li>\u003cli>\u003cstrong>امنیت در API.\u003c/strong> هر محدودیتی که در رابط کاربری هست (پنهان کردن دکمه، قفل مشتری، ماژول خاموش) باید در API هم با middleware اعمال شود.\u003c/li>\u003cli>\u003cstrong>دادهٔ سایت فقط از \u003ccode>req.tenant.db\u003c/code>.\u003c/strong> هیچ handlerی نباید به دیتابیس سایت دیگری برسد.\u003c/li>\u003cli>\u003cstrong>سازگاری با گذشته.\u003c/strong> سایت‌های قدیمی و سرورهای مشتری باید بدون دخالت کار کنند: پیش‌فرض در schema، \u003ccode>withSettingDefaults\u003c/code>، تبدیل نسخهٔ قدیمی هنگام خواندن، و migrationی که روی دادهٔ موجود درست کار کند.\u003c/li>\u003cli>\u003cstrong>مبلغ و موجودی را از مرورگر قبول نکنید.\u003c/strong> روی سرور دوباره حساب کنید.\u003c/li>\u003c/ol>\n\u003ch2 id=\"نامگذاری\">نام‌گذاری\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کجا\u003c/th>\u003cth>قاعده\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ستون‌ها و جدول‌ها\u003c/td>\u003ctd>\u003ccode>snake_case\u003c/code> (\u003ccode>created_at\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>JSON پاسخ و TypeScript\u003c/td>\u003ctd>\u003ccode>camelCase\u003c/code> (\u003ccode>createdAt\u003c/code>)؛ تبدیل در SQL با \u003ccode>AS &quot;createdAt&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مبلغ\u003c/td>\u003ctd>پسوند \u003ccode>_minor\u003c/code> / \u003ccode>Minor\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>فایل‌های API\u003c/td>\u003ctd>\u003ccode>modules/&lt;name&gt;/&lt;name&gt;.routes.ts\u003c/code> و \u003ccode>&lt;name&gt;.service.ts\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کامپوننت‌ها\u003c/td>\u003ctd>\u003ccode>PascalCase.tsx\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>slugها\u003c/td>\u003ctd>حروف کوچک، عدد، خط تیره\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"متن-کاربر\">متن کاربر\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>همهٔ متن‌های رابط کاربری دوزبانه‌اند:\u003c/strong> \u003ccode>L('English', 'فارسی')\u003c/code> یا \u003ccode>{ en, fa }\u003c/code>؛ متن‌های مشترک پنل در \u003ccode>admin/i18n.ts\u003c/code>.\u003c/li>\u003cli>\u003cstrong>خطاها:\u003c/strong> API یک \u003ccode>code\u003c/code> و حدود را می‌فرستد. جملهٔ کاربر در \u003ccode>apps/web/src/lib/errorText.ts\u003c/code> ساخته می‌شود. برای خطای جدید یک code روشن مثل \u003ccode>module_disabled\u003c/code> انتخاب کنید و متن فارسی و انگلیسی‌اش را اضافه کنید.\u003c/li>\u003cli>جهت را با کلاس‌های منطقی بنویسید (\u003ccode>ms-\u003c/code>، \u003ccode>me-\u003c/code>، \u003ccode>text-start\u003c/code>)، نه \u003ccode>left\u003c/code> و \u003ccode>right\u003c/code>، تا RTL و LTR هر دو درست باشند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"کامنتها\">کامنت‌ها\u003c/h2>\n\u003cul>\u003cli>انگلیسی و ساده؛ توضیح بدهید \u003cstrong>چرا\u003c/strong> یا \u003cstrong>برای چه\u003c/strong>، نه اینکه کد چه می‌کند.\u003c/li>\u003cli>با تراکم کامنت‌های اطراف هماهنگ باشید. فایل‌های این پروژه بالای هر تابع export‌شده یک \u003ccode>/** … */\u003c/code> کوتاه دارند.\u003c/li>\u003cli>اگر کدی را از روی مستندات خارجی نوشته‌اید و تست واقعی نشده است، همین را در کامنت بنویسید (نمونه: درگاه‌های پرداخت).\u003c/li>\u003c/ul>\n\u003ch2 id=\"داده-نمونه\">دادهٔ نمونه\u003c/h2>\n\u003cp>هر ردیف ساختگی \u003ccode>demo = true\u003c/code> دارد تا با هم حذف شود و در بستهٔ مشتری نرود.\u003c/p>\n\u003ch2 id=\"صفحههای-داخلی\">صفحه‌های داخلی\u003c/h2>\n\u003cp>قابلیت‌های داخلی از طریق slugهای ثابت (\u003ccode>SYSTEM_PAGES\u003c/code>) به‌صورت صفحهٔ builder قابل ویرایش می‌شوند؛ برای هر صفحهٔ داخلی جدید همین الگو را دنبال کنید (\u003ca href=\"#04-features/system-pages.md\">صفحات داخلی\u003c/a>).\u003c/p>\n\u003ch2 id=\"پیش-از-اینکه-بگویید-کار-تمام-است\">پیش از اینکه بگویید کار تمام است\u003c/h2>\n\u003col>\u003cli>\u003ccode>npm run typecheck\u003c/code> بدون خطا.\u003c/li>\u003cli>\u003ccode>npm test\u003c/code> سبز. هر شکست جدید باید توضیح داده شود.\u003c/li>\u003cli>رفتار جدید API یک تست در \u003ccode>apps/api/test/\u003c/code> دارد.\u003c/li>\u003cli>کانتینرها rebuild شده‌اند و تغییر در http://admin.localhost بررسی شده است.\u003c/li>\u003cli>مستندات به‌روز شده است (\u003ca href=\"#07-rules/docs.md\">قواعد مستندات\u003c/a>).\u003c/li>\u003c/ol>","text":" سبک کد فصل ۷ — قواعد · خلاصهٔ انگلیسی در AGENTS.md بخش Conventions اصول 1. اعتبارسنجی فقط در packages/shared . API هر ورودی را parse می‌کند و وب از همان schemaها استفاده می‌کند. هیچ‌وقت قاعدهٔ اعتبارسنجی را در وب یا API تکرار نکنید. 2. امنیت در API. هر محدودیتی که در رابط کاربری هست پنهان کردن دکمه، قفل مشتری، ماژول خاموش باید در API هم با middleware اعمال شود. 3. دادهٔ سایت فقط از req.tenant.db . هیچ handlerی نباید به دیتابیس سایت دیگری برسد. 4. سازگاری با گذشته. سایت‌های قدیمی و سرورهای مشتری باید بدون دخالت کار کنند: پیش‌فرض در schema، withSettingDefaults ، تبدیل نسخهٔ قدیمی هنگام خواندن، و migrationی که روی دادهٔ موجود درست کار کند. 5. مبلغ و موجودی را از مرورگر قبول نکنید. روی سرور دوباره حساب کنید. نام‌گذاری کجا قاعده ستون‌ها و جدول‌ها snake_case created_at JSON پاسخ و TypeScript camelCase createdAt ؛ تبدیل در SQL با AS \"createdAt\" مبلغ پسوند _minor / Minor فایل‌های API modules/\u003cname /\u003cname .routes.ts و \u003cname .service.ts کامپوننت‌ها PascalCase.tsx slugها حروف کوچک، عدد، خط تیره متن کاربر همهٔ متن‌های رابط کاربری دوزبانه‌اند: L 'English', 'فارسی' یا { en, fa } ؛ متن‌های مشترک پنل در admin/i18n.ts . خطاها: API یک code و حدود را می‌فرستد. جملهٔ کاربر در apps/web/src/lib/errorText.ts ساخته می‌شود. برای خطای جدید یک code روشن مثل module_disabled انتخاب کنید و متن فارسی و انگلیسی‌اش را اضافه کنید. جهت را با کلاس‌های منطقی بنویسید ms ، me ، text start ، نه left و right ، تا RTL و LTR هر دو درست باشند. کامنت‌ها انگلیسی و ساده؛ توضیح بدهید چرا یا برای چه ، نه اینکه کد چه می‌کند. با تراکم کامنت‌های اطراف هماهنگ باشید. فایل‌های این پروژه بالای هر تابع export‌شده یک / … / کوتاه دارند. اگر کدی را از روی مستندات خارجی نوشته‌اید و تست واقعی نشده است، همین را در کامنت بنویسید نمونه: درگاه‌های پرداخت . دادهٔ نمونه هر ردیف ساختگی demo = true دارد تا با هم حذف شود و در بستهٔ مشتری نرود. صفحه‌های داخلی قابلیت‌های داخلی از طریق slugهای ثابت SYSTEM_PAGES به‌صورت صفحهٔ builder قابل ویرایش می‌شوند؛ برای هر صفحهٔ داخلی جدید همین الگو را دنبال کنید صفحات داخلی ../04 features/system pages.md . پیش از اینکه بگویید کار تمام است 1. npm run typecheck بدون خطا. 2. npm test سبز. هر شکست جدید باید توضیح داده شود. 3. رفتار جدید API یک تست در apps/api/test/ دارد. 4. کانتینرها rebuild شده‌اند و تغییر در http://admin.localhost بررسی شده است. 5. مستندات به‌روز شده است قواعد مستندات docs.md . ","headings":[{"level":2,"id":"اصول","text":"اصول"},{"level":2,"id":"نامگذاری","text":"نام‌گذاری"},{"level":2,"id":"متن-کاربر","text":"متن کاربر"},{"level":2,"id":"کامنتها","text":"کامنت‌ها"},{"level":2,"id":"داده-نمونه","text":"دادهٔ نمونه"},{"level":2,"id":"صفحههای-داخلی","text":"صفحه‌های داخلی"},{"level":2,"id":"پیش-از-اینکه-بگویید-کار-تمام-است","text":"پیش از اینکه بگویید کار تمام است"}]},{"path":"07-rules/docs.md","title":"به‌روز نگه داشتن مستندات","html":"\u003ch1 id=\"بهروز-نگه-داشتن-مستندات\">به‌روز نگه داشتن مستندات\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۷ — قواعد\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"سه-لایه-مستندات\">سه لایهٔ مستندات\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کجا\u003c/th>\u003cth>زبان\u003c/th>\u003cth>برای\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>AGENTS.md\u003c/code>\u003c/td>\u003ctd>انگلیسی\u003c/td>\u003ctd>هر agent و هر توسعه‌دهنده، در هر کار\u003c/td>\u003ctd>واقعیت‌هایی که همهٔ کارها لازم دارند: دستورات، Git، قراردادها، دام‌ها. \u003cstrong>کوتاه\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>docs/features/*.md\u003c/code>\u003c/td>\u003ctd>انگلیسی\u003c/td>\u003ctd>agentها\u003c/td>\u003ctd>جزئیات هر قابلیت، فشرده\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>docs/dev/\u003c/code> (همین‌جا)\u003c/td>\u003ctd>فارسی\u003c/td>\u003ctd>توسعه‌دهنده\u003c/td>\u003ctd>توضیح، نمودار، ارتباط بخش‌ها، دستورالعمل‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>docs/STATUS.md\u003c/code>\u003c/td>\u003ctd>انگلیسی\u003c/td>\u003ctd>همه\u003c/td>\u003ctd>کار در چه وضعی است، چه چیزی باز است، قدم بعدی\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>docs/guide/\u003c/code>\u003c/td>\u003ctd>فارسی\u003c/td>\u003ctd>کاربر پنل\u003c/td>\u003ctd>راهنمای کاربر با ویدیو\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>docs/HANDOFF.fa.md\u003c/code>\u003c/td>\u003ctd>فارسی\u003c/td>\u003ctd>مالک\u003c/td>\u003ctd>راه‌اندازی روی سیستم جدید و کارهای روزانه\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>فایل‌های قدیمی \u003ccode>docs/\u003c/code> (\u003ccode>architecture.md\u003c/code>، \u003ccode>api.md\u003c/code>، \u003ccode>security.md\u003c/code>، \u003ccode>operations.md\u003c/code>، گزارش‌های مرحله‌ای) \u003cstrong>legacy\u003c/strong> هستند و نسخهٔ اول پروژه را توصیف می‌کنند.\u003c/p>\n\u003ch2 id=\"بعد-از-هر-تغییر\">بعد از هر تغییر\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>اگر…\u003c/th>\u003cth>به‌روز کنید\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>نحوهٔ کار یک قابلیت عوض شد\u003c/td>\u003ctd>صفحهٔ آن در \u003ccode>docs/dev/04-features/\u003c/code> \u003cstrong>و\u003c/strong> \u003ccode>docs/features/\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>دستور، قرارداد یا دامی که همهٔ کارها لازم دارند عوض شد\u003c/td>\u003ctd>\u003ccode>AGENTS.md\u003c/code> و صفحهٔ مربوط در \u003ccode>docs/dev/\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>migration جدید\u003c/td>\u003ctd>\u003ccode>AGENTS.md\u003c/code> (latest) و \u003ca href=\"#03-layers/data-model.md\">مدل داده\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>روش جدید برای کاری تکراری\u003c/td>\u003ctd>یک دستورالعمل در \u003ccode>docs/dev/05-recipes/\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تعداد تست‌ها عوض شد\u003c/td>\u003ctd>\u003ccode>AGENTS.md\u003c/code>، \u003ccode>docs/STATUS.md\u003c/code>، \u003ca href=\"#01-start/setup.md\">راه‌اندازی\u003c/a>، \u003ca href=\"#05-recipes/tests.md\">تست\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>هر کار تمام‌شده\u003c/td>\u003ctd>\u003ccode>docs/STATUS.md\u003c/code> (چه شد، با commit؛ چه ماند؛ قدم بعدی)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"سبک-صفحههای-docsdev\">سبک صفحه‌های \u003ccode>docs/dev/\u003c/code>\u003c/h2>\n\u003cp>هر صفحه این ساختار را دارد:\u003c/p>\n\u003col>\u003cli>عنوان، و یک خط \u003ccode>&gt;\u003c/code> با فصل و \u003cstrong>فایل‌های کد مربوط\u003c/strong>،\u003c/li>\u003cli>\u003cstrong>خلاصه\u003c/strong> در چند خط،\u003c/li>\u003cli>نمودار Mermaid اگر جریانی یا رابطه‌ای هست،\u003c/li>\u003cli>جدول‌ها و مراحل با نام واقعی فایل‌ها، توابع و جدول‌ها،\u003c/li>\u003cli>«اگر بخواهید…» با لینک به صفحه‌های مرتبط،\u003c/li>\u003cli>«اشتباه‌های رایج» اگر دامی هست.\u003c/li>\u003c/ol>\n\u003cp>قواعد:\u003c/p>\n\u003cul>\u003cli>نام فایل، کد و اصطلاح فنی انگلیسی بماند؛ متن فارسی.\u003c/li>\u003cli>هر ادعا را با کد بسنجید. اگر مطمئن نیستید، به فایل لینک بدهید و ادعا نکنید.\u003c/li>\u003cli>فهرست کامل آدرس‌های API را اینجا تکرار نکنید؛ منبع کامل \u003ccode>GET /api/v1/openapi.json\u003c/code> است. فقط آدرس‌هایی را بیاورید که برای فهم جریان لازم‌اند.\u003c/li>\u003cli>صفحهٔ جدید را به فهرست \u003ca href=\"#README.md\">\u003ccode>docs/dev/README.md\u003c/code>\u003c/a> اضافه کنید؛ منوی نسخهٔ HTML هم از همین فهرست ساخته می‌شود.\u003c/li>\u003cli>\u003cstrong>بعد از هر ویرایش، نسخهٔ HTML را دوباره بسازید\u003c/strong> و \u003ccode>docs/dev/index.html\u003c/code> را همراه صفحه‌ها commit کنید:\u003c/li>\u003c/ul>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>npm run docs:html\u003c/code>\u003c/pre>\n\u003ch2 id=\"خواندن-مستندات\">خواندن مستندات\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>روی سیستم، بدون هیچ برنامه‌ای:\u003c/strong> روی \u003ccode>docs\\dev\\index.html\u003c/code> دوبار کلیک کنید. همهٔ صفحه‌ها با منوی فصل‌ها، جست‌وجو، متن راست‌به‌چپ و نمودارها در مرورگر باز می‌شوند. متن بدون اینترنت هم کار می‌کند؛ نمودارها کتابخانهٔ mermaid را از اینترنت می‌گیرند و بدون آن به‌صورت کد نشان داده می‌شوند. این فایل را \u003ccode>tools/dev-docs/build.mjs\u003c/code> می‌سازد؛ \u003cstrong>دستی ویرایشش نکنید\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>GitHub:\u003c/strong> متن فارسی را راست‌به‌چپ و نمودارهای Mermaid را درست نمایش می‌دهد.\u003c/li>\u003cli>\u003cstrong>VS Code:\u003c/strong> با \u003ccode>Ctrl+Shift+V\u003c/code> پیش‌نمایش بگیرید. برای نمودارها افزونهٔ «Markdown Preview Mermaid Support» را نصب کنید.\u003c/li>\u003c/ul>","text":" به‌روز نگه داشتن مستندات فصل ۷ — قواعد سه لایهٔ مستندات کجا زبان برای چه چیزی AGENTS.md انگلیسی هر agent و هر توسعه‌دهنده، در هر کار واقعیت‌هایی که همهٔ کارها لازم دارند: دستورات، Git، قراردادها، دام‌ها. کوتاه docs/features/ .md انگلیسی agentها جزئیات هر قابلیت، فشرده docs/dev/ همین‌جا فارسی توسعه‌دهنده توضیح، نمودار، ارتباط بخش‌ها، دستورالعمل‌ها docs/STATUS.md انگلیسی همه کار در چه وضعی است، چه چیزی باز است، قدم بعدی docs/guide/ فارسی کاربر پنل راهنمای کاربر با ویدیو docs/HANDOFF.fa.md فارسی مالک راه‌اندازی روی سیستم جدید و کارهای روزانه فایل‌های قدیمی docs/ architecture.md ، api.md ، security.md ، operations.md ، گزارش‌های مرحله‌ای legacy هستند و نسخهٔ اول پروژه را توصیف می‌کنند. بعد از هر تغییر اگر… به‌روز کنید نحوهٔ کار یک قابلیت عوض شد صفحهٔ آن در docs/dev/04 features/ و docs/features/ دستور، قرارداد یا دامی که همهٔ کارها لازم دارند عوض شد AGENTS.md و صفحهٔ مربوط در docs/dev/ migration جدید AGENTS.md latest و مدل داده ../03 layers/data model.md روش جدید برای کاری تکراری یک دستورالعمل در docs/dev/05 recipes/ تعداد تست‌ها عوض شد AGENTS.md ، docs/STATUS.md ، راه‌اندازی ../01 start/setup.md ، تست ../05 recipes/tests.md هر کار تمام‌شده docs/STATUS.md چه شد، با commit؛ چه ماند؛ قدم بعدی سبک صفحه‌های docs/dev/ هر صفحه این ساختار را دارد: 1. عنوان، و یک خط با فصل و فایل‌های کد مربوط ، 2. خلاصه در چند خط، 3. نمودار Mermaid اگر جریانی یا رابطه‌ای هست، 4. جدول‌ها و مراحل با نام واقعی فایل‌ها، توابع و جدول‌ها، 5. «اگر بخواهید…» با لینک به صفحه‌های مرتبط، 6. «اشتباه‌های رایج» اگر دامی هست. قواعد: نام فایل، کد و اصطلاح فنی انگلیسی بماند؛ متن فارسی. هر ادعا را با کد بسنجید. اگر مطمئن نیستید، به فایل لینک بدهید و ادعا نکنید. فهرست کامل آدرس‌های API را اینجا تکرار نکنید؛ منبع کامل GET /api/v1/openapi.json است. فقط آدرس‌هایی را بیاورید که برای فهم جریان لازم‌اند. صفحهٔ جدید را به فهرست docs/dev/README.md ../README.md اضافه کنید؛ منوی نسخهٔ HTML هم از همین فهرست ساخته می‌شود. بعد از هر ویرایش، نسخهٔ HTML را دوباره بسازید و docs/dev/index.html را همراه صفحه‌ها commit کنید: خواندن مستندات روی سیستم، بدون هیچ برنامه‌ای: روی docs\\dev\\index.html دوبار کلیک کنید. همهٔ صفحه‌ها با منوی فصل‌ها، جست‌وجو، متن راست‌به‌چپ و نمودارها در مرورگر باز می‌شوند. متن بدون اینترنت هم کار می‌کند؛ نمودارها کتابخانهٔ mermaid را از اینترنت می‌گیرند و بدون آن به‌صورت کد نشان داده می‌شوند. این فایل را tools/dev docs/build.mjs می‌سازد؛ دستی ویرایشش نکنید . GitHub: متن فارسی را راست‌به‌چپ و نمودارهای Mermaid را درست نمایش می‌دهد. VS Code: با Ctrl+Shift+V پیش‌نمایش بگیرید. برای نمودارها افزونهٔ «Markdown Preview Mermaid Support» را نصب کنید. ","headings":[{"level":2,"id":"سه-لایه-مستندات","text":"سه لایهٔ مستندات"},{"level":2,"id":"بعد-از-هر-تغییر","text":"بعد از هر تغییر"},{"level":2,"id":"سبک-صفحههای-docsdev","text":"سبک صفحه‌های docs/dev/"},{"level":2,"id":"خواندن-مستندات","text":"خواندن مستندات"}]},{"path":"07-rules/git.md","title":"Git","html":"\u003ch1 id=\"git\">Git\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۷ — قواعد · خلاصهٔ انگلیسی در \u003ccode>AGENTS.md\u003c/code> (بخش Git)\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"شاخهها\">شاخه‌ها\u003c/h2>\n\u003cpre class=\"mermaid\">gitGraph\n  commit id: &quot;main&quot;\n  branch develop\n  commit id: &quot;develop&quot;\n  branch feature/topic\n  commit id: &quot;کار&quot;\n  commit id: &quot;تست و مستندات&quot;\n  checkout develop\n  merge feature/topic\n  checkout main\n  merge develop tag: &quot;فقط با درخواست مالک&quot;\u003c/pre>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>شاخه\u003c/th>\u003cth>چیست\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>develop\u003c/code>\u003c/td>\u003ctd>شاخهٔ کار. هر کار از اینجا شروع می‌شود\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>feature/&lt;topic&gt;\u003c/code>\u003c/td>\u003ctd>هر کار یک شاخه (مثلاً \u003ccode>feature/payment-gateways\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>main\u003c/code>\u003c/td>\u003ctd>از \u003ccode>develop\u003c/code> عقب‌تر است؛ فقط وقتی مالک بخواهد به‌روز می‌شود\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"روند-هر-کار\">روند هر کار\u003c/h2>\n\u003cp>شروع:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git switch develop\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git pull\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git switch -c feature/my-topic\u003c/code>\u003c/pre>\n\u003cp>پس از کار و تست:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git add &lt;files&gt;\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git commit -m &quot;Let each site offer several payment gateways&quot;\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git push -u origin feature/my-topic\u003c/code>\u003c/pre>\n\u003cp>merge به \u003ccode>develop\u003c/code> (فقط وقتی مالک بخواهد) و همیشه با \u003ccode>--no-ff\u003c/code>:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git switch develop\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git merge --no-ff feature/my-topic\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>git push\u003c/code>\u003c/pre>\n\u003ch2 id=\"commit\">commit\u003c/h2>\n\u003cul>\u003cli>انگلیسی، امری و کوتاه، بدون پیشوند (\u003ccode>feat:\u003c/code> و امثالش نه): \u003ccode>Add the feature list and the empty-site start guide\u003c/code>.\u003c/li>\u003cli>هر commit یک کار منطقی؛ تست و مستندات همان کار در همان شاخه.\u003c/li>\u003cli>\u003cstrong>هرگز force-push نکنید.\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2 id=\"هرگز-commit-نکنید\">هرگز commit نکنید\u003c/h2>\n\u003cp>\u003ccode>.env\u003c/code>، \u003ccode>deploy/.env\u003c/code>، \u003ccode>exports/\u003c/code>، \u003ccode>backups/\u003c/code>، \u003ccode>var/\u003c/code>، \u003ccode>var.rar\u003c/code>، و \u003ccode>*.tar.gz\u003c/code> و \u003ccode>*.jpg\u003c/code> در ریشه. این‌ها دادهٔ مشتری و رمز دارند. بیشترشان در \u003ccode>.gitignore\u003c/code> هستند، ولی قبل از commit حتماً \u003ccode>git status\u003c/code> را ببینید.\u003c/p>\n\u003ch2 id=\"remote\">remote\u003c/h2>\n\u003cp>push از طریق حساب GitHub \u003ccode>bonshad2026\u003c/code> انجام می‌شود (در آدرس remote تنظیم شده است).\u003c/p>","text":" Git فصل ۷ — قواعد · خلاصهٔ انگلیسی در AGENTS.md بخش Git شاخه‌ها شاخه چیست develop شاخهٔ کار. هر کار از اینجا شروع می‌شود feature/\u003ctopic هر کار یک شاخه مثلاً feature/payment gateways main از develop عقب‌تر است؛ فقط وقتی مالک بخواهد به‌روز می‌شود روند هر کار شروع: پس از کار و تست: merge به develop فقط وقتی مالک بخواهد و همیشه با no ff : commit انگلیسی، امری و کوتاه، بدون پیشوند feat: و امثالش نه : Add the feature list and the empty site start guide . هر commit یک کار منطقی؛ تست و مستندات همان کار در همان شاخه. هرگز force push نکنید. هرگز commit نکنید .env ، deploy/.env ، exports/ ، backups/ ، var/ ، var.rar ، و .tar.gz و .jpg در ریشه. این‌ها دادهٔ مشتری و رمز دارند. بیشترشان در .gitignore هستند، ولی قبل از commit حتماً git status را ببینید. remote push از طریق حساب GitHub bonshad2026 انجام می‌شود در آدرس remote تنظیم شده است . ","headings":[{"level":2,"id":"شاخهها","text":"شاخه‌ها"},{"level":2,"id":"روند-هر-کار","text":"روند هر کار"},{"level":2,"id":"commit","text":"commit"},{"level":2,"id":"هرگز-commit-نکنید","text":"هرگز commit نکنید"},{"level":2,"id":"remote","text":"remote"}]},{"path":"README.md","title":"مستندات فنی Site Builder","html":"\u003ch1 id=\"مستندات-فنی-site-builder\">مستندات فنی Site Builder\u003c/h1>\n\u003cp>راهنمای توسعه‌دهنده، به فارسی. هدف: با خواندن این صفحه‌ها بدانید هر بخش کجاست، چطور با بقیه ارتباط دارد و برای یک تغییر کدام فایل‌ها را باید عوض کنید.\u003c/p>\n\u003cblockquote>\u003cp>نام فایل‌ها، کد، اصطلاحات فنی و پیام‌های commit انگلیسی می‌مانند. خلاصهٔ کوتاه و انگلیسیِ همین مطالب برای agentها در \u003ca href=\"../../AGENTS.md\">\u003ccode>AGENTS.md\u003c/code>\u003c/a> و \u003ca href=\"../features\">\u003ccode>docs/features/\u003c/code>\u003c/a> است؛ وقتی چیزی را عوض می‌کنید، هر دو را به‌روز کنید (\u003ca href=\"#07-rules/docs.md\">قواعد مستندات\u003c/a>).\u003c/p>\u003c/blockquote>\n\u003cblockquote>\u003cp>\u003cstrong>راحت‌ترین راه خواندن روی سیستم:\u003c/strong> روی \u003ccode>docs\\dev\\index.html\u003c/code> دوبار کلیک کنید تا همهٔ صفحه‌ها با منو و جست‌وجو در مرورگر باز شوند. بعد از ویرایش صفحه‌ها، آن را با \u003ccode>npm run docs:html\u003c/code> دوباره بسازید (\u003ca href=\"#07-rules/docs.md\">قواعد مستندات\u003c/a>).\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"ترتیب-پیشنهادی-خواندن\">ترتیب پیشنهادی خواندن\u003c/h2>\n\u003cp>اگر تازه شروع می‌کنید، به همین ترتیب بخوانید: ۱ ← ۲ ← ۳. بعد هر وقت روی قابلیتی کار کردید، فصل ۴ همان قابلیت و دستورالعمل مربوط در فصل ۵ را بخوانید.\u003c/p>\n\u003ch2 id=\"فهرست\">فهرست\u003c/h2>\n\u003ch3 id=\"۱-شروع\">۱. شروع\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>صفحه\u003c/th>\u003cth>موضوع\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#01-start/setup.md\">راه‌اندازی محیط توسعه\u003c/a>\u003c/td>\u003ctd>نصب، اجرای استودیو، دیتابیس تست، اولین تغییر\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#01-start/folders.md\">ساختار پوشه‌ها\u003c/a>\u003c/td>\u003ctd>هر پوشه چه دارد و کجا را باید نگاه کرد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#01-start/glossary.md\">واژه‌نامه\u003c/a>\u003c/td>\u003ctd>site، tenant، cell، kit، starter، system page و…\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"۲-معماری\">۲. معماری\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>صفحه\u003c/th>\u003cth>موضوع\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#02-architecture/overview.md\">نمای کلی\u003c/a>\u003c/td>\u003ctd>استودیو، سرویس deploy، بستهٔ مشتری\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#02-architecture/request-path.md\">مسیر یک درخواست\u003c/a>\u003c/td>\u003ctd>از nginx تا دیتابیس سایت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#02-architecture/multi-tenancy.md\">چند-مستأجری\u003c/a>\u003c/td>\u003ctd>دیتابیس کنترل و دیتابیس جدا برای هر سایت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#02-architecture/auth.md\">احراز هویت و نقش‌ها\u003c/a>\u003c/td>\u003ctd>اپراتور، مالک، کارمند، مشتری؛ session و CSRF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#02-architecture/builds.md\">ساخت و حالت‌های اجرا\u003c/a>\u003c/td>\u003ctd>استودیو، پیش‌نمایش، بستهٔ مشتری (cell)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"۳-لایهها\">۳. لایه‌ها\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>صفحه\u003c/th>\u003cth>موضوع\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#03-layers/shared.md\">پکیج shared\u003c/a>\u003c/td>\u003ctd>schemaهای zod و منطق مشترک\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#03-layers/api.md\">API\u003c/a>\u003c/td>\u003ctd>ماژول‌ها، \u003ccode>ApiRouter\u003c/code>، خطاها، middlewareها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#03-layers/web.md\">وب\u003c/a>\u003c/td>\u003ctd>مسیرها، پنل ادمین، builder، رندر سکشن‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#03-layers/data-model.md\">مدل داده\u003c/a>\u003c/td>\u003ctd>جدول‌های دیتابیس کنترل و دیتابیس سایت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#03-layers/migrations.md\">migrationها\u003c/a>\u003c/td>\u003ctd>چطور اجرا می‌شوند و چطور یکی بنویسید\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"۴-قابلیتها\">۴. قابلیت‌ها\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>صفحه\u003c/th>\u003cth>موضوع\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#04-features/pages-and-sections.md\">صفحات و سکشن‌ها\u003c/a>\u003c/td>\u003ctd>پیش‌نویس، انتشار، نسخه‌ها، builder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04-features/system-pages.md\">صفحات داخلی (system pages)\u003c/a>\u003c/td>\u003ctd>فروشگاه، سبد، حساب و… به‌صورت صفحهٔ قابل ویرایش\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04-features/collections.md\">جدول‌های محتوا\u003c/a>\u003c/td>\u003ctd>جدول‌ها، فیلدها، لیست‌ها، طراح باکس\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04-features/requests.md\">فرم‌ها و workflow\u003c/a>\u003c/td>\u003ctd>درخواست‌ها، مراحل، حساب مشتری، پیگیری\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04-features/shop-and-payments.md\">فروشگاه و پرداخت\u003c/a>\u003c/td>\u003ctd>محصول، سفارش، کوپن، درگاه‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04-features/site-setup.md\">ساخت سایت جدید، kit و دادهٔ نمونه\u003c/a>\u003c/td>\u003ctd>setup، ماژول‌ها، site kits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04-features/starters.md\">starterها\u003c/a>\u003c/td>\u003ctd>packها، اعمال روی سایت، پیش‌نمایش\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04-features/delivery.md\">تحویل به مشتری\u003c/a>\u003c/td>\u003ctd>سرویس deploy، بستهٔ نصب و به‌روزرسانی طراحی\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"۵-دستورالعملها-گامبهگام\">۵. دستورالعمل‌ها (گام‌به‌گام)\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>صفحه\u003c/th>\u003cth>موضوع\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#05-recipes/new-section.md\">نوع سکشن جدید\u003c/a>\u003c/td>\u003ctd>schema، renderer، فیلدهای ویرایشگر\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#05-recipes/new-api-route.md\">مسیر یا ماژول API جدید\u003c/a>\u003c/td>\u003ctd>route، دسترسی، تست، استفاده در وب\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#05-recipes/new-migration.md\">migration جدید\u003c/a>\u003c/td>\u003ctd>فایل SQL، اجرا، تست\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#05-recipes/new-site-setting.md\">تنظیم جدید برای سایت\u003c/a>\u003c/td>\u003ctd>schema، پیش‌فرض، فرم ادمین، سهم مشتری\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#05-recipes/new-payment-gateway.md\">درگاه پرداخت جدید\u003c/a>\u003c/td>\u003ctd>کلاس gateway و driver\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#05-recipes/new-ready-starter.md\">starter آماده جدید\u003c/a>\u003c/td>\u003ctd>افزودن به \u003ccode>SAMPLES\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#05-recipes/tests.md\">نوشتن تست\u003c/a>\u003c/td>\u003ctd>تست API با Postgres واقعی، تست وب\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"۶-عملیات\">۶. عملیات\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>صفحه\u003c/th>\u003cth>موضوع\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#06-operations/docker.md\">Docker و اجرای روزانه\u003c/a>\u003c/td>\u003ctd>کانتینرها، rebuild، لاگ، CLI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#06-operations/backup.md\">backup و restore\u003c/a>\u003c/td>\u003ctd>پشتیبان کل استودیو\u003c/td>\u003c/tr>\u003ctr>\u003ctd> const byPath = new Map(DATA.pages.map((p) => [p.path, p]));
const nav = document.getElementById('nav');
const links = document.getElementById('links');
const main = document.getElementById('page');
const q = document.getElementById('q');
document.getElementById('meta').textContent = 'ساخته‌شده در ' + DATA.built + ' از docs/dev';
document.getElementById('menuBtn').onclick = () => nav.classList.toggle('open');

function menuHtml() {
  const home = '<a href="#README.md" data-path="README.md">فهرست و ترتیب خواندن</a>';
  return home + DATA.chapters.map((c) => '<div class="chapter">' + c.title + '</div>' + c.pages.map((p) => '<a href="#' + p.path + '" data-path="' + p.path + '">' + p.title + '</a>').join('')).join('');
}

function search(term) {
  if (!term.trim()) { links.innerHTML = menuHtml(); markActive(); return; }
  const words = term.trim().toLowerCase().split(/\s+/);
  const hits = DATA.pages.filter((p) => words.every((w) => (p.title + ' ' + p.text).toLowerCase().includes(w)));
  links.innerHTML = hits.length
    ? hits.map((p) => { const i = p.text.toLowerCase().indexOf(words[0]); const snip = p.text.slice(Math.max(0, i - 30), i + 60); return '<a class="result" href="#' + p.path + '" data-path="' + p.path + '">' + p.title + '<small>…' + snip.replace(/</g, '&lt;') + '…</small></a>'; }).join('')
    : '<p style="font-size:14px;color:var(--soft)">چیزی پیدا نشد.</p>';
  markActive();
}

function markActive() {
  const current = (location.hash.slice(1).split('::')[0]) || 'README.md';
  links.querySelectorAll('a').forEach((a) => a.classList.toggle('active', decodeURIComponent(a.dataset.path) === decodeURIComponent(current)));
}

function highlight(term) {
  if (!term.trim()) return;
  const words = term.trim().split(/\s+/).filter((w) => w.length > 1);
  const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) if (!walker.currentNode.parentElement.closest('pre')) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue;
    const lower = text.toLowerCase();
    const w = words.find((x) => lower.includes(x.toLowerCase()));
    if (!w) continue;
    const at = lower.indexOf(w.toLowerCase());
    const mark = document.createElement('mark');
    const rest = node.splitText(at);
    rest.splitText(w.length);
    mark.textContent = rest.nodeValue;
    rest.replaceWith(mark);
  }
  main.querySelector('mark')?.scrollIntoView({ block: 'center' });
}

async function show() {
  const [file, anchor] = decodeURIComponent(location.hash.slice(1)).split('::');
  const page = byPath.get(file || 'README.md') || byPath.get('README.md');
  const toc = page.headings.filter((h) => h.level === 2);
  main.innerHTML = page.html.replace(/<\/h1>/, (m) => m + (toc.length > 2 ? '<div class="toc">' + toc.map((h) => '<a href="#' + page.path + '::' + h.id + '">' + h.text + '</a>').join(' ') + '</div>' : ''));
  document.title = page.title + ' — مستندات فنی';
  markActive();
  nav.classList.remove('open');
  await drawDiagrams();
  if (anchor) document.getElementById(anchor)?.scrollIntoView();
  else if (q.value.trim()) highlight(q.value);
  else window.scrollTo(0, 0);
}

let mermaidReady = null;
function loadMermaid() {
  mermaidReady ??= new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
    s.onload = () => { window.mermaid.initialize({ startOnLoad: false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default', fontFamily: 'Vazirmatn, Tahoma, sans-serif' }); resolve(window.mermaid); };
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
  return mermaidReady;
}
async function drawDiagrams() {
  const blocks = main.querySelectorAll('pre.mermaid');
  if (!blocks.length) return;
  const mermaid = await loadMermaid();
  if (!mermaid) { blocks.forEach((b) => { b.classList.add('raw'); b.title = 'برای دیدن نمودار، اینترنت لازم است'; }); return; }
  try { await mermaid.run({ nodes: blocks }); } catch { blocks.forEach((b) => b.classList.add('raw')); }
}

q.addEventListener('input', () => search(q.value));
q.addEventListener('keydown', (e) => { if (e.key === 'Enter') links.querySelector('a')?.click(); });
addEventListener('hashchange', show);
links.innerHTML = menuHtml();
show();
</script>
</body>
</html>
