ify email لینک‌های ایمیل /__preview iframe پیش‌نمایش builder فقط استودیو /__starter preview پیش‌نمایش starterها فقط استودیو / صفحهٔ اصلی سایت SitePage home /products ، /products/:slug ، /services ، /services/:slug صفحه‌های داخلی فروشگاه و خدمات /cart ، /checkout ، /checkout/result سبد و پرداخت /account ، /track ، /track/:code حساب مشتری و پیگیری /wishlist علاقه‌مندی‌ها /:slug صفحهٔ ساخته‌شده در builder /:collection/:item صفحهٔ یک آیتم از جدول محتوا مثلاً /classes/yoga 404 صفحه‌های داخلی داخل \u003cBuiltInPage page=\"…\" قرار دارند. اگر سایت یک صفحهٔ منتشرشده با slug ثابت آن صفحه داشته باشد مثلاً products ، همان صفحهٔ builder نشان داده می‌شود و محتوای داخلی درون سکشن system page قرار می‌گیرد. → صفحات داخلی ../04 features/system pages.md پنل ادمین admin/AdminRoot.tsx : /admin/login ، /admin/forgot /admin/platform/ PlatformPages ، فقط اپراتور : سایت‌ها، کاربران، audit، starterها، site kits، درگاه‌ها /admin/sites/:siteId/ SitePages : صفحه‌ها، محتوا، محصولات، خدمات، جدول‌ها و آیتم‌ها، درخواست‌ها leads ، سفارش‌ها، مشتریان، کوپن‌ها، نظرها، مشترکان، فایل‌ها، اعضا، تنظیمات، درگاه‌ها، تراکنش‌ها /admin/sites/:siteId/pages/:pageId/builder فقط اپراتور منوی کناری هر سایت در SiteNav داخل AdminRoot.tsx است. دریافت داده lib/api.ts : api.get/post/put/patch/delete پاسخ data را برمی‌گردانند و api.page کل پاسخ را همراه meta . خطاها ApiError با status ، code و details هستند. hookهای سایت عمومی : features/public site/data.ts useSiteSettings ، usePublishedPageList … ؛ کلید query به شکل 'public', site, … . hookهای پنل کنار صفحه‌ها تعریف شده‌اند مثلاً admin/collections/api.ts . بعد از هر تغییر، queryClient.invalidateQueries با همان کلید صدا زده می‌شود تا داده دوباره خوانده شود. سایت جاری: useSiteId از SiteIdContext ؛ مقدار پیش‌فرض از host یا VITE_SITE_ID می‌آید. بدون API VITE_API_URL خالی : سایت با content/fallback نمایش داده می‌شود و پنل در دسترس نیست. رندر سکشن‌ها sections/renderers.tsx : جدول sectionRenderers هر type یک کامپوننت . سکشن‌های جدول محتوا در collectionSections.tsx و رسانه در mediaSections.tsx هستند. SectionRenderer هر سکشن را در یک error boundary می‌گذارد، پس سکشن خراب بقیهٔ صفحه را از کار نمی‌اندازد. در صفحهٔ قالبِ آیتم جدول، {{field}} در هر متنی با مقدار آیتم جایگزین می‌شود useItemTokens . builder admin/builder/ : فایل کار BuilderPage.tsx صفحهٔ اصلی: لیست سکشن‌ها کشیدن و رها کردن با dnd kit ، افزودن، ذخیره، انتشار state.ts reducer: add ، remove ، duplicate ، move ، update ، toggleHidden ، undo / redo تا ۱۰۰ قدم؛ ویرایش‌های پشت‌سرهم یک سکشن در کمتر از ۱ ثانیه یک قدم حساب می‌شوند fields.ts sectionMeta : نام، توضیح و فیلدهای ویرایشگر هر نوع سکشن FieldDef Inspector.tsx فرم تنظیمات سکشن انتخاب‌شده، ساخته‌شده از FieldDef ها؛ و ظاهر AppearanceEditor PreviewFrame.tsx داخل iframe /__preview ؛ سند را با postMessage می‌گیرد و با استایل خود سایت رندر می‌کند CardDesigner.tsx ، CollectionFields.tsx طراح باکس و فیلدهای مخصوص منبع داده پیش‌نمایش در iframe است تا عرض واقعی موبایل، تبلت و دسکتاپ و CSS خود سایت را داشته باشد. پیام‌ها فقط از همان origin پذیرفته می‌شوند. ظاهر و تم styles/index.css : tokenهای رنگ bg ، surface ، ink ، accent … برای هر data theme=\"…\" که Tailwind آن‌ها را به کلاس‌هایی مثل bg bg و text ink soft تبدیل می‌کند. طراحی سفارشی سایت settings.design : فونت‌ها، رنگ‌ها با lib/siteLook.tsx اعمال می‌شود. در کامپوننت‌ها رنگ ثابت ننویسید؛ از کلاس‌های token استفاده کنید تا همهٔ تم‌ها درست کار کنند. زبان و جهت متن‌های دوزبانه درون کد: L 'English', 'فارسی' admin/interactions/common.tsx یک { en, fa } می‌سازد و useL نسخهٔ زبان جاری را برمی‌گرداند. بعضی فایل‌ها l { en, fa } محلی دارند. متن‌های مشترک پنل در admin/i18n.ts هستند useT . متن‌های سایت عمومی در locales/en.ts و locales/fa.ts هستند و settings.texts می‌تواند آن‌ها را عوض کند. زبان و جهت جاری از lib/preferences.tsx usePreferences می‌آیند. تاریخ‌ها با lib/calendar.ts شمسی یا میلادی نمایش داده می‌شوند. خطاهای API با lib/errorText.ts به جمله تبدیل می‌شوند. اگر بخواهید… سکشن جدید بسازید → نوع سکشن جدید ../05 recipes/new section.md صفحهٔ جدیدی به پنل اضافه کنید: کامپوننت را در admin/pages/ بسازید، در SitePages.tsx یا PlatformPages.tsx یک \u003cRoute بدهید و در SiteNav لینکش را بگذارید. اگر فقط برای اپراتور است، با operator یا OPERATOR_UI محدودش کنید و در API هم. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"مسیرها","text":"مسیرها"},{"level":3,"id":"پنل-ادمین","text":"پنل ادمین"},{"level":2,"id":"دریافت-داده","text":"دریافت داده"},{"level":2,"id":"رندر-سکشنها","text":"رندر سکشن‌ها"},{"level":2,"id":"builder","text":"builder"},{"level":2,"id":"ظاهر-و-تم","text":"ظاهر و تم"},{"level":2,"id":"زبان-و-جهت","text":"زبان و جهت"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"04-features/collections.md","title":"جدول‌های محتوا (collections)","html":"\u003ch1 id=\"جدولهای-محتوا-collections\">جدول‌های محتوا (collections)\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · shared: \u003ccode>collections.ts\u003c/code> · API: \u003ccode>modules/collections/\u003c/code> · وب: \u003ccode>admin/collections/\u003c/code>، \u003ccode>admin/builder/CardDesigner.tsx\u003c/code>، \u003ccode>features/collections/\u003c/code>، \u003ccode>sections/collectionSections.tsx\u003c/code> · جدول‌ها: \u003ccode>collections\u003c/code>، \u003ccode>collection_items\u003c/code> (migration 006) · خلاصهٔ انگلیسی: \u003ca href=\"../features/collections.md\">\u003ccode>docs/features/collections.md\u003c/code>\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>اپراتور برای هر سایت \u003cstrong>جدول\u003c/strong> تعریف می‌کند (دوره‌ها، کلاس‌ها، اخبار، پروژه‌ها…) و مالک \u003cstrong>آیتم‌ها\u003c/strong> را اضافه می‌کند. آیتم‌ها در صفحه‌ها با سکشن «List from a table» (\u003ccode>collection-list\u003c/code>) و در صفحهٔ هر آیتم با «Item display» (\u003ccode>collection-item\u003c/code>) نشان داده می‌شوند.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart LR\n  T[تعریف جدول&lt;br/&gt;collections.fields] --&gt; I[آیتم‌ها&lt;br/&gt;collection_items.data]\n  I --&gt; L[سکشن collection-list&lt;br/&gt;فیلتر، مرتب‌سازی، باکس]\n  I --&gt; D[&quot;صفحهٔ آیتم /:table/:item&lt;br/&gt;صفحهٔ قالب + {{field}}&quot;]\n  C[طرح باکس&lt;br/&gt;settings.cardDesigns] --&gt; L\n  P[(products)] -- &quot;source: products&quot; --&gt; L\u003c/pre>\n\u003ch2 id=\"تعریف-جدول\">تعریف جدول\u003c/h2>\n\u003cp>\u003ccode>collectionInputSchema\u003c/code> (shared):\u003c/p>\n\u003cul>\u003cli>\u003ccode>slug\u003c/code>، \u003ccode>name\u003c/code>، \u003ccode>itemName\u003c/code>\u003c/li>\u003cli>\u003ccode>fields\u003c/code>: هر فیلد یک \u003ccode>key\u003c/code>، برچسب و نوع دارد. ۱۵ نوع وجود دارد: \u003ccode>text\u003c/code>، \u003ccode>textarea\u003c/code>، \u003ccode>number\u003c/code>، \u003ccode>price\u003c/code>، \u003ccode>date\u003c/code>، \u003ccode>datetime\u003c/code>، \u003ccode>boolean\u003c/code>، \u003ccode>select\u003c/code>، \u003ccode>multiselect\u003c/code>، \u003ccode>image\u003c/code>، \u003ccode>gallery\u003c/code>، \u003ccode>link\u003c/code>، \u003ccode>email\u003c/code>، \u003ccode>phone\u003c/code>، \u003ccode>reference\u003c/code> (اشاره به آیتمی از جدول دیگر با slug). \u003ccode>text\u003c/code> و \u003ccode>textarea\u003c/code> دوزبانه‌اند.\u003c/li>\u003cli>\u003ccode>detailPage\u003c/code>: slug صفحهٔ قالبی که هر آیتم با آن نمایش داده می‌شود.\u003c/li>\u003cli>\u003ccode>imageField\u003c/code>: فیلد عکس اصلی.\u003c/li>\u003cli>\u003ccode>commerce\u003c/code>: فروش آیتم‌ها (\u003ccode>capacityField\u003c/code> برای ظرفیت، \u003ccode>deadlineField\u003c/code> برای مهلت).\u003c/li>\u003cli>\u003ccode>requestType\u003c/code>: فرم درخواست مرتبط.\u003c/li>\u003cli>\u003ccode>COLLECTION_PRESETS\u003c/code>: جدول‌های آماده برای شروع سریع.\u003c/li>\u003c/ul>\n\u003cp>داده‌های هر آیتم در \u003ccode>collection_items.data\u003c/code> (jsonb) و با کلید فیلدها ذخیره می‌شوند.\u003c/p>\n\u003ch2 id=\"آدرسهای-api\">آدرس‌های API\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس\u003c/th>\u003cth>کار\u003c/th>\u003cth>محدودیت\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>GET/POST /sites/:s/collections\u003c/code>\u003c/td>\u003ctd>فهرست و ساخت جدول\u003c/td>\u003ctd>ساخت: در cell فقط اپراتور + \u003ccode>site:write\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET/PUT/DELETE /sites/:s/collections/:id\u003c/code>\u003c/td>\u003ctd>یک جدول\u003c/td>\u003ctd>تغییر ساختار: همان\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET/POST /sites/:s/collections/:id/items\u003c/code>\u003c/td>\u003ctd>آیتم‌ها\u003c/td>\u003ctd>\u003ccode>catalog:write\u003c/code> برای نوشتن\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET/PUT/DELETE /sites/:s/collections/:id/items/:itemId\u003c/code>\u003c/td>\u003ctd>یک آیتم\u003c/td>\u003ctd>همان\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /sites/:s/collections/preview/:source\u003c/code>\u003c/td>\u003ctd>پیش‌نمایش لیست در builder\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /public/sites/:s/collections\u003c/code>\u003c/td>\u003ctd>جدول‌ها برای بازدیدکننده\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /public/sites/:s/collections/:table/items\u003c/code>\u003c/td>\u003ctd>لیست با فیلتر، مرتب‌سازی، صفحه‌بندی، جست‌وجو\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET …/:table/range\u003c/code>، \u003ccode>…/:table/days\u003c/code>\u003c/td>\u003ctd>کمترین و بیشترین مقدار (برای slider) و روزهای دارای آیتم (برای تقویم)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET …/:table/items/:slug\u003c/code>\u003c/td>\u003ctd>یک آیتم\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>فیلتر و مرتب‌سازی \u003cstrong>در SQL\u003c/strong> انجام می‌شود (\u003ccode>collections.service.ts\u003c/code>)، نه در مرورگر. ظرفیت و مهلت هم روی سرور بررسی می‌شوند.\u003c/p>\n\u003ch2 id=\"لیست-و-باکس\">لیست و باکس\u003c/h2>\n\u003cp>سکشن \u003ccode>collection-list\u003c/code> این‌ها را دارد: منبع (یک جدول یا \u003ccode>products\u003c/code>)، فیلترهای ثابت، فیلترهای بازدیدکننده، مرتب‌سازی، شبکه یا لیست، تعداد ستون برای هر دستگاه، صفحه‌بندی و جست‌وجو.\u003c/p>\n\u003cp>\u003cstrong>فیلترهای بازدیدکننده\u003c/strong> بسته به نوع فیلد: جست‌وجو، chip، select، checkbox، slider، بازه، presetها، تقویم (درون صفحه یا در پنجره)، بازهٔ تاریخ، و «فقط موجودها». فیلترها کنار هم یا زیر هم نمایش داده می‌شوند.\u003c/p>\n\u003cp>\u003cstrong>باکس\u003c/strong> هر آیتم با طراح باکس (\u003ccode>CardDesigner.tsx\u003c/code>) ساخته و با \u003ccode>CardView.tsx\u003c/code> رندر می‌شود. گزینه‌ها: اندازه و برش عکس، چند عکس (شبکه، اسلایدر، ردیف)، جهت و چینش، و دکمه‌ها (مشاهده، سبد، درخواست، لینک، تماس). طرح‌های مشترک در \u003ccode>settings.cardDesigns\u003c/code> ذخیره می‌شوند (مثلاً \u003ccode>box-products\u003c/code>، \u003ccode>box-&lt;table&gt;\u003c/code>). هر لیست می‌تواند \u003ccode>card\u003c/code> اختصاصی هم داشته باشد.\u003c/p>\n\u003ch2 id=\"صفحه-آیتم\">صفحهٔ آیتم\u003c/h2>\n\u003cp>مسیر \u003ccode>/:collection/:item\u003c/code> (\u003ccode>features/collections/CollectionItemPage.tsx\u003c/code>) صفحهٔ \u003ccode>detailPage\u003c/code> جدول را رندر می‌کند:\u003c/p>\n\u003cul>\u003cli>هر \u003ccode>{{field}}\u003c/code> در هر متنی از سکشن‌ها با مقدار آیتم جایگزین می‌شود (\u003ccode>useItemTokens\u003c/code> در \u003ccode>SectionRenderer.tsx\u003c/code>).\u003c/li>\u003cli>سکشن \u003ccode>collection-item\u003c/code> خود آیتم را نشان می‌دهد.\u003c/li>\u003cli>لیست‌های مرتبط می‌توانند با \u003ccode>valueFrom: 'current'\u003c/code> بر اساس آیتم جاری فیلتر شوند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"فروش-و-درخواست\">فروش و درخواست\u003c/h2>\n\u003cul>\u003cli>آیتم با \u003ccode>commerce\u003c/code> به سبد خرید اضافه می‌شود (\u003ccode>order_items.collection_item_id\u003c/code>) و ظرفیت و مهلت روی سرور کنترل می‌شوند.\u003c/li>\u003cli>دکمهٔ «درخواست» فرم را با \u003ccode>?item=&lt;table&gt;/&lt;slug&gt;\u003c/code> باز می‌کند و آیتم در \u003ccode>leads.item_ref\u003c/code> ثبت می‌شود.\u003c/li>\u003c/ul>\n\u003ch2 id=\"در-تحویل\">در تحویل\u003c/h2>\n\u003cp>design update \u003cstrong>تعریف جدول‌ها\u003c/strong> را جایگزین می‌کند و \u003cstrong>آیتم‌های مشتری\u003c/strong> را نگه می‌دارد. جدولی که برای مشتری تازه است، آیتم‌های استودیو را هم می‌گیرد.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>نوع فیلد جدید اضافه کنید:\n\u003col>\u003cli>آن را به \u003ccode>FIELD_TYPES\u003c/code> اضافه کنید و اعتبارسنجی مقدارش را در shared بنویسید،\u003c/li>\u003cli>ویرایشگرش را در \u003ccode>admin/collections/ItemsPage.tsx\u003c/code> بسازید،\u003c/li>\u003cli>نمایشش را در \u003ccode>CardView.tsx\u003c/code> بنویسید،\u003c/li>\u003cli>اگر قابل فیلتر است، SQL فیلترش را در \u003ccode>collections.service.ts\u003c/code> اضافه کنید،\u003c/li>\u003cli>سازندهٔ مقدار نمونه را در \u003ccode>platform/setup/demo.ts\u003c/code> (\u003ccode>fieldValue\u003c/code>) اضافه کنید.\u003c/li>\u003c/ol>\n\u003cp>\u003ccode>npm run typecheck\u003c/code> جاهایی را که روی همهٔ نوع‌ها switch دارند نشانتان می‌دهد.\u003c/p>\u003c/li>\u003c/ul>","text":" جدول‌های محتوا collections فصل ۴ — قابلیت‌ها · shared: collections.ts · API: modules/collections/ · وب: admin/collections/ ، admin/builder/CardDesigner.tsx ، features/collections/ ، sections/collectionSections.tsx · جدول‌ها: collections ، collection_items migration 006 · خلاصهٔ انگلیسی: docs/features/collections.md ../../features/collections.md خلاصه اپراتور برای هر سایت جدول تعریف می‌کند دوره‌ها، کلاس‌ها، اخبار، پروژه‌ها… و مالک آیتم‌ها را اضافه می‌کند. آیتم‌ها در صفحه‌ها با سکشن «List from a table» collection list و در صفحهٔ هر آیتم با «Item display» collection item نشان داده می‌شوند. تعریف جدول collectionInputSchema shared : slug ، name ، itemName fields : هر فیلد یک key ، برچسب و نوع دارد. ۱۵ نوع وجود دارد: text ، textarea ، number ، price ، date ، datetime ، boolean ، select ، multiselect ، image ، gallery ، link ، email ، phone ، reference اشاره به آیتمی از جدول دیگر با slug . text و textarea دوزبانه‌اند. detailPage : slug صفحهٔ قالبی که هر آیتم با آن نمایش داده می‌شود. imageField : فیلد عکس اصلی. commerce : فروش آیتم‌ها capacityField برای ظرفیت، deadlineField برای مهلت . requestType : فرم درخواست مرتبط. COLLECTION_PRESETS : جدول‌های آماده برای شروع سریع. داده‌های هر آیتم در collection_items.data jsonb و با کلید فیلدها ذخیره می‌شوند. آدرس‌های API آدرس کار محدودیت GET/POST /sites/:s/collections فهرست و ساخت جدول ساخت: در cell فقط اپراتور + site:write GET/PUT/DELETE /sites/:s/collections/:id یک جدول تغییر ساختار: همان GET/POST /sites/:s/collections/:id/items آیتم‌ها catalog:write برای نوشتن GET/PUT/DELETE /sites/:s/collections/:id/items/:itemId یک آیتم همان GET /sites/:s/collections/preview/:source پیش‌نمایش لیست در builder — GET /public/sites/:s/collections جدول‌ها برای بازدیدکننده — GET /public/sites/:s/collections/:table/items لیست با فیلتر، مرتب‌سازی، صفحه‌بندی، جست‌وجو — GET …/:table/range ، …/:table/days کمترین و بیشترین مقدار برای slider و روزهای دارای آیتم برای تقویم — GET …/:table/items/:slug یک آیتم — فیلتر و مرتب‌سازی در SQL انجام می‌شود collections.service.ts ، نه در مرورگر. ظرفیت و مهلت هم روی سرور بررسی می‌شوند. لیست و باکس سکشن collection list این‌ها را دارد: منبع یک جدول یا products ، فیلترهای ثابت، فیلترهای بازدیدکننده، مرتب‌سازی، شبکه یا لیست، تعداد ستون برای هر دستگاه، صفحه‌بندی و جست‌وجو. فیلترهای بازدیدکننده بسته به نوع فیلد: جست‌وجو، chip، select، checkbox، slider، بازه، presetها، تقویم درون صفحه یا در پنجره ، بازهٔ تاریخ، و «فقط موجودها». فیلترها کنار هم یا زیر هم نمایش داده می‌شوند. باکس هر آیتم با طراح باکس CardDesigner.tsx ساخته و با CardView.tsx رندر می‌شود. گزینه‌ها: اندازه و برش عکس، چند عکس شبکه، اسلایدر، ردیف ، جهت و چینش، و دکمه‌ها مشاهده، سبد، درخواست، لینک، تماس . طرح‌های مشترک در settings.cardDesigns ذخیره می‌شوند مثلاً box products ، box \u003ctable . هر لیست می‌تواند card اختصاصی هم داشته باشد. صفحهٔ آیتم مسیر /:collection/:item features/collections/CollectionItemPage.tsx صفحهٔ detailPage جدول را رندر می‌کند: هر {{field}} در هر متنی از سکشن‌ها با مقدار آیتم جایگزین می‌شود useItemTokens در SectionRenderer.tsx . سکشن collection item خود آیتم را نشان می‌دهد. لیست‌های مرتبط می‌توانند با valueFrom: 'current' بر اساس آیتم جاری فیلتر شوند. فروش و درخواست آیتم با commerce به سبد خرید اضافه می‌شود order_items.collection_item_id و ظرفیت و مهلت روی سرور کنترل می‌شوند. دکمهٔ «درخواست» فرم را با ?item=\u003ctable /\u003cslug باز می‌کند و آیتم در leads.item_ref ثبت می‌شود. در تحویل design update تعریف جدول‌ها را جایگزین می‌کند و آیتم‌های مشتری را نگه می‌دارد. جدولی که برای مشتری تازه است، آیتم‌های استودیو را هم می‌گیرد. اگر بخواهید… نوع فیلد جدید اضافه کنید: 1. آن را به FIELD_TYPES اضافه کنید و اعتبارسنجی مقدارش را در shared بنویسید، 2. ویرایشگرش را در admin/collections/ItemsPage.tsx بسازید، 3. نمایشش را در CardView.tsx بنویسید، 4. اگر قابل فیلتر است، SQL فیلترش را در collections.service.ts اضافه کنید، 5. سازندهٔ مقدار نمونه را در platform/setup/demo.ts fieldValue اضافه کنید. npm run typecheck جاهایی را که روی همهٔ نوع‌ها switch دارند نشانتان می‌دهد. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"تعریف-جدول","text":"تعریف جدول"},{"level":2,"id":"آدرسهای-api","text":"آدرس‌های API"},{"level":2,"id":"لیست-و-باکس","text":"لیست و باکس"},{"level":2,"id":"صفحه-آیتم","text":"صفحهٔ آیتم"},{"level":2,"id":"فروش-و-درخواست","text":"فروش و درخواست"},{"level":2,"id":"در-تحویل","text":"در تحویل"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"04-features/delivery.md","title":"تحویل به مشتری","html":"\u003ch1 id=\"تحویل-به-مشتری\">تحویل به مشتری\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · فایل‌ها: \u003ccode>deploy/control/server.mjs\u003c/code>، \u003ccode>deploy/export/\u003c/code>، \u003ccode>deploy/cell/api-start.sh\u003c/code>، \u003ccode>apps/api/src/cell-bootstrap.ts\u003c/code> · خلاصهٔ انگلیسی: \u003ca href=\"../features/studio-and-delivery.md\">\u003ccode>docs/features/studio-and-delivery.md\u003c/code>\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>سرویس deploy (http://admin.localhost/deploy/) برای هر سایت یک فایل \u003ccode>exports/&lt;name&gt;.tar.gz\u003c/code> می‌سازد. در هر لحظه فقط یک کار اجرا می‌شود و قبل از بازنویسی بسته‌ای که وجود دارد سؤال می‌پرسد. فقط اپراتور وارد این صفحه می‌شود (با همان session استودیو).\u003c/p>\n\u003ch2 id=\"بسته-install\">بستهٔ install\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart TB\n  A[&quot;build API&lt;br/&gt;docker build --target api-runtime&quot;] --&gt; B[&quot;build site&lt;br/&gt;--target web-static، VITE_SITE_ID=slug&quot;]\n  B --&gt; C[&quot;save API image → images/api.tar.gz&quot;]\n  C --&gt; D[&quot;prerender سایت با دادهٔ استودیو&quot;]\n  D --&gt; E[&quot;فایل‌های سایت از /data/uploads&quot;]\n  E --&gt; F[&quot;Postgres موقت + migrate + cell-bootstrap&lt;br/&gt;با کلیدها و حساب‌های تازه&quot;]\n  F --&gt; G[&quot;pg_dump دادهٔ سایت از استودیو → DB تازه&lt;br/&gt;fix-sequences.sql&quot;]\n  G --&gt; H[&quot;پاک کردن sessionها و کدهای مشتری&quot;]\n  H --&gt; I{همراه دادهٔ نمونه؟}\n  I -- خیر --&gt; J[&quot;drop-demo.sql&quot;]\n  I -- بله --&gt; K\n  J --&gt; K[&quot;pg_dumpall → data/db.sql&quot;]\n  K --&gt; L[&quot;کپی install.*، backup.*، restore*، Caddyfile، README&quot;]\n  L --&gt; M[&quot;tar.gz در exports/&quot;]\u003c/pre>\n\u003cp>نکته‌ها:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>بدون کد منبع:\u003c/strong> فقط build minifyشدهٔ API و فایل‌های ایستای سایت در بسته قرار می‌گیرند.\u003c/li>\u003cli>\u003cstrong>کلیدهای تازه:\u003c/strong> دیتابیس سرور مشتری کلیدها و رمزهای خودش را دارد. اطلاعات ورود و تنظیمات هر سایت در volume \u003ccode>control-data\u003c/code> سرویس deploy نگه داشته می‌شود تا بستهٔ بعدی همان را استفاده کند.\u003c/li>\u003cli>\u003cstrong>حساب‌ها:\u003c/strong> \u003ccode>SITE_OPERATOR_*\u003c/code> و \u003ccode>SITE_OWNER_*\u003c/code> از \u003ccode>deploy/.env\u003c/code>. اگر خالی باشند، برای هر سایت ساخته می‌شوند.\u003c/li>\u003cli>\u003cstrong>sessionهای استودیو و کدهای یک‌بارمصرف\u003c/strong> هیچ‌وقت به سرور مشتری نمی‌روند.\u003c/li>\u003c/ul>\n\u003cp>روی سرور مشتری: \u003ccode>install.sh\u003c/code>، \u003ccode>install.ps1\u003c/code> یا \u003ccode>install.cmd\u003c/code>. این اسکریپت آدرس و پورت‌ها را نشان می‌دهد. راهنمای داخل بسته: \u003ccode>deploy/export/README.md\u003c/code>.\u003c/p>\n\u003ch2 id=\"بسته-design-update\">بستهٔ design update\u003c/h2>\n\u003cp>فقط \u003cstrong>طراحی\u003c/strong> را می‌برد:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>جایگزین می‌شود\u003c/th>\u003cth>دست نمی‌خورد (مال مشتری)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>pages\u003c/code>، \u003ccode>page_versions\u003c/code>\u003c/td>\u003ctd>محصولات، خدمات، دسته‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تعریف \u003ccode>collections\u003c/code> (جدول‌هایی که در استودیو نیستند حذف می‌شوند)\u003c/td>\u003ctd>آیتم‌های جدول‌ها (جدول تازه آیتم‌های استودیو را می‌گیرد)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>assets\u003c/code> جدید (\u003ccode>ON CONFLICT DO NOTHING\u003c/code>)\u003c/td>\u003ctd>سفارش‌ها، درخواست‌ها، مشتریان، پرداخت‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تنظیمات طراحی در \u003ccode>site_settings\u003c/code>\u003c/td>\u003ctd>نام، شعار، لوگو، تماس، \u003ccode>notifications\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>image جدید API (migrationها خودکار اجرا می‌شوند)\u003c/td>\u003ctd>حساب‌ها\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>روی سرور مشتری: \u003ccode>update.sh\u003c/code>، \u003ccode>update.ps1\u003c/code> یا \u003ccode>update.cmd\u003c/code> (\u003ccode>deploy/export/UPDATE.md\u003c/code>). اگر مشتری متن یا عکس صفحه‌ها را عوض کرده باشد، با نسخهٔ استودیو \u003cstrong>جایگزین\u003c/strong> می‌شود.\u003c/p>\n\u003ch2 id=\"سرور-مشتری-در-اجرا\">سرور مشتری در اجرا\u003c/h2>\n\u003cp>→ \u003ca href=\"#02-architecture/builds.md\">ساخت و حالت‌های اجرا\u003c/a>\u003c/p>\n\u003cul>\u003cli>backup مشتری: \u003ccode>backup.sh\u003c/code> یا \u003ccode>backup.ps1\u003c/code>. بازگردانی: \u003ccode>restore.sh\u003c/code> / \u003ccode>restore-db.sh\u003c/code>.\u003c/li>\u003cli>اپراتور با SSO وارد پنل مشتری می‌شود (\u003ccode>CELL_SSO_SECRET\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>چیز جدیدی را جزء «طراحی» کنید (یعنی با design update برود): آن را به بخش design update در \u003ccode>server.mjs\u003c/code> اضافه کنید و مطمئن شوید دادهٔ مشتری را بازنویسی نمی‌کند. بعد این جدول را به‌روز کنید.\u003c/li>\u003cli>جدول جدیدی در دیتابیس سایت ساختید: تصمیم بگیرید دادهٔ نمونه دارد یا نه. اگر دارد، ستون \u003ccode>demo\u003c/code> بدهید و آن را به \u003ccode>deploy/export/drop-demo.sql\u003c/code> اضافه کنید.\u003c/li>\u003c/ul>\n\u003ch2 id=\"اشتباههای-رایج\">اشتباه‌های رایج\u003c/h2>\n\u003cul>\u003cli>⚠️ build بسته به Docker و registry npm نیاز دارد؛ اگر شکست خورد، \u003ccode>NPM_REGISTRY\u003c/code> را بررسی کنید.\u003c/li>\u003cli>⚠️ لاگ هر کار در صفحهٔ deploy نمایش داده می‌شود. قدمی که شکست خورده آنجا مشخص است.\u003c/li>\u003c/ul>","text":" تحویل به مشتری فصل ۴ — قابلیت‌ها · فایل‌ها: deploy/control/server.mjs ، deploy/export/ ، deploy/cell/api start.sh ، apps/api/src/cell bootstrap.ts · خلاصهٔ انگلیسی: docs/features/studio and delivery.md ../../features/studio and delivery.md خلاصه سرویس deploy http://admin.localhost/deploy/ برای هر سایت یک فایل exports/\u003cname .tar.gz می‌سازد. در هر لحظه فقط یک کار اجرا می‌شود و قبل از بازنویسی بسته‌ای که وجود دارد سؤال می‌پرسد. فقط اپراتور وارد این صفحه می‌شود با همان session استودیو . بستهٔ install نکته‌ها: بدون کد منبع: فقط build minifyشدهٔ API و فایل‌های ایستای سایت در بسته قرار می‌گیرند. کلیدهای تازه: دیتابیس سرور مشتری کلیدها و رمزهای خودش را دارد. اطلاعات ورود و تنظیمات هر سایت در volume control data سرویس deploy نگه داشته می‌شود تا بستهٔ بعدی همان را استفاده کند. حساب‌ها: SITE_OPERATOR_ و SITE_OWNER_ از deploy/.env . اگر خالی باشند، برای هر سایت ساخته می‌شوند. sessionهای استودیو و کدهای یک‌بارمصرف هیچ‌وقت به سرور مشتری نمی‌روند. روی سرور مشتری: install.sh ، install.ps1 یا install.cmd . این اسکریپت آدرس و پورت‌ها را نشان می‌دهد. راهنمای داخل بسته: deploy/export/README.md . بستهٔ design update فقط طراحی را می‌برد: جایگزین می‌شود دست نمی‌خورد مال مشتری pages ، page_versions محصولات، خدمات، دسته‌ها تعریف collections جدول‌هایی که در استودیو نیستند حذف می‌شوند آیتم‌های جدول‌ها جدول تازه آیتم‌های استودیو را می‌گیرد assets جدید ON CONFLICT DO NOTHING سفارش‌ها، درخواست‌ها، مشتریان، پرداخت‌ها تنظیمات طراحی در site_settings نام، شعار، لوگو، تماس، notifications image جدید API migrationها خودکار اجرا می‌شوند حساب‌ها روی سرور مشتری: update.sh ، update.ps1 یا update.cmd deploy/export/UPDATE.md . اگر مشتری متن یا عکس صفحه‌ها را عوض کرده باشد، با نسخهٔ استودیو جایگزین می‌شود. سرور مشتری در اجرا → ساخت و حالت‌های اجرا ../02 architecture/builds.md backup مشتری: backup.sh یا backup.ps1 . بازگردانی: restore.sh / restore db.sh . اپراتور با SSO وارد پنل مشتری می‌شود CELL_SSO_SECRET . اگر بخواهید… چیز جدیدی را جزء «طراحی» کنید یعنی با design update برود : آن را به بخش design update در server.mjs اضافه کنید و مطمئن شوید دادهٔ مشتری را بازنویسی نمی‌کند. بعد این جدول را به‌روز کنید. جدول جدیدی در دیتابیس سایت ساختید: تصمیم بگیرید دادهٔ نمونه دارد یا نه. اگر دارد، ستون demo بدهید و آن را به deploy/export/drop demo.sql اضافه کنید. اشتباه‌های رایج ⚠️ build بسته به Docker و registry npm نیاز دارد؛ اگر شکست خورد، NPM_REGISTRY را بررسی کنید. ⚠️ لاگ هر کار در صفحهٔ deploy نمایش داده می‌شود. قدمی که شکست خورده آنجا مشخص است. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"بسته-install","text":"بستهٔ install"},{"level":2,"id":"بسته-design-update","text":"بستهٔ design update"},{"level":2,"id":"سرور-مشتری-در-اجرا","text":"سرور مشتری در اجرا"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"},{"level":2,"id":"اشتباههای-رایج","text":"اشتباه‌های رایج"}]},{"path":"04-features/pages-and-sections.md","title":"صفحات و سکشن‌ها","html":"\u003ch1 id=\"صفحات-و-سکشنها\">صفحات و سکشن‌ها\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · API: \u003ccode>modules/pages/pages.routes.ts\u003c/code>، \u003ccode>modules/public/public.routes.ts\u003c/code> · shared: \u003ccode>schemas.ts\u003c/code> (\u003ccode>pageDocumentSchema\u003c/code>)، \u003ccode>sections.ts\u003c/code> · وب: \u003ccode>admin/builder/\u003c/code>، \u003ccode>sections/\u003c/code>، \u003ccode>features/public-site/pages/SitePage.tsx\u003c/code> · جدول‌ها: \u003ccode>pages\u003c/code>، \u003ccode>page_versions\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>هر صفحه یک \u003cstrong>سند JSON\u003c/strong> است: فهرستی مرتب از سکشن‌ها. هر صفحه دو نسخه دارد:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>draft\u003c/strong> (پیش‌نویس) که builder مدام ذخیره‌اش می‌کند،\u003c/li>\u003cli>\u003cstrong>published\u003c/strong> که بازدیدکننده می‌بیند.\u003c/li>\u003c/ul>\n\u003cp>با هر انتشار یک \u003cstrong>نسخه\u003c/strong> در \u003ccode>page_versions\u003c/code> ثبت می‌شود و می‌شود آن را بعداً به draft برگرداند.\u003c/p>\n\u003ch2 id=\"جریان-داده\">جریان داده\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  B[builder] -- &quot;PATCH /pages/:id {document}&quot; --&gt; D[(pages.draft)]\n  B -- &quot;POST /pages/:id/publish&quot; --&gt; P[(pages.published&lt;br/&gt;+ page_versions)]\n  P -- &quot;GET /public/sites/:s/pages/:slug&quot; --&gt; S[سایت: SitePage → PageSections]\n  V[(page_versions)] -- &quot;POST /pages/:id/versions/:v/restore&quot; --&gt; D\u003c/pre>\n\u003ch2 id=\"آدرسهای-api\">آدرس‌های API\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس (\u003ccode>/api/v1/sites/:siteId/pages…\u003c/code>)\u003c/th>\u003cth>کار\u003c/th>\u003cth>محدودیت\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>GET /\u003c/code>\u003c/td>\u003ctd>فهرست صفحه‌ها با وضعیت انتشار\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /\u003c/code>\u003c/td>\u003ctd>صفحهٔ جدید (به‌صورت draft)\u003c/td>\u003ctd>\u003ccode>pages:write\u003c/code>، در cell فقط اپراتور\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PUT /order\u003c/code>\u003c/td>\u003ctd>ترتیب صفحه‌ها\u003c/td>\u003ctd>همان\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PATCH /:id\u003c/code>\u003c/td>\u003ctd>عنوان، slug، SEO، سند، صفحهٔ اصلی\u003c/td>\u003ctd>\u003ccode>pages:write\u003c/code>؛ مشتری در cell فقط سند، و فقط متن و تصویر\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /:id/publish\u003c/code>\u003c/td>\u003ctd>انتشار draft\u003c/td>\u003ctd>\u003ccode>pages:write\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /:id/unpublish\u003c/code>\u003c/td>\u003ctd>پنهان کردن از بازدیدکننده\u003c/td>\u003ctd>در cell فقط اپراتور\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /:id/versions\u003c/code>\u003c/td>\u003ctd>نسخه‌های منتشرشده\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /:id/versions/:version/restore\u003c/code>\u003c/td>\u003ctd>کپی یک نسخه به draft\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DELETE /:id\u003c/code>\u003c/td>\u003ctd>حذف (به‌جز صفحهٔ اصلی)\u003c/td>\u003ctd>در cell فقط اپراتور\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>عمومی: \u003ccode>GET /api/v1/public/sites/:slug/pages\u003c/code> (فهرست منتشرشده‌ها برای منو و sitemap) و \u003ccode>GET …/pages/:slug\u003c/code> (سند منتشرشده).\u003c/p>\n\u003ch2 id=\"قواعد\">قواعد\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>یک صفحهٔ اصلی:\u003c/strong> index یکتای \u003ccode>pages_single_home\u003c/code> تضمین می‌کند فقط یک \u003ccode>is_home\u003c/code> وجود داشته باشد. \u003ccode>isHome: false\u003c/code> رد می‌شود؛ باید صفحهٔ دیگری را اصلی کنید.\u003c/li>\u003cli>\u003cstrong>slug:\u003c/strong> حروف کوچک انگلیسی، عدد و خط تیره (\u003ccode>CHECK\u003c/code> در جدول).\u003c/li>\u003cli>\u003cstrong>انتشار\u003c/strong> draft را در \u003ccode>published\u003c/code> کپی می‌کند، \u003ccode>published_version\u003c/code> را یکی بالا می‌برد، نسخه را ثبت می‌کند و رویداد audit \u003ccode>page.published\u003c/code> می‌نویسد. همهٔ این‌ها در یک تراکنش انجام می‌شوند.\u003c/li>\u003cli>\u003cstrong>\u003ccode>hasUnpublishedChanges\u003c/code>\u003c/strong> در پاسخ می‌گوید draft با published فرق دارد یا نه.\u003c/li>\u003c/ul>\n\u003ch2 id=\"سکشنها-سه-جای-تعریف\">سکشن‌ها: سه جای تعریف\u003c/h2>\n\u003cp>هر نوع سکشن در سه جا تعریف می‌شود. نام \u003ccode>type\u003c/code> در هر سه یکی است:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>کجا\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>shared \u003ccode>sections.ts\u003c/code> → \u003ccode>sectionDefinitions\u003c/code>\u003c/td>\u003ctd>schema کامل props و پیش‌فرض‌ها؛ API و وب هر دو با آن اعتبارسنجی می‌کنند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>وب \u003ccode>sections/renderers.tsx\u003c/code> → \u003ccode>sectionRenderers\u003c/code>\u003c/td>\u003ctd>کامپوننتی که سکشن را نمایش می‌دهد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>وب \u003ccode>admin/builder/fields.ts\u003c/code> → \u003ccode>sectionMeta\u003c/code>\u003c/td>\u003ctd>نام، توضیح و فیلدهای ویرایشگر در builder\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>TypeScript هر سه را به \u003ccode>SectionType\u003c/code> گره زده است. اگر نوعی در shared اضافه کنید و renderer یا meta آن را ننویسید، \u003ccode>npm run typecheck\u003c/code> خطا می‌دهد. → \u003ca href=\"#05-recipes/new-section.md\">دستورالعمل: نوع سکشن جدید\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>ظاهر (appearance)\u003c/strong> برای همهٔ سکشن‌ها مشترک است (\u003ccode>appearanceSchema\u003c/code>: فاصله، پس‌زمینه…) و \u003ccode>SectionLook\u003c/code> آن را اعمال می‌کند.\u003c/p>\n\u003ch2 id=\"منو-و-لینکها\">منو و لینک‌ها\u003c/h2>\n\u003cp>منوی سایت از صفحه‌ها ساخته نمی‌شود؛ در \u003ccode>settings.nav\u003c/code> و \u003ccode>settings.header\u003c/code> / \u003ccode>settings.footer\u003c/code> ذخیره می‌شود. انتخاب لینک در پنل از \u003ccode>admin/links.tsx\u003c/code> (\u003ccode>useLinkGroups\u003c/code>) می‌آید: صفحه‌ها، صفحه‌های داخلی، جدول‌ها و آیتم‌ها. اگر slug صفحه‌ای را عوض کنید، لینک‌های منو خودکار عوض نمی‌شوند. (اعمال starter slugها را همه‌جا عوض می‌کند، ولی تغییر دستی slug این کار را نمی‌کند.)\u003c/p>\n\u003ch2 id=\"قفل-مشتری\">قفل مشتری\u003c/h2>\n\u003cp>در cell، \u003ccode>PATCH\u003c/code> فقط \u003ccode>document\u003c/code> را از مشتری می‌پذیرد و \u003ccode>contentOnlyChange(draftقبلی, سندجدید)\u003c/code> باید \u003ccode>null\u003c/code> برگرداند. یعنی تعداد، ترتیب، نوع و پنهان بودن سکشن‌ها و کلیدهای ساختاری نباید عوض شوند و فقط متن و تصویر تغییر کند. → \u003ca href=\"#02-architecture/auth.md::قفل-مشتری-در-cell-clientlocked\">احراز هویت و نقش‌ها\u003c/a>\u003c/p>\n\u003ch2 id=\"تست\">تست\u003c/h2>\n\u003cp>\u003ccode>apps/api/test/content.test.ts\u003c/code>: draft در برابر published، نسخه‌ها، بازگردانی، قفل مشتری.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>صفحه‌های فروشگاه و حساب را قابل ویرایش کنید → \u003ca href=\"#04-features/system-pages.md\">صفحات داخلی\u003c/a>\u003c/li>\u003cli>از یک صفحهٔ آماده شروع کنید → \u003ca href=\"#04-features/starters.md\">starterها\u003c/a>\u003c/li>\u003c/ul>","text":" صفحات و سکشن‌ها فصل ۴ — قابلیت‌ها · API: modules/pages/pages.routes.ts ، modules/public/public.routes.ts · shared: schemas.ts pageDocumentSchema ، sections.ts · وب: admin/builder/ ، sections/ ، features/public site/pages/SitePage.tsx · جدول‌ها: pages ، page_versions خلاصه هر صفحه یک سند JSON است: فهرستی مرتب از سکشن‌ها. هر صفحه دو نسخه دارد: draft پیش‌نویس که builder مدام ذخیره‌اش می‌کند، published که بازدیدکننده می‌بیند. با هر انتشار یک نسخه در page_versions ثبت می‌شود و می‌شود آن را بعداً به draft برگرداند. جریان داده آدرس‌های API آدرس /api/v1/sites/:siteId/pages… کار محدودیت GET / فهرست صفحه‌ها با وضعیت انتشار — POST / صفحهٔ جدید به‌صورت draft pages:write ، در cell فقط اپراتور PUT /order ترتیب صفحه‌ها همان PATCH /:id عنوان، slug، SEO، سند، صفحهٔ اصلی pages:write ؛ مشتری در cell فقط سند، و فقط متن و تصویر POST /:id/publish انتشار draft pages:write POST /:id/unpublish پنهان کردن از بازدیدکننده در cell فقط اپراتور GET /:id/versions نسخه‌های منتشرشده — POST /:id/versions/:version/restore کپی یک نسخه به draft — DELETE /:id حذف به‌جز صفحهٔ اصلی در cell فقط اپراتور عمومی: GET /api/v1/public/sites/:slug/pages فهرست منتشرشده‌ها برای منو و sitemap و GET …/pages/:slug سند منتشرشده . قواعد یک صفحهٔ اصلی: index یکتای pages_single_home تضمین می‌کند فقط یک is_home وجود داشته باشد. isHome: false رد می‌شود؛ باید صفحهٔ دیگری را اصلی کنید. slug: حروف کوچک انگلیسی، عدد و خط تیره CHECK در جدول . انتشار draft را در published کپی می‌کند، published_version را یکی بالا می‌برد، نسخه را ثبت می‌کند و رویداد audit page.published می‌نویسد. همهٔ این‌ها در یک تراکنش انجام می‌شوند. hasUnpublishedChanges در پاسخ می‌گوید draft با published فرق دارد یا نه. سکشن‌ها: سه جای تعریف هر نوع سکشن در سه جا تعریف می‌شود. نام type در هر سه یکی است: کجا چه چیزی shared sections.ts → sectionDefinitions schema کامل props و پیش‌فرض‌ها؛ API و وب هر دو با آن اعتبارسنجی می‌کنند وب sections/renderers.tsx → sectionRenderers کامپوننتی که سکشن را نمایش می‌دهد وب admin/builder/fields.ts → sectionMeta نام، توضیح و فیلدهای ویرایشگر در builder TypeScript هر سه را به SectionType گره زده است. اگر نوعی در shared اضافه کنید و renderer یا meta آن را ننویسید، npm run typecheck خطا می‌دهد. → دستورالعمل: نوع سکشن جدید ../05 recipes/new section.md ظاهر appearance برای همهٔ سکشن‌ها مشترک است appearanceSchema : فاصله، پس‌زمینه… و SectionLook آن را اعمال می‌کند. منو و لینک‌ها منوی سایت از صفحه‌ها ساخته نمی‌شود؛ در settings.nav و settings.header / settings.footer ذخیره می‌شود. انتخاب لینک در پنل از admin/links.tsx useLinkGroups می‌آید: صفحه‌ها، صفحه‌های داخلی، جدول‌ها و آیتم‌ها. اگر slug صفحه‌ای را عوض کنید، لینک‌های منو خودکار عوض نمی‌شوند. اعمال starter slugها را همه‌جا عوض می‌کند، ولی تغییر دستی slug این کار را نمی‌کند. قفل مشتری در cell، PATCH فقط document را از مشتری می‌پذیرد و contentOnlyChange draftقبلی, سندجدید باید null برگرداند. یعنی تعداد، ترتیب، نوع و پنهان بودن سکشن‌ها و کلیدهای ساختاری نباید عوض شوند و فقط متن و تصویر تغییر کند. → احراز هویت و نقش‌ها ../02 architecture/auth.md قفل مشتری در cell clientlocked تست apps/api/test/content.test.ts : draft در برابر published، نسخه‌ها، بازگردانی، قفل مشتری. اگر بخواهید… صفحه‌های فروشگاه و حساب را قابل ویرایش کنید → صفحات داخلی system pages.md از یک صفحهٔ آماده شروع کنید → starterها starters.md ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"جریان-داده","text":"جریان داده"},{"level":2,"id":"آدرسهای-api","text":"آدرس‌های API"},{"level":2,"id":"قواعد","text":"قواعد"},{"level":2,"id":"سکشنها-سه-جای-تعریف","text":"سکشن‌ها: سه جای تعریف"},{"level":2,"id":"منو-و-لینکها","text":"منو و لینک‌ها"},{"level":2,"id":"قفل-مشتری","text":"قفل مشتری"},{"level":2,"id":"تست","text":"تست"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"04-features/requests.md","title":"فرم‌ها، workflow، حساب مشتری و پیگیری","html":"\u003ch1 id=\"فرمها-workflow-حساب-مشتری-و-پیگیری\">فرم‌ها، workflow، حساب مشتری و پیگیری\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · shared: \u003ccode>interactions.ts\u003c/code>، \u003ccode>forms.ts\u003c/code>، \u003ccode>siteOptions.ts\u003c/code> (\u003ccode>formFieldSchema\u003c/code>) · API: \u003ccode>modules/interactions/\u003c/code>، \u003ccode>modules/leads/\u003c/code>، \u003ccode>modules/customers/\u003c/code> · وب: \u003ccode>admin/interactions/\u003c/code>، \u003ccode>admin/pages/InboxPages.tsx\u003c/code>، \u003ccode>features/leads/\u003c/code>، \u003ccode>features/account/\u003c/code> · جدول‌ها: \u003ccode>leads\u003c/code>، \u003ccode>case_events\u003c/code>، \u003ccode>request_files\u003c/code>، \u003ccode>customers\u003c/code> (migrationهای 007 و 008) · خلاصهٔ انگلیسی: \u003ca href=\"../features/interactions.md\">\u003ccode>docs/features/interactions.md\u003c/code>\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>هر \u003cstrong>نوع درخواست\u003c/strong> (مشاوره، رزرو، دمو…) در \u003ccode>settings.requestTypes\u003c/code> تعریف می‌شود و سه بخش دارد:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>فرم\u003c/strong>: سؤال‌ها،\u003c/li>\u003cli>\u003cstrong>workflow\u003c/strong>: مراحلی که درخواست طی می‌کند،\u003c/li>\u003cli>\u003cstrong>دسترسی و اعلان‌ها\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>هر درخواست ارسال‌شده یک ردیف در \u003ccode>leads\u003c/code> می‌شود، با کد پیگیری \u003ccode>R&lt;number&gt;\u003c/code>، یک خط زمانی (\u003ccode>case_events\u003c/code>) و در صورت نیاز پرداخت (\u003ccode>payments.lead_id\u003c/code>).\u003c/p>\n\u003cpre class=\"mermaid\">sequenceDiagram\n  participant V as بازدیدکننده\n  participant W as وب (CustomRequestForm)\n  participant A as API\n  participant S as کارمند (Inbox)\n  V-&gt;&gt;W: پر کردن فرم (+ آپلود فایل)\n  W-&gt;&gt;A: POST /public/sites/:s/uploads (فایل‌ها، خصوصی)\n  W-&gt;&gt;A: POST /public/sites/:s/leads\n  A-&gt;&gt;A: createRequest: اعتبارسنجی با فیلدها، computeTotal، اولین مرحله\n  A--&gt;&gt;V: کد R123 + اعلان SMS/ایمیل\n  S-&gt;&gt;A: PATCH stage / پیام / درخواست پرداخت (/sites/:s/leads/:id/…)\n  A--&gt;&gt;V: اعلان مرحلهٔ جدید\n  V-&gt;&gt;A: GET /public/sites/:s/requests/:number (پیگیری) / pay / messages / cancel\u003c/pre>\n\u003ch2 id=\"فرم-نسخه-۲\">فرم (نسخهٔ ۲)\u003c/h2>\n\u003cp>هر سؤال یک \u003cstrong>فیلد\u003c/strong> است (\u003ccode>formFieldSchema\u003c/code>)، از جمله نام، تلفن و ایمیل. \u003ccode>role\u003c/code> مشخص می‌کند کدام فیلد برای پیگیری استفاده شود. ۱۴ نوع فیلد در \u003ccode>FORM_FIELD_TYPES\u003c/code> تعریف شده است، از جمله \u003ccode>date\u003c/code>، \u003ccode>time\u003c/code>، آپلود فایل، \u003ccode>heading\u003c/code> و \u003ccode>step\u003c/code> (فرم چندمرحله‌ای).\u003c/p>\n\u003cp>امکانات هر فیلد: حداقل و حداکثر، الگوهای آماده (\u003ccode>pattern\u003c/code>: کد ملی، کد پستی، شبا…)، placeholder، شرط نمایش، و عرض.\u003c/p>\n\u003cp>\u003cstrong>مبلغ:\u003c/strong> گزینه‌ها، تیک‌ها و عددها می‌توانند قیمت داشته باشند (قیمت × عدد). جمع آن‌ها با \u003ccode>computeTotal\u003c/code> (shared) حساب می‌شود و \u003cstrong>روی سرور دوباره حساب می‌شود\u003c/strong>؛ مبلغی که مرورگر می‌فرستد قبول نمی‌شود.\u003c/p>\n\u003cp>\u003ccode>layout\u003c/code>: ستون‌ها، متن دکمه و پیام تشکر، و نوار پیشرفت مراحل. لینک‌ها می‌توانند سؤال‌ها را از قبل پر کنند (\u003ccode>?&lt;key&gt;=value\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>نسخهٔ ۱\u003c/strong> (فقط در بسته‌های قدیمی مشتری) هنگام خواندن با \u003ccode>upgradeRequestType\u003c/code> (\u003ccode>forms.ts\u003c/code>) تبدیل می‌شود. سایت‌های جدید از اول نسخهٔ ۲ ذخیره می‌کنند (\u003ccode>defaultRequestTypes\u003c/code>). فرم‌های آمادهٔ setup: \u003ccode>SETUP_FORMS\u003c/code> / \u003ccode>setupRequestType\u003c/code> (\u003ccode>setup.ts\u003c/code>).\u003c/p>\n\u003ch2 id=\"workflow\">workflow\u003c/h2>\n\u003cul>\u003cli>مراحل با نوع \u003ccode>open\u003c/code>، \u003ccode>done\u003c/code> یا \u003ccode>cancelled\u003c/code>، و مرحله‌هایی که از هر مرحله می‌شود به آن‌ها رفت.\u003c/li>\u003cli>هر مرحله می‌تواند به مشتری نشان داده شود یا داخلی باشد.\u003c/li>\u003cli>اعلان SMS یا ایمیل با متن‌های \u003ccode>{{…}}\u003c/code> (\u003ccode>interactions/notify.ts\u003c/code>).\u003c/li>\u003cli>مشتری می‌تواند لغو کند یا پاسخ بدهد.\u003c/li>\u003cli>«درخواست پرداخت» و مرحلهٔ «پس از پرداخت».\u003c/li>\u003cli>دسترسی: همه، یا فقط کاربران واردشده.\u003c/li>\u003cli>۵ الگوی آماده: \u003ccode>WORKFLOW_PRESETS\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>workflowها و آدرس‌های کارکنان \u003cstrong>از تنظیمات عمومی حذف می‌شوند\u003c/strong> (بازدیدکننده آن‌ها را نمی‌بیند).\u003c/p>\n\u003ch2 id=\"api\">API\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>POST /public/sites/:s/leads\u003c/code>\u003c/td>\u003ctd>ارسال فرم\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /public/sites/:s/uploads\u003c/code>\u003c/td>\u003ctd>آپلود فایل فرم (خصوصی، \u003ccode>request_files\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /public/sites/:s/track\u003c/code>\u003c/td>\u003ctd>پیگیری با کد + تلفن یا ایمیل\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /public/sites/:s/requests/:number\u003c/code>\u003c/td>\u003ctd>مشاهدهٔ درخواست (با token امضاشده یا حساب مشتری)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST …/requests/:number/messages\u003c/code>، \u003ccode>…/cancel\u003c/code>، \u003ccode>…/pay\u003c/code>\u003c/td>\u003ctd>پیام، لغو، پرداخت\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /sites/:s/leads\u003c/code>\u003c/td>\u003ctd>صندوق کارکنان: فیلتر نوع، مرحله، وضعیت، خوانده‌نشده، پرداخت، جست‌وجو\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /sites/:s/leads/summary\u003c/code>، \u003ccode>/staff\u003c/code>\u003c/td>\u003ctd>شمارنده‌ها؛ افراد قابل ارجاع\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET /sites/:s/leads/:id\u003c/code>\u003c/td>\u003ctd>جزئیات با خط زمانی و پرداخت‌ها (باز کردن، آن را خوانده‌شده می‌کند)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تغییر مرحله، رویداد، درخواست پرداخت\u003c/td>\u003ctd>\u003ccode>changeStage\u003c/code>، \u003ccode>addStaffEvent\u003c/code>، \u003ccode>requestPayment\u003c/code> در \u003ccode>requests.service.ts\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>مجوزها: \u003ccode>leads:read\u003c/code> و \u003ccode>leads:write\u003c/code>، به‌علاوهٔ \u003ccode>requireModule('leads')\u003c/code>.\u003c/p>\n\u003ch2 id=\"سفارشها-هم-همین-خط-زمانی-را-دارند\">سفارش‌ها هم همین خط زمانی را دارند\u003c/h2>\n\u003cp>سفارش‌ها (\u003ccode>orders\u003c/code>) هم \u003ccode>case_events\u003c/code>، پیام دوطرفه و اعلان برای هر مرحله دارند (\u003ccode>shop.orderStatuses[].notify/message\u003c/code>). منطق آن‌ها در \u003ccode>orders/orders.service.ts\u003c/code> است (\u003ccode>changeOrderStage\u003c/code>، \u003ccode>addOrderEvent\u003c/code>، \u003ccode>orderCustomerView\u003c/code>). → \u003ca href=\"#04-features/shop-and-payments.md\">فروشگاه\u003c/a>\u003c/p>\n\u003ch2 id=\"حساب-مشتری-و-پیگیری\">حساب مشتری و پیگیری\u003c/h2>\n\u003cul>\u003cli>\u003ccode>settings.accounts\u003c/code> حساب‌ها را روشن می‌کند. ورود با کد یا رمز است. → \u003ca href=\"#02-architecture/auth.md::مشتریان-سایت\">احراز هویت\u003c/a>\u003c/li>\u003cli>\u003ccode>/account\u003c/code>: ورود و ثبت‌نام، بعد درخواست‌ها، سفارش‌ها و پروفایل (چیدمان با سکشن \u003ccode>system-page\u003c/code>).\u003c/li>\u003cli>\u003ccode>/track\u003c/code>: پیگیری با کد و تلفن یا ایمیل، بدون حساب.\u003c/li>\u003cli>\u003ccode>/track/&lt;code&gt;?t=&lt;token&gt;\u003c/code>: لینک امضاشده‌ای که در پیام‌ها برای مشتری فرستاده می‌شود.\u003c/li>\u003c/ul>\n\u003ch2 id=\"چه-کسی-چه-چیزی-را-عوض-میکند\">چه کسی چه چیزی را عوض می‌کند\u003c/h2>\n\u003cp>در cell، مشتری فقط \u003cstrong>نام\u003c/strong> نوع‌ها و مراحل و \u003cstrong>متن پیام‌ها\u003c/strong> را عوض می‌کند (\u003ccode>clientRequestTypes\u003c/code> در \u003ccode>site.routes.ts\u003c/code>). فرم و workflow مال اپراتور است. design update \u003ccode>notifications\u003c/code> مشتری را نگه می‌دارد.\u003c/p>\n\u003ch2 id=\"تست\">تست\u003c/h2>\n\u003cp>\u003ccode>apps/api/test/interactions.test.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>نوع فیلد فرم جدید اضافه کنید:\n\u003col>\u003cli>آن را به \u003ccode>FORM_FIELD_TYPES\u003c/code> و اعتبارسنجی پاسخ در shared اضافه کنید،\u003c/li>\u003cli>ویرایشگرش را در \u003ccode>admin/interactions/RequestTypesEditor.tsx\u003c/code> بسازید،\u003c/li>\u003cli>نمایشش را در \u003ccode>features/leads/CustomRequestForm.tsx\u003c/code> بنویسید،\u003c/li>\u003cli>اگر روی مبلغ اثر دارد، \u003ccode>computeTotal\u003c/code> را به‌روز کنید.\u003c/li>\u003c/ol>\u003c/li>\u003c/ul>","text":" فرم‌ها، workflow، حساب مشتری و پیگیری فصل ۴ — قابلیت‌ها · shared: interactions.ts ، forms.ts ، siteOptions.ts formFieldSchema · API: modules/interactions/ ، modules/leads/ ، modules/customers/ · وب: admin/interactions/ ، admin/pages/InboxPages.tsx ، features/leads/ ، features/account/ · جدول‌ها: leads ، case_events ، request_files ، customers migrationهای 007 و 008 · خلاصهٔ انگلیسی: docs/features/interactions.md ../../features/interactions.md خلاصه هر نوع درخواست مشاوره، رزرو، دمو… در settings.requestTypes تعریف می‌شود و سه بخش دارد: فرم : سؤال‌ها، workflow : مراحلی که درخواست طی می‌کند، دسترسی و اعلان‌ها . هر درخواست ارسال‌شده یک ردیف در leads می‌شود، با کد پیگیری R\u003cnumber ، یک خط زمانی case_events و در صورت نیاز پرداخت payments.lead_id . فرم نسخهٔ ۲ هر سؤال یک فیلد است formFieldSchema ، از جمله نام، تلفن و ایمیل. role مشخص می‌کند کدام فیلد برای پیگیری استفاده شود. ۱۴ نوع فیلد در FORM_FIELD_TYPES تعریف شده است، از جمله date ، time ، آپلود فایل، heading و step فرم چندمرحله‌ای . امکانات هر فیلد: حداقل و حداکثر، الگوهای آماده pattern : کد ملی، کد پستی، شبا… ، placeholder، شرط نمایش، و عرض. مبلغ: گزینه‌ها، تیک‌ها و عددها می‌توانند قیمت داشته باشند قیمت × عدد . جمع آن‌ها با computeTotal shared حساب می‌شود و روی سرور دوباره حساب می‌شود ؛ مبلغی که مرورگر می‌فرستد قبول نمی‌شود. layout : ستون‌ها، متن دکمه و پیام تشکر، و نوار پیشرفت مراحل. لینک‌ها می‌توانند سؤال‌ها را از قبل پر کنند ?\u003ckey =value . نسخهٔ ۱ فقط در بسته‌های قدیمی مشتری هنگام خواندن با upgradeRequestType forms.ts تبدیل می‌شود. سایت‌های جدید از اول نسخهٔ ۲ ذخیره می‌کنند defaultRequestTypes . فرم‌های آمادهٔ setup: SETUP_FORMS / setupRequestType setup.ts . workflow مراحل با نوع open ، done یا cancelled ، و مرحله‌هایی که از هر مرحله می‌شود به آن‌ها رفت. هر مرحله می‌تواند به مشتری نشان داده شود یا داخلی باشد. اعلان SMS یا ایمیل با متن‌های {{…}} interactions/notify.ts . مشتری می‌تواند لغو کند یا پاسخ بدهد. «درخواست پرداخت» و مرحلهٔ «پس از پرداخت». دسترسی: همه، یا فقط کاربران واردشده. ۵ الگوی آماده: WORKFLOW_PRESETS . workflowها و آدرس‌های کارکنان از تنظیمات عمومی حذف می‌شوند بازدیدکننده آن‌ها را نمی‌بیند . API آدرس کار POST /public/sites/:s/leads ارسال فرم POST /public/sites/:s/uploads آپلود فایل فرم خصوصی، request_files POST /public/sites/:s/track پیگیری با کد + تلفن یا ایمیل GET /public/sites/:s/requests/:number مشاهدهٔ درخواست با token امضاشده یا حساب مشتری POST …/requests/:number/messages ، …/cancel ، …/pay پیام، لغو، پرداخت GET /sites/:s/leads صندوق کارکنان: فیلتر نوع، مرحله، وضعیت، خوانده‌نشده، پرداخت، جست‌وجو GET /sites/:s/leads/summary ، /staff شمارنده‌ها؛ افراد قابل ارجاع GET /sites/:s/leads/:id جزئیات با خط زمانی و پرداخت‌ها باز کردن، آن را خوانده‌شده می‌کند تغییر مرحله، رویداد، درخواست پرداخت changeStage ، addStaffEvent ، requestPayment در requests.service.ts مجوزها: leads:read و leads:write ، به‌علاوهٔ requireModule 'leads' . سفارش‌ها هم همین خط زمانی را دارند سفارش‌ها orders هم case_events ، پیام دوطرفه و اعلان برای هر مرحله دارند shop.orderStatuses .notify/message . منطق آن‌ها در orders/orders.service.ts است changeOrderStage ، addOrderEvent ، orderCustomerView . → فروشگاه shop and payments.md حساب مشتری و پیگیری settings.accounts حساب‌ها را روشن می‌کند. ورود با کد یا رمز است. → احراز هویت ../02 architecture/auth.md مشتریان سایت /account : ورود و ثبت‌نام، بعد درخواست‌ها، سفارش‌ها و پروفایل چیدمان با سکشن system page . /track : پیگیری با کد و تلفن یا ایمیل، بدون حساب. /track/\u003ccode ?t=\u003ctoken : لینک امضاشده‌ای که در پیام‌ها برای مشتری فرستاده می‌شود. چه کسی چه چیزی را عوض می‌کند در cell، مشتری فقط نام نوع‌ها و مراحل و متن پیام‌ها را عوض می‌کند clientRequestTypes در site.routes.ts . فرم و workflow مال اپراتور است. design update notifications مشتری را نگه می‌دارد. تست apps/api/test/interactions.test.ts . اگر بخواهید… نوع فیلد فرم جدید اضافه کنید: 1. آن را به FORM_FIELD_TYPES و اعتبارسنجی پاسخ در shared اضافه کنید، 2. ویرایشگرش را در admin/interactions/RequestTypesEditor.tsx بسازید، 3. نمایشش را در features/leads/CustomRequestForm.tsx بنویسید، 4. اگر روی مبلغ اثر دارد، computeTotal را به‌روز کنید. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"فرم-نسخه-۲","text":"فرم (نسخهٔ ۲)"},{"level":2,"id":"workflow","text":"workflow"},{"level":2,"id":"api","text":"API"},{"level":2,"id":"سفارشها-هم-همین-خط-زمانی-را-دارند","text":"سفارش‌ها هم همین خط زمانی را دارند"},{"level":2,"id":"حساب-مشتری-و-پیگیری","text":"حساب مشتری و پیگیری"},{"level":2,"id":"چه-کسی-چه-چیزی-را-عوض-میکند","text":"چه کسی چه چیزی را عوض می‌کند"},{"level":2,"id":"تست","text":"تست"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"04-features/shop-and-payments.md","title":"فروشگاه و پرداخت","html":"\u003ch1 id=\"فروشگاه-و-پرداخت\">فروشگاه و پرداخت\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · API: \u003ccode>modules/catalog/catalog.ts\u003c/code>، \u003ccode>modules/orders/\u003c/code>، \u003ccode>modules/shop/\u003c/code>، \u003ccode>modules/payments/\u003c/code> · وب: \u003ccode>features/cart/\u003c/code>، \u003ccode>features/public-site/pages/ProductsPages.tsx\u003c/code>، \u003ccode>admin/pages/CatalogPages.tsx\u003c/code>، \u003ccode>admin/pages/PaymentsPages.tsx\u003c/code> · خلاصهٔ انگلیسی: \u003ca href=\"../features/shop.md\">\u003ccode>docs/features/shop.md\u003c/code>\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cul>\u003cli>محصولات و خدمات جدول‌های خودشان را دارند.\u003c/li>\u003cli>سبد خرید در مرورگر نگه داشته می‌شود. ساختن سفارش، بررسی موجودی، تخفیف و هزینهٔ ارسال روی سرور انجام می‌شود.\u003c/li>\u003cli>پرداخت از طریق \u003cstrong>درگاه‌ها\u003c/strong> انجام می‌شود. هر درگاه یک \u003cstrong>driver\u003c/strong> در کد دارد و برای هر سایت یک ردیف تنظیمات در \u003ccode>payment_gateways\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"سفارش-از-سبد-تا-پرداخت\">سفارش، از سبد تا پرداخت\u003c/h2>\n\u003cpre class=\"mermaid\">sequenceDiagram\n  participant B as خریدار\n  participant W as وب (CartPages)\n  participant A as API\n  participant G as درگاه\n  B-&gt;&gt;W: سبد (در مرورگر)\n  W-&gt;&gt;A: GET /public/sites/:s/payment-methods\n  W-&gt;&gt;A: POST /public/sites/:s/orders\n  A-&gt;&gt;A: createOrder: قیمت و موجودی از DB، کوپن، ارسال، سقف هر سفارش\n  W-&gt;&gt;A: POST /public/sites/:s/orders/:number/pay { gateway? }\n  A-&gt;&gt;G: request(amount، callbackUrl)\n  A--&gt;&gt;B: redirect به درگاه\n  G--&gt;&gt;A: /api/v1/payments/callback/:slug/:paymentId\n  A-&gt;&gt;G: verify (سرور به سرور)\n  A--&gt;&gt;B: redirect به /checkout/result\u003c/pre>\n\u003cul>\u003cli>\u003cstrong>قیمت از مرورگر قبول نمی‌شود.\u003c/strong> \u003ccode>createOrder\u003c/code> قیمت، variant و موجودی را از دیتابیس می‌خواند.\u003c/li>\u003cli>\u003cstrong>فقط \u003ccode>verify\u003c/code> پرداخت را موفق می‌کند.\u003c/strong> پاسخ درگاه روی آدرس بازگشت فقط «احتمالاً پرداخت شد» است.\u003c/li>\u003cli>خریدار سفارش را با یک token عمومی می‌بیند (\u003ccode>orders.public_token_hash\u003c/code>، \u003ccode>findOrderForBuyer\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch2 id=\"محصولات-و-خدمات\">محصولات و خدمات\u003c/h2>\n\u003cp>\u003ccode>products\u003c/code>: قیمت به واحد کوچک پول (\u003ccode>price_minor\u003c/code>)، درصد تخفیف، رنگ‌ها، variantها (سایز، مدل… با قیمت و موجودی خودشان)، سقف هر سفارش، موجودی، ویژه، دسته (\u003ccode>settings.productCategories\u003c/code> با slug)، جنس، ابعاد، زمان آماده‌سازی، عکس‌های بیشتر و ویژگی‌ها. \u003ccode>services\u003c/code>: صفحهٔ فهرست و صفحهٔ هر خدمت (داخلی یا به‌صورت صفحهٔ builder).\u003c/p>\n\u003cp>محصولات می‌توانند منبع سکشن «List from a table» هم باشند (\u003ccode>source: 'products'\u003c/code>، \u003ccode>listProductsAsItems\u003c/code>).\u003c/p>\n\u003ch2 id=\"قوانین-فروشگاه-settingsshop\">قوانین فروشگاه (\u003ccode>settings.shop\u003c/code>)\u003c/h2>\n\u003cul>\u003cli>فیلدهای پرداخت (\u003ccode>shop.checkout\u003c/code>، مثلاً آدرس اجباری)\u003c/li>\u003cli>روش‌های ارسال (\u003ccode>shop.shipping\u003c/code>: هزینه، و «رایگان بالای …»)\u003c/li>\u003cli>مراحل سفارش (\u003ccode>shop.orderStatuses\u003c/code>) با اعلان و پیام هر مرحله\u003c/li>\u003cli>کد تخفیف (\u003ccode>coupons\u003c/code>: درصدی یا مبلغی، حداقل خرید، تعداد استفاده، تاریخ)\u003c/li>\u003cli>پرداخت در محل (\u003ccode>payment_settings.allow_cod\u003c/code>)\u003c/li>\u003c/ul>\n\u003cp>نظرهای محصول (\u003ccode>product_reviews\u003c/code>) تا وقتی کارکنان تأییدشان نکنند نمایش داده نمی‌شوند. مشترکان خبرنامه در \u003ccode>subscribers\u003c/code> هستند و علاقه‌مندی‌ها در \u003ccode>features/wishlist/\u003c/code>.\u003c/p>\n\u003ch2 id=\"درگاههای-پرداخت\">درگاه‌های پرداخت\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart LR\n  D[drivers.ts&lt;br/&gt;PAYMENT_DRIVERS] --&gt; CAT[کاتالوگ استودیو&lt;br/&gt;app_settings.payment_catalog]\n  CAT --&gt; ROW[(payment_gateways&lt;br/&gt;هر سایت، هر درگاه)]\n  ROW --&gt; U[usableGateways]\n  U --&gt; CO[checkout: انتخاب درگاه]\n  D --&gt; GW[gateways.ts&lt;br/&gt;request / verify]\u003c/pre>\n\u003ch3 id=\"driver\">driver\u003c/h3>\n\u003cp>هر driver در \u003ccode>drivers.ts\u003c/code> این‌ها را دارد:\u003c/p>\n\u003cul>\u003cli>\u003ccode>key\u003c/code> و \u003ccode>name\u003c/code>،\u003c/li>\u003cli>\u003ccode>fields\u003c/code>: فیلدهای اطلاعات اتصال. فرم پنل از روی همین‌ها ساخته می‌شود و هر فیلد \u003ccode>pattern\u003c/code> اعتبارسنجی دارد.\u003c/li>\u003cli>\u003ccode>testMode\u003c/code>:\n\u003cul>\u003cli>\u003ccode>toggle\u003c/code>: کارکنان حالت تست را روشن می‌کنند،\u003c/li>\u003cli>\u003ccode>auto\u003c/code>: یک اطلاعات اتصال مخصوص تست آن را تستی می‌کند،\u003c/li>\u003cli>\u003ccode>always\u003c/code>: هیچ‌وقت پول جابه‌جا نمی‌شود.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003ccode>available(ctx)\u003c/code>: مثلاً \u003ccode>sandbox\u003c/code> در production در دسترس نیست.\u003c/li>\u003cli>\u003ccode>create(...)\u003c/code>: یک \u003ccode>PaymentGateway\u003c/code> از \u003ccode>gateways.ts\u003c/code> می‌سازد.\u003c/li>\u003cli>\u003ccode>readCallback(answer)\u003c/code>: پارامترهای بازگشت را به \u003ccode>{ authority, status: 'OK' | 'NOK' }\u003c/code> تبدیل می‌کند.\u003c/li>\u003c/ul>\n\u003cp>driverهای فعلی: \u003ccode>zarinpal\u003c/code>، \u003ccode>zibal\u003c/code>، \u003ccode>idpay\u003c/code> و \u003ccode>sandbox\u003c/code> (صفحهٔ آزمایشی محلی). کد درگاه‌ها از روی مستندات عمومی هر سرویس نوشته شده و فقط با HTTP شبیه‌سازی‌شده تست شده است. → \u003ca href=\"#05-recipes/new-payment-gateway.md\">دستورالعمل: درگاه جدید\u003c/a>\u003c/p>\n\u003ch3 id=\"سه-سطح-تنظیم\">سه سطح تنظیم\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>سطح\u003c/th>\u003cth>کجا\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>استودیو\u003c/td>\u003ctd>Platform ← Payment gateways (\u003ccode>catalog.ts\u003c/code>)\u003c/td>\u003ctd>اینکه سایت‌ها اصلاً می‌توانند این درگاه را بگیرند، پیش‌فرض برای سایت‌های جدید، نام و توضیح پیش‌فرض\u003c/td>\u003c/tr>\u003ctr>\u003ctd>اپراتور برای هر سایت\u003c/td>\u003ctd>\u003ccode>PUT …/payment-settings/gateways/:provider/access\u003c/code>\u003c/td>\u003ctd>\u003ccode>allowed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کارکنان سایت\u003c/td>\u003ctd>\u003ccode>PUT …/payment-settings/gateways/:provider\u003c/code>\u003c/td>\u003ctd>\u003ccode>enabled\u003c/code>، اطلاعات اتصال، حالت تست، نام و توضیح؛ و ترتیب (\u003ccode>PUT …/order\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>ردیف‌های غایب با پیش‌فرض‌های کاتالوگ ساخته می‌شوند (\u003ccode>ensureGatewayRows\u003c/code>). درگاهی که ممنوع شود، خاموش و از دید کارکنان سایت پنهان می‌شود. سرور مشتری کاتالوگ ندارد و فقط ردیف‌های سایت تعیین‌کننده‌اند.\u003c/p>\n\u003ch3 id=\"پرداخت-و-تراکنشها\">پرداخت و تراکنش‌ها\u003c/h3>\n\u003cul>\u003cli>\u003ccode>usableGateways\u003c/code>: درگاه‌هایی که مجاز، روشن، در دسترس روی این سرور و با اطلاعات اتصال معتبر هستند، به ترتیب سایت.\u003c/li>\u003cli>\u003ccode>pay\u003c/code> یک \u003ccode>gateway\u003c/code> اختیاری می‌گیرد؛ اگر نباشد، اولین درگاه استفاده می‌شود. هر پرداخت \u003ccode>provider\u003c/code> خودش را نگه می‌دارد، پس حتی اگر درگاه بعداً خاموش شود، verify می‌شود.\u003c/li>\u003cli>\u003cstrong>تراکنش‌ها\u003c/strong> (\u003ccode>GET /sites/:s/payments\u003c/code>، مجوز \u003ccode>payments:manage\u003c/code>): همهٔ تلاش‌ها با فیلتر.\u003c/li>\u003cli>\u003cstrong>«Check again»\u003c/strong> (\u003ccode>POST …/payments/:id/recheck\u003c/code>) از درگاه می‌پرسد: اگر پرداخت شده باشد ثبت می‌شود؛ اگر نه و بیش از ۳۰ دقیقه گذشته باشد، شکست‌خورده می‌شود.\u003c/li>\u003cli>\u003cstrong>«Test connection»\u003c/strong> (\u003ccode>POST …/gateways/:provider/test\u003c/code>) یک درخواست پرداخت کوچک می‌فرستد ولی خریدار هیچ‌وقت به درگاه نمی‌رود، پس پولی جابه‌جا نمی‌شود.\u003c/li>\u003cli>درخواست‌ها (leads) هم با همین مسیر پرداخت می‌شوند (\u003ccode>startRequestPayment\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch2 id=\"باز\">باز\u003c/h2>\n\u003cp>صفحهٔ پیگیری سفارش و درخواست مشتری هنوز با اولین درگاه پرداخت می‌کند و انتخاب درگاه ندارد (→ \u003ccode>docs/STATUS.md\u003c/code>).\u003c/p>\n\u003ch2 id=\"تست\">تست\u003c/h2>\n\u003cp>\u003ccode>apps/api/test/shop.test.ts\u003c/code>، \u003ccode>apps/api/test/payments.test.ts\u003c/code>.\u003c/p>","text":" فروشگاه و پرداخت فصل ۴ — قابلیت‌ها · API: modules/catalog/catalog.ts ، modules/orders/ ، modules/shop/ ، modules/payments/ · وب: features/cart/ ، features/public site/pages/ProductsPages.tsx ، admin/pages/CatalogPages.tsx ، admin/pages/PaymentsPages.tsx · خلاصهٔ انگلیسی: docs/features/shop.md ../../features/shop.md خلاصه محصولات و خدمات جدول‌های خودشان را دارند. سبد خرید در مرورگر نگه داشته می‌شود. ساختن سفارش، بررسی موجودی، تخفیف و هزینهٔ ارسال روی سرور انجام می‌شود. پرداخت از طریق درگاه‌ها انجام می‌شود. هر درگاه یک driver در کد دارد و برای هر سایت یک ردیف تنظیمات در payment_gateways . سفارش، از سبد تا پرداخت قیمت از مرورگر قبول نمی‌شود. createOrder قیمت، variant و موجودی را از دیتابیس می‌خواند. فقط verify پرداخت را موفق می‌کند. پاسخ درگاه روی آدرس بازگشت فقط «احتمالاً پرداخت شد» است. خریدار سفارش را با یک token عمومی می‌بیند orders.public_token_hash ، findOrderForBuyer . محصولات و خدمات products : قیمت به واحد کوچک پول price_minor ، درصد تخفیف، رنگ‌ها، variantها سایز، مدل… با قیمت و موجودی خودشان ، سقف هر سفارش، موجودی، ویژه، دسته settings.productCategories با slug ، جنس، ابعاد، زمان آماده‌سازی، عکس‌های بیشتر و ویژگی‌ها. services : صفحهٔ فهرست و صفحهٔ هر خدمت داخلی یا به‌صورت صفحهٔ builder . محصولات می‌توانند منبع سکشن «List from a table» هم باشند source: 'products' ، listProductsAsItems . قوانین فروشگاه settings.shop فیلدهای پرداخت shop.checkout ، مثلاً آدرس اجباری روش‌های ارسال shop.shipping : هزینه، و «رایگان بالای …» مراحل سفارش shop.orderStatuses با اعلان و پیام هر مرحله کد تخفیف coupons : درصدی یا مبلغی، حداقل خرید، تعداد استفاده، تاریخ پرداخت در محل payment_settings.allow_cod نظرهای محصول product_reviews تا وقتی کارکنان تأییدشان نکنند نمایش داده نمی‌شوند. مشترکان خبرنامه در subscribers هستند و علاقه‌مندی‌ها در features/wishlist/ . درگاه‌های پرداخت driver هر driver در drivers.ts این‌ها را دارد: key و name ، fields : فیلدهای اطلاعات اتصال. فرم پنل از روی همین‌ها ساخته می‌شود و هر فیلد pattern اعتبارسنجی دارد. testMode : toggle : کارکنان حالت تست را روشن می‌کنند، auto : یک اطلاعات اتصال مخصوص تست آن را تستی می‌کند، always : هیچ‌وقت پول جابه‌جا نمی‌شود. available ctx : مثلاً sandbox در production در دسترس نیست. create ... : یک PaymentGateway از gateways.ts می‌سازد. readCallback answer : پارامترهای بازگشت را به { authority, status: 'OK' 'NOK' } تبدیل می‌کند. driverهای فعلی: zarinpal ، zibal ، idpay و sandbox صفحهٔ آزمایشی محلی . کد درگاه‌ها از روی مستندات عمومی هر سرویس نوشته شده و فقط با HTTP شبیه‌سازی‌شده تست شده است. → دستورالعمل: درگاه جدید ../05 recipes/new payment gateway.md سه سطح تنظیم سطح کجا چه چیزی استودیو Platform ← Payment gateways catalog.ts اینکه سایت‌ها اصلاً می‌توانند این درگاه را بگیرند، پیش‌فرض برای سایت‌های جدید، نام و توضیح پیش‌فرض اپراتور برای هر سایت PUT …/payment settings/gateways/:provider/access allowed کارکنان سایت PUT …/payment settings/gateways/:provider enabled ، اطلاعات اتصال، حالت تست، نام و توضیح؛ و ترتیب PUT …/order ردیف‌های غایب با پیش‌فرض‌های کاتالوگ ساخته می‌شوند ensureGatewayRows . درگاهی که ممنوع شود، خاموش و از دید کارکنان سایت پنهان می‌شود. سرور مشتری کاتالوگ ندارد و فقط ردیف‌های سایت تعیین‌کننده‌اند. پرداخت و تراکنش‌ها usableGateways : درگاه‌هایی که مجاز، روشن، در دسترس روی این سرور و با اطلاعات اتصال معتبر هستند، به ترتیب سایت. pay یک gateway اختیاری می‌گیرد؛ اگر نباشد، اولین درگاه استفاده می‌شود. هر پرداخت provider خودش را نگه می‌دارد، پس حتی اگر درگاه بعداً خاموش شود، verify می‌شود. تراکنش‌ها GET /sites/:s/payments ، مجوز payments:manage : همهٔ تلاش‌ها با فیلتر. «Check again» POST …/payments/:id/recheck از درگاه می‌پرسد: اگر پرداخت شده باشد ثبت می‌شود؛ اگر نه و بیش از ۳۰ دقیقه گذشته باشد، شکست‌خورده می‌شود. «Test connection» POST …/gateways/:provider/test یک درخواست پرداخت کوچک می‌فرستد ولی خریدار هیچ‌وقت به درگاه نمی‌رود، پس پولی جابه‌جا نمی‌شود. درخواست‌ها leads هم با همین مسیر پرداخت می‌شوند startRequestPayment . باز صفحهٔ پیگیری سفارش و درخواست مشتری هنوز با اولین درگاه پرداخت می‌کند و انتخاب درگاه ندارد → docs/STATUS.md . تست apps/api/test/shop.test.ts ، apps/api/test/payments.test.ts . ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"سفارش-از-سبد-تا-پرداخت","text":"سفارش، از سبد تا پرداخت"},{"level":2,"id":"محصولات-و-خدمات","text":"محصولات و خدمات"},{"level":2,"id":"قوانین-فروشگاه-settingsshop","text":"قوانین فروشگاه (settings.shop)"},{"level":2,"id":"درگاههای-پرداخت","text":"درگاه‌های پرداخت"},{"level":3,"id":"driver","text":"driver"},{"level":3,"id":"سه-سطح-تنظیم","text":"سه سطح تنظیم"},{"level":3,"id":"پرداخت-و-تراکنشها","text":"پرداخت و تراکنش‌ها"},{"level":2,"id":"باز","text":"باز"},{"level":2,"id":"تست","text":"تست"}]},{"path":"04-features/site-setup.md","title":"ساخت سایت جدید، ماژول‌ها، kit و دادهٔ نمونه","html":"\u003ch1 id=\"ساخت-سایت-جدید-ماژولها-kit-و-داده-نمونه\">ساخت سایت جدید، ماژول‌ها، kit و دادهٔ نمونه\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · shared: \u003ccode>setup.ts\u003c/code>، \u003ccode>bank.ts\u003c/code> · API: \u003ccode>modules/platform/\u003c/code> (\u003ccode>platform.routes.ts\u003c/code>، \u003ccode>provisioning.ts\u003c/code>، \u003ccode>templates/\u003c/code>، \u003ccode>setup/\u003c/code>)، \u003ccode>modules/bank/\u003c/code> · وب: \u003ccode>admin/pages/SiteSetup.tsx\u003c/code>، \u003ccode>admin/pages/PlatformPages.tsx\u003c/code>، \u003ccode>admin/pages/BankPage.tsx\u003c/code> · خلاصهٔ انگلیسی: \u003ca href=\"../features/site-setup.md\">\u003ccode>docs/features/site-setup.md\u003c/code>\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>ساختن سایت دو لایه دارد:\u003c/p>\n\u003col>\u003cli>\u003cstrong>provisioning\u003c/strong>: ساختن دیتابیس و role، migrationها، مالک و فعال‌سازی. → \u003ca href=\"#02-architecture/multi-tenancy.md\">چند-مستأجری\u003c/a>\u003c/li>\u003cli>\u003cstrong>setup\u003c/strong> (اختیاری): تنظیمات، منو، صفحه‌ها، فرم‌ها، جدول‌ها، طرح باکس‌ها و دادهٔ نمونه، بر اساس فرمی که اپراتور پر کرده است.\u003c/li>\u003c/ol>\n\u003cpre class=\"mermaid\">flowchart LR\n  F[فرم سایت جدید&lt;br/&gt;/admin/platform/sites/new] -- &quot;POST /platform/tenants { setup }&quot; --&gt; P[provisionTenant]\n  P --&gt; A[applySetup&lt;br/&gt;templates/apply.ts]\n  A --&gt; S[settings، nav، header/footer]\n  A --&gt; PG[صفحه‌ها + system pages]\n  A --&gt; RT[request types]\n  A --&gt; T[جدول‌ها + box-products، box-&amp;lt;table&amp;gt;]\n  A --&gt; D[addDemoData&lt;br/&gt;setup/demo.ts]\n  K[(site kit&lt;br/&gt;sb_control)] --&gt; D\u003c/pre>\n\u003ch2 id=\"فرم-سایت-جدید\">فرم سایت جدید\u003c/h2>\n\u003cp>یک صفحه با بخش‌های تاشو، که با \u003ccode>siteSetupSchema\u003c/code> (shared \u003ccode>setup.ts\u003c/code>) اعتبارسنجی می‌شود:\u003c/p>\n\u003cul>\u003cli>نوع کسب‌وکار، زبان‌ها و ظاهر، و تماس،\u003c/li>\u003cli>صفحه‌ها و جای هر کدام در منو (اصلی، «More»، footer یا هیچ‌جا)،\u003c/li>\u003cli>فرم‌ها از \u003ccode>SETUP_FORMS\u003c/code>، هر کدام با صفحه، workflow، دسترسی و اعلان‌های خودش،\u003c/li>\u003cli>دکمه‌های header (تماس، WhatsApp، جست‌وجو)، footer، فروشگاه، فیلترها، جدول‌ها، حساب‌ها،\u003c/li>\u003cli>تعداد دادهٔ نمونه.\u003c/li>\u003c/ul>\n\u003cp>۸ نوع کسب‌وکار در \u003ccode>templates/catalog.ts\u003c/code> تعریف شده‌اند و عکس‌هایشان در \u003ccode>templates/images.ts\u003c/code>. \u003cstrong>سایت پیش‌فرض\u003c/strong> با تنظیمات خنثی ساخته می‌شود (\u003ccode>genericTemplate\u003c/code>). \u003cstrong>سایت خالی\u003c/strong> setup ندارد، صفحه‌ای ندارد و همهٔ ماژول‌ها جز leads خاموش‌اند.\u003c/p>\n\u003cp>\u003cstrong>عکس‌ها:\u003c/strong> اول از \u003ccode>var/demo-images/&lt;ref&gt;.jpg\u003c/code>، اگر نبود از اینترنت، و اگر نشد یک placeholder گرادیانی (\u003ccode>unsplash-&lt;ref&gt;.png\u003c/code>) استفاده می‌شود. فهرست سایت‌ها برای هر سایت \u003ccode>placeholderPhotos\u003c/code> برمی‌گرداند و دکمهٔ «Refresh photos» (\u003ccode>POST /platform/tenants/:id/refresh-photos\u003c/code>) فقط وقتی دیده می‌شود که این عدد بیشتر از صفر باشد.\u003c/p>\n\u003ch2 id=\"آدرسهای-platform\">آدرس‌های platform\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس (\u003ccode>/api/v1/platform/…\u003c/code>)\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>GET/POST tenants\u003c/code>\u003c/td>\u003ctd>فهرست و ساخت سایت (\u003ccode>setup\u003c/code> اختیاری)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET/PATCH/DELETE tenants/:id\u003c/code>\u003c/td>\u003ctd>یک سایت؛ حذف با \u003ccode>?confirm=&lt;slug&gt;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST tenants/:id/retry\u003c/code>\u003c/td>\u003ctd>ادامهٔ provisioning شکست‌خورده\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PUT tenants/:id/owner\u003c/code>\u003c/td>\u003ctd>تغییر مالک\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET/POST/DELETE tenants/:id/demo-data\u003c/code>\u003c/td>\u003ctd>شمارش، افزودن و حذف دادهٔ نمونه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST tenants/:id/refresh-photos\u003c/code>\u003c/td>\u003ctd>جایگزینی placeholderها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET templates\u003c/code>\u003c/td>\u003ctd>نوع‌های کسب‌وکار\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GET/POST users\u003c/code>، \u003ccode>PATCH/DELETE users/:id\u003c/code>، \u003ccode>GET audit\u003c/code>\u003c/td>\u003ctd>کاربران و رویدادها\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"ماژولها\">ماژول‌ها\u003c/h2>\n\u003cp>Settings ← Modules (فقط اپراتور، \u003ccode>MODULE_SWITCHES\u003c/code> در \u003ccode>SettingsPages.tsx\u003c/code>): \u003ccode>products\u003c/code>، \u003ccode>orders\u003c/code>، \u003ccode>services\u003c/code>، \u003ccode>leads\u003c/code>. هر کلید فقط \u003cstrong>همان بخش را باز می‌کند\u003c/strong>: منوهای پنل، مسیرهای داخلی، API (\u003ccode>requireModule\u003c/code>). صفحه، جدول یا دادهٔ نمونه اضافه نمی‌کند؛ این کار starterها و دادهٔ نمونه است. \u003ccode>projects\u003c/code>، \u003ccode>testimonials\u003c/code> و \u003ccode>faq\u003c/code> هنوز در \u003ccode>MODULES\u003c/code> هستند ولی اثری ندارند و نمایش داده نمی‌شوند.\u003c/p>\n\u003ch2 id=\"داده-نمونه\">دادهٔ نمونه\u003c/h2>\n\u003cp>همهٔ ردیف‌های نمونه \u003ccode>demo = true\u003c/code> دارند: محصولات، خدمات، آیتم‌های جدول، مشتریان، درخواست‌ها، سفارش‌ها، پرداخت‌ها و نظرها. ورودی پنجرهٔ «Sample data» با \u003ccode>demoRunSchema\u003c/code> تعریف می‌شود: نوع kit، افزودن یا جایگزینی، و تعداد برای هر جدول.\u003c/p>\n\u003cp>\u003ccode>setup/demo.ts\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003ccode>addDemoData\u003c/code>، \u003ccode>clearDemoData\u003c/code>.\u003c/li>\u003cli>\u003ccode>fieldValue\u003c/code>: مقدار ساختگی برای هر نوع فیلد.\u003c/li>\u003cli>\u003ccode>itemTitle\u003c/code>: عنوان آیتم‌ها.\u003c/li>\u003cli>فهرست کلمات در \u003ccode>setup/pools.ts\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"site-kits-بانک-محتوا\">site kits (بانک محتوا)\u003c/h2>\n\u003cp>Platform ← Site kits (\u003ccode>BankPage.tsx\u003c/code>، \u003ccode>/platform/bank\u003c/code>). برای هر \u003cstrong>نوع سایت\u003c/strong> (general، ۸ نوع قالب و نوع‌های خود استودیو در \u003ccode>bank_types\u003c/code>) مشخص می‌کند دادهٔ نمونه از چه ساخته شود:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>جدول‌ها\u003c/strong> (\u003ccode>kit_tables\u003c/code>): کپی یک starter جدول با آیتم‌ها و عکس‌های خودش، که در همان صفحه ویرایش می‌شود. ویرایش kit هیچ‌وقت به starter اصلی دست نمی‌زند (\u003ccode>addKitTable\u003c/code> عکس‌ها را کپی می‌کند).\u003c/li>\u003cli>\u003cstrong>لیست‌ها\u003c/strong> (\u003ccode>bank_entries\u003c/code>، \u003ccode>BUILT_IN_KINDS\u003c/code>): محصولات، خدمات، نظرها، FAQ.\u003c/li>\u003cli>\u003cstrong>عکس‌ها\u003c/strong> (\u003ccode>bank_photos\u003c/code>).\u003c/li>\u003c/ul>\n\u003cp>ساخت دادهٔ نمونه: هر جدول سایت آیتم‌های kit table با \u003cstrong>همان slug\u003c/strong> را می‌گیرد (اول kit همان نوع، بعد general؛ \u003ccode>loadBank().table(slug)\u003c/code>). مقدارها هر جا با فیلد سایت جور باشند استفاده می‌شوند (\u003ccode>kitValueFits\u003c/code>)، referenceها به آیتم‌های جدید منتقل می‌شوند و بقیه ساختگی ساخته می‌شوند. \u003ccode>tenants.business_type\u003c/code> نوع هر سایت را نگه می‌دارد.\u003c/p>\n\u003cp>kit عمومی یک‌بار با جدول‌های starterهای آماده پر می‌شود (\u003ccode>seedGeneralKit\u003c/code>؛ \u003ccode>app_settings.general_kit_seeded\u003c/code>).\u003c/p>\n\u003ch2 id=\"تست\">تست\u003c/h2>\n\u003cp>\u003ccode>apps/api/test/setup.test.ts\u003c/code>، \u003ccode>provisioning.test.ts\u003c/code>، \u003ccode>bank.test.ts\u003c/code>.\u003c/p>","text":" ساخت سایت جدید، ماژول‌ها، kit و دادهٔ نمونه فصل ۴ — قابلیت‌ها · shared: setup.ts ، bank.ts · API: modules/platform/ platform.routes.ts ، provisioning.ts ، templates/ ، setup/ ، modules/bank/ · وب: admin/pages/SiteSetup.tsx ، admin/pages/PlatformPages.tsx ، admin/pages/BankPage.tsx · خلاصهٔ انگلیسی: docs/features/site setup.md ../../features/site setup.md خلاصه ساختن سایت دو لایه دارد: 1. provisioning : ساختن دیتابیس و role، migrationها، مالک و فعال‌سازی. → چند مستأجری ../02 architecture/multi tenancy.md 2. setup اختیاری : تنظیمات، منو، صفحه‌ها، فرم‌ها، جدول‌ها، طرح باکس‌ها و دادهٔ نمونه، بر اساس فرمی که اپراتور پر کرده است. فرم سایت جدید یک صفحه با بخش‌های تاشو، که با siteSetupSchema shared setup.ts اعتبارسنجی می‌شود: نوع کسب‌وکار، زبان‌ها و ظاهر، و تماس، صفحه‌ها و جای هر کدام در منو اصلی، «More»، footer یا هیچ‌جا ، فرم‌ها از SETUP_FORMS ، هر کدام با صفحه، workflow، دسترسی و اعلان‌های خودش، دکمه‌های header تماس، WhatsApp، جست‌وجو ، footer، فروشگاه، فیلترها، جدول‌ها، حساب‌ها، تعداد دادهٔ نمونه. ۸ نوع کسب‌وکار در templates/catalog.ts تعریف شده‌اند و عکس‌هایشان در templates/images.ts . سایت پیش‌فرض با تنظیمات خنثی ساخته می‌شود genericTemplate . سایت خالی setup ندارد، صفحه‌ای ندارد و همهٔ ماژول‌ها جز leads خاموش‌اند. عکس‌ها: اول از var/demo images/\u003cref .jpg ، اگر نبود از اینترنت، و اگر نشد یک placeholder گرادیانی unsplash \u003cref .png استفاده می‌شود. فهرست سایت‌ها برای هر سایت placeholderPhotos برمی‌گرداند و دکمهٔ «Refresh photos» POST /platform/tenants/:id/refresh photos فقط وقتی دیده می‌شود که این عدد بیشتر از صفر باشد. آدرس‌های platform آدرس /api/v1/platform/… کار GET/POST tenants فهرست و ساخت سایت setup اختیاری GET/PATCH/DELETE tenants/:id یک سایت؛ حذف با ?confirm=\u003cslug POST tenants/:id/retry ادامهٔ provisioning شکست‌خورده PUT tenants/:id/owner تغییر مالک GET/POST/DELETE tenants/:id/demo data شمارش، افزودن و حذف دادهٔ نمونه POST tenants/:id/refresh photos جایگزینی placeholderها GET templates نوع‌های کسب‌وکار GET/POST users ، PATCH/DELETE users/:id ، GET audit کاربران و رویدادها ماژول‌ها Settings ← Modules فقط اپراتور، MODULE_SWITCHES در SettingsPages.tsx : products ، orders ، services ، leads . هر کلید فقط همان بخش را باز می‌کند : منوهای پنل، مسیرهای داخلی، API requireModule . صفحه، جدول یا دادهٔ نمونه اضافه نمی‌کند؛ این کار starterها و دادهٔ نمونه است. projects ، testimonials و faq هنوز در MODULES هستند ولی اثری ندارند و نمایش داده نمی‌شوند. دادهٔ نمونه همهٔ ردیف‌های نمونه demo = true دارند: محصولات، خدمات، آیتم‌های جدول، مشتریان، درخواست‌ها، سفارش‌ها، پرداخت‌ها و نظرها. ورودی پنجرهٔ «Sample data» با demoRunSchema تعریف می‌شود: نوع kit، افزودن یا جایگزینی، و تعداد برای هر جدول. setup/demo.ts : addDemoData ، clearDemoData . fieldValue : مقدار ساختگی برای هر نوع فیلد. itemTitle : عنوان آیتم‌ها. فهرست کلمات در setup/pools.ts . site kits بانک محتوا Platform ← Site kits BankPage.tsx ، /platform/bank . برای هر نوع سایت general، ۸ نوع قالب و نوع‌های خود استودیو در bank_types مشخص می‌کند دادهٔ نمونه از چه ساخته شود: جدول‌ها kit_tables : کپی یک starter جدول با آیتم‌ها و عکس‌های خودش، که در همان صفحه ویرایش می‌شود. ویرایش kit هیچ‌وقت به starter اصلی دست نمی‌زند addKitTable عکس‌ها را کپی می‌کند . لیست‌ها bank_entries ، BUILT_IN_KINDS : محصولات، خدمات، نظرها، FAQ. عکس‌ها bank_photos . ساخت دادهٔ نمونه: هر جدول سایت آیتم‌های kit table با همان slug را می‌گیرد اول kit همان نوع، بعد general؛ loadBank .table slug . مقدارها هر جا با فیلد سایت جور باشند استفاده می‌شوند kitValueFits ، referenceها به آیتم‌های جدید منتقل می‌شوند و بقیه ساختگی ساخته می‌شوند. tenants.business_type نوع هر سایت را نگه می‌دارد. kit عمومی یک‌بار با جدول‌های starterهای آماده پر می‌شود seedGeneralKit ؛ app_settings.general_kit_seeded . تست apps/api/test/setup.test.ts ، provisioning.test.ts ، bank.test.ts . ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"فرم-سایت-جدید","text":"فرم سایت جدید"},{"level":2,"id":"آدرسهای-platform","text":"آدرس‌های platform"},{"level":2,"id":"ماژولها","text":"ماژول‌ها"},{"level":2,"id":"داده-نمونه","text":"دادهٔ نمونه"},{"level":2,"id":"site-kits-بانک-محتوا","text":"site kits (بانک محتوا)"},{"level":2,"id":"تست","text":"تست"}]},{"path":"04-features/starters.md","title":"starterها","html":"\u003ch1 id=\"starterها\">starterها\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · shared: \u003ccode>starters.ts\u003c/code> · API: \u003ccode>modules/starters/\u003c/code> (\u003ccode>pack.service.ts\u003c/code>، \u003ccode>samples.ts\u003c/code>، \u003ccode>starters.routes.ts\u003c/code>) · وب: \u003ccode>admin/pages/StartersPage.tsx\u003c/code>، \u003ccode>admin/starters.tsx\u003c/code>، \u003ccode>admin/StarterPreviewFrame.tsx\u003c/code> · جدول: \u003ccode>starters\u003c/code> (sb_control) · خلاصهٔ انگلیسی: \u003ca href=\"../features/starters.md\">\u003ccode>docs/features/starters.md\u003c/code>\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>starter یک \u003cstrong>نقطهٔ شروع خودکفا\u003c/strong> است که روی هر سایتی (حتی سایت خالی) اعمال می‌شود. چهار نوع دارد: صفحه، جدول، header و footer. داخلش یک \u003cstrong>pack\u003c/strong> است که هر چیزی را که آن صفحه یا جدول لازم دارد با خودش می‌آورد.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart LR\n  S1[سایت A] -- &quot;scan → save&quot; --&gt; ST[(starters.data = pack)]\n  RS[samples.ts&lt;br/&gt;starterهای آماده] -- &quot;add-sample-starters&quot; --&gt; ST\n  ST -- &quot;check → apply&quot; --&gt; S2[سایت B]\n  ST -- &quot;/__starter-preview + setApiMock&quot; --&gt; PV[پیش‌نمایش]\n  ST -- &quot;addKitTable&quot; --&gt; KIT[(kit_tables)]\u003c/pre>\n\u003ch2 id=\"pack-چه-دارد\">pack چه دارد\u003c/h2>\n\u003cp>\u003ccode>starterPackSchema\u003c/code> (نسخهٔ ۲):\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>بخش\u003c/th>\u003cth>چیست\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>pages\u003c/code>\u003c/td>\u003ctd>صفحه‌ها با نقش \u003ccode>main\u003c/code>، \u003ccode>detail\u003c/code> (صفحهٔ آیتم یک جدول) یا \u003ccode>linked\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tables\u003c/code>\u003c/td>\u003ctd>تعریف جدول‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>forms\u003c/code>\u003c/td>\u003ctd>request typeها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cardDesigns\u003c/code>\u003c/td>\u003ctd>طرح باکس‌های مشترک\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>site.header\u003c/code> / \u003ccode>site.footer\u003c/code>\u003c/td>\u003ctd>برای starterهای header و footer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>samples\u003c/code>\u003c/td>\u003ctd>آیتم‌های هر جدول (reference با \u003ccode>ref\u003c/code>)، محصولات، دسته‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>modules\u003c/code>\u003c/td>\u003ctd>ماژول‌هایی که باید روشن شوند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>needs\u003c/code>\u003c/td>\u003ctd>صفحه، جدول یا فرمی که استفاده می‌شود ولی داخل pack نیست\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>photos\u003c/code>\u003c/td>\u003ctd>کپی عکس‌ها در storage استودیو (پوشهٔ \u003ccode>BANK_STORAGE_ID\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>آیتم‌ها و محصولات \u003ccode>id\u003c/code> عکس را نگه می‌دارند و متن‌ها آدرس آن را. starter حذف‌شده عکس‌هایش را هم پاک می‌کند، مگر starter دیگری هنوز از آن‌ها استفاده کند. داده‌های قدیمی (\u003ccode>{document}\u003c/code>) هنگام خواندن با \u003ccode>readStarterPack\u003c/code> تبدیل می‌شوند.\u003c/p>\n\u003ch2 id=\"ذخیره\">ذخیره\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>POST /sites/:s/starters/scan\u003c/code>\u003c/td>\u003ctd>از این انتخاب چه چیزی در starter قرار می‌گیرد: جدول‌های نمایش‌داده‌شده یا ارجاع‌شده و صفحه‌های آیتمشان خودکار؛ صفحه‌های لینک‌شده فقط اگر تیک بخورند؛ با \u003ccode>skip\u003c/code> حذف می‌شوند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /sites/:s/starters\u003c/code>\u003c/td>\u003ctd>ذخیره (\u003ccode>kind\u003c/code>، \u003ccode>name\u003c/code>، \u003ccode>group\u003c/code>، انتخاب، \u003ccode>samples\u003c/code>)؛ با \u003ccode>replace: &lt;id&gt;\u003c/code> محتوای starter موجود عوض می‌شود (راه به‌روزرسانی starter)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>starterهای header و footer از تنظیمات ذخیره‌شدهٔ سایت ساخته می‌شوند.\u003c/p>\n\u003ch2 id=\"اعمال\">اعمال\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>GET /sites/:s/starters/:id/check\u003c/code>\u003c/td>\u003ctd>بر
