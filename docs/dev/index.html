ای هر صفحه، جدول و فرم: داخل pack است یا فقط لازم است؛ در سایت وجود دارد، ندارد یا فرق دارد (فیلدهای غایب)؛ و پیشنهاد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /sites/:s/starters/:id/apply\u003c/code>\u003c/td>\u003ctd>برای هر مورد: \u003ccode>create\u003c/code> (با slug)، \u003ccode>use\u003c/code> (همانِ سایت) یا \u003ccode>skip\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>در اعمال:\u003c/p>\n\u003cul>\u003cli>slugها \u003cstrong>همه‌جا\u003c/strong> عوض می‌شوند: لینک‌ها، منبع لیست‌ها، referenceها، صفحهٔ آیتم و فرم‌ها.\u003c/li>\u003cli>فیلدهای غایب می‌توانند به جدول موجود اضافه شوند.\u003c/li>\u003cli>ماژول‌ها روشن می‌شوند.\u003c/li>\u003cli>همه در \u003cstrong>یک تراکنش\u003c/strong> انجام می‌شود.\u003c/li>\u003cli>صفحهٔ اصلی draft می‌ماند و بقیه منتشر می‌شوند. نمونه‌ها \u003ccode>demo = true\u003c/code> دارند.\u003c/li>\u003c/ul>\n\u003cp>همهٔ routeهای \u003ccode>/sites/:s/starters\u003c/code> فقط برای اپراتور هستند. مدیریت در \u003ccode>/platform/starters\u003c/code> است: فهرست بر اساس نوع و گروه، تغییر نام یا گروه (\u003ccode>PATCH\u003c/code>)، حذف.\u003c/p>\n\u003ch2 id=\"پیشنمایش\">پیش‌نمایش\u003c/h2>\n\u003cp>صفحه‌ها، headerها و footerها در iframe \u003ccode>/__starter-preview\u003c/code> (\u003ccode>StarterPreviewFrame.tsx\u003c/code>) و با ظاهر یک سایت انتخابی نمایش داده می‌شوند. \u003ccode>setApiMock\u003c/code> (\u003ccode>lib/api.ts\u003c/code>) به درخواست‌های سایت ساختگی \u003ccode>starter-preview\u003c/code> از روی خود pack جواب می‌دهد: تنظیمات، صفحه‌ها، جدول‌ها و آیتم‌ها، محصولات و یک مشتری واردشده با درخواست و سفارش نمونه. درخواست‌های POST رد می‌شوند.\u003c/p>\n\u003ch2 id=\"starterهای-آماده\">starterهای آماده\u003c/h2>\n\u003cp>\u003ccode>samples.ts\u003c/code> (\u003ccode>SAMPLES\u003c/code>، حدود ۵۰): 404، تماس، درباره، فروشگاه، صفحهٔ محصول، خدمات، دوره‌ها، کلاس‌ها، رویدادها، بلاگ، فرم‌های درخواست، سبد و پرداخت، ورود و ثبت‌نام، چیدمان‌های حساب، پیگیری، ۶ جدول، ۴ header و ۳ footer.\u003c/p>\n\u003cp>\u003ccode>node dist/cli.js add-sample-starters\u003c/code> در هر شروع API فقط آن‌هایی را اضافه می‌کند که \u003ccode>key\u003c/code>شان در \u003ccode>app_settings.starter_samples\u003c/code> نیست. پس starter آماده‌ای که اپراتور حذف کرده \u003cstrong>برنمی‌گردد\u003c/strong>. starterهای صفحه باید با slug گفته‌شده در توضیحشان اعمال شوند (مثل \u003ccode>not-found\u003c/code>، \u003ccode>products\u003c/code>، \u003ccode>account\u003c/code>) تا جای صفحهٔ داخلی را بگیرند. → \u003ca href=\"#05-recipes/new-ready-starter.md\">دستورالعمل: starter آماده جدید\u003c/a>\u003c/p>\n\u003ch2 id=\"تست\">تست\u003c/h2>\n\u003cp>\u003ccode>apps/api/test/starters.test.ts\u003c/code>: همهٔ starterهای آماده را روی یک سایت خالی می‌سازد.\u003c/p>","text":" starterها فصل ۴ — قابلیت‌ها · shared: starters.ts · API: modules/starters/ pack.service.ts ، samples.ts ، starters.routes.ts · وب: admin/pages/StartersPage.tsx ، admin/starters.tsx ، admin/StarterPreviewFrame.tsx · جدول: starters sb_control · خلاصهٔ انگلیسی: docs/features/starters.md ../../features/starters.md خلاصه starter یک نقطهٔ شروع خودکفا است که روی هر سایتی حتی سایت خالی اعمال می‌شود. چهار نوع دارد: صفحه، جدول، header و footer. داخلش یک pack است که هر چیزی را که آن صفحه یا جدول لازم دارد با خودش می‌آورد. pack چه دارد starterPackSchema نسخهٔ ۲ : بخش چیست pages صفحه‌ها با نقش main ، detail صفحهٔ آیتم یک جدول یا linked tables تعریف جدول‌ها forms request typeها cardDesigns طرح باکس‌های مشترک site.header / site.footer برای starterهای header و footer samples آیتم‌های هر جدول reference با ref ، محصولات، دسته‌ها modules ماژول‌هایی که باید روشن شوند needs صفحه، جدول یا فرمی که استفاده می‌شود ولی داخل pack نیست photos کپی عکس‌ها در storage استودیو پوشهٔ BANK_STORAGE_ID آیتم‌ها و محصولات id عکس را نگه می‌دارند و متن‌ها آدرس آن را. starter حذف‌شده عکس‌هایش را هم پاک می‌کند، مگر starter دیگری هنوز از آن‌ها استفاده کند. داده‌های قدیمی {document} هنگام خواندن با readStarterPack تبدیل می‌شوند. ذخیره آدرس کار POST /sites/:s/starters/scan از این انتخاب چه چیزی در starter قرار می‌گیرد: جدول‌های نمایش‌داده‌شده یا ارجاع‌شده و صفحه‌های آیتمشان خودکار؛ صفحه‌های لینک‌شده فقط اگر تیک بخورند؛ با skip حذف می‌شوند POST /sites/:s/starters ذخیره kind ، name ، group ، انتخاب، samples ؛ با replace: \u003cid محتوای starter موجود عوض می‌شود راه به‌روزرسانی starter starterهای header و footer از تنظیمات ذخیره‌شدهٔ سایت ساخته می‌شوند. اعمال آدرس کار GET /sites/:s/starters/:id/check برای هر صفحه، جدول و فرم: داخل pack است یا فقط لازم است؛ در سایت وجود دارد، ندارد یا فرق دارد فیلدهای غایب ؛ و پیشنهاد POST /sites/:s/starters/:id/apply برای هر مورد: create با slug ، use همانِ سایت یا skip در اعمال: slugها همه‌جا عوض می‌شوند: لینک‌ها، منبع لیست‌ها، referenceها، صفحهٔ آیتم و فرم‌ها. فیلدهای غایب می‌توانند به جدول موجود اضافه شوند. ماژول‌ها روشن می‌شوند. همه در یک تراکنش انجام می‌شود. صفحهٔ اصلی draft می‌ماند و بقیه منتشر می‌شوند. نمونه‌ها demo = true دارند. همهٔ routeهای /sites/:s/starters فقط برای اپراتور هستند. مدیریت در /platform/starters است: فهرست بر اساس نوع و گروه، تغییر نام یا گروه PATCH ، حذف. پیش‌نمایش صفحه‌ها، headerها و footerها در iframe /__starter preview StarterPreviewFrame.tsx و با ظاهر یک سایت انتخابی نمایش داده می‌شوند. setApiMock lib/api.ts به درخواست‌های سایت ساختگی starter preview از روی خود pack جواب می‌دهد: تنظیمات، صفحه‌ها، جدول‌ها و آیتم‌ها، محصولات و یک مشتری واردشده با درخواست و سفارش نمونه. درخواست‌های POST رد می‌شوند. starterهای آماده samples.ts SAMPLES ، حدود ۵۰ : 404، تماس، درباره، فروشگاه، صفحهٔ محصول، خدمات، دوره‌ها، کلاس‌ها، رویدادها، بلاگ، فرم‌های درخواست، سبد و پرداخت، ورود و ثبت‌نام، چیدمان‌های حساب، پیگیری، ۶ جدول، ۴ header و ۳ footer. node dist/cli.js add sample starters در هر شروع API فقط آن‌هایی را اضافه می‌کند که key شان در app_settings.starter_samples نیست. پس starter آماده‌ای که اپراتور حذف کرده برنمی‌گردد . starterهای صفحه باید با slug گفته‌شده در توضیحشان اعمال شوند مثل not found ، products ، account تا جای صفحهٔ داخلی را بگیرند. → دستورالعمل: starter آماده جدید ../05 recipes/new ready starter.md تست apps/api/test/starters.test.ts : همهٔ starterهای آماده را روی یک سایت خالی می‌سازد. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"pack-چه-دارد","text":"pack چه دارد"},{"level":2,"id":"ذخیره","text":"ذخیره"},{"level":2,"id":"اعمال","text":"اعمال"},{"level":2,"id":"پیشنمایش","text":"پیش‌نمایش"},{"level":2,"id":"starterهای-آماده","text":"starterهای آماده"},{"level":2,"id":"تست","text":"تست"}]},{"path":"04-features/system-pages.md","title":"صفحات داخلی (system pages)","html":"\u003ch1 id=\"صفحات-داخلی-system-pages\">صفحات داخلی (system pages)\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۴ — قابلیت‌ها · shared: \u003ccode>sections.ts\u003c/code> (\u003ccode>SYSTEM_PAGES\u003c/code>، \u003ccode>systemPageSections\u003c/code>) · وب: \u003ccode>sections/BuiltInPage.tsx\u003c/code>، \u003ccode>app/routes.tsx\u003c/code>، \u003ccode>features/\u003c/code> · سند قدیمی‌تر: \u003ca href=\"../features/site-setup.md\">\u003ccode>docs/features/site-setup.md\u003c/code>\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cp>فروشگاه، صفحهٔ محصول، سبد، پرداخت، حساب مشتری، پیگیری و 404 \u003cstrong>کامپوننت‌های داخلی\u003c/strong> React هستند. برای اینکه اپراتور بتواند دورشان سکشن‌های دلخواه بچیند، هر کدام یک \u003cstrong>slug ثابت\u003c/strong> دارد. اگر سایت یک صفحهٔ منتشرشده با همان slug داشته باشد، آن صفحه نمایش داده می‌شود و کامپوننت داخلی درون سکشن \u003cstrong>\u003ccode>system-page\u003c/code>\u003c/strong> («محتوای داخلی») قرار می‌گیرد.\u003c/p>\n\u003ch2 id=\"جدول-صفحهها\">جدول صفحه‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>key\u003c/th>\u003cth>slug\u003c/th>\u003cth>مسیر\u003c/th>\u003cth>ماژول لازم\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>products\u003c/code>\u003c/td>\u003ctd>\u003ccode>products\u003c/code>\u003c/td>\u003ctd>\u003ccode>/products\u003c/code>\u003c/td>\u003ctd>products\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>productDetail\u003c/code>\u003c/td>\u003ctd>\u003ccode>product\u003c/code>\u003c/td>\u003ctd>\u003ccode>/products/…\u003c/code>\u003c/td>\u003ctd>products\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>services\u003c/code>\u003c/td>\u003ctd>\u003ccode>services\u003c/code>\u003c/td>\u003ctd>\u003ccode>/services\u003c/code>\u003c/td>\u003ctd>services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>serviceDetail\u003c/code>\u003c/td>\u003ctd>\u003ccode>service\u003c/code>\u003c/td>\u003ctd>\u003ccode>/services/…\u003c/code>\u003c/td>\u003ctd>services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cart\u003c/code>\u003c/td>\u003ctd>\u003ccode>cart\u003c/code>\u003c/td>\u003ctd>\u003ccode>/cart\u003c/code>\u003c/td>\u003ctd>products\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>checkout\u003c/code>\u003c/td>\u003ctd>\u003ccode>checkout\u003c/code>\u003c/td>\u003ctd>\u003ccode>/checkout\u003c/code>\u003c/td>\u003ctd>products\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>checkoutResult\u003c/code>\u003c/td>\u003ctd>\u003ccode>checkout-result\u003c/code>\u003c/td>\u003ctd>\u003ccode>/checkout/result\u003c/code>\u003c/td>\u003ctd>products\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>account\u003c/code>\u003c/td>\u003ctd>\u003ccode>account\u003c/code>\u003c/td>\u003ctd>\u003ccode>/account\u003c/code>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>track\u003c/code>\u003c/td>\u003ctd>\u003ccode>track\u003c/code>\u003c/td>\u003ctd>\u003ccode>/track\u003c/code>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>notFound\u003c/code>\u003c/td>\u003ctd>\u003ccode>not-found\u003c/code>\u003c/td>\u003ctd>404\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"تصمیمگیری-در-builtinpage\">تصمیم‌گیری در \u003ccode>BuiltInPage\u003c/code>\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart TB\n  R[مسیر، مثلاً /products] --&gt; E{صفحهٔ منتشرشده با slug products؟}\n  E -- بله --&gt; O[همان صفحهٔ builder&lt;br/&gt;سکشن system-page = ProductsPage]\n  E -- خیر --&gt; M{ماژول products روشن است؟}\n  M -- خیر --&gt; N[NotFound]\n  M -- بله --&gt; B[کامپوننت داخلی ProductsPage]\u003c/pre>\n\u003cul>\u003cli>کامپوننت‌ها در \u003ccode>app/routes.tsx\u003c/code> با \u003ccode>registerSystemPages({...})\u003c/code> ثبت می‌شوند تا \u003ccode>sections/\u003c/code> و \u003ccode>features/\u003c/code> هم را import نکنند.\u003c/li>\u003cli>داخل صفحهٔ builder، \u003ccode>EmbeddedContext\u003c/code> روشن است و کامپوننت داخلی فقط خودش را نشان می‌دهد (بدون دوباره پیچیدن در صفحه).\u003c/li>\u003cli>در پیش‌نمایش builder، صفحهٔ محصول و خدمت اولین آیتم را نشان می‌دهند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"گزینههای-سکشن-system-page\">گزینه‌های سکشن \u003ccode>system-page\u003c/code>\u003c/h2>\n\u003cp>برای حساب مشتری: \u003ccode>accountMenu\u003c/code> (\u003ccode>tabs\u003c/code>، \u003ccode>sidebar\u003c/code>، \u003ccode>cards\u003c/code>، \u003ccode>none\u003c/code>)، \u003ccode>accountOpen\u003c/code> (\u003ccode>requests\u003c/code>، \u003ccode>orders\u003c/code>، \u003ccode>profile\u003c/code>) و \u003ccode>authStart\u003c/code> (\u003ccode>login\u003c/code>، \u003ccode>signup\u003c/code>). کامپوننت‌ها با \u003ccode>useSystemPageOptions()\u003c/code> می‌خوانندشان. به این ترتیب می‌شود صفحه‌های جدای «ورود»، «ثبت‌نام»، «سفارش‌های من» و «پروفایل» ساخت.\u003c/p>\n\u003ch2 id=\"ساختن-این-صفحهها\">ساختن این صفحه‌ها\u003c/h2>\n\u003cul>\u003cli>در پنل: Pages ← «Make it editable» (و «Make the 404 page editable»).\u003c/li>\u003cli>setup سایت جدید آن‌ها را می‌سازد (فروشگاه به شکل یک صفحه با سکشن «List from a table» روی \u003ccode>/products\u003c/code>).\u003c/li>\u003cli>starterهای آماده برای اغلبشان وجود دارد؛ باید با همان slug اعمال شوند.\u003c/li>\u003cli>سکشن‌های پیش‌فرض هر کدام از \u003ccode>systemPageSections(key)\u003c/code> در shared می‌آیند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"اگر-بخواهید\">اگر بخواهید…\u003c/h2>\n\u003cul>\u003cli>صفحهٔ داخلی جدیدی اضافه کنید:\n\u003col>\u003cli>یک ردیف به \u003ccode>SYSTEM_PAGES\u003c/code> اضافه کنید،\u003c/li>\u003cli>سکشن‌های پیش‌فرضش را در \u003ccode>systemPageSections\u003c/code> بنویسید،\u003c/li>\u003cli>کامپوننت را بسازید و در \u003ccode>registerSystemPages\u003c/code> ثبت کنید،\u003c/li>\u003cli>مسیر را با \u003ccode>&lt;BuiltInPage page=&quot;…&quot;&gt;\u003c/code> در \u003ccode>app/routes.tsx\u003c/code> بگذارید.\u003c/li>\u003c/ol>\n\u003cp>اگر به ماژولی وابسته است، \u003ccode>MODULE_OF\u003c/code> را در \u003ccode>BuiltInPage.tsx\u003c/code> هم به‌روز کنید.\u003c/p>\u003c/li>\u003c/ul>","text":" صفحات داخلی system pages فصل ۴ — قابلیت‌ها · shared: sections.ts SYSTEM_PAGES ، systemPageSections · وب: sections/BuiltInPage.tsx ، app/routes.tsx ، features/ · سند قدیمی‌تر: docs/features/site setup.md ../../features/site setup.md خلاصه فروشگاه، صفحهٔ محصول، سبد، پرداخت، حساب مشتری، پیگیری و 404 کامپوننت‌های داخلی React هستند. برای اینکه اپراتور بتواند دورشان سکشن‌های دلخواه بچیند، هر کدام یک slug ثابت دارد. اگر سایت یک صفحهٔ منتشرشده با همان slug داشته باشد، آن صفحه نمایش داده می‌شود و کامپوننت داخلی درون سکشن system page «محتوای داخلی» قرار می‌گیرد. جدول صفحه‌ها key slug مسیر ماژول لازم products products /products products productDetail product /products/… products services services /services services serviceDetail service /services/… services cart cart /cart products checkout checkout /checkout products checkoutResult checkout result /checkout/result products account account /account — track track /track — notFound not found 404 — تصمیم‌گیری در BuiltInPage کامپوننت‌ها در app/routes.tsx با registerSystemPages {...} ثبت می‌شوند تا sections/ و features/ هم را import نکنند. داخل صفحهٔ builder، EmbeddedContext روشن است و کامپوننت داخلی فقط خودش را نشان می‌دهد بدون دوباره پیچیدن در صفحه . در پیش‌نمایش builder، صفحهٔ محصول و خدمت اولین آیتم را نشان می‌دهند. گزینه‌های سکشن system page برای حساب مشتری: accountMenu tabs ، sidebar ، cards ، none ، accountOpen requests ، orders ، profile و authStart login ، signup . کامپوننت‌ها با useSystemPageOptions می‌خوانندشان. به این ترتیب می‌شود صفحه‌های جدای «ورود»، «ثبت‌نام»، «سفارش‌های من» و «پروفایل» ساخت. ساختن این صفحه‌ها در پنل: Pages ← «Make it editable» و «Make the 404 page editable» . setup سایت جدید آن‌ها را می‌سازد فروشگاه به شکل یک صفحه با سکشن «List from a table» روی /products . starterهای آماده برای اغلبشان وجود دارد؛ باید با همان slug اعمال شوند. سکشن‌های پیش‌فرض هر کدام از systemPageSections key در shared می‌آیند. اگر بخواهید… صفحهٔ داخلی جدیدی اضافه کنید: 1. یک ردیف به SYSTEM_PAGES اضافه کنید، 2. سکشن‌های پیش‌فرضش را در systemPageSections بنویسید، 3. کامپوننت را بسازید و در registerSystemPages ثبت کنید، 4. مسیر را با \u003cBuiltInPage page=\"…\" در app/routes.tsx بگذارید. اگر به ماژولی وابسته است، MODULE_OF را در BuiltInPage.tsx هم به‌روز کنید. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"جدول-صفحهها","text":"جدول صفحه‌ها"},{"level":2,"id":"تصمیمگیری-در-builtinpage","text":"تصمیم‌گیری در BuiltInPage"},{"level":2,"id":"گزینههای-سکشن-system-page","text":"گزینه‌های سکشن system-page"},{"level":2,"id":"ساختن-این-صفحهها","text":"ساختن این صفحه‌ها"},{"level":2,"id":"اگر-بخواهید","text":"اگر بخواهید…"}]},{"path":"05-recipes/new-api-route.md","title":"دستورالعمل: مسیر یا ماژول API جدید","html":"\u003ch1 id=\"دستورالعمل-مسیر-یا-ماژول-api-جدید\">دستورالعمل: مسیر یا ماژول API جدید\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۵ — دستورالعمل‌ها · زمینه: \u003ca href=\"#03-layers/api.md\">API\u003c/a>، \u003ca href=\"#02-architecture/request-path.md\">مسیر یک درخواست\u003c/a>\u003c/p>\u003c/blockquote>\n\u003cp>مثال: ماژول \u003ccode>notes\u003c/code> (یادداشت‌های داخلی سایت) با فهرست و افزودن، به‌علاوهٔ استفاده در پنل.\u003c/p>\n\u003ch2 id=\"فایلها\">فایل‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>فایل\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ccode>apps/api/src/database/tenant/migrations/012_notes.sql\u003c/code>\u003c/td>\u003ctd>جدول (اگر لازم است) → \u003ca href=\"#05-recipes/new-migration.md\">migration جدید\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ccode>packages/shared/src/schemas.ts\u003c/code> (یا فایل مرتبط)\u003c/td>\u003ctd>schema ورودی\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ccode>apps/api/src/modules/notes/notes.routes.ts\u003c/code>\u003c/td>\u003ctd>routeها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ccode>apps/api/src/modules/notes/notes.service.ts\u003c/code>\u003c/td>\u003ctd>منطق (اگر بیش از چند خط است)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ccode>apps/api/src/app.ts\u003c/code>\u003c/td>\u003ctd>وصل کردن router\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ccode>apps/api/test/notes.test.ts\u003c/code>\u003c/td>\u003ctd>تست\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>\u003ccode>apps/web/src/admin/…\u003c/code>\u003c/td>\u003ctd>hook و صفحه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ccode>apps/web/src/lib/errorText.ts\u003c/code>\u003c/td>\u003ctd>متن خطاهای جدید (اگر \u003ccode>code\u003c/code> تازه دارید)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"۱-schema-در-shared\">۱. schema در shared\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// packages/shared/src/schemas.ts\nexport const noteInputSchema = z.object({\n  body: z.string().trim().min(1).max(2000),\n  pinned: z.boolean().default(false),\n});\nexport type NoteInput = z.infer&lt;typeof noteInputSchema&gt;;\u003c/code>\u003c/pre>\n\u003ch2 id=\"۲-routeها\">۲. routeها\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/api/src/modules/notes/notes.routes.ts\nimport { noteInputSchema } from '@site-builder/shared';\nimport { ApiRouter, idParam, pageMeta, paginationQuery } from '../../common/http.js';\nimport { notFound } from '../../common/errors.js';\nimport { requirePermission } from '../../middleware/tenant.js';\nimport { auditTenant } from '../audit/audit.js';\n\n/** Internal notes of a site, for its staff only. */\nexport function notesRoutes() {\n  const r = new ApiRouter('/api/v1/sites/:siteId/notes', 'Notes', true);\n\n  r.route(\n    { method: 'get', path: '/', summary: 'List notes, pinned first', query: paginationQuery, middleware: [requirePermission('leads:read')] },\n    async ({ req, query }) =&gt; {\n      const { rows } = await req.tenant!.db.query(\n        `SELECT id, body, pinned, created_at AS &quot;createdAt&quot;, count(*) OVER()::int AS total\n           FROM notes ORDER BY pinned DESC, created_at DESC LIMIT $1 OFFSET $2`,\n        [query.pageSize, (query.page - 1) * query.pageSize],\n      );\n      return { data: rows.map(({ total: _t, ...n }) =&gt; n), meta: pageMeta(query.page, query.pageSize, rows[0]?.total ?? 0) };\n    },\n  );\n\n  r.route(\n    { method: 'post', path: '/', summary: 'Add a note', status: 201, body: noteInputSchema, middleware: [requirePermission('leads:write')] },\n    async ({ req, body }) =&gt; {\n      const { rows } = await req.tenant!.db.query(\n        'INSERT INTO notes (body, pinned, created_by) VALUES ($1, $2, $3) RETURNING id, body, pinned, created_at AS &quot;createdAt&quot;',\n        [body.body, body.pinned, req.auth!.user.id],\n      );\n      await auditTenant(req.tenant!.db, { actorUserId: req.auth!.user.id, action: 'note.created', target: rows[0].id });\n      return { data: rows[0] };\n    },\n  );\n\n  r.route({ method: 'delete', path: '/:id', summary: 'Delete a note', params: idParam, middleware: [requirePermission('leads:write')] }, async ({ req, params }) =&gt; {\n    const { rowCount } = await req.tenant!.db.query('DELETE FROM notes WHERE id = $1', [params.id]);\n    if (!rowCount) throw notFound('Note');\n  });\n\n  return r.router;\n}\u003c/code>\u003c/pre>\n\u003ch2 id=\"۳-وصل-کردن-در-appts\">۳. وصل کردن در \u003ccode>app.ts\u003c/code>\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// زیر بقیهٔ site.use(...)ها\nsite.use('/notes', notesRoutes());\u003c/code>\u003c/pre>\n\u003cp>router \u003ccode>site\u003c/code> پیش از این، ورود، CSRF و عضویت در سایت را بررسی کرده است. شما فقط مجوز را با \u003ccode>requirePermission\u003c/code> اضافه می‌کنید.\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>آدرس از چه نوعی است؟\u003c/th>\u003cth>کجا وصل شود\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>مال یک سایت، برای کارکنان\u003c/td>\u003ctd>\u003ccode>site.use('/…', …)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مال یک سایت، برای بازدیدکننده\u003c/td>\u003ctd>کنار \u003ccode>publicRoutes\u003c/code> با \u003ccode>loadPublicTenant(ctx)\u003c/code> و \u003ccode>loadCustomer()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کل استودیو، فقط اپراتور\u003c/td>\u003ctd>\u003ccode>app.use('/api/v1/platform/…', requirePlatformAdmin, …)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ساختار سایت (در cell فقط اپراتور)\u003c/td>\u003ctd>\u003ccode>operatorOnly\u003c/code> را به \u003ccode>middleware\u003c/code> اضافه کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>بخشی که ماژول دارد\u003c/td>\u003ctd>\u003ccode>r.router.use(requireModule('…'))\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"۴-تست\">۴. تست\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/api/test/notes.test.ts\nimport { afterAll, beforeAll, describe, expect, it } from 'vitest';\nimport { closeContext } from '../src/context.js';\nimport { createAdmin, createTenant, createTestServer, signIn, type Client } from './helpers.js';\n\nconst { ctx, app } = createTestServer();\nlet owner: Client;\nlet base: string;\n\nbeforeAll(async () =&gt; {\n  const admin = await createAdmin(ctx);\n  const site = await createTenant(ctx, admin.id);\n  owner = await signIn(app, site.ownerEmail);\n  base = `/api/v1/sites/${site.slug}/notes`;\n});\nafterAll(() =&gt; closeContext(ctx));\n\ndescribe('notes', () =&gt; {\n  it('adds and lists notes, pinned first', async () =&gt; {\n    expect((await owner.post(base, { body: 'later' })).status).toBe(201);\n    expect((await owner.post(base, { body: 'first', pinned: true })).status).toBe(201);\n    const list = await owner.get(base);\n    expect(list.body.data.map((n: { body: string }) =&gt; n.body)).toEqual(['first', 'later']);\n  });\n\n  it('rejects an empty note', async () =&gt; {\n    const res = await owner.post(base, { body: '' });\n    expect(res.status).toBe(400);\n    expect(res.body.error.code).toBe('validation_failed');\n  });\n});\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker start sb-test-pg\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>cd apps/api &amp;&amp; npx vitest run test/notes.test.ts\u003c/code>\u003c/pre>\n\u003ch2 id=\"۵-استفاده-در-وب\">۵. استفاده در وب\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/web/src/admin/notes/api.ts\nexport const notesKey = (siteId: string) =&gt; ['admin', siteId, 'notes'];\nexport function useNotes(siteId: string) {\n  return useQuery({ queryKey: notesKey(siteId), queryFn: () =&gt; api.page&lt;Note[]&gt;(`/sites/${siteId}/notes`) });\n}\nexport function useAddNote(siteId: string) {\n  const qc = useQueryClient();\n  return useMutation({\n    mutationFn: (input: NoteInput) =&gt; api.post&lt;Note&gt;(`/sites/${siteId}/notes`, input),\n    onSuccess: () =&gt; qc.invalidateQueries({ queryKey: notesKey(siteId) }),\n  });\n}\u003c/code>\u003c/pre>\n\u003cul>\u003cli>صفحه را در \u003ccode>admin/pages/\u003c/code> بسازید، در \u003ccode>SitePages.tsx\u003c/code> یک \u003ccode>&lt;Route path=&quot;notes&quot;&gt;\u003c/code> بدهید و لینکش را در \u003ccode>SiteNav\u003c/code> (\u003ccode>AdminRoot.tsx\u003c/code>) بگذارید.\u003c/li>\u003cli>برای نمایش خطا از اجزای موجود (\u003ccode>ErrorNote\u003c/code>، \u003ccode>useErrorLine\u003c/code> در \u003ccode>admin/ui.tsx\u003c/code>) استفاده کنید. این‌ها پیام را از \u003ccode>errorText.ts\u003c/code> می‌گیرند.\u003c/li>\u003cli>متن‌ها را دوزبانه بنویسید: \u003ccode>L('Notes', 'یادداشت‌ها')\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۶-پیش-از-تمام-شدن\">۶. پیش از تمام شدن\u003c/h2>\n\u003col>\u003cli>\u003ccode>npm run typecheck\u003c/code> و \u003ccode>npm test\u003c/code>\u003c/li>\u003cli>rebuild کانتینرها و بررسی در http://admin.localhost\u003c/li>\u003cli>مسیرها را در http://admin.localhost/api/v1/openapi.json ببینید؛ باید خودکار آمده باشند.\u003c/li>\u003cli>صفحهٔ قابلیت مربوط در \u003ccode>docs/dev/04-features/\u003c/code> و \u003ccode>docs/features/\u003c/code> را به‌روز کنید.\u003c/li>\u003c/ol>","text":" دستورالعمل: مسیر یا ماژول API جدید فصل ۵ — دستورالعمل‌ها · زمینه: API ../03 layers/api.md ، مسیر یک درخواست ../02 architecture/request path.md مثال: ماژول notes یادداشت‌های داخلی سایت با فهرست و افزودن، به‌علاوهٔ استفاده در پنل. فایل‌ها فایل چه چیزی 1 apps/api/src/database/tenant/migrations/012_notes.sql جدول اگر لازم است → migration جدید new migration.md 2 packages/shared/src/schemas.ts یا فایل مرتبط schema ورودی 3 apps/api/src/modules/notes/notes.routes.ts routeها 4 apps/api/src/modules/notes/notes.service.ts منطق اگر بیش از چند خط است 5 apps/api/src/app.ts وصل کردن router 6 apps/api/test/notes.test.ts تست 7 apps/web/src/admin/… hook و صفحه 8 apps/web/src/lib/errorText.ts متن خطاهای جدید اگر code تازه دارید ۱. schema در shared ۲. routeها ۳. وصل کردن در app.ts router site پیش از این، ورود، CSRF و عضویت در سایت را بررسی کرده است. شما فقط مجوز را با requirePermission اضافه می‌کنید. آدرس از چه نوعی است؟ کجا وصل شود مال یک سایت، برای کارکنان site.use '/…', … مال یک سایت، برای بازدیدکننده کنار publicRoutes با loadPublicTenant ctx و loadCustomer کل استودیو، فقط اپراتور app.use '/api/v1/platform/…', requirePlatformAdmin, … ساختار سایت در cell فقط اپراتور operatorOnly را به middleware اضافه کنید بخشی که ماژول دارد r.router.use requireModule '…' ۴. تست ۵. استفاده در وب صفحه را در admin/pages/ بسازید، در SitePages.tsx یک \u003cRoute path=\"notes\" بدهید و لینکش را در SiteNav AdminRoot.tsx بگذارید. برای نمایش خطا از اجزای موجود ErrorNote ، useErrorLine در admin/ui.tsx استفاده کنید. این‌ها پیام را از errorText.ts می‌گیرند. متن‌ها را دوزبانه بنویسید: L 'Notes', 'یادداشت‌ها' . ۶. پیش از تمام شدن 1. npm run typecheck و npm test 2. rebuild کانتینرها و بررسی در http://admin.localhost 3. مسیرها را در http://admin.localhost/api/v1/openapi.json ببینید؛ باید خودکار آمده باشند. 4. صفحهٔ قابلیت مربوط در docs/dev/04 features/ و docs/features/ را به‌روز کنید. ","headings":[{"level":2,"id":"فایلها","text":"فایل‌ها"},{"level":2,"id":"۱-schema-در-shared","text":"۱. schema در shared"},{"level":2,"id":"۲-routeها","text":"۲. routeها"},{"level":2,"id":"۳-وصل-کردن-در-appts","text":"۳. وصل کردن در app.ts"},{"level":2,"id":"۴-تست","text":"۴. تست"},{"level":2,"id":"۵-استفاده-در-وب","text":"۵. استفاده در وب"},{"level":2,"id":"۶-پیش-از-تمام-شدن","text":"۶. پیش از تمام شدن"}]},{"path":"05-recipes/new-migration.md","title":"دستورالعمل: migration جدید","html":"\u003ch1 id=\"دستورالعمل-migration-جدید\">دستورالعمل: migration جدید\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۵ — دستورالعمل‌ها · زمینه: \u003ca href=\"#03-layers/migrations.md\">migrationها\u003c/a>، \u003ca href=\"#03-layers/data-model.md\">مدل داده\u003c/a>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"۱-کدام-دیتابیس\">۱. کدام دیتابیس؟\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>داده مال…\u003c/th>\u003cth>پوشه\u003c/th>\u003cth>شمارهٔ بعدی (2026-11-03)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>یک سایت (صفحه، سفارش، مشتری…)\u003c/td>\u003ctd>\u003ccode>apps/api/src/database/tenant/migrations/\u003c/code>\u003c/td>\u003ctd>\u003ccode>012_…sql\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>کل استودیو (کاربر، starter، kit…)\u003c/td>\u003ctd>\u003ccode>apps/api/src/database/control-plane/migrations/\u003c/code>\u003c/td>\u003ctd>\u003ccode>007_…sql\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>پیش از انتخاب شماره، فهرست پوشه را ببینید؛ شاید کس دیگری شماره را گرفته باشد.\u003c/p>\n\u003ch2 id=\"۲-نوشتن\">۲. نوشتن\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>-- apps/api/src/database/tenant/migrations/012_notes.sql\n-- Internal notes of a site, shown to its staff only.\nCREATE TABLE IF NOT EXISTS notes (\n  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  body        text NOT NULL CHECK (length(body) BETWEEN 1 AND 2000),\n  pinned      boolean NOT NULL DEFAULT false,\n  created_by  uuid,\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS notes_pinned_created ON notes (pinned DESC, created_at DESC);\u003c/code>\u003c/pre>\n\u003cp>قواعد:\u003c/p>\n\u003cul>\u003cli>\u003ccode>BEGIN\u003c/code> و \u003ccode>COMMIT\u003c/code> ننویسید؛ migrator هر فایل را در یک تراکنش اجرا می‌کند.\u003c/li>\u003cli>\u003cstrong>روی دیتابیس پر هم درست کار کند.\u003c/strong> ستون \u003ccode>NOT NULL\u003c/code> جدید یا \u003ccode>DEFAULT\u003c/code> می‌خواهد، یا باید در همان فایل مقدار ردیف‌های موجود را پر کنید.\u003c/li>\u003cli>ستون jsonb؟ ساختارش را در \u003ccode>packages/shared\u003c/code> با zod تعریف کنید.\u003c/li>\u003cli>دادهٔ نمونه دارد؟ ستون \u003ccode>demo boolean NOT NULL DEFAULT false\u003c/code> بدهید و پاک‌کردنش را به \u003ccode>deploy/export/drop-demo.sql\u003c/code> و \u003ccode>clearDemoData\u003c/code> (\u003ccode>modules/platform/setup/demo.ts\u003c/code>) اضافه کنید.\u003c/li>\u003cli>کلید \u003ccode>uuid\u003c/code> به جدول دیتابیس \u003cstrong>کنترل\u003c/strong> (مثلاً \u003ccode>users.id\u003c/code>) را نمی‌شود \u003ccode>REFERENCES\u003c/code> کرد، چون در دیتابیس دیگری است (مثل \u003ccode>created_by\u003c/code> بالا).\u003c/li>\u003cli>serial یا bigserial دارد؟ کاری لازم نیست؛ \u003ccode>deploy/export/fix-sequences.sql\u003c/code> همهٔ sequenceها را خودکار پیدا و درست می‌کند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۳-اجرا\">۳. اجرا\u003c/h2>\n\u003cp>migrationها در شروع API اجرا می‌شوند:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml up -d --build studio-api\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml logs studio-api\u003c/code>\u003c/pre>\n\u003cp>تست‌ها هم دیتابیس‌های تازه با همهٔ migrationها می‌سازند:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>npm test\u003c/code>\u003c/pre>\n\u003ch2 id=\"۴-اگر-اشتباه-کردید\">۴. اگر اشتباه کردید\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>هنوز commit یا اجرا نشده:\u003c/strong> فایل را ویرایش کنید.\u003c/li>\u003cli>\u003cstrong>روی استودیوی خودتان اجرا شده:\u003c/strong> فایل را ویرایش نکنید، چون خطای checksum می‌گیرید. یک migration تازه بنویسید که اشتباه را اصلاح کند.\u003c/li>\u003cli>\u003cstrong>خطای \u003ccode>Migration … was modified after it was applied\u003c/code>:\u003c/strong> فایل را به نسخهٔ commitشده برگردانید (\u003ccode>git checkout -- &lt;file&gt;\u003c/code>) و اصلاح را در یک فایل جدید بنویسید.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۵-مستندات\">۵. مستندات\u003c/h2>\n\u003cp>جدول را به \u003ca href=\"#03-layers/data-model.md\">مدل داده\u003c/a> اضافه کنید و در \u003ccode>AGENTS.md\u003c/code> «latest» migration را به‌روز کنید.\u003c/p>","text":" دستورالعمل: migration جدید فصل ۵ — دستورالعمل‌ها · زمینه: migrationها ../03 layers/migrations.md ، مدل داده ../03 layers/data model.md ۱. کدام دیتابیس؟ داده مال… پوشه شمارهٔ بعدی 2026 11 03 یک سایت صفحه، سفارش، مشتری… apps/api/src/database/tenant/migrations/ 012_…sql کل استودیو کاربر، starter، kit… apps/api/src/database/control plane/migrations/ 007_…sql پیش از انتخاب شماره، فهرست پوشه را ببینید؛ شاید کس دیگری شماره را گرفته باشد. ۲. نوشتن قواعد: BEGIN و COMMIT ننویسید؛ migrator هر فایل را در یک تراکنش اجرا می‌کند. روی دیتابیس پر هم درست کار کند. ستون NOT NULL جدید یا DEFAULT می‌خواهد، یا باید در همان فایل مقدار ردیف‌های موجود را پر کنید. ستون jsonb؟ ساختارش را در packages/shared با zod تعریف کنید. دادهٔ نمونه دارد؟ ستون demo boolean NOT NULL DEFAULT false بدهید و پاک‌کردنش را به deploy/export/drop demo.sql و clearDemoData modules/platform/setup/demo.ts اضافه کنید. کلید uuid به جدول دیتابیس کنترل مثلاً users.id را نمی‌شود REFERENCES کرد، چون در دیتابیس دیگری است مثل created_by بالا . serial یا bigserial دارد؟ کاری لازم نیست؛ deploy/export/fix sequences.sql همهٔ sequenceها را خودکار پیدا و درست می‌کند. ۳. اجرا migrationها در شروع API اجرا می‌شوند: تست‌ها هم دیتابیس‌های تازه با همهٔ migrationها می‌سازند: ۴. اگر اشتباه کردید هنوز commit یا اجرا نشده: فایل را ویرایش کنید. روی استودیوی خودتان اجرا شده: فایل را ویرایش نکنید، چون خطای checksum می‌گیرید. یک migration تازه بنویسید که اشتباه را اصلاح کند. خطای Migration … was modified after it was applied : فایل را به نسخهٔ commitشده برگردانید git checkout \u003cfile و اصلاح را در یک فایل جدید بنویسید. ۵. مستندات جدول را به مدل داده ../03 layers/data model.md اضافه کنید و در AGENTS.md «latest» migration را به‌روز کنید. ","headings":[{"level":2,"id":"۱-کدام-دیتابیس","text":"۱. کدام دیتابیس؟"},{"level":2,"id":"۲-نوشتن","text":"۲. نوشتن"},{"level":2,"id":"۳-اجرا","text":"۳. اجرا"},{"level":2,"id":"۴-اگر-اشتباه-کردید","text":"۴. اگر اشتباه کردید"},{"level":2,"id":"۵-مستندات","text":"۵. مستندات"}]},{"path":"05-recipes/new-payment-gateway.md","title":"دستورالعمل: درگاه پرداخت جدید","html":"\u003ch1 id=\"دستورالعمل-درگاه-پرداخت-جدید\">دستورالعمل: درگاه پرداخت جدید\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۵ — دستورالعمل‌ها · زمینه: \u003ca href=\"#04-features/shop-and-payments.md\">فروشگاه و پرداخت\u003c/a> · فایل‌ها: \u003ccode>apps/api/src/modules/payments/gateways.ts\u003c/code>، \u003ccode>drivers.ts\u003c/code>، \u003ccode>apps/api/test/payments.test.ts\u003c/code>\u003c/p>\u003c/blockquote>\n\u003cp>افزودن درگاه یعنی \u003cstrong>یک کلاس\u003c/strong> و \u003cstrong>یک ردیف driver\u003c/strong>. کاتالوگ استودیو، فرم تنظیمات سایت، فهرست checkout و تراکنش‌ها خودکار آن را برمی‌دارند. migration لازم نیست، چون \u003ccode>payment_gateways\u003c/code> برای هر \u003ccode>provider\u003c/code> یک ردیف دارد که هنگام نیاز ساخته می‌شود.\u003c/p>\n\u003ch2 id=\"۱-کلاس-gateway\">۱. کلاس gateway\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/api/src/modules/payments/gateways.ts\n/**\n * Example Pay REST v1. Amounts are sent in rials (IRR).\n * Written against the provider's published API; tested with mocked HTTP only.\n */\nexport class ExamplePayGateway implements PaymentGateway {\n  readonly name = 'examplepay';\n  constructor(private readonly apiKey: string, readonly isTest: boolean, private readonly fetchFn: Fetch = fetch) {}\n\n  async request(req: PaymentRequest) {\n    const res = await this.fetchFn('https://api.examplepay.ir/v1/request', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', 'X-API-KEY': this.apiKey },\n      body: JSON.stringify({ amount: Number(req.amountMinor), callback: req.callbackUrl, description: req.description, mobile: req.mobile }),\n    });\n    const json = await res.json();\n    if (!res.ok || !json.token) throw new Error(`ExamplePay request failed: ${json.message ?? res.status}`);\n    return { authority: json.token, redirectUrl: `https://pay.examplepay.ir/${json.token}` };\n  }\n\n  /** Server-to-server confirmation: the only thing that may mark a payment as paid. */\n  async verify({ authority, amountMinor }: VerifyArgs): Promise&lt;VerifyResult&gt; {\n    const res = await this.fetchFn('https://api.examplepay.ir/v1/verify', { /* … */ });\n    const json = await res.json();\n    if (json.status !== 'paid' || BigInt(json.amount) !== amountMinor) return { ok: false, reason: json.message ?? 'not paid' };\n    return { ok: true, refId: String(json.refId), cardPan: json.card };\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>قواعد:\u003c/p>\n\u003cul>\u003cli>مبلغ‌ها \u003ccode>bigint\u003c/code> و به واحد کوچک هستند. اگر درگاه تومان می‌خواهد، تبدیل را \u003cstrong>داخل کلاس\u003c/strong> انجام دهید.\u003c/li>\u003cli>\u003ccode>verify\u003c/code> باید \u003cstrong>مبلغ\u003c/strong> را هم بررسی کند.\u003c/li>\u003cli>\u003ccode>fetchFn\u003c/code> را از constructor بگیرید (\u003ccode>ctx.httpFetch\u003c/code>) تا در تست با پاسخ ساختگی جایگزین شود.\u003c/li>\u003cli>خطای شبکه را throw کنید؛ لایهٔ بالا آن را به پیام مناسب تبدیل می‌کند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۲-ردیف-driver\">۲. ردیف driver\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/api/src/modules/payments/drivers.ts — داخل PAYMENT_DRIVERS\n{\n  key: 'examplepay',\n  name: { en: 'Example Pay', fa: 'اگزمپل‌پی' },\n  fields: [uuidField('apiKey', { en: 'API key', fa: 'کلید API' }, 'Enter a valid Example Pay API key (36 characters)')],\n  testMode: 'toggle',                 // یا 'auto' / 'always'\n  available: () =&gt; true,\n  create: (ctx, c) =&gt; new ExamplePayGateway(c.credentials.apiKey, c.testMode, ctx.httpFetch),\n  readCallback: (a) =&gt; ({ authority: a.token, status: okIf(a.status === undefined ? undefined : a.status === 'paid') }),\n},\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>fields\u003c/code>: هر فیلد \u003ccode>key\u003c/code>، برچسب دوزبانه، \u003ccode>hint\u003c/code> اختیاری، \u003ccode>pattern\u003c/code> و پیام \u003ccode>invalid\u003c/code> دارد. فرم پنل از روی همین ساخته می‌شود و \u003ccode>credentialProblem\u003c/code> با همین‌ها اعتبارسنجی می‌کند.\u003c/li>\u003cli>\u003ccode>readCallback\u003c/code>: پارامترهایی که درگاه به آدرس بازگشت (\u003ccode>/api/v1/payments/callback/:slug/:paymentId\u003c/code>، GET یا POST) می‌فرستد را به \u003ccode>authority\u003c/code> و \u003ccode>OK\u003c/code>/\u003ccode>NOK\u003c/code> تبدیل می‌کند. این فقط یک نشانه است؛ تصمیم نهایی با \u003ccode>verify\u003c/code> است.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۳-تست\">۳. تست\u003c/h2>\n\u003cp>در \u003ccode>apps/api/test/payments.test.ts\u003c/code> الگوی درگاه‌های موجود را دنبال کنید: \u003ccode>ctx.httpFetch\u003c/code> را با تابعی جایگزین کنید که پاسخ‌های request و verify را شبیه‌سازی کند. این موارد را تست کنید:\u003c/p>\n\u003col>\u003cli>پرداخت موفق: verify با مبلغ درست ← سفارش پرداخت‌شده،\u003c/li>\u003cli>لغو (\u003ccode>NOK\u003c/code>) ← ناموفق،\u003c/li>\u003cli>مبلغ متفاوت در verify ← ناموفق،\u003c/li>\u003cli>اطلاعات اتصال نامعتبر ← \u003ccode>PUT …/gateways/examplepay\u003c/code> با 400 رد شود.\u003c/li>\u003c/ol>\n\u003ch2 id=\"۴-بررسی-در-استودیو\">۴. بررسی در استودیو\u003c/h2>\n\u003col>\u003cli>rebuild کانتینرها.\u003c/li>\u003cli>Platform ← Payment gateways: درگاه جدید در فهرست است.\u003c/li>\u003cli>یک سایت ← تنظیمات پرداخت: درگاه را با کلید تست روشن کنید و «Test connection» را بزنید.\u003c/li>\u003cli>در سایت پیش‌نمایش یک خرید کنید. فقط با کلید تست؛ هیچ‌وقت با اطلاعات واقعی.\u003c/li>\u003c/ol>\n\u003ch2 id=\"۵-مستندات\">۵. مستندات\u003c/h2>\n\u003cp>نام درگاه را به فهرست driverها در \u003ca href=\"#04-features/shop-and-payments.md\">فروشگاه و پرداخت\u003c/a> و \u003ccode>docs/features/shop.md\u003c/code> اضافه کنید.\u003c/p>","text":" دستورالعمل: درگاه پرداخت جدید فصل ۵ — دستورالعمل‌ها · زمینه: فروشگاه و پرداخت ../04 features/shop and payments.md · فایل‌ها: apps/api/src/modules/payments/gateways.ts ، drivers.ts ، apps/api/test/payments.test.ts افزودن درگاه یعنی یک کلاس و یک ردیف driver . کاتالوگ استودیو، فرم تنظیمات سایت، فهرست checkout و تراکنش‌ها خودکار آن را برمی‌دارند. migration لازم نیست، چون payment_gateways برای هر provider یک ردیف دارد که هنگام نیاز ساخته می‌شود. ۱. کلاس gateway قواعد: مبلغ‌ها bigint و به واحد کوچک هستند. اگر درگاه تومان می‌خواهد، تبدیل را داخل کلاس انجام دهید. verify باید مبلغ را هم بررسی کند. fetchFn را از constructor بگیرید ctx.httpFetch تا در تست با پاسخ ساختگی جایگزین شود. خطای شبکه را throw کنید؛ لایهٔ بالا آن را به پیام مناسب تبدیل می‌کند. ۲. ردیف driver fields : هر فیلد key ، برچسب دوزبانه، hint اختیاری، pattern و پیام invalid دارد. فرم پنل از روی همین ساخته می‌شود و credentialProblem با همین‌ها اعتبارسنجی می‌کند. readCallback : پارامترهایی که درگاه به آدرس بازگشت /api/v1/payments/callback/:slug/:paymentId ، GET یا POST می‌فرستد را به authority و OK / NOK تبدیل می‌کند. این فقط یک نشانه است؛ تصمیم نهایی با verify است. ۳. تست در apps/api/test/payments.test.ts الگوی درگاه‌های موجود را دنبال کنید: ctx.httpFetch را با تابعی جایگزین کنید که پاسخ‌های request و verify را شبیه‌سازی کند. این موارد را تست کنید: 1. پرداخت موفق: verify با مبلغ درست ← سفارش پرداخت‌شده، 2. لغو NOK ← ناموفق، 3. مبلغ متفاوت در verify ← ناموفق، 4. اطلاعات اتصال نامعتبر ← PUT …/gateways/examplepay با 400 رد شود. ۴. بررسی در استودیو 1. rebuild کانتینرها. 2. Platform ← Payment gateways: درگاه جدید در فهرست است. 3. یک سایت ← تنظیمات پرداخت: درگاه را با کلید تست روشن کنید و «Test connection» را بزنید. 4. در سایت پیش‌نمایش یک خرید کنید. فقط با کلید تست؛ هیچ‌وقت با اطلاعات واقعی. ۵. مستندات نام درگاه را به فهرست driverها در فروشگاه و پرداخت ../04 features/shop and payments.md و docs/features/shop.md اضافه کنید. ","headings":[{"level":2,"id":"۱-کلاس-gateway","text":"۱. کلاس gateway"},{"level":2,"id":"۲-ردیف-driver","text":"۲. ردیف driver"},{"level":2,"id":"۳-تست","text":"۳. تست"},{"level":2,"id":"۴-بررسی-در-استودیو","text":"۴. بررسی در استودیو"},{"level":2,"id":"۵-مستندات","text":"۵. مستندات"}]},{"path":"05-recipes/new-ready-starter.md","title":"دستورالعمل: starter آماده جدید","html":"\u003ch1 id=\"دستورالعمل-starter-آماده-جدید\">دستورالعمل: starter آماده جدید\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۵ — دستورالعمل‌ها · زمینه: \u003ca href=\"#04-features/starters.md\">starterها\u003c/a> · فایل: \u003ccode>apps/api/src/modules/starters/samples.ts\u003c/code>\u003c/p>\u003c/blockquote>\n\u003cp>starterهای «آماده» در کد هستند و در هر شروع API به استودیو اضافه می‌شوند. برای starterی که فقط روی استودیوی خودتان لازم است، کد ننویسید: آن را از یک سایت با «Save as starter» ذخیره کنید.\u003c/p>\n\u003ch2 id=\"۱-افزودن-به-samples\">۱. افزودن به \u003ccode>SAMPLES\u003c/code>\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/api/src/modules/starters/samples.ts — داخل SAMPLES\n{\n  key: 'page-faq-simple',              // یکتا و دائمی؛ هرگز برای starter دیگری استفاده نشود\n  kind: 'page',                        // 'page' | 'table' | 'header' | 'footer'\n  group: G.about,                      // گروه در فهرست starterها (از شیء G)\n  name: 'پرسش‌های پرتکرار / FAQ',\n  description: 'Questions and answers with a contact button.',\n  page: {\n    slug: 'faq',\n    title: Lx('FAQ', 'پرسش‌های پرتکرار'),\n    sections: [\n      header(Lx('Questions', 'پرسش‌ها'), Lx('Short answers to common questions.', 'پاسخ کوتاه به پرسش‌های رایج.')),\n      sec('faq', { items: [ /* … */ ] }),\n      sec('cta', { heading: Lx('Still unsure?', 'هنوز سؤال دارید؟'), buttons: [btn('Contact us', 'تماس با ما', '/contact')] }),\n    ],\n  },\n},\u003c/code>\u003c/pre>\n\u003cp>کمکی‌های همین فایل: \u003ccode>Lx(en, fa)\u003c/code> (متن دوزبانه)، \u003ccode>sec(type, props)\u003c/code> (سکشن)، \u003ccode>header(…)\u003c/code>، \u003ccode>btn(…)\u003c/code>، \u003ccode>photo(PHOTOS.x)\u003c/code>.\u003c/p>\n\u003cp>گزینه‌های دیگر \u003ccode>Sample\u003c/code>:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>فیلد\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>pages\u003c/code>\u003c/td>\u003ctd>صفحه‌های همراه: \u003ccode>detail\u003c/code> (صفحهٔ آیتم یک جدول، با \u003ccode>detailOf\u003c/code>) یا \u003ccode>linked\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tables\u003c/code>\u003c/td>\u003ctd>slug جدول‌هایی از جدول‌های آماده که همراه starter می‌آیند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>products\u003c/code>\u003c/td>\u003ctd>محصولات نمونه هم بیاید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>forms\u003c/code>\u003c/td>\u003ctd>request typeهای همراه\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>site\u003c/code>\u003c/td>\u003ctd>برای header و footer: \u003ccode>site.header\u003c/code> یا \u003ccode>site.footer\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>اگر صفحه جای یک صفحهٔ داخلی را می‌گیرد، slug آن را از \u003ccode>SYSTEM_PAGES\u003c/code> بگذارید و در \u003ccode>description\u003c/code> بگویید («Use the address …»).\u003c/p>\n\u003ch2 id=\"۲-اگر-سکشنها-درست-نباشند\">۲. اگر سکشن‌ها درست نباشند\u003c/h2>\n\u003cp>همهٔ props با \u003ccode>parseSectionProps\u003c/code> اعتبارسنجی می‌شوند. تست \u003ccode>starters.test.ts\u003c/code> \u003cstrong>همهٔ\u003c/strong> \u003ccode>SAMPLES\u003c/code> را روی یک سایت خالی می‌سازد و اعمال می‌کند، پس هر prop اشتباه آنجا پیدا می‌شود:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>cd apps/api &amp;&amp; npx vitest run test/starters.test.ts\u003c/code>\u003c/pre>\n\u003ch2 id=\"۳-به-استودیو-رسیدن\">۳. به استودیو رسیدن\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker compose -f deploy/docker-compose.yml up -d --build studio-api\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>add-sample-starters\u003c/code> فقط \u003ccode>key\u003c/code>هایی را اضافه می‌کند که در \u003ccode>app_settings.starter_samples\u003c/code> نیستند.\u003c/p>\n\u003cul>\u003cli>starter جدید اضافه می‌شود.\u003c/li>\u003cli>\u003cstrong>تغییر\u003c/strong> یک starter موجود به استودیوهایی که آن را قبلاً گرفته‌اند \u003cstrong>نمی‌رسد\u003c/strong>. برای عرضهٔ نسخهٔ جدید، key تازه بدهید (مثلاً \u003ccode>page-faq-simple-2\u003c/code>) یا در پنل starter قدیمی را با «replace» به‌روز کنید.\u003c/li>\u003cli>starterی که اپراتور حذف کرده، برنمی‌گردد.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۴-kit-عمومی\">۴. kit عمومی\u003c/h2>\n\u003cp>جدول‌های starterهای آماده یک‌بار به kit عمومی اضافه می‌شوند (\u003ccode>seedGeneralKit\u003c/code>). جدول آمادهٔ جدید به استودیویی که قبلاً seed شده خودکار اضافه نمی‌شود؛ از صفحهٔ Site kits اضافه‌اش کنید.\u003c/p>","text":" دستورالعمل: starter آماده جدید فصل ۵ — دستورالعمل‌ها · زمینه: starterها ../04 features/starters.md · فایل: apps/api/src/modules/starters/samples.ts starterهای «آماده» در کد هستند و در هر شروع API به استودیو اضافه می‌شوند. برای starterی که فقط روی استودیوی خودتان لازم است، کد ننویسید: آن را از یک سایت با «Save as starter» ذخیره کنید. ۱. افزودن به SAMPLES کمکی‌های همین فایل: Lx en, fa متن دوزبانه ، sec type, props سکشن ، header … ، btn … ، photo PHOTOS.x . گزینه‌های دیگر Sample : فیلد کار pages صفحه‌های همراه: detail صفحهٔ آیتم یک جدول، با detailOf یا linked tables slug جدول‌هایی از جدول‌های آماده که همراه starter می‌آیند products محصولات نمونه هم بیاید forms request typeهای همراه site برای header و footer: site.header یا site.footer اگر صفحه جای یک صفحهٔ داخلی را می‌گیرد، slug آن را از SYSTEM_PAGES بگذارید و در description بگویید «Use the address …» . ۲. اگر سکشن‌ها درست نباشند همهٔ props با parseSectionProps اعتبارسنجی می‌شوند. تست starters.test.ts همهٔ SAMPLES را روی یک سایت خالی می‌سازد و اعمال می‌کند، پس هر prop اشتباه آنجا پیدا می‌شود: ۳. به استودیو رسیدن add sample starters فقط key هایی را اضافه می‌کند که در app_settings.starter_samples نیستند. starter جدید اضافه می‌شود. تغییر یک starter موجود به استودیوهایی که آن را قبلاً گرفته‌اند نمی‌رسد . برای عرضهٔ نسخهٔ جدید، key تازه بدهید مثلاً page faq simple 2 یا در پنل starter قدیمی را با «replace» به‌روز کنید. starterی که اپراتور حذف کرده، برنمی‌گردد. ۴. kit عمومی جدول‌های starterهای آماده یک‌بار به kit عمومی اضافه می‌شوند seedGeneralKit . جدول آمادهٔ جدید به استودیویی که قبلاً seed شده خودکار اضافه نمی‌شود؛ از صفحهٔ Site kits اضافه‌اش کنید. ","headings":[{"level":2,"id":"۱-افزودن-به-samples","text":"۱. افزودن به SAMPLES"},{"level":2,"id":"۲-اگر-سکشنها-درست-نباشند","text":"۲. اگر سکشن‌ها درست نباشند"},{"level":2,"id":"۳-به-استودیو-رسیدن","text":"۳. به استودیو رسیدن"},{"level":2,"id":"۴-kit-عمومی","text":"۴. kit عمومی"}]},{"path":"05-recipes/new-section.md","title":"دستورالعمل: نوع سکشن جدید","html":"\u003ch1 id=\"دستورالعمل-نوع-سکشن-جدید\">دستورالعمل: نوع سکشن جدید\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۵ — دستورالعمل‌ها · زمینه: \u003ca href=\"#04-features/pages-and-sections.md\">صفحات و سکشن‌ها\u003c/a>\u003c/p>\u003c/blockquote>\n\u003cp>مثال: سکشنی به نام \u003ccode>quote\u003c/code> (یک نقل‌قول با نام گوینده و عکس).\u003c/p>\n\u003ch2 id=\"فایلهایی-که-عوض-میشوند\">فایل‌هایی که عوض می‌شوند\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>فایل\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ccode>packages/shared/src/sections.ts\u003c/code>\u003c/td>\u003ctd>schema در \u003ccode>sectionDefinitions\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ccode>apps/web/src/sections/renderers.tsx\u003c/code> (یا فایل جدید کنارش)\u003c/td>\u003ctd>کامپوننت + ثبت در \u003ccode>sectionRenderers\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ccode>apps/web/src/admin/builder/fields.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>sectionMeta\u003c/code>: نام، توضیح، فیلدها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ccode>apps/web/src/test/sections.test.tsx\u003c/code>\u003c/td>\u003ctd>تست رندر\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ccode>packages/shared/src/sections.ts\u003c/code> → \u003ccode>STRUCTURE_KEYS\u003c/code>\u003c/td>\u003ctd>اگر کلیدی ساختاری است (اختیاری)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>API تغییری لازم ندارد، چون سندهای صفحه را با همین schema اعتبارسنجی می‌کند.\u003c/p>\n\u003ch2 id=\"۱-schema-در-shared\">۱. schema در shared\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// packages/shared/src/sections.ts — داخل sectionDefinitions\nquote: z.object({\n  text: loc(600),                  // متن دوزبانه، حداکثر ۶۰۰ نویسه\n  author: loc(120),\n  photoUrl: imageUrlSchema,        // آدرس تصویر (همان قواعد بقیهٔ سکشن‌ها)\n  align: z.enum(['start', 'center']).default('center'),\n}),\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003cstrong>هر فیلد پیش‌فرض داشته باشد.\u003c/strong> \u003ccode>defaultProps(type)\u003c/code> با \u003ccode>parse({})\u003c/code> سکشن تازه را می‌سازد و سندهای قدیمی هم باید بدون خطا parse شوند.\u003c/li>\u003cli>از کمکی‌های موجود در همین فایل استفاده کنید: \u003ccode>loc(n)\u003c/code>، \u003ccode>eyebrowHeading\u003c/code>، \u003ccode>buttons\u003c/code>، \u003ccode>imageUrlSchema\u003c/code>، \u003ccode>hrefSchema\u003c/code>.\u003c/li>\u003cli>\u003ccode>appearance\u003c/code> (فاصله، پس‌زمینه) را اضافه نکنید؛ برای همهٔ سکشن‌ها خودکار است.\u003c/li>\u003cli>اگر بعداً شکل یک prop را عوض کردید، تبدیل شکل قدیمی را با \u003ccode>z.preprocess\u003c/code> در همین schema بنویسید. (نمونه: \u003ccode>hero\u003c/code> دکمهٔ تکی قدیمی را به \u003ccode>buttons\u003c/code> تبدیل می‌کند.)\u003c/li>\u003c/ul>\n\u003ch2 id=\"۲-renderer-در-وب\">۲. renderer در وب\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/web/src/sections/renderers.tsx\nfunction QuoteSection({ props }: { props: SectionProps&lt;'quote'&gt; }) {\n  const { l } = usePreferences();            // متن زبان جاری از { en, fa }\n  if (!l(props.text)) return null;\n  return (\n    &lt;Section&gt;\n      &lt;Container&gt;\n        &lt;blockquote className={cn('text-xl text-ink', props.align === 'center' &amp;&amp; 'text-center')}&gt;\n          {l(props.text)}\n          {l(props.author) &amp;&amp; &lt;footer className=&quot;mt-4 text-sm text-ink-soft&quot;&gt;{l(props.author)}&lt;/footer&gt;}\n        &lt;/blockquote&gt;\n      &lt;/Container&gt;\n    &lt;/Section&gt;\n  );\n}\n\nexport const sectionRenderers: Record&lt;SectionType, AnyRenderer&gt; = {\n  // …\n  quote: QuoteSection,\n};\u003c/code>\u003c/pre>\n\u003cul>\u003cli>props \u003cstrong>قبلاً اعتبارسنجی شده‌اند\u003c/strong> و پیش‌فرض‌ها پر شده‌اند. دوباره بررسی نکنید.\u003c/li>\u003cli>از کلاس‌های token (\u003ccode>text-ink\u003c/code>، \u003ccode>bg-surface\u003c/code>…) استفاده کنید، نه رنگ ثابت.\u003c/li>\u003cli>برای تصویر از \u003ccode>components/ui/Image.tsx\u003c/code> استفاده کنید.\u003c/li>\u003c/ul>\n\u003ch2 id=\"۳-ویرایشگر-در-builder\">۳. ویرایشگر در builder\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/web/src/admin/builder/fields.ts — داخل sectionMeta\nquote: {\n  label: L('Quote', 'نقل‌قول'),\n  description: L('A short quote with its author', 'یک نقل‌قول کوتاه با نام گوینده'),\n  fields: [\n    { key: 'text', kind: 'loc', label: L('Quote', 'متن'), multiline: true },\n    { key: 'author', kind: 'loc', label: L('Author', 'گوینده') },\n    { key: 'photoUrl', kind: 'image', label: L('Photo', 'عکس') },\n    { key: 'align', kind: 'select', label: L('Alignment', 'چینش'), options: [\n      { value: 'start', label: L('Start', 'ابتدا') },\n      { value: 'center', label: L('Center', 'وسط') },\n    ] },\n  ],\n},\u003c/code>\u003c/pre>\n\u003cp>انواع فیلد (\u003ccode>FieldDef\u003c/code>) در بالای همین فایل فهرست شده‌اند: \u003ccode>loc\u003c/code>، \u003ccode>text\u003c/code>، \u003ccode>href\u003c/code>، \u003ccode>image\u003c/code>، \u003ccode>number\u003c/code>، \u003ccode>bool\u003c/code>، \u003ccode>select\u003c/code>، \u003ccode>buttons\u003c/code>، \u003ccode>list\u003c/code> (فهرست با زیرفیلدها)، \u003ccode>color\u003c/code>، \u003ccode>source\u003c/code>، \u003ccode>card\u003c/code> و… \u003ccode>Inspector.tsx\u003c/code> فرم را از روی همین تعریف می‌سازد.\u003c/p>\n\u003ch2 id=\"۴-محتوای-ساختاری-یا-محتوایی\">۴. محتوای ساختاری یا محتوایی؟\u003c/h2>\n\u003cp>در cell، مشتری فقط متن و تصویر را عوض می‌کند. کلیدهای \u003ccode>STRUCTURE_KEYS\u003c/code> (مثل \u003ccode>layout\u003c/code>، \u003ccode>columns\u003c/code>، \u003ccode>href\u003c/code>) برای مشتری قفل‌اند. عدد، switch و طول فهرست‌ها هم به‌طور پیش‌فرض قفل‌اند. اگر prop رشته‌ای جدیدی دارید که طرح را تعیین می‌کند (مثلاً \u003ccode>align\u003c/code> در مثال بالا)، آن را به \u003ccode>STRUCTURE_KEYS\u003c/code> اضافه کنید.\u003c/p>\n\u003ch2 id=\"۵-تست-و-بررسی\">۵. تست و بررسی\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/web/src/test/sections.test.tsx\nit('renders a quote', () =&gt; {\n  wrap(&lt;SectionRenderer section={{ id: 'q', type: 'quote', props: { text: { en: 'Less is more', fa: '' } } }} /&gt;);\n  expect(screen.getByText('Less is more')).toBeInTheDocument();\n});\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>npm run typecheck\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>npm test\u003c/code>\u003c/pre>\n\u003cp>TypeScript اگر renderer یا meta را جا انداخته باشید خطا می‌دهد (\u003ccode>Record&lt;SectionType, …&gt;\u003c/code>). بعد کانتینرها را rebuild کنید و در builder سکشن را اضافه، ویرایش و منتشر کنید.\u003c/p>\n\u003ch2 id=\"اگر-سکشن-داده-از-api-میخواند\">اگر سکشن داده از API می‌خواند\u003c/h2>\n\u003cp>مثل \u003ccode>products\u003c/code> یا \u003ccode>collection-list\u003c/code>: در renderer با یک hook از \u003ccode>features/…/data.ts\u003c/code> داده را بخوانید (\u003ccode>useQuery\u003c/code> با کلید \u003ccode>['public', site, …]\u003c/code>)، و در \u003ccode>sectionMeta\u003c/code> مقدار \u003ccode>dynamic: true\u003c/code> بگذارید. اگر route عمومی جدید لازم است → \u003ca href=\"#05-recipes/new-api-route.md\">مسیر API جدید\u003c/a>.\u003c/p>","text":" دستورالعمل: نوع سکشن جدید فصل ۵ — دستورالعمل‌ها · زمینه: صفحات و سکشن‌ها ../04 features/pages and sections.md مثال: سکشنی به نام quote یک نقل‌قول با نام گوینده و عکس . فایل‌هایی که عوض می‌شوند فایل چه چیزی 1 packages/shared/src/sections.ts schema در sectionDefinitions 2 apps/web/src/sections/renderers.tsx یا فایل جدید کنارش کامپوننت + ثبت در sectionRenderers 3 apps/web/src/admin/builder/fields.ts sectionMeta : نام، توضیح، فیلدها 4 apps/web/src/test/sections.test.tsx تست رندر 5 packages/shared/src/sections.ts → STRUCTURE_KEYS اگر کلیدی ساختاری است اختیاری API تغییری لازم ندارد، چون سندهای صفحه را با همین schema اعتبارسنجی می‌کند. ۱. schema در shared هر فیلد پیش‌فرض داشته باشد. defaultProps type با parse {} سکشن تازه را می‌سازد و سندهای قدیمی هم باید بدون خطا parse شوند. از کمکی‌های موجود در همین فایل استفاده کنید: loc n ، eyebrowHeading ، buttons ، imageUrlSchema ، hrefSchema . appearance فاصله، پس‌زمینه را اضافه نکنید؛ برای همهٔ سکشن‌ها خودکار است. اگر بعداً شکل یک prop را عوض کردید، تبدیل شکل قدیمی را با z.preprocess در همین schema بنویسید. نمونه: hero دکمهٔ تکی قدیمی را به buttons تبدیل می‌کند. ۲. renderer در وب props قبلاً اعتبارسنجی شده‌اند و پیش‌فرض‌ها پر شده‌اند. دوباره بررسی نکنید. از کلاس‌های token text ink ، bg surface … استفاده کنید، نه رنگ ثابت. برای تصویر از components/ui/Image.tsx استفاده کنید. ۳. ویرایشگر در builder انواع فیلد FieldDef در بالای همین فایل فهرست شده‌اند: loc ، text ، href ، image ، number ، bool ، select ، buttons ، list فهرست با زیرفیلدها ، color ، source ، card و… Inspector.tsx فرم را از روی همین تعریف می‌سازد. ۴. محتوای ساختاری یا محتوایی؟ در cell، مشتری فقط متن و تصویر را عوض می‌کند. کلیدهای STRUCTURE_KEYS مثل layout ، columns ، href برای مشتری قفل‌اند. عدد، switch و طول فهرست‌ها هم به‌طور پیش‌فرض قفل‌اند. اگر prop رشته‌ای جدیدی دارید که طرح را تعیین می‌کند مثلاً align در مثال بالا ، آن را به STRUCTURE_KEYS اضافه کنید. ۵. تست و بررسی TypeScript اگر renderer یا meta را جا انداخته باشید خطا می‌دهد Record\u003cSectionType, … . بعد کانتینرها را rebuild کنید و در builder سکشن را اضافه، ویرایش و منتشر کنید. اگر سکشن داده از API می‌خواند مثل products یا collection list : در renderer با یک hook از features/…/data.ts داده را بخوانید useQuery با کلید 'public', site, … ، و در sectionMeta مقدار dynamic: true بگذارید. اگر route عمومی جدید لازم است → مسیر API جدید new api route.md . ","headings":[{"level":2,"id":"فایلهایی-که-عوض-میشوند","text":"فایل‌هایی که عوض می‌شوند"},{"level":2,"id":"۱-schema-در-shared","text":"۱. schema در shared"},{"level":2,"id":"۲-renderer-در-وب","text":"۲. renderer در وب"},{"level":2,"id":"۳-ویرایشگر-در-builder","text":"۳. ویرایشگر در builder"},{"level":2,"id":"۴-محتوای-ساختاری-یا-محتوایی","text":"۴. محتوای ساختاری یا محتوایی؟"},{"level":2,"id":"۵-تست-و-بررسی","text":"۵. تست و بررسی"},{"level":2,"id":"اگر-سکشن-داده-از-api-میخواند","text":"اگر سکشن داده از API می‌خواند"}]},{"path":"05-recipes/new-site-setting.md","title":"دستورالعمل: تنظیم جدید برای سایت","html":"\u003ch1 id=\"دستورالعمل-تنظیم-جدید-برای-سایت\">دستورالعمل: تنظیم جدید برای سایت\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۵ — دستورالعمل‌ها · زمینه: \u003ca href=\"#03-layers/shared.md::تنظیمات-سایت-یک-سند-بزرگ\">پکیج shared\u003c/a>\u003c/p>\u003c/blockquote>\n\u003cp>تنظیمات سایت یک سند jsonb است (\u003ccode>site_settings.settings\u003c/code>). برای افزودن تنظیم \u003cstrong>migration لازم نیست\u003c/strong>؛ سایت‌های قدیمی پیش‌فرض را از \u003ccode>withSettingDefaults\u003c/code> می‌گیرند.\u003c/p>\n\u003cp>مثال: نوار «اطلاعیه» (\u003ccode>announcement\u003c/code>)، که در کد وجود دارد و الگوی خوبی است.\u003c/p>\n\u003ch2 id=\"فایلها\">فایل‌ها\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>فایل\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ccode>packages/shared/src/siteOptions.ts\u003c/code>\u003c/td>\u003ctd>schema گروه با پیش‌فرض‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ccode>packages/shared/src/schemas.ts\u003c/code>\u003c/td>\u003ctd>افزودن به \u003ccode>siteSettingsSchema\u003c/code> \u003cstrong>و\u003c/strong> \u003ccode>optionSchemas\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ccode>apps/api/src/modules/site/site.routes.ts\u003c/code>\u003c/td>\u003ctd>آیا مشتری در cell اجازهٔ تغییرش را دارد؟\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ccode>apps/api/src/modules/public/public.routes.ts\u003c/code>\u003c/td>\u003ctd>اگر بخشی خصوصی است، از \u003ccode>GET /settings\u003c/code> عمومی حذفش کنید\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ccode>apps/web/src/admin/pages/SiteOptionsTabs.tsx\u003c/code> یا \u003ccode>SettingsPages.tsx\u003c/code>\u003c/td>\u003ctd>فرم ویرایش\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>جایی که اثر دارد (مثلاً \u003ccode>components/layout/\u003c/code>)\u003c/td>\u003ctd>استفاده\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>\u003ccode>deploy/control/server.mjs\u003c/code> (بخش design update)\u003c/td>\u003ctd>اگر مال مشتری است و نباید با design update بازنویسی شود\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"۱-schema\">۱. schema\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// packages/shared/src/siteOptions.ts\n/** A strip above the header (offers, notices). */\nexport const announcementSchema = z\n  .object({\n    enabled: z.boolean().default(false),\n    text: loc(300),\n    href: z.string().max(500).default(''),\n    dismissible: z.boolean().default(true),\n  })\n  .default({});            // ← کل گروه پیش‌فرض دارد\u003c/code>\u003c/pre>\n\u003ch2 id=\"۲-ثبت-در-تنظیمات\">۲. ثبت در تنظیمات\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// packages/shared/src/schemas.ts\nexport const siteSettingsSchema = z.object({\n  // …\n  announcement: announcementSchema,\n});\n\nconst optionSchemas = {\n  // …\n  announcement: announcementSchema,   // ← بدون این، سایت‌های قدیمی مقدار undefined می‌گیرند\n};\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>withSettingDefaults\u003c/code> برای هر کلید \u003ccode>optionSchemas\u003c/code>، اگر مقدار نباشد یا parse نشود، پیش‌فرض می‌گذارد. API (\u003ccode>GET /sites/:s/settings\u003c/code>، \u003ccode>GET /public/sites/:s/settings\u003c/code>) و وب (\u003ccode>useSiteSettings\u003c/code>) همه از آن استفاده می‌کنند.\u003c/p>\n\u003ch2 id=\"۳-چه-کسی-تغییرش-میدهد\">۳. چه کسی تغییرش می‌دهد؟\u003c/h2>\n\u003cp>در \u003ccode>site.routes.ts\u003c/code>، \u003ccode>PUT /settings\u003c/code> در cell فقط فهرست مشخصی از کلیدها را از مشتری می‌پذیرد و بقیه را از تنظیمات فعلی نگه می‌دارد:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>const { name, tagline, logoAssetId, …, announcement, popup } = body;\nbody = { ...current.rows[0].settings, name, tagline, logoAssetId, …, announcement, popup };\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003cstrong>محتوا\u003c/strong> (مشتری عوض می‌کند): کلید را به این فهرست اضافه کنید.\u003c/li>\u003cli>\u003cstrong>طراحی یا ساختار\u003c/strong> (فقط اپراتور): کاری نکنید. پیش‌فرض این است که مشتری نمی‌تواند تغییرش دهد.\u003c/li>\u003c/ul>\n\u003cp>یک تست در \u003ccode>apps/api/test/content.test.ts\u003c/code> بنویسید که رفتار مشتری را در حالت قفل بررسی کند. نمونهٔ \u003ccode>settings.texts\u003c/code> آنجا هست.\u003c/p>\n\u003ch2 id=\"۴-خصوصی-است\">۴. خصوصی است؟\u003c/h2>\n\u003cp>\u003ccode>GET /public/sites/:s/settings\u003c/code> همه‌چیز را به بازدیدکننده می‌دهد، به‌جز \u003ccode>notifications\u003c/code> و \u003ccode>workflow\u003c/code> فرم‌ها. اگر تنظیم شما رمز، آدرس کارکنان یا هر دادهٔ داخلی دیگری دارد، آن را آنجا حذف کنید.\u003c/p>\n\u003ch2 id=\"۵-فرم-پنل\">۵. فرم پنل\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>// apps/web/src/admin/pages/SiteOptionsTabs.tsx (الگوی موجود)\nconst bar = s.announcement;\nconst upBar = (patch: Partial&lt;typeof bar&gt;) =&gt; set('announcement', { ...bar, ...patch });\n// … &lt;Checkbox checked={bar.enabled} onChange={(v) =&gt; upBar({ enabled: v })} /&gt;\u003c/code>\u003c/pre>\n\u003cp>پنل کل سند تنظیمات را با \u003ccode>PUT /sites/:s/settings\u003c/code> ذخیره می‌کند.\u003c/p>\n\u003ch2 id=\"۶-استفاده-در-سایت\">۶. استفاده در سایت\u003c/h2>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>const { data: settings } = useSiteSettings();\nif (settings?.announcement.enabled) { /* … */ }\u003c/code>\u003c/pre>\n\u003ch2 id=\"۷-در-تحویل\">۷. در تحویل\u003c/h2>\n\u003cp>design update تنظیمات طراحی را از استودیو می‌برد و فقط چند کلید مشتری (نام، شعار، لوگو، تماس، \u003ccode>notifications\u003c/code>…) را نگه می‌دارد. اگر تنظیم جدیدتان مال مشتری است، آن را به فهرست \u003ccode>jsonb_build_object\u003c/code> در بخش design update \u003ccode>server.mjs\u003c/code> اضافه کنید.\u003c/p>","text":" دستورالعمل: تنظیم جدید برای سایت فصل ۵ — دستورالعمل‌ها · زمینه: پکیج shared ../03 layers/shared.md تنظیمات سایت یک سند بزرگ تنظیمات سایت یک سند jsonb است site_settings.settings . برای افزودن تنظیم migration لازم نیست ؛ سایت‌های قدیمی پیش‌فرض را از withSettingDefaults می‌گیرند. مثال: نوار «اطلاعیه» announcement ، که در کد وجود دارد و الگوی خوبی است. فایل‌ها فایل چه چیزی 1 packages/shared/src/siteOptions.ts schema گروه با پیش‌فرض‌ها 2 packages/shared/src/schemas.ts افزودن به siteSettingsSchema و optionSchemas 3 apps/api/src/modules/site/site.routes.ts آیا مشتری در cell اجازهٔ تغییرش را دارد؟ 4 apps/api/src/modules/public/public.routes.ts اگر بخشی خصوصی است، از GET /settings عمومی حذفش کنید 5 apps/web/src/admin/pages/SiteOptionsTabs.tsx یا SettingsPages.tsx فرم ویرایش 6 جایی که اثر دارد مثلاً components/layout/ استفاده 7 deploy/control/server.mjs بخش design update اگر مال مشتری است و نباید با design update بازنویسی شود ۱. schema ۲. ثبت در تنظیمات withSettingDefaults برای هر کلید optionSchemas ، اگر مقدار نباشد یا parse نشود، پیش‌فرض می‌گذارد. API GET /sites/:s/settings ، GET /public/sites/:s/settings و وب useSiteSettings همه از آن استفاده می‌کنند. ۳. چه کسی تغییرش می‌دهد؟ در site.routes.ts ، PUT /settings در cell فقط فهرست مشخصی از کلیدها را از مشتری می‌پذیرد و بقیه را از تنظیمات فعلی نگه می‌دارد: محتوا مشتری عوض می‌کند : کلید را به این فهرست اضافه کنید. طراحی یا ساختار فقط اپراتور : کاری نکنید. پیش‌فرض این است که مشتری نمی‌تواند تغییرش دهد. یک تست در apps/api/test/content.test.ts بنویسید که رفتار مشتری را در حالت قفل بررسی کند. نمونهٔ settings.texts آنجا هست. ۴. خصوصی است؟ GET /public/sites/:s/settings همه‌چیز را به بازدیدکننده می‌دهد، به‌جز notifications و workflow فرم‌ها. اگر تنظیم شما رمز، آدرس کارکنان یا هر دادهٔ داخلی دیگری دارد، آن را آنجا حذف کنید. ۵. فرم پنل پنل کل سند تنظیمات را با PUT /sites/:s/settings ذخیره می‌کند. ۶. استفاده در سایت ۷. در تحویل design update تنظیمات طراحی را از استودیو می‌برد و فقط چند کلید مشتری نام، شعار، لوگو، تماس، notifications … را نگه می‌دارد. اگر تنظیم جدیدتان مال مشتری است، آن را به فهرست jsonb_build_object در بخش design update server.mjs اضافه کنید. ","headings":[{"level":2,"id":"فایلها","text":"فایل‌ها"},{"level":2,"id":"۱-schema","text":"۱. schema"},{"level":2,"id":"۲-ثبت-در-تنظیمات","text":"۲. ثبت در تنظیمات"},{"level":2,"id":"۳-چه-کسی-تغییرش-میدهد","text":"۳. چه کسی تغییرش می‌دهد؟"},{"level":2,"id":"۴-خصوصی-است","text":"۴. خصوصی است؟"},{"level":2,"id":"۵-فرم-پنل","text":"۵. فرم پنل"},{"level":2,"id":"۶-استفاده-در-سایت","text":"۶. استفاده در سایت"},{"level":2,"id":"۷-در-تحویل","text":"۷. در تحویل"}]},{"path":"05-recipes/tests.md","title":"دستورالعمل: نوشتن تست","html":"\u003ch1 id=\"دستورالعمل-نوشتن-تست\">دستورالعمل: نوشتن تست\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۵ — دستورالعمل‌ها · API: \u003ccode>apps/api/test/\u003c/code>، \u003ccode>apps/api/vitest.config.ts\u003c/code> · وب: \u003ccode>apps/web/src/test/\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"خلاصه\">خلاصه\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>API\u003c/th>\u003cth>وب\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ابزار\u003c/td>\u003ctd>vitest + supertest\u003c/td>\u003ctd>vitest + Testing Library (jsdom)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>دیتابیس\u003c/td>\u003ctd>\u003cstrong>Postgres واقعی\u003c/strong> روی 5433\u003c/td>\u003ctd>ندارد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تعداد (2026-11-02)\u003c/td>\u003ctd>۱۰۴\u003c/td>\u003ctd>۴۳\u003c/td>\u003c/tr>\u003ctr>\u003ctd>اجرا\u003c/td>\u003ctd>\u003ccode>npm test\u003c/code> (ریشه، اول وب بعد API)\u003c/td>\u003ctd>همان\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>قاعدهٔ پروژه: \u003cstrong>هر رفتار جدید API یک تست در \u003ccode>apps/api/test/\u003c/code> می‌خواهد.\u003c/strong>\u003c/p>\n\u003ch2 id=\"تستهای-api\">تست‌های API\u003c/h2>\n\u003ch3 id=\"آمادهسازی\">آماده‌سازی\u003c/h3>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker start sb-test-pg\u003c/code>\u003c/pre>\n\u003cp>(اگر وجود ندارد، دستور ساختنش در \u003ca href=\"#01-start/setup.md::۴-دیتابیس-تست\">راه‌اندازی\u003c/a> است.)\u003c/p>\n\u003cp>\u003ccode>vitest.config.ts\u003c/code> محیط تست را تنظیم می‌کند:\u003c/p>\n\u003cul>\u003cli>دیتابیس کنترل \u003ccode>sb_control_test\u003c/code>،\u003c/li>\u003cli>پیشوند دیتابیس سایت‌ها \u003ccode>sb_test_\u003c/code>،\u003c/li>\u003cli>کلیدهای ثابت و storage در \u003ccode>./var/test-uploads\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>global-setup.ts\u003c/code> دیتابیس کنترل تست را از نو می‌سازد. هیچ تستی به استودیوی شما دست نمی‌زند.\u003c/p>\n\u003ch3 id=\"helperها-testhelpersts\">helperها (\u003ccode>test/helpers.ts\u003c/code>)\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>helper\u003c/th>\u003cth>کار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>createTestServer()\u003c/code>\u003c/td>\u003ctd>\u003ccode>{ ctx, app, emails, sms }\u003c/code>؛ ایمیل و SMS در حافظه جمع می‌شوند\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>createAdmin(ctx)\u003c/code>\u003c/td>\u003ctd>یک اپراتور\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>createTenant(ctx, adminId, { modules })\u003c/code>\u003c/td>\u003ctd>یک سایت واقعی با دیتابیس خودش و مالکی با رمز \u003ccode>PASSWORD\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>signIn(app, email)\u003c/code>\u003c/td>\u003ctd>\u003ccode>Client\u003c/code> که cookie نگه می‌دارد و CSRF را خودکار می‌فرستد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>uid()\u003c/code>\u003c/td>\u003ctd>پسوند یکتا برای slug و ایمیل\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>product(slug)\u003c/code>، \u003ccode>lead(…)\u003c/code>\u003c/td>\u003ctd>ورودی‌های نمونه\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"الگو\">الگو\u003c/h3>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>const { ctx, app } = createTestServer();\nlet owner: Client;\nlet base: string;\n\nbeforeAll(async () =&gt; {\n  const admin = await createAdmin(ctx);\n  const site = await createTenant(ctx, admin.id, { modules: { orders: true } });\n  owner = await signIn(app, site.ownerEmail);\n  base = `/api/v1/sites/${site.slug}`;\n});\nafterAll(() =&gt; closeContext(ctx));\n\nit('keeps drafts private until published', async () =&gt; {\n  const created = await owner.post(`${base}/pages`, { slug: 'about', title: { en: 'About', fa: 'درباره' }, document: doc('Draft') });\n  expect(created.status).toBe(201);\n  expect((await request(app).get(`/api/v1/public/sites/${site.slug}/pages/about`)).status).toBe(404);\n});\u003c/code>\u003c/pre>\n\u003cul>\u003cli>برای بازدیدکنندهٔ بی‌نام از \u003ccode>request(app)\u003c/code> (supertest) استفاده کنید.\u003c/li>\u003cli>اعلان‌ها را از \u003ccode>emails.outbox\u003c/code>، \u003ccode>sms.outbox\u003c/code> (کدهای یک‌بارمصرف) و \u003ccode>sms.texts\u003c/code> (پیامک‌های متنی) بخوانید (\u003ccode>ConsoleEmailSender\u003c/code> / \u003ccode>ConsoleSmsSender\u003c/code> در \u003ccode>modules/auth/notifications.ts\u003c/code>).\u003c/li>\u003cli>HTTP بیرونی (درگاه پرداخت) را با جایگزین کردن \u003ccode>ctx.httpFetch\u003c/code> شبیه‌سازی کنید (\u003ccode>payments.test.ts\u003c/code>).\u003c/li>\u003cli>\u003cstrong>حالت cell\u003c/strong> (\u003ccode>clientLocked\u003c/code>): در \u003ccode>content.test.ts\u003c/code> یک app با \u003ccode>CELL_SLUG\u003c/code> ساخته می‌شود؛ همان الگو را دنبال کنید.\u003c/li>\u003cli>JSONهای jsonb را \u003cstrong>ساختاری\u003c/strong> مقایسه کنید (\u003ccode>toEqual\u003c/code>، \u003ccode>toMatchObject\u003c/code>)، نه به‌صورت رشته.\u003c/li>\u003c/ul>\n\u003ch3 id=\"اجرای-یک-فایل\">اجرای یک فایل\u003c/h3>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>cd apps/api &amp;&amp; npx vitest run test/content.test.ts\u003c/code>\u003c/pre>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>cd apps/api &amp;&amp; npx vitest run test/content.test.ts -t &quot;drafts&quot;\u003c/code>\u003c/pre>\n\u003ch2 id=\"تستهای-وب\">تست‌های وب\u003c/h2>\n\u003cp>\u003ccode>apps/web/src/test/\u003c/code>:\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>فایل\u003c/th>\u003cth>چه چیزی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sections.test.tsx\u003c/code>\u003c/td>\u003ctd>رندر سکشن‌ها، سکشن نامعتبر\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>builder.test.ts\u003c/code>\u003c/td>\u003ctd>reducer builder (\u003ccode>state.ts\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>admin.test.tsx\u003c/code>، \u003ccode>api-mode.test.tsx\u003c/code>، \u003ccode>site.test.tsx\u003c/code>\u003c/td>\u003ctd>پنل و سایت با API ساختگی\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>calendar.test.ts\u003c/code>، \u003ccode>errorText.test.ts\u003c/code>\u003c/td>\u003ctd>کمکی‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>renderApp.tsx\u003c/code>، \u003ccode>setup.ts\u003c/code>\u003c/td>\u003ctd>راه‌اندازی مشترک\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>npm run test -w apps/web\u003c/code>\u003c/pre>\n\u003ch2 id=\"وقتی-یک-تست-شکست-خورد\">وقتی یک تست شکست خورد\u003c/h2>\n\u003cul>\u003cli>\u003ccode>connect ECONNREFUSED 127.0.0.1:5433\u003c/code> ← \u003ccode>docker start sb-test-pg\u003c/code>.\u003c/li>\u003cli>تستی که قبلاً سبز بود و حالا قرمز است، مسئولیت تغییر شماست؛ تا توضیحش ندهید کار تمام نیست.\u003c/li>\u003cli>برای debug، \u003ccode>LOG_LEVEL\u003c/code> در \u003ccode>vitest.config.ts\u003c/code> روی \u003ccode>silent\u003c/code> است؛ موقتاً عوضش کنید.\u003c/li>\u003c/ul>","text":" دستورالعمل: نوشتن تست فصل ۵ — دستورالعمل‌ها · API: apps/api/test/ ، apps/api/vitest.config.ts · وب: apps/web/src/test/ خلاصه API وب ابزار vitest + supertest vitest + Testing Library jsdom دیتابیس Postgres واقعی روی 5433 ندارد تعداد 2026 11 02 ۱۰۴ ۴۳ اجرا npm test ریشه، اول وب بعد API همان قاعدهٔ پروژه: هر رفتار جدید API یک تست در apps/api/test/ می‌خواهد. تست‌های API آماده‌سازی اگر وجود ندارد، دستور ساختنش در راه‌اندازی ../01 start/setup.md ۴ دیتابیس تست است. vitest.config.ts محیط تست را تنظیم می‌کند: دیتابیس کنترل sb_control_test ، پیشوند دیتابیس سایت‌ها sb_test_ ، کلیدهای ثابت و storage در ./var/test uploads . global setup.ts دیتابیس کنترل تست را از نو می‌سازد. هیچ تستی به استودیوی شما دست نمی‌زند. helperها test/helpers.ts helper کار createTestServer { ctx, app, emails, sms } ؛ ایمیل و SMS در حافظه جمع می‌شوند createAdmin ctx یک اپراتور createTenant ctx, adminId, { modules } یک سایت واقعی با دیتابیس خودش و مالکی با رمز PASSWORD signIn app, email Client که cookie نگه می‌دارد و CSRF را خودکار می‌فرستد uid پسوند یکتا برای slug و ایمیل product slug ، lead … ورودی‌های نمونه الگو برای بازدیدکنندهٔ بی‌نام از request app supertest استفاده کنید. اعلان‌ها را از emails.outbox ، sms.outbox کدهای یک‌بارمصرف و sms.texts پیامک‌های متنی بخوانید ConsoleEmailSender / ConsoleSmsSender در modules/auth/notifications.ts . HTTP بیرونی درگاه پرداخت را با جایگزین کردن ctx.httpFetch شبیه‌سازی کنید payments.test.ts . حالت cell clientLocked : در content.test.ts یک app با CELL_SLUG ساخته می‌شود؛ همان الگو را دنبال کنید. JSONهای jsonb را ساختاری مقایسه کنید toEqual ، toMatchObject ، نه به‌صورت رشته. اجرای یک فایل تست‌های وب apps/web/src/test/ : فایل چه چیزی sections.test.tsx رندر سکشن‌ها، سکشن نامعتبر builder.test.ts reducer builder state.ts admin.test.tsx ، api mode.test.tsx ، site.test.tsx پنل و سایت با API ساختگی calendar.test.ts ، errorText.test.ts کمکی‌ها renderApp.tsx ، setup.ts راه‌اندازی مشترک وقتی یک تست شکست خورد connect ECONNREFUSED 127.0.0.1:5433 ← docker start sb test pg . تستی که قبلاً سبز بود و حالا قرمز است، مسئولیت تغییر شماست؛ تا توضیحش ندهید کار تمام نیست. برای debug، LOG_LEVEL در vitest.config.ts روی silent است؛ موقتاً عوضش کنید. ","headings":[{"level":2,"id":"خلاصه","text":"خلاصه"},{"level":2,"id":"تستهای-api","text":"تست‌های API"},{"level":3,"id":"آمادهسازی","text":"آماده‌سازی"},{"level":3,"id":"helperها-testhelpersts","text":"helperها (test/helpers.ts)"},{"level":3,"id":"الگو","text":"الگو"},{"level":3,"id":"اجرای-یک-فایل","text":"اجرای یک فایل"},{"level":2,"id":"تستهای-وب","text":"تست‌های وب"},{"level":2,"id":"وقتی-یک-تست-شکست-خورد","text":"وقتی یک تست شکست خورد"}]},{"path":"06-operations/backup.md","title":"backup و restore","html":"\u003ch1 id=\"backup-و-restore\">backup و restore\u003c/h1>\n\u003cblockquote>\u003cp>فصل ۶ — عملیات · فایل‌ها: \u003ccode>deploy/backup/studio-backup.sh\u003c/code>، \u003ccode>studio-restore.sh\u003c/code>، \u003ccode>studio-restore.ps1\u003c/code>\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"backup-کل-استودیو\">backup کل استودیو\u003c/h2>\n\u003cp>استودیو باید روشن باشد:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>deploy/backup/studio-backup.sh\u003c/code>\u003c/pre>\n\u003cp>خروجی: \u003ccode>backups/studio-backup-&lt;time&gt;.tar.gz\u003c/code> شامل\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>بخش\u003c/th>\u003cth>از کجا\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>studio-db.sql\u003c/code>\u003c/td>\u003ctd>\u003ccode>pg_dumpall\u003c/code> از \u003ccode>sb-studio-db\u003c/code>: دیتابیس کنترل و همهٔ سایت‌ها\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>uploads.tar.gz\u003c/code>\u003c/td>\u003ctd>\u003ccode>/data/uploads\u003c/code> در \u003ccode>sb-studio-api\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>control-data.tar.gz\u003c/code>\u003c/td>\u003ctd>\u003ccode>/data\u003c/code> در \u003ccode>sb-control\u003c/code> (اطلاعات deploy سایت‌ها)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>demo-images.tar.gz\u003c/code>\u003c/td>\u003ctd>\u003ccode>var/demo-images\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>deploy/.env\u003c/code>\u003c/td>\u003ctd>رمزها و کلیدها، از جمله \u003ccode>STUDIO_TENANT_SECRETS_KEY\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\u003cp>این فایل \u003cstrong>دادهٔ مشتری و رمز\u003c/strong> دارد. فقط خصوصی منتقلش کنید و هرگز commit نکنید (\u003ccode>backups/\u003c/code> و \u003ccode>/*.tar.gz\u003c/code> در \u003ccode>.gitignore\u003c/code> هستند).\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"restore\">restore\u003c/h2>\n\u003cp>Linux / macOS / Git Bash:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>deploy/backup/studio-restore.sh backups/studio-backup-….tar.gz\u003c/code>\u003c/pre>\n\u003cp>Windows PowerShell:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>powershell -ExecutionPolicy Bypass -File deploy\\backup\\studio-restore.ps1 -Backup backups\\studio-backup-….tar.gz\u003c/code>\u003c/pre>\n\u003cul>\u003cli>اگر روی این سیستم دادهٔ استودیو وجود داشته باشد، restore \u003cstrong>رد می‌شود\u003c/strong>. برای پاک کردن دادهٔ فعلی و جایگزینی، \u003ccode>--replace\u003c/code> (یا \u003ccode>-Replace\u003c/code>) را اضافه کنید.\u003c/li>\u003cli>بعد از restore استودیو خودش بالا می‌آید و migrationهای جدید را اجرا می‌کند.\u003c/li>\u003c/ul>\n\u003ch2 id=\"backup-سایت-مشتری\">backup سایت مشتری\u003c/h2>\n\u003cp>روی سرور مشتری، اسکریپت‌های داخل بسته: \u003ccode>backup.sh\u003c/code> / \u003ccode>backup.ps1\u003c/code> و \u003ccode>restore.sh\u003c/code> / \u003ccode>restore-db.sh\u003c/code> (→ \u003ccode>deploy/export/README.md\u003c/code>).\u003c/p>\n\u003ch2 id=\"بعد-از-کپی-داده-بین-دیتابیسها\">بعد از کپی داده بین دیتابیس‌ها\u003c/h2>\n\u003cp>اگر داده را دستی از یک دیتابیس به دیگری بردید:\u003c/p>\n\u003cpre dir=\"ltr\" class=\"code\">\u003ccode>docker exec -i sb-studio-db psql -U sb_admin -d sb_t_&lt;slug&gt; &lt; deploy/export/fix-sequences.sql\u003c/code>\u003c/pre>\n\u003cp>وگرنه insert بعدی با id تکراری 409 می‌دهد.\u003c/p>","text":" backup و restore فصل ۶ — عملیات · فایل‌ها: deploy/backup/studio backup.sh ، studio restore.sh ، studio restore.ps1 backup کل استودیو استودیو باید روشن باشد: خروجی: backups/studio backup \u003ctime .tar.gz شامل بخش از کجا studio db.sql pg_dumpall از sb studio db : دیتابیس کنترل و همهٔ سایت‌ها uploads.tar.gz /data/uploads در sb studio api control data.tar.gz /data در sb control اطلاعات deploy سایت‌ها demo images.tar.gz var/demo images deploy/.env رمزها و کلیدها، از جمله STUDIO_TENANT_SECRETS_KEY این فا
